[package]
name = "beavuck-hermit"
version = "1.4.27"
edition = "2024"
license = "Unlicense"
repository = "https://gitlab.com/beavuck-services/hermit"
readme = "README.md"
description = "OpenAPI mock server -- serve realistic responses from any OpenAPI spec"
keywords = ["openapi", "mock", "mock-server", "cli"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]
include = ["src/**/*", "README.md", "UNLICENSE", "PRIVACY.md", "docs/**/*"]

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "signal"] }
axum = "0.8"
tower-http = { version = "0.7.1", features = ["cors"] }
serde_json = "1.0.151"
yaml_serde = "0.10.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
rand = "0.10.2"
rayon = "1.12.0"
chrono = "0.4.45"
mutants = "0.0.4"

[dev-dependencies]
regex = "1.13.1"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[[bin]]
name = "hermit"
path = "src/main.rs"
