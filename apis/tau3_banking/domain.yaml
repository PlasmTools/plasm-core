    description: Pay down a credit card balance from the customer's Rho-Bank checking account. Use only when nv_closure_policy
      steps 1–3 already pass and an outstanding balance is the sole remaining blocker (or the customer explicitly requests
      a payoff unrelated to a dispute-blocked closure). Do not pay toward closure when a pending dispute still blocks the
      account.
    kind: action
    entity: CreditCardAccountLocked
    discovery:
      operation_terms:
      - pay
      - transfer
      - debit
      target_terms:
      - credit card balance
