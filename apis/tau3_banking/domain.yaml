        fields:
        - name: card_id
          value_ref: nv_str
          required: true
  DebitCard_clear_fraud_alert:
    description: Clear a fraud alert or velocity block on a debit card.
    kind: action
    entity: DebitCard
    output:
      type: side_effect
      description: Clear a fraud alert or velocity block on a debit card.
    payload:
      input_type:
        type: object
        fields:
        - name: card_id
          value_ref: nv_str
          required: true
        - name: reason
          value_ref: nv_str
          required: true
  DebitCard_reset_pin:
    description: Reset a debit card PIN when the customer has forgotten it.
    kind: action
    entity: DebitCard
    output:
      type: side_effect
      description: Reset a debit card PIN when the customer has forgotten it.
    payload:
      input_type:
        type: object
        fields:
        - name: card_id
          value_ref: nv_str
          required: true
        - name: last_4_digits
          value_ref: nv_str
          required: true
        - name: new_pin
          value_ref: nv_str
          required: true
  DebitCard_change_pin:
    description: Change a debit card PIN when the customer knows their current PIN.
    kind: action
    entity: DebitCard
    output:
      type: side_effect
      description: Change a debit card PIN when the customer knows their current PIN.
    payload:
      input_type:
        type: object
        fields:
        - name: card_id
          value_ref: nv_str
          required: true
        - name: current_pin
          value_ref: nv_str
          required: true
        - name: new_pin
          value_ref: nv_str
          required: true
  DebitCard_list_by_account:
    description: Retrieve all debit cards associated with a checking account. Returns card details including status, issue
      reason, and expiration date.
    kind: query
    entity: DebitCard
    selection:
    - name: account_id
      value_ref: nv_str
      required: true
    provides:
    - card_id
    - account_id
    - status
    - last_4
  DebitCard_request_limit_increase:
    description: Request a temporary 24-hour increase to a debit card's daily ATM or purchase limit.
    kind: action
    entity: DebitCard
    output:
      type: side_effect
      description: Request a temporary 24-hour increase to a debit card's daily ATM or purchase limit.
    payload:
      input_type:
        type: object
        fields:
        - name: card_id
          value_ref: nv_str
          required: true
        - name: limit_type
          value_ref: nv_str
          required: true
        - name: new_limit
          value_ref: nv_int
          required: true
  referral_get:
    description: Fetch one referral by id.
    kind: get
    entity: Referral
    arguments:
      input_type:
        type: object
        fields:
        - name: referral_id
          value_ref: nv_str
          required: true
    provides:
    - referral_id
    - referrer_id
views:
  credit_limit_eligibility:
    description: Composed CLI readiness projection for one card and customer.
    capability: CreditLimitEligibility_query
    entity: CreditLimitEligibility
    scope:
    - name: credit_card_account_id
      value_ref: nv_credit_card_account_id
      required: true
    - name: user_id
      value_ref: nv_user_id
      required: true
    nodes:
    - id: card
      capability: get_credit_card_accounts_by_user
      bind:
        user_id:
          kind: scope
          param: user_id
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
    - id: prior_requests
      capability: CreditLimitRequest_list_by_account
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
    - id: pending_cli
      capability: CreditLimitRequest_list_by_account
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
        status:
          kind: literal
          value: PENDING
    - id: approved_cli
      capability: CreditLimitRequest_list_by_account
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
        status:
          kind: literal
          value: APPROVED
    - id: recent_payments
      capability: PaymentHistory_list_by_account
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
        months:
          kind: literal
          value: 6
    - id: disputes
      capability: CreditCardDispute_list_by_user
      bind:
        user_id:
          kind: scope
          param: user_id
    - id: pending_replacements
      capability: CreditCardOrder_list_pending
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
    output:
      credit_card_account_id:
        kind: scope
        param: credit_card_account_id
      user_id:
        kind: scope
        param: user_id
      prior_request_count:
        kind: node_row_count
        node: prior_requests
      payment_row_count:
        kind: node_row_count
        node: recent_payments
      open_dispute_count:
        kind: node_row_count
        node: disputes
      pending_replacement_count:
        kind: node_row_count
        node: pending_replacements
      has_open_dispute:
        kind: node_row_count_positive
        node: disputes
      has_pending_replacement:
        kind: node_row_count_positive
        node: pending_replacements
      card_balance:
        kind: node_field
        node: card
        field: balance
      card_limit:
        kind: node_field
        node: card
        field: credit_limit
      card_type:
        kind: node_field
        node: card
        field: card_type
      has_pending_request:
        kind: node_row_count_positive
        node: pending_cli
      pending_request_id:
        kind: node_field
        node: pending_cli
        field: request_id
      pending_requested_amount:
        kind: node_field
        node: pending_cli
        field: requested_increase_amount
      utilization_pct:
        kind: computed
        template: '{%- set bal = card_balance | wire_num -%}{%- set lim = card_limit | wire_num -%}{%- if lim > 0 -%}{{ ((bal
          / lim) * 100) | round(1) }}{%- else -%}0{%- endif -%}

          '
      tier_max_increase_pct:
        kind: computed
        template: '{%- if card_type and ''Bronze'' in card_type -%}25{%- elif card_type and ''Silver'' in card_type -%}50{%-
          elif card_type and ''Gold'' in card_type -%}50{%- else -%}25{%- endif -%}

          '
      tier_max_utilization_pct:
        kind: computed
        template: '{%- if card_type and ''Bronze'' in card_type -%}70{%- elif card_type and ''Silver'' in card_type -%}80{%-
          elif card_type and ''Gold'' in card_type -%}90{%- else -%}70{%- endif -%}

          '
      tier_min_payment_months:
        kind: computed
        template: '{%- if card_type and ''Bronze'' in card_type -%}6{%- elif card_type and ''Silver'' in card_type -%}3{%-
          elif card_type and ''Gold'' in card_type -%}3{%- else -%}6{%- endif -%}

          '
      tier_cooldown_days:
        kind: computed
        template: '{%- if card_type and ''Bronze'' in card_type -%}120{%- elif card_type and ''Silver'' in card_type -%}90{%-
          elif card_type and ''Gold'' in card_type -%}60{%- else -%}120{%- endif -%}

          '
      tier_min_account_age_days:
        kind: computed
        template: '{%- if card_type and ''Bronze'' in card_type -%}120{%- elif card_type and ''Silver'' in card_type -%}90{%-
          elif card_type and ''Gold'' in card_type -%}60{%- else -%}120{%- endif -%}

          '
      payment_months_met:
        kind: computed
        template: '{%- if payment_row_count | wire_num >= tier_min_payment_months | wire_num -%}true{%- else -%}false{%- endif
          -%}

          '
      max_increase_amount:
        kind: computed
        template: '{%- set lim = card_limit | wire_num -%}{%- set pct = tier_max_increase_pct | wire_num -%}{%- if lim > 0
          and pct > 0 -%}{{ (lim * pct / 100) | int }}{%- else -%}0{%- endif -%}

          '
      approved_request_count:
        kind: node_row_count
        node: approved_cli
      last_approved_decision_date:
        kind: node_field
        node: approved_cli
        field: decision_date
      last_approved_submitted_date:
        kind: node_field
        node: approved_cli
        field: submitted_date
      days_since_last_approval:
        kind: computed
        template: '{%- set ref = last_approved_decision_date if last_approved_decision_date and last_approved_decision_date
          != ''null'' else last_approved_submitted_date -%}{%- if ref and approved_request_count | wire_num > 0 -%}{{ ref
          | wire_days_since | int }}{%- else -%}9999{%- endif -%}

          '
      cooldown_period_active:
        kind: computed
        template: '{%- if approved_request_count | wire_num > 0 and days_since_last_approval | wire_num < tier_cooldown_days
          | wire_num -%}true{%- else -%}false{%- endif -%}

          '
      required_reads_checklist:
        kind: computed
        template: dispute_history,pending_replacements,cli_history,payment_history
      workflow_sequencing_hint:
        kind: computed
        template: '{%- if has_open_dispute or has_pending_replacement -%}cli_before_dispute_and_replacement

          {%- elif has_pending_request and cooldown_period_active == ''true'' -%}deny_pending_cooldown

          {%- elif has_pending_request -%}decide_pending_request

          {%- elif cooldown_period_active == ''true'' -%}deny_cooldown_before_submit

          {%- else -%}standard_cli_flow{%- endif -%}

          '
      eligibility_hint:
        kind: computed
        template: '{%- if has_open_dispute -%}blocked_open_dispute

          {%- elif has_pending_replacement -%}blocked_pending_replacement

          {%- elif has_pending_request and cooldown_period_active == ''true'' -%}deny_cooldown_period_active

          {%- elif has_pending_request -%}decide_pending_request

          {%- elif cooldown_period_active == ''true'' -%}blocked_cooldown_period_active

          {%- elif payment_months_met == ''false'' -%}deny_insufficient_payment_history

          {%- elif utilization_pct | wire_num >= tier_max_utilization_pct | wire_num -%}submit_then_deny_high_utilization

          {%- elif tier_max_increase_pct == 25 -%}coach_cap_increase_at_25pct

          {%- else -%}submit_when_ready

          {%- endif -%}

          '
    relation_outputs:
    - relation: prior_requests
      target: CreditLimitRequest
      cardinality: many
      binding:
        kind: node_all_rows
        node: prior_requests
    - relation: recent_payments
      target: PaymentHistory
      cardinality: many
      binding:
        kind: node_all_rows
        node: recent_payments
    - relation: disputes
      target: CreditCardDispute
      cardinality: many
      binding:
        kind: node_all_rows
        node: disputes
    - relation: pending_replacements
      target: CreditCardOrder
      cardinality: many
      binding:
        kind: node_all_rows
        node: pending_replacements
  credit_card_closure_eligibility:
    description: Composed closure readiness projection for one card and customer.
    capability: CreditCardClosureEligibility_query
    entity: CreditCardClosureEligibility
    scope:
    - name: credit_card_account_id
      value_ref: nv_credit_card_account_id
      required: true
    - name: user_id
      value_ref: nv_user_id
      required: true
    nodes:
    - id: card
      capability: get_credit_card_accounts_by_user
      bind:
        user_id:
          kind: scope
          param: user_id
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
    - id: disputes
      capability: CreditCardDispute_list_by_user
      bind:
        user_id:
          kind: scope
          param: user_id
    - id: pending_replacements
      capability: CreditCardOrder_list_pending
      bind:
        credit_card_account_id:
          kind: scope
          param: credit_card_account_id
    output:
      credit_card_account_id:
        kind: scope
        param: credit_card_account_id
      user_id:
        kind: scope
        param: user_id
      open_dispute_count:
        kind: node_row_count
        node: disputes
      pending_replacement_count:
        kind: node_row_count
        node: pending_replacements
      has_open_dispute:
        kind: node_row_count_positive
        node: disputes
      has_pending_replacement:
        kind: node_row_count_positive
        node: pending_replacements
      card_balance:
        kind: node_field
        node: card
        field: balance
      closure_hint:
        kind: computed
        template: '{%- if has_open_dispute -%}blocked_open_dispute

          {%- elif has_pending_replacement -%}blocked_pending_replacement

          {%- elif card_balance | wire_num > 0 -%}pay_balance_then_close

          {%- else -%}ready_for_retention

          {%- endif -%}

          '
    relation_outputs:
    - relation: disputes
      target: CreditCardDispute
      cardinality: many
      binding:
        kind: node_all_rows
        node: disputes
    - relation: pending_replacements
      target: CreditCardOrder
      cardinality: many
      binding:
        kind: node_all_rows
        node: pending_replacements
values:
  nv_str:
    type: string
    description: Generic short string.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_num:
    type: number
    description: Numeric amount.
  nv_int:
    type: integer
    description: Integer quantity.
  nv_user_id:
    type: string
    description: Banking customer id.
  nv_credit_card_account_id:
    type: string
    description: Credit card account id.
  nv_cli_request_id:
    type: string
    description: Credit limit increase request id (`cli_*`). In one program, bind approve from submit — `c1 = e3.m7(…)` then
      `e3(c1.request_id).m4(request_id=c1.request_id, …)`; do not invent `request_id` literals. τ² leaves the original PENDING
      submit record after approve/deny; a separate APPROVED or DENIED record is appended — do not call approve/deny again
      on the same request_id.
  nv_cli_increase_amount:
    type: integer
    description: Requested credit limit increase in whole dollars (not the new total limit). Must not exceed the tier maximum
      per request — Entry-tier 25%, Mid-tier 50%, Premium-tier 50% of current credit limit. Coach the customer to the tier
      cap before filing.
  nv_cli_new_limit:
    type: integer
    description: Approved total credit limit in whole dollars on approve — not the increase delta alone. Successful approve
      witness has status APPROVED and this total limit; if unclear, read CLI history or card limit instead of re-approving
      the same request_id.
  nv_cli_status:
    type: enum
    enum:
    - PENDING
    - DENIED
    - APPROVED
    description: CLI case status. PENDING awaits approve or deny; DENIED and APPROVED are terminal for that request_id (τ²
      appends a new row; the submit PENDING row is not mutated in place). Denied requests do not trigger cooldown — customer
      may remediate and submit a new case.
  nv_cli_denial_reason:
    type: enum
    enum:
    - insufficient_account_age
    - cooldown_period_active
    - pending_disputes
    - pending_replacement_card
    - past_due_balance
    - high_utilization
    - insufficient_payment_history
    - requested_amount_exceeds_limit
    - other
    description: 'Policy reason when denying a CLI. insufficient_account_age: account younger than tier minimum (Entry 120d,
      Mid 90d, Premium 60d). cooldown_period_active: approved request within tier cooldown (Entry 120d, Mid 90d, Premium 60d)
      — denials do not trigger cooldown. pending_disputes: open disputes on the account. pending_replacement_card: outstanding
      replacement card order. past_due_balance: account not in good standing. high_utilization: utilization at or above tier
      max (Entry below 70%, Mid below 80%, Premium below 90%). insufficient_payment_history: fewer consecutive on-time months
      than tier requires (Entry 6, Mid 3, Premium 3). requested_amount_exceeds_limit: increase over tier max percent of current
      limit.'
  nv_card_type:
    type: string
    description: 'Rho-Bank credit card product name. Maps to CLI tier policy — Entry-tier: Bronze Rewards Card (and Business
      Bronze); Mid-tier: Silver cards; Premium-tier: Gold cards. Tier thresholds are documented on nv_cli_denial_reason.'
  nv_closure_policy:
    type: string
    description: 'Credit card closure retention protocol (KB doc_credit_cards_credit_card_account_logistics_003).

      Before retention offers or any closure write, verify eligibility in this order:

      1. Pending disputes — query dispute history; if any active/pending dispute exists, explain closure is blocked until
      resolution and STOP. Do not pay balance, log closure reason, or close on this call.

      2. Pending replacement cards — if any outstanding replacement order, explain and STOP.

      3. Minimum account age — account must be open 60+ days; if not, explain and STOP.

      4. Outstanding balance — only if steps 1–3 pass: customer may pay from checking, then proceed.

      After closure request: 45 days to redeem rewards; annual fee refundable if closed within 37 days of fee posting.'
  nv_retention_policy:
    type: markdown
    description: 'Retention before closure: skip offers if closure reason logged within past year. Annual fee concern — waive
      one year if customer 2+ years (loyalty benefit flag), else offer no-annual-fee downgrade. Retention offers if still
      closing — Entry-tier 500 points or $5 credit, Mid-tier 2000 points or $20 credit, Premium-tier 5000 points or $50 credit.'
  nv_downgrade_policy:
    type: markdown
    description: 'Downgrade to no-annual-fee card: Bronze Rewards Card (personal) or Business Bronze Rewards Card (business);
      same category only. Preserves credit limit, account number, and history; unredeemed rewards transfer at same value.'
  nv_closure_reason:
    type: enum
    enum:
    - annual_fee
    - not_using_card
    - found_better_card
    - unhappy_with_rewards
    - simplifying_finances
    - negative_experience
    - other
    description: Why the customer wants to close their credit card account.
  nv_bank_account_type:
    type: enum
    enum:
    - checking
    - savings
    - business_checking
    - business_savings
    description: Bank account wire type for open_bank_account. Personal checking/savings use checking or savings. LLC/business
      products (Navy Blue, Lime Green, True Blue, Sky Blue) require business_checking. Business savings products require business_savings.
  nv_bank_reorg_policy:
    type: markdown
    description: 'Multi-account banking reorganization ordering (KB bank account eligibility).

      Valid order when customer requests closures and opens together:

      1. Open business checking first — blocked if any account already has CLOSED status.

      2. Open personal savings — requires a personal checking account open at least 14 days.

      3. Close old savings (transfer balance to new savings).

      4. Close old checking (split/transfer balances, then close).

      Query BankAccount_list_by_user for account_type, account_class, date_opened, and status before planning.'
  nv_user_lookup_shelf:
    type: enum
    enum:
    - by_email
    - by_name
    description: Look up User by shelf — by_email or by_name.
