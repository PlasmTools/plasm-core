          value_ref: nv_str
          required: true
        - name: checking_account_id
          value_ref: nv_str
          required: true
        - name: credit_card_account_id
          value_ref: nv_str
          required: true
        - name: amount
          value_ref: nv_num
          required: true
  CreditLimitRequest_submit:
    description: File a new PENDING credit limit increase. Workflow order — submit first to open a case, then review eligibility
      on that pending request and approve or deny. Do not refuse to submit solely because utilization exceeds the tier threshold;
      high utilization is a post-submit deny reason. Coach `requested_increase_amount` to the tier max (`max_increase_amount`)
      before filing. Denied requests do not start cooldown — after the customer fixes blockers, submit again as a new case.
    kind: action
    entity: CreditLimitRequest
    identity_key:
    - credit_card_account_id
    - user_id
    - requested_increase_amount
    discovery:
      operation_terms:
      - submit
      - request
      - file
      - resubmit
      target_terms:
      - credit limit increase
      - CLI request
      - new CLI case
    provides:
    - request_id
    - status
    - requested_increase_amount
    - credit_card_account_id
    invalidates_entities:
    - CreditLimitRequest
    - CreditLimitEligibility
    output:
      type: side_effect
      description: Creates a PENDING credit limit increase request. Witness includes request_id (in provides) — bind approve
        from c1.request_id in the same program or read it from the submit plasm_run row before approving.
    payload:
      input_type:
        type: object
        fields:
        - name: credit_card_account_id
          value_ref: nv_credit_card_account_id
          required: true
        - name: user_id
          value_ref: nv_user_id
          required: true
        - name: requested_increase_amount
          value_ref: nv_cli_increase_amount
          required: true
  CreditLimitRequest_list_by_account:
    description: List prior credit limit increase requests for a card.
    kind: query
    entity: CreditLimitRequest
    selection:
    - name: credit_card_account_id
      value_ref: nv_credit_card_account_id
      required: true
    - name: status
      value_ref: nv_cli_status
      required: false
    provides:
    - request_id
    - credit_card_account_id
    - user_id
    - requested_increase_amount
    - status
    - denial_reason
    - decision_date
    - submitted_date
  PaymentHistory_list_by_account:
    description: Recent credit card payment history for a card — use for consecutive on-time month rules.
    kind: query
    entity: PaymentHistory
    discovery:
      operation_terms:
      - list
      - check
      - verify
      target_terms:
      - payment history
      - on-time payments
      - consecutive payment months
    selection:
    - name: credit_card_account_id
      value_ref: nv_credit_card_account_id
      required: true
    - name: months
      value_ref: nv_int
      required: true
    provides:
    - payment_id
    - credit_card_account_id
    - amount
  CreditLimitRequest_deny:
    description: Deny one pending CLI case by `request_id` after submit — post-submit review step. Pick `denial_reason` from
      policy gloss (e.g. `high_utilization` when utilization is at or above the tier max at decision time; `cooldown_period_active`
      when an approved CLI falls inside the tier cooldown window). Terminal for that request — a new cycle needs a new submit.
      Denial does not trigger cooldown. τ² DB semantics leave the original PENDING submit row in place; a separate DENIED
      row is appended — do not re-deny or re-approve the same request_id.
    kind: action
    entity: CreditLimitRequest
    identity_key:
    - request_id
    discovery:
      operation_terms:
      - deny
      - reject
      - decline
      target_terms:
      - credit limit increase
      - CLI denial
      - pending request
      - high utilization
      - insufficient payment history
      - cooldown period
    provides:
    - request_id
    - status
    - denial_reason
    - credit_card_account_id
    - user_id
    invalidates_entities:
    - CreditLimitRequest
    - CreditLimitEligibility
    output:
      type: side_effect
      description: Denies one pending credit limit increase request with a policy reason.
    payload:
      input_type:
        type: object
        fields:
        - name: request_id
          value_ref: nv_cli_request_id
          required: true
        - name: credit_card_account_id
          value_ref: nv_credit_card_account_id
          required: true
        - name: user_id
          value_ref: nv_user_id
          required: true
        - name: denial_reason
          value_ref: nv_cli_denial_reason
          required: true
  CreditLimitRequest_approve:
    description: Approve one pending CLI case by `request_id`. `new_credit_limit` is the approved total limit (not the increase
      delta). Terminal for that request — a new cycle needs a new submit. τ² DB semantics leave the original PENDING submit
      row in place; a separate APPROVED row is appended and the card limit updates — trust the APPROVED witness; do not re-approve
      the same request_id.
    kind: action
    entity: CreditLimitRequest
    identity_key:
    - request_id
    discovery:
      operation_terms:
      - approve
      - grant
      - accept
      target_terms:
      - credit limit increase
      - CLI approval
      - pending request
    provides:
    - request_id
    - status
    - new_limit
    - credit_card_account_id
    - user_id
    invalidates_entities:
    - CreditLimitRequest
    - CreditLimitEligibility
    output:
      type: side_effect
      description: Approves one pending credit limit increase request at the new total limit.
    payload:
      input_type:
        type: object
        fields:
        - name: request_id
          value_ref: nv_cli_request_id
          required: true
        - name: credit_card_account_id
          value_ref: nv_credit_card_account_id
          required: true
        - name: user_id
          value_ref: nv_user_id
          required: true
        - name: new_credit_limit
          value_ref: nv_cli_new_limit
          required: true
  CreditLimitEligibility_query:
    description: CLI eligibility review — tier thresholds, utilization, payment months, disputes, cooldown, required_reads_checklist,
      and workflow_sequencing_hint. Use to coach the customer and to decide approve/deny on a pending request; it does not
      replace submit when utilization is high — submit first, then deny with `high_utilization` if still over tier max. When
      the customer also wants a dispute and/or replacement card, complete CLI submit and decision before those writes.
    kind: query
