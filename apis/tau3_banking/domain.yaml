    - CreditCardClosureEligibility
    output:
      type: side_effect
      description: Pay off a credit card balance using funds from the customer's Rho-Bank checking account. This deducts the
        specified amount from the checking account and reduces the credit card balance by the same amount. Blocked when nv_closure_policy
        step 1 (open dispute) applies.
    payload:
      input_type:
        type: object
        fields:
