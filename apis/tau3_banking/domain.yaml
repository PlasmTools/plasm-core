version: 15
entry_id: tau3_banking
registry_aliases:
- default
auth:
  scheme: none
http_backend: http://127.0.0.1:18080
entities:
  User:
    id_field: user_id
    primary_query: get_user_information_by_email
    description: Banking customer profile (always-on lookups).
    discovery:
      names:
      - customer
      - user
      - banking customer
      seed_class: ambient
    fields:
      user_id:
        required: true
        value_ref: nv_str
      name:
        required: false
        value_ref: nv_str
      email:
        required: false
        value_ref: nv_str
      phone_number:
        required: false
        value_ref: nv_str
      address:
        required: false
        value_ref: nv_str
      date_of_birth:
        required: false
        value_ref: nv_str
    relations:
      referrals:
        description: referrals for this user.
        target: Referral
        cardinality: many
        materialize:
          kind: query_scoped
          capability: get_referrals_by_user
          param: user_id
      credit_card_accounts:
        description: credit_card_accounts for this user.
        target: CreditCardAccount
        cardinality: many
        materialize:
          kind: query_scoped
          capability: get_credit_card_accounts_by_user
          param: user_id
      credit_card_transactions:
        description: credit_card_transactions for this user.
        target: CreditCardTransaction
        cardinality: many
        materialize:
          kind: query_scoped
          capability: get_credit_card_transactions_by_user
          param: user_id
  Referral:
    id_field: referral_id
    description: Referral record for a customer.
    fields:
      referral_id:
        required: true
        value_ref: nv_str
      referrer_id:
        required: false
        value_ref: nv_str
      referred_account_type:
        required: false
        value_ref: nv_str
      referral_status:
        required: false
        value_ref: nv_str
      date:
        required: false
        value_ref: nv_str
    relations: {}
  CreditCardAccount:
    id_field: account_id
    description: Credit card account balances and limits for payments, CLI, and closure work.
    discovery:
      names:
      - credit card
      - credit card account
      - rho-bank credit card
      qualifier_names:
      - card account
      - Bronze Rewards Card
      - card tier
      seed_class: primary
    fields:
      account_id:
        required: true
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      card_type:
        required: false
        value_ref: nv_card_type
      status:
        required: false
        value_ref: nv_str
      balance:
        required: false
        value_ref: nv_num
      credit_limit:
        required: false
        value_ref: nv_num
      rewards:
        required: false
        value_ref: nv_num
    relations: {}
  CreditCardTransactionLocked:
    id_field: transaction_id
    description: Credit card transaction mutations requiring unlock (discoverable).
    fields:
      transaction_id:
        required: true
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
    relations: {}
  CreditCardTransaction:
    id_field: transaction_id
    description: Credit card transaction (always-on list-by-user).
    fields:
      transaction_id:
        required: true
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      amount:
        required: false
        value_ref: nv_num
      merchant_name:
        required: false
        value_ref: nv_str
      category:
        required: false
        value_ref: nv_str
      rewards_earned:
        required: false
        value_ref: nv_str
    relations: {}
  AgentToolkit:
    id_field: toolkit_id
    description: Session meta ops — verification, dual-control user tools, transfer, clock.
    fields:
      toolkit_id:
        required: true
        value_ref: nv_str
    relations: {}
  BankAccount:
    id_field: account_id
    description: Checking/savings account (discoverable).
    discovery:
      names:
      - bank account
      - checking account
      - savings account
      seed_class: primary
    fields:
      account_id:
        required: true
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      account_type:
        required: false
        value_ref: nv_str
      account_class:
        required: false
        value_ref: nv_str
        description: Product name (e.g. Navy Blue, Silver Plus Account, Evergreen Account).
      date_opened:
        required: false
        value_ref: nv_str
        description: Account open date (MM/DD/YYYY) — savings eligibility needs checking open 14+ days.
      status:
        required: false
        value_ref: nv_str
      balance:
        required: false
        value_ref: nv_num
    relations: {}
  DebitCard:
    id_field: card_id
    description: Debit card linked to a bank account (discoverable).
    discovery:
      names:
      - debit card
      seed_class: primary
    fields:
      card_id:
        required: true
        value_ref: nv_str
      account_id:
        required: false
        value_ref: nv_str
      status:
        required: false
        value_ref: nv_str
      last_4:
        required: false
        value_ref: nv_str
    relations: {}
  BankTransaction:
    id_field: transaction_id
    description: Bank account transaction (discoverable).
    fields:
      transaction_id:
        required: true
        value_ref: nv_str
      account_id:
        required: false
        value_ref: nv_str
      amount:
        required: false
        value_ref: nv_num
    relations: {}
  CreditCardDispute:
    id_field: dispute_id
    description: Filed credit card transaction dispute (discoverable).
    discovery:
      names:
      - credit card dispute
      - transaction dispute
      seed_class: primary
    fields:
      dispute_id:
        required: true
        value_ref: nv_str
      transaction_id:
        required: false
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      status:
        required: false
        value_ref: nv_str
    relations: {}
  DebitCardDispute:
    id_field: dispute_id
    description: Filed debit card transaction dispute (discoverable).
    fields:
      dispute_id:
        required: true
        value_ref: nv_str
      transaction_id:
        required: false
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      status:
        required: false
        value_ref: nv_str
    relations: {}
  CreditCardOrder:
    id_field: order_id
    description: Replacement credit card order (discoverable).
    fields:
      order_id:
        required: true
        value_ref: nv_str
      credit_card_account_id:
        required: false
        value_ref: nv_str
      status:
        required: false
        value_ref: nv_str
    relations: {}
  ClosureReason:
    id_field: closure_reason_id
    description: Logged reason when a customer asks to close a credit card — retention and abuse-prevention history.
    discovery:
      names:
      - closure reason
      - account closure
      qualifier_names:
      - retention history
      - why customer wants to close
      seed_class: dependent
    fields:
      closure_reason_id:
        required: true
        value_ref: nv_str
      credit_card_account_id:
        required: false
        value_ref: nv_str
      closure_reason:
        required: false
        value_ref: nv_closure_reason
    relations: {}
  CreditCardAccountLocked:
    id_field: account_id
    description: Credit card account mutations — close, pay from checking, flags, statement credits.
    discovery:
      names:
      - credit card mutation
      qualifier_names:
      - close credit card
      - pay credit card from checking
      - annual fee waiver
      seed_class: primary
    fields:
      account_id:
        required: true
        value_ref: nv_str
      user_id:
        required: false
        value_ref: nv_str
      card_type:
        required: false
        value_ref: nv_card_type
      status:
        required: false
        value_ref: nv_str
      balance:
        required: false
        value_ref: nv_num
      credit_limit:
        required: false
        value_ref: nv_num
      rewards:
        required: false
        value_ref: nv_num
      closure_policy:
        required: false
        value_ref: nv_closure_policy
      retention_policy:
        required: false
        value_ref: nv_retention_policy
      downgrade_policy:
        required: false
        value_ref: nv_downgrade_policy
    relations: {}
  CreditLimitRequest:
    id_field: request_id
    description: Credit limit increase (CLI) case — one pending request per decision cycle.
    discovery:
      names:
      - credit limit increase
      - CLI request
      - limit increase request
      qualifier_names:
      - pending CLI
      - credit limit case
      - CLI denial
      - CLI approval
      seed_class: primary
    fields:
      request_id:
        required: true
        value_ref: nv_cli_request_id
      credit_card_account_id:
        required: false
        value_ref: nv_credit_card_account_id
      user_id:
        required: false
        value_ref: nv_user_id
      requested_increase_amount:
        required: false
        value_ref: nv_cli_increase_amount
      status:
        required: false
        value_ref: nv_cli_status
      denial_reason:
        required: false
        value_ref: nv_cli_denial_reason
      decision_date:
        required: false
        value_ref: nv_str
      submitted_date:
        required: false
        value_ref: nv_str
      previous_limit:
        required: false
        value_ref: nv_num
      new_limit:
        required: false
        value_ref: nv_num
      increase_amount:
        required: false
        value_ref: nv_num
    relations: {}
  CreditLimitEligibility:
    abstract: true
    id_field: credit_card_account_id
    description: CLI eligibility snapshot — tier thresholds, utilization, payment history, blockers, and workflow_sequencing_hint
      when CLI must precede disputes or replacement orders.
    discovery:
      names:
      - CLI eligibility
      - credit limit readiness
      - tier requirements
      qualifier_names:
      - eligibility snapshot
      - CLI review
      - utilization threshold
      - cooldown period
      - payment history requirement
      seed_class: dependent
    fields:
      credit_card_account_id:
        required: true
        value_ref: nv_credit_card_account_id
      user_id:
        required: true
        value_ref: nv_user_id
      prior_request_count:
        required: false
        value_ref: nv_int
      payment_row_count:
        required: false
        value_ref: nv_int
      open_dispute_count:
        required: false
        value_ref: nv_int
      pending_replacement_count:
        required: false
        value_ref: nv_int
      has_open_dispute:
        required: false
        value_ref: nv_bool
      has_pending_replacement:
        required: false
        value_ref: nv_bool
      eligibility_hint:
        required: false
        value_ref: nv_str
      card_balance:
        required: false
        value_ref: nv_num
      card_limit:
        required: false
        value_ref: nv_num
      card_type:
        required: false
        value_ref: nv_str
      utilization_pct:
        required: false
        value_ref: nv_num
      tier_max_increase_pct:
        required: false
        value_ref: nv_int
      max_increase_amount:
        required: false
        value_ref: nv_int
      has_pending_request:
        required: false
        value_ref: nv_bool
      pending_request_id:
        required: false
        value_ref: nv_cli_request_id
      pending_requested_amount:
        required: false
        value_ref: nv_cli_increase_amount
      tier_max_utilization_pct:
        required: false
        value_ref: nv_int
      tier_min_payment_months:
        required: false
        value_ref: nv_int
      tier_cooldown_days:
        required: false
        value_ref: nv_int
      tier_min_account_age_days:
        required: false
        value_ref: nv_int
      payment_months_met:
        required: false
        value_ref: nv_bool
      approved_request_count:
        required: false
        value_ref: nv_int
      last_approved_decision_date:
        required: false
        value_ref: nv_str
      last_approved_submitted_date:
        required: false
        value_ref: nv_str
      days_since_last_approval:
        required: false
        value_ref: nv_int
      cooldown_period_active:
        required: false
        value_ref: nv_bool
      required_reads_checklist:
        required: false
        value_ref: nv_str
      workflow_sequencing_hint:
        required: false
        value_ref: nv_str
    relations:
      prior_requests:
        description: prior_requests for this credit_card_account_id.
        target: CreditLimitRequest
        cardinality: many
        discovery:
          seed_nav: attach
          qualifier_terms:
          - prior CLI requests
          - request history
          - pending request
        materialize:
          kind: view_embed
          view: credit_limit_eligibility
      recent_payments:
        description: Recent on-time credit card payments for CLI payment-history rules.
        target: PaymentHistory
        cardinality: many
        discovery:
          seed_nav: attach
          qualifier_terms:
          - payment history
          - on-time payments
          - consecutive payment months
        materialize:
          kind: view_embed
          view: credit_limit_eligibility
      disputes:
        target: CreditCardDispute
        cardinality: many
        materialize:
          kind: view_embed
          view: credit_limit_eligibility
      pending_replacements:
        target: CreditCardOrder
        cardinality: many
        materialize:
          kind: view_embed
          view: credit_limit_eligibility
  CreditCardClosureEligibility:
    abstract: true
    id_field: credit_card_account_id
    description: Closure readiness snapshot — open disputes, pending replacements, balance, and closure_hint per nv_closure_policy
      step order.
    discovery:
      names:
      - closure eligibility
      - close card readiness
      - account closure review
      qualifier_names:
      - closure blocked
      - pending dispute
      - retention protocol
      seed_class: dependent
    fields:
      credit_card_account_id:
        required: true
        value_ref: nv_credit_card_account_id
      user_id:
        required: true
        value_ref: nv_user_id
      has_open_dispute:
        required: false
        value_ref: nv_bool
      has_pending_replacement:
        required: false
        value_ref: nv_bool
      open_dispute_count:
        required: false
        value_ref: nv_int
      pending_replacement_count:
        required: false
        value_ref: nv_int
      card_balance:
        required: false
        value_ref: nv_num
      closure_hint:
        required: false
        value_ref: nv_str
    relations:
      disputes:
        target: CreditCardDispute
        cardinality: many
        materialize:
          kind: view_embed
          view: credit_card_closure_eligibility
      pending_replacements:
        target: CreditCardOrder
        cardinality: many
        materialize:
          kind: view_embed
          view: credit_card_closure_eligibility
  PaymentHistory:
    id_field: payment_id
    description: Credit card payment history for CLI eligibility and consecutive on-time payment rules.
    discovery:
      names:
      - payment history
      qualifier_names:
      - on-time payments
      - consecutive payment months
      seed_class: dependent
    fields:
      payment_id:
        required: true
        value_ref: nv_str
      credit_card_account_id:
        required: false
        value_ref: nv_str
      amount:
        required: false
        value_ref: nv_num
    relations: {}
capabilities:
  get_user_information_by_id:
    description: Retrieve a banking customer profile for identity verification and servicing.
    kind: get
    entity: User
    provides:
    - user_id
    - name
    - email
    - phone_number
    - address
    - date_of_birth
    arguments:
      input_type:
        type: object
        fields:
        - name: user_id
          value_ref: nv_str
          required: true
  get_user_information_by_email:
    description: Look up User by shelf — by_email or by_name.
    kind: query
    entity: User
    selection:
    - name: shelf
      value_ref: nv_user_lookup_shelf
      required: true
      description: by_email | by_name
    - name: email
      value_ref: nv_str
      required: false
    - name: customer_name
      value_ref: nv_str
      required: false
    provides:
    - user_id
    - email
  get_referrals_by_user:
    description: List referrals for a user.
    kind: query
    entity: Referral
    selection: []
    provides:
    - referral_id
    - referrer_id
    scope:
    - name: user_id
      value_ref: nv_str
      required: true
  get_credit_card_accounts_by_user:
    description: List credit card accounts for a user.
    kind: query
    entity: CreditCardAccount
    selection:
    - name: credit_card_account_id
      value_ref: nv_credit_card_account_id
      required: false
    provides:
    - account_id
    - user_id
    - card_type
    - balance
    - credit_limit
    scope:
    - name: user_id
      value_ref: nv_str
      required: true
  get_credit_card_transactions_by_user:
    description: List credit card transactions for a user.
    kind: query
    entity: CreditCardTransaction
    selection: []
    provides:
    - transaction_id
    - user_id
    scope:
    - name: user_id
      value_ref: nv_str
      required: true
  change_user_email:
    description: Change user email.
    kind: update
    entity: User
    payload:
      input_type:
        type: object
        fields:
        - name: user_id
          value_ref: nv_str
          required: true
        - name: new_email
          value_ref: nv_str
          required: true
  log_verification:
    description: Log identity verification.
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Log identity verification.
    payload:
      input_type:
        type: object
        fields:
        - name: name
          value_ref: nv_str
          required: true
        - name: user_id
          value_ref: nv_str
          required: true
        - name: address
          value_ref: nv_str
          required: true
        - name: email
          value_ref: nv_str
          required: true
        - name: phone_number
          value_ref: nv_str
          required: true
        - name: date_of_birth
          value_ref: nv_str
          required: true
        - name: time_verified
          value_ref: nv_str
          required: true
  get_current_time:
    description: Get fixed eval clock.
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Get fixed eval clock.
  transfer_to_human_agents:
    description: Transfer the customer to a human agent.
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Hands the conversation to a human agent.
    payload:
      input_type:
        type: object
        fields:
        - name: summary
          value_ref: nv_str
          required: true
        - name: reason
          value_ref: nv_str
          required: true
  give_discoverable_user_tool:
    description: Hand a dual-control portal tool to the customer (last-4, confirmations).
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Grants a user-side portal tool for dual-control steps.
    payload:
      input_type:
        type: object
        fields:
        - name: discoverable_tool_name
          value_ref: nv_str
          required: true
        - name: arguments
          value_ref: nv_str
          required: true
  AgentToolkit_example_noop:
    description: Harness placeholder noop (eval wiring only).
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: No domain effect — harness placeholder.
  CreditCardTransaction_update_rewards:
    description: Update the rewards_earned field on a credit card transaction.
    kind: update
    entity: CreditCardTransactionLocked
    payload:
      input_type:
        type: object
        fields:
        - name: transaction_id
          value_ref: nv_str
          required: true
        - name: new_rewards_earned
          value_ref: nv_str
          required: true
  AgentToolkit_initial_transfer_0218:
    description: Special-protocol transfer request (lines may still be busy).
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Records an initial transfer attempt under the special protocol.
  AgentToolkit_initial_transfer_1822:
    description: Special-protocol transfer request (may instruct further triage first).
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Records an initial transfer attempt under the special protocol.
  AgentToolkit_emergency_bureau_transfer:
    description: Escalate a credit-bureau incident for priority correction handling.
    kind: action
    entity: AgentToolkit
    output:
      type: side_effect
      description: Flags the case for the credit-bureau correction team.
  CreditCardDispute_file:
    description: File a formal dispute for a credit card transaction. When the customer also requested a credit limit increase
      on the same card, complete CLI submit and approve/deny first — open disputes block further CLI eligibility. Omit `partial_refund_amount`
      unless resolution is a partial refund (do not pass 0 for a full refund).
    kind: action
    entity: CreditCardDispute
    provides:
    - dispute_id
    - transaction_id
    - user_id
    - status
    output:
      type: side_effect
      description: File a formal dispute for a credit card transaction.
    payload:
      input_type:
        type: object
        fields:
        - name: transaction_id
          value_ref: nv_str
          required: true
        - name: card_action
          value_ref: nv_str
          required: true
        - name: card_last_4_digits
          value_ref: nv_str
          required: true
        - name: full_name
          value_ref: nv_str
          required: true
        - name: user_id
          value_ref: nv_str
          required: true
        - name: phone
          value_ref: nv_str
          required: true
        - name: email
          value_ref: nv_str
          required: true
        - name: address
          value_ref: nv_str
          required: true
        - name: contacted_merchant
          value_ref: nv_bool
          required: true
        - name: purchase_date
          value_ref: nv_str
          required: true
        - name: issue_noticed_date
          value_ref: nv_str
          required: true
        - name: dispute_reason
          value_ref: nv_str
          required: true
        - name: resolution_requested
          value_ref: nv_str
          required: true
        - name: eligible_for_provisional_credit
          value_ref: nv_bool
          required: true
        - name: partial_refund_amount
          value_ref: nv_num
          required: false
  DebitCardDispute_file:
    description: File a formal dispute for a debit card transaction under Regulation E. Debit card disputes affect actual
      bank funds and have different liability rules based on reporting timing.
    kind: action
    entity: DebitCardDispute
    provides:
    - dispute_id
    - transaction_id
    - user_id
    - status
    output:
      type: side_effect
      description: File a formal dispute for a debit card transaction under Regulation E. Debit card disputes affect actual
        bank funds and have different liability rules based on reporting timing.
    payload:
      input_type:
        type: object
        fields:
        - name: transaction_id
          value_ref: nv_str
          required: true
        - name: account_id
          value_ref: nv_str
          required: true
        - name: card_id
          value_ref: nv_str
          required: true
        - name: user_id
          value_ref: nv_str
          required: true
        - name: dispute_category
          value_ref: nv_str
          required: true
        - name: transaction_date
          value_ref: nv_str
          required: true
        - name: discovery_date
          value_ref: nv_str
          required: true
        - name: disputed_amount
          value_ref: nv_num
          required: true
        - name: transaction_type
          value_ref: nv_str
          required: true
        - name: card_in_possession
          value_ref: nv_bool
          required: true
        - name: pin_compromised
          value_ref: nv_bool
          required: true
        - name: contacted_merchant
          value_ref: nv_bool
          required: true
        - name: police_report_filed
          value_ref: nv_bool
          required: true
        - name: written_statement_provided
          value_ref: nv_bool
          required: true
        - name: provisional_credit_eligible
          value_ref: nv_bool
          required: true
        - name: customer_max_liability_amount
          value_ref: nv_num
          required: true
        - name: card_action
          value_ref: nv_str
          required: true
  DebitCard_set_recurring_block:
    description: Block or unblock all recurring payments on a debit card. When blocked, all recurring/subscription charges
      will be declined. One-time purchases are not affected.
    kind: action
    entity: DebitCard
    output:
      type: side_effect
      description: Block or unblock all recurring payments on a debit card. When blocked, all recurring/subscription charges
        will be declined. One-time purchases are not affected.
    payload:
      input_type:
        type: object
        fields:
        - name: card_id
          value_ref: nv_str
