version: 15
http_backend: https://api.linear.app
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  external_publish:
    description: Public-visible issue or comment content within the workspace.
    severity: critical
entities:
  Team:
    id_field: key
    description: A Linear team (workspace grouping).
    fields:
      id:
        required: true
        value_ref: nv_team_id
      key:
        required: true
        value_ref: nv_team_key
      name:
        required: false
        value_ref: nv_wire_str_short
    relations: {}
  Project:
    id_field: id
    description: A Linear project.
    fields:
      id:
        required: true
        value_ref: nv_project_id
      name:
        required: false
        value_ref: nv_wire_str_short
      slugId:
        required: false
        value_ref: nv_project_slug_id
    relations: {}
  Cycle:
    id_field: id
    description: A time-boxed iteration on a team.
    fields:
      id:
        required: true
        value_ref: nv_cycle_id
      number:
        required: false
        value_ref: nv_cycle_number
      startsAt:
        required: false
        value_ref: nv_cycle_starts_at
      endsAt:
        required: false
        value_ref: nv_cycle_ends_at
    relations:
      team:
        target: Team
        cardinality: one
  User:
    id_field: id
    description: A Linear user.
    fields:
      id:
        required: true
        value_ref: nv_user_id
      name:
        required: false
        value_ref: nv_wire_str_short
      displayName:
        required: false
        value_ref: nv_wire_str_short
      email:
        required: false
        value_ref: nv_wire_str_short
    relations: {}
  WorkflowState:
    id_field: id
    description: A workflow column for a team.
    fields:
      id:
        required: true
        value_ref: nv_workflow_state_id
      name:
        required: false
        value_ref: nv_state_name
      type:
        required: false
        value_ref: nv_workflow_state_type
    relations: {}
  Label:
    id_field: name
    description: An issue label.
    discovery: null
    fields:
      id:
        required: true
        value_ref: nv_label_id
      name:
        required: true
        value_ref: nv_label_name
      color:
        required: false
        value_ref: nv_wire_str_short
    relations: {}
  Comment:
    id_field: id
    description: A comment on a Linear issue.
    discovery:
      names:
      - comment
    fields:
      id:
        required: true
        value_ref: nv_comment_id
      body:
        required: false
        value_ref: nv_wire_str_markdown
        data_class: untrusted
    relations:
      issue:
        target: Issue
        cardinality: one
  Issue:
    id_field: identifier
    primary_read: issue_get
    description: A Linear work item (task, bug, or feature).
    discovery:
      names:
      - issue
      - linear issue
    fields:
      id:
        required: true
        value_ref: nv_issue_id
      identifier:
        required: true
        value_ref: nv_issue_identifier
      title:
        required: false
        value_ref: nv_wire_str_short
        data_class: untrusted
      description:
        required: false
        value_ref: nv_wire_str_markdown
        data_class: untrusted
      priority:
        required: false
        value_ref: nv_issue_priority
      estimate:
        required: false
        value_ref: nv_wire_num
      dueDate:
        required: false
        value_ref: nv_wire_str_short
      team_key:
        required: false
        path: team.key
        value_ref: nv_team_key
    relations:
      team:
        target: Team
        cardinality: one
      project:
        target: Project
        cardinality: one
      assignee:
        target: User
        cardinality: one
      state:
        target: WorkflowState
        cardinality: one
      cycle:
        target: Cycle
        cardinality: one
      labels:
        target: Label
        cardinality: many
        discovery: null
        materialize:
          kind: from_parent_get
          path:
          - key: labels
          - key: nodes
          - wildcard: true
      parent:
        target: Issue
        cardinality: one
      children:
        target: Issue
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: children
          - key: nodes
          - wildcard: true
      comments:
        target: Comment
        cardinality: many
        discovery: null
        materialize:
          kind: query_scoped
          capability: comment_by_issue_query
          param: issue
  Document:
    id_field: id
    description: A Linear document.
    discovery:
      names:
      - linear document
      - document
    fields:
      id:
        required: true
        value_ref: nv_document_id
      title:
        required: false
        value_ref: nv_wire_str_short
    relations: {}
  Initiative:
    id_field: id
    description: A strategic initiative grouping projects.
    fields:
      id:
        required: true
        value_ref: nv_initiative_id
      name:
        required: false
        value_ref: nv_wire_str_short
    relations: {}
  ProjectMilestone:
    id_field: id
    description: A milestone on a project.
    fields:
      id:
        required: true
        value_ref: nv_project_milestone_id
      name:
        required: false
        value_ref: nv_wire_str_short
    relations:
      project:
        target: Project
        cardinality: one
  ProjectUpdate:
    id_field: id
    description: A status update posted on a project.
    fields:
      id:
        required: true
        value_ref: nv_project_update_id
      body:
        required: false
        value_ref: nv_wire_str_markdown
      health:
        required: false
        value_ref: nv_project_update_health
    relations:
      project:
        target: Project
        cardinality: one
  IssueContext:
    abstract: true
    id_field: issue_identifier
    primary_read: issue_context_get
    description: Bundle for triaging one issue.
    fields:
      issue_identifier:
        required: true
        value_ref: nv_issue_identifier
      title:
        required: false
        value_ref: nv_wire_str_short
      comment_count:
        required: false
        value_ref: nv_wire_int
    relations:
      issue:
        target: Issue
        cardinality: one
      comments:
        target: Comment
        cardinality: many
        materialize:
          kind: query_scoped
          capability: comment_by_issue_query
          param: issue
  MyWorkSnapshot:
    abstract: true
    id_field: viewer_id
    primary_read: my_work_get
    description: Issues assigned to the authenticated user (dashboard).
    discovery:
      names:
      - my work
      - assigned to me
      - my issues
    fields:
      viewer_id:
        required: true
        value_ref: nv_user_id
      issue_count:
        required: false
        value_ref: nv_wire_int
    relations:
      viewer:
        target: User
        cardinality: one
      issues:
        target: Issue
        cardinality: many
        discovery: null
        materialize:
          kind: view_embed
          view: my_work
  ProjectContext:
    abstract: true
    id_field: project_id
    primary_read: project_context_get
    description: Project with recent status updates.
    fields:
      project_id:
        required: true
        value_ref: nv_project_id
      name:
        required: false
        value_ref: nv_wire_str_short
      update_count:
        required: false
        value_ref: nv_wire_int
    relations:
      project:
        target: Project
        cardinality: one
      updates:
        target: ProjectUpdate
        cardinality: many
        materialize:
          kind: view_embed
          view: project_context
  IssueNavigationLink:
    abstract: true
    id_field: issue_identifier
    primary_read: issue_navigation_link_get
    description: Shareable Linear web URL for an issue.
    fields:
      issue_identifier:
        required: true
        value_ref: nv_issue_identifier
      title:
        required: false
        value_ref: nv_wire_str_short
      url:
        required: false
        value_ref: nv_linear_issue_url
    relations:
      issue:
        target: Issue
        cardinality: one
  CycleBoardSnapshot:
    abstract: true
    id_field: cycle_id
    primary_read: cycle_board_snapshot_get
    description: Cycle dates and issues in that iteration.
    fields:
      cycle_id:
        required: true
        value_ref: nv_cycle_id
      number:
        required: false
        value_ref: nv_cycle_number
      issue_count:
        required: false
        value_ref: nv_wire_int
    relations:
      cycle:
        target: Cycle
        cardinality: one
      issues:
        target: Issue
        cardinality: many
        materialize:
          kind: view_embed
          view: cycle_board_snapshot
capabilities:
  issue_search:
    description: Find issues by title and filter criteria.
    kind: query
    entity: Issue
    selection:
    - name: q
      value_ref: nv_issue_search_q
      required: false
    - name: team_key
      value_ref: nv_team_key
      required: false
    - name: state_name
      value_ref: nv_state_name
      required: false
    - name: label_name
      value_ref: nv_label_name
      required: false
    - name: assignee_name
      value_ref: nv_assignee_name
      required: false
    - name: priority
      value_ref: nv_issue_priority
      required: false
    - name: project_name
      value_ref: nv_wire_str_short
      required: false
    - name: cycle
      value_ref: nv_cycle_ref
      required: false
    provides:
    - identifier
    - title
    - priority
    - team_key
  issue_get:
    kind: get
    entity: Issue
    provides:
    - id
    - identifier
    - title
    - description
    - priority
    - estimate
    - dueDate
    - team
    - project
    - assignee
    - cycle
    - parent
  user_viewer:
    description: The authenticated Linear user.
    kind: get
    entity: User
    provides:
    - id
    - name
    - displayName
    - email
  user_search:
    description: Find users by display name (exact match on first page).
    kind: search
    entity: User
    selection:
    - name: display_name
      value_ref: nv_assignee_name
      required: true
    provides:
    - id
    - displayName
  team_query:
    description: List teams.
    kind: query
    entity: Team
    provides:
    - key
    - name
  team_get:
    kind: get
    entity: Team
    provides:
    - id
    - key
    - name
  project_query:
    description: List projects.
    kind: query
    entity: Project
    provides:
    - id
    - name
    - slugId
  project_get:
    kind: get
    entity: Project
    provides:
    - id
    - name
    - slugId
  project_search:
    description: Find projects by name substring.
    kind: search
    entity: Project
    selection:
    - name: q
      value_ref: nv_wire_str_short
      required: true
    provides:
    - id
    - name
    - slugId
  cycle_query:
    description: List cycles for a team.
    kind: query
    entity: Cycle
    scope:
    - name: team_key
      value_ref: nv_team_key
      required: true
    provides:
    - id
    - number
    - startsAt
    - endsAt
  cycle_get:
    kind: get
    entity: Cycle
    provides:
    - id
    - number
    - startsAt
    - endsAt
    - team
  workflow_state_query:
    description: List workflow columns for a team.
    kind: query
    entity: WorkflowState
    scope:
    - name: team_key
      value_ref: nv_team_key
      required: true
    provides:
    - id
    - name
    - type
  label_query:
    description: List issue labels.
    kind: query
    entity: Label
    provides:
    - name
    - color
  comment_by_issue_query:
    description: List comments on an issue.
    kind: query
    entity: Comment
    scope:
    - name: issue
      value_ref: nv_issue_ref
      required: true
    provides:
    - id
    - body
  document_search:
    description: Find documents by title.
    kind: query
    entity: Document
    selection:
    - name: q
      value_ref: nv_wire_str_short
      required: false
    provides:
    - id
    - title
  document_get:
    kind: get
    entity: Document
    provides:
    - id
    - title
  document_update:
    description: Update document title or content.
    kind: update
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: title
          value_ref: nv_wire_str_short
          required: false
        - name: content
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - title
  initiative_query:
    description: List initiatives.
    kind: query
    entity: Initiative
    provides:
    - id
    - name
  initiative_get:
    kind: get
    entity: Initiative
    provides:
    - id
    - name
  initiative_update:
    description: Update initiative name or description.
    kind: update
    entity: Initiative
    payload:
      input_type:
        type: object
        fields:
        - name: name
          value_ref: nv_wire_str_short
          required: false
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - name
  project_milestone_query:
    description: List milestones on a project.
    kind: query
    entity: ProjectMilestone
    scope:
    - name: project
      value_ref: nv_project_id
      required: true
    provides:
    - id
    - name
  project_milestone_create:
    description: Create a milestone on a project.
    kind: create
    entity: ProjectMilestone
    payload:
      input_type:
        type: object
        fields:
        - name: project
          value_ref: nv_project_id
          required: true
        - name: name
          value_ref: nv_wire_str_short
          required: true
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - name
  project_milestone_update:
    description: Update a project milestone.
    kind: update
    entity: ProjectMilestone
    payload:
      input_type:
        type: object
        fields:
        - name: name
          value_ref: nv_wire_str_short
          required: false
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - name
  project_update_query:
    description: List status updates on a project.
    kind: query
    entity: ProjectUpdate
    scope:
    - name: project
      value_ref: nv_project_id
      required: true
    provides:
    - id
    - body
    - health
  project_update_create:
    description: Post a project status update.
    kind: create
    entity: ProjectUpdate
    payload:
      input_type:
        type: object
        fields:
        - name: project
          value_ref: nv_project_id
          required: true
        - name: body
          value_ref: nv_wire_str_markdown
          required: true
        - name: health
          value_ref: nv_project_update_health
          required: false
    provides:
    - id
    - body
    - health
  issue_create:
    description: Create an issue.
    kind: create
    entity: Issue
    payload:
      input_type:
        type: object
        fields:
        - name: team
          value_ref: nv_issue_create_team
          required: true
        - name: title
          value_ref: nv_wire_str_short
          required: true
          sink_class: external_publish
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
          sink_class: external_publish
        - name: state_name
          value_ref: nv_state_name
          required: false
        - name: assignee_name
          value_ref: nv_assignee_name
          required: false
        - name: project_name
          value_ref: nv_wire_str_short
          required: false
        - name: parent_identifier
          value_ref: nv_issue_identifier
          required: false
        - name: priority
          value_ref: nv_issue_priority
          required: false
    provides:
    - identifier
    - title
    - description
    preflight:
    - kind: hydrate_entity_ref_param
      param: team
      get: team_get
      merge:
        teamId: id
    - kind: query_pick
      when: state_name
      query: workflow_state_query
      scope:
        team_key:
          from_param: team
      pick:
        field: name
        equals_param: state_name
      merge:
        stateId: id
    - kind: query_pick
      when: assignee_name
      query: user_search
      scope:
        display_name:
          from_param: assignee_name
      pick:
        field: displayName
        equals_param: assignee_name
      merge:
        assigneeId: id
    - kind: query_pick
      when: project_name
      query: project_search
      scope:
        q:
          from_param: project_name
      pick:
        field: name
        equals_param: project_name
      merge:
        projectId: id
    identity_key:
    - team
    - title
  issue_update:
    description: Change issue workflow, ownership, labels, or priority.
    kind: update
    entity: Issue
    payload:
      input_type:
        type: object
        fields:
        - name: title
          value_ref: nv_wire_str_short
          required: false
          sink_class: external_publish
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
          sink_class: external_publish
        - name: state_name
          value_ref: nv_state_name
          required: false
        - name: assignee_name
          value_ref: nv_assignee_name
          required: false
        - name: project_name
          value_ref: nv_wire_str_short
          required: false
        - name: add_label_name
          value_ref: nv_label_name
          required: false
        - name: remove_label_name
          value_ref: nv_label_name
          required: false
        - name: priority
          value_ref: nv_issue_priority
          required: false
    provides:
    - identifier
    - title
    - description
    preflight:
    - kind: hydrate_invoke_target
      get: issue_get
      prefix: issue
    - kind: query_pick
      when: state_name
      query: workflow_state_query
      scope:
        team_key:
          from_preflight:
            prefix: issue
            path:
            - team
            - key
      pick:
        field: name
        equals_param: state_name
      merge:
        stateId: id
    - kind: query_pick
      when: assignee_name
      query: user_search
      scope:
        display_name:
          from_param: assignee_name
      pick:
        field: displayName
        equals_param: assignee_name
      merge:
        assigneeId: id
    - kind: query_pick
      when: project_name
      query: project_search
      scope:
        q:
          from_param: project_name
      pick:
        field: name
        equals_param: project_name
      merge:
        projectId: id
    - kind: label_ids_delta
      add_when: add_label_name
      remove_when: remove_label_name
      lookup: label_query
      from_preflight:
        prefix: issue
        path:
        - labels
      merge: labelIds
  issue_delete:
    description: Move an issue to trash (recoverable).
    kind: delete
    entity: Issue
  comment_create:
    description: Add a comment on an issue.
    kind: create
    entity: Comment
    discovery:
      operation_terms:
      - post comment
      - leave comment
      - summary comment
    payload:
      input_type:
        type: object
        fields:
        - name: issue
          value_ref: nv_issue_ref
          required: true
        - name: body
          value_ref: nv_wire_str_markdown
          required: true
          sink_class: external_publish
    provides:
    - id
    - body
  project_create:
    description: Create a project on a team.
    kind: create
    entity: Project
    payload:
      input_type:
        type: object
        fields:
        - name: name
          value_ref: nv_wire_str_short
          required: true
        - name: team
          value_ref: nv_issue_create_team
          required: true
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - name
  project_update:
    description: Update project name or description.
    kind: update
    entity: Project
    payload:
      input_type:
        type: object
        fields:
        - name: name
          value_ref: nv_wire_str_short
          required: false
        - name: description
          value_ref: nv_wire_str_markdown
          required: false
    provides:
    - id
    - name
  issue_context_query:
    description: Triage bundle for one issue.
    kind: query
    entity: IssueContext
    scope:
    - name: issue_identifier
      value_ref: nv_issue_identifier
      required: true
    provides:
    - issue_identifier
    - title
    - comment_count
  issue_context_get:
    description: Triage bundle for one issue.
    kind: get
    entity: IssueContext
    provides:
    - issue_identifier
    - title
    - comment_count
  my_work_query:
    description: Issues assigned to the authenticated user.
    kind: query
    entity: MyWorkSnapshot
    provides:
    - viewer_id
    - issue_count
  my_work_get:
    description: Dashboard snapshot for the current user.
    kind: get
    entity: MyWorkSnapshot
    provides:
    - viewer_id
    - issue_count
  project_context_query:
    description: Project with recent status updates.
    kind: query
    entity: ProjectContext
    scope:
    - name: project
      value_ref: nv_project_id
      required: true
    provides:
    - project_id
    - name
    - update_count
  project_context_get:
    description: Project context snapshot.
    kind: get
    entity: ProjectContext
    provides:
    - project_id
    - name
    - update_count
  issue_navigation_link_query:
    description: Shareable web URL for an issue.
    kind: query
    entity: IssueNavigationLink
    scope:
    - name: issue_identifier
      value_ref: nv_issue_identifier
      required: true
    provides:
    - issue_identifier
    - title
    - url
  issue_navigation_link_get:
    kind: get
    entity: IssueNavigationLink
    provides:
    - issue_identifier
    - title
    - url
  cycle_board_snapshot_query:
    description: Cycle board snapshot.
    kind: query
    entity: CycleBoardSnapshot
    scope:
    - name: cycle
      value_ref: nv_cycle_ref
      required: true
    provides:
    - cycle_id
    - number
    - issue_count
  cycle_board_snapshot_get:
    kind: get
    entity: CycleBoardSnapshot
    provides:
    - cycle_id
    - number
    - issue_count
views:
  issue_context:
    description: Triage snapshot for one issue.
    capability: issue_context_query
    entity: IssueContext
    scope:
    - name: issue_identifier
      value_ref: nv_issue_identifier
    nodes:
    - id: issue_row
      capability: issue_get
      bind:
        id:
          kind: scope
          param: issue_identifier
    - id: issue_comments
      capability: comment_by_issue_query
      bind:
        issue:
          kind: scope
          param: issue_identifier
    output:
      issue_identifier:
        kind: scope
        param: issue_identifier
      title:
        kind: node_field
        node: issue_row
        field: title
      comment_count:
        kind: node_row_count
        node: issue_comments
    relation_outputs:
    - relation: issue
      target: Issue
      cardinality: one
      binding:
        kind: node_single_row
        node: issue_row
    - relation: comments
      target: Comment
      cardinality: many
      binding:
        kind: node_all_rows
        node: issue_comments
  my_work:
    description: Authenticated user and their assigned issues.
    capability: my_work_query
    entity: MyWorkSnapshot
    nodes:
    - id: viewer_row
      capability: user_viewer
      bind: {}
    - id: assigned_issues
      capability: issue_search
      bind:
        assignee_name:
          kind: node_field
          node: viewer_row
          field: displayName
    output:
      viewer_id:
        kind: node_field
        node: viewer_row
        field: id
      issue_count:
        kind: node_row_count
        node: assigned_issues
    relation_outputs:
    - relation: viewer
      target: User
      cardinality: one
      binding:
        kind: node_single_row
        node: viewer_row
    - relation: issues
      target: Issue
      cardinality: many
      binding:
        kind: node_all_rows
        node: assigned_issues
  project_context:
    description: Project status snapshot.
    capability: project_context_query
    entity: ProjectContext
    scope:
    - name: project
      value_ref: nv_project_id
    nodes:
    - id: project_row
      capability: project_get
      bind:
        id:
          kind: scope
          param: project
    - id: status_updates
      capability: project_update_query
      bind:
        project:
          kind: scope
          param: project
    output:
      project_id:
        kind: scope
        param: project
      name:
        kind: node_field
        node: project_row
        field: name
      update_count:
        kind: node_row_count
        node: status_updates
    relation_outputs:
    - relation: project
      target: Project
      cardinality: one
      binding:
        kind: node_single_row
        node: project_row
    - relation: updates
      target: ProjectUpdate
      cardinality: many
      binding:
        kind: node_all_rows
        node: status_updates
  issue_navigation_link:
    description: Shareable web URL for an issue.
    capability: issue_navigation_link_query
    entity: IssueNavigationLink
    scope:
    - name: issue_identifier
      value_ref: nv_issue_identifier
    nodes:
    - id: issue_row
      capability: issue_get
      bind:
        id:
          kind: scope
          param: issue_identifier
    output:
      issue_identifier:
        kind: scope
        param: issue_identifier
      title:
        kind: node_field
        node: issue_row
        field: title
      url:
        kind: computed
        template: '{%- set team_key = issue_identifier.split(''-'')[0] -%}

          https://linear.app/{{ team_key }}/issue/{{ issue_identifier }}

          '
    relation_outputs:
    - relation: issue
      target: Issue
      cardinality: one
      binding:
        kind: node_single_row
        node: issue_row
  cycle_board_snapshot:
    description: Cycle board snapshot.
    capability: cycle_board_snapshot_query
    entity: CycleBoardSnapshot
    scope:
    - name: cycle
      value_ref: nv_cycle_ref
    nodes:
    - id: cycle_row
      capability: cycle_get
      bind:
        id:
          kind: scope
          param: cycle
    - id: cycle_issues
      capability: issue_search
      bind:
        cycle:
          kind: scope
          param: cycle
    output:
      cycle_id:
        kind: scope
        param: cycle
      number:
        kind: node_field
        node: cycle_row
        field: number
      issue_count:
        kind: node_row_count
        node: cycle_issues
    relation_outputs:
    - relation: cycle
      target: Cycle
      cardinality: one
      binding:
        kind: node_single_row
        node: cycle_row
    - relation: issues
      target: Issue
      cardinality: many
      binding:
        kind: node_all_rows
        node: cycle_issues
