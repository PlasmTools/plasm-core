version: 12
entry_id: simple_note
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored note text.
    severity: untrusted
entities:
  Account:
    id_field: email
    description: The signed-in simple note account, including private account details
      and registration, verification, recovery and deletion.
    discovery:
      names:
      - account
      - signup
      - sign up
      - registration
      - password reset
      - account verification
    fields:
      first_name:
        value_ref: account_name
      last_name:
        value_ref: account_name
      email:
        value_ref: account_email
      registered_at:
        value_ref: account_timestamp
      last_logged_in:
        value_ref: account_timestamp
      verified:
        value_ref: account_verified
  AuthSession:
    id_field: access_token
    description: Authenticated session for Simple Note.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Note:
    id_field: note_id
    description: A Simple Note document.
    discovery:
      names:
      - note
      - notes
      - memo
    fields:
      note_id:
        required: true
        value_ref: nv_note_id
      title:
        required: true
        value_ref: nv_title
      content:
        required: false
        value_ref: nv_content
        data_class: untrusted
      tags:
        required: false
        value_ref: nv_tags
      pinned:
        required: false
        value_ref: nv_bool
        description: "Whether this note is pinned for quick access."
      created_at:
        required: false
        value_ref: nv_datetime
      updated_at:
        required: false
        value_ref: nv_datetime
  Profile:
    id_field: email
    description: Simple Note user profile.
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
capabilities:
  account_get:
    description: Show the signed-in simple note account.
    kind: query
    entity: Account
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - last_logged_in
    - verified
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
  account_create:
    description: Sign up a new simple note account.
    kind: action
    receiver:
      kind: none
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: true
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: true
        - name: email
          value_ref: account_email
          required: true
        - name: password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Creates the simple note account for this email.
  account_update:
    description: Update the signed-in account holder's name.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: false
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: false
    output:
      type: side_effect
      description: Updates the account holder's display name.
    receiver:
      kind: none
  account_delete:
    description: Delete the signed-in simple note account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Deletes the signed-in simple note account.
    receiver:
      kind: none
  send_verification_code:
    description: Email a verification code to confirm an simple note account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends an account verification code to the email.
    receiver:
      kind: none
  verify_account:
    description: Confirm an simple note account with a verification code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: verification_code
          value_ref: account_verification_code
          required: true
    output:
      type: side_effect
      description: Marks the account as verified.
    receiver:
      kind: none
  send_password_reset_code:
    description: Email a password-reset code for an simple note account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends a password-reset code to the email.
    receiver:
      kind: none
  reset_password:
    description: Set a new simple note password using a reset code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: password_reset_code
          value_ref: account_password_reset_code
          required: true
        - name: new_password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Replaces the account password.
    receiver:
      kind: none
  login:
    description: Authenticate as this Simple Note account holder with their email and password.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Simple Note session for this token.
  note_query:
    description: Search notes (titles/tags; content omitted in list).
    kind: query
    entity: Note
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: tags
      value_ref: nv_tags
      required: false
    - name: pinned
      value_ref: nv_bool
      required: false
    controls:
    - name: dont_reorder_pinned
      value_ref: nv_bool
      required: false
      description: Keep pinned notes in the requested ordering instead of moving them ahead of other notes.
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - note_id
    - title
    - tags
    - pinned
    - created_at
    - updated_at
  note_get:
    description: Show one note including full content.
    kind: get
    entity: Note
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - note_id
    - title
    - content
    - tags
    - pinned
    - created_at
    - updated_at
  note_create:
    description: Create a new note.
    kind: create
    entity: Note
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_title
          required: true
        - name: content
          value_ref: nv_content
          required: true
        - name: tags
          value_ref: nv_tags
          required: false
        - name: pinned
          value_ref: nv_bool
          required: false
    provides:
    - note_id
  note_update:
    description: Update a note.
    kind: update
    entity: Note
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_title
          required: false
        - name: content
          value_ref: nv_content
          required: false
        - name: tags
          value_ref: nv_tags
          required: false
        - name: pinned
          value_ref: nv_bool
          required: false
  note_append_content:
    receiver: {kind: entity, entity: Note}
    description: Append or prepend text to an existing note body.
    kind: action
    entity: Note
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: append_or_prepend
          value_ref: nv_append_mode
          required: true
        - name: content
          value_ref: nv_content
          required: true
    output:
      type: side_effect
      description: Mutates note content by appending or prepending text.
  note_delete:
    description: Delete a note.
    kind: delete
    entity: Note
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  profile_get:
    description: Show Simple Note profile for an email (public lookup).
    kind: get
    entity: Profile
    arguments:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: nv_email
          required: true
values:
  account_name:
    type: string
    description: Account holder first or last name.
  account_email:
    type: email
    description: Email identifying the account being registered, verified, or recovered.
  account_password:
    type: string
    description: Password for account registration or recovery.
    min_length: 5
  account_verification_code:
    type: string
    description: Code delivered to the account owner to confirm account ownership.
  account_password_reset_code:
    type: string
    description: Code delivered to the account owner to authorize a password change.
  account_timestamp:
    type: rfc3339
    description: Account registration or last login time.
  account_verified:
    type: boolean
    description: Whether account ownership has been verified.
  nv_str:
    type: string
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_note_id:
    type: integer
    description: Identifies the note to read or act on.
  nv_title:
    type: string
    description: Note title.
  nv_content:
    type: document
    description: Note body text.
  nv_tags:
    type: array
    items:
      value_ref: nv_str
    description: Note tags.
  nv_bool:
    type: boolean
  nv_int:
    type: integer
  nv_datetime:
    type: rfc3339
  nv_append_mode:
    type: enum
    description: Whether to append or prepend content.
    enum:
    - append
    - prepend
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
prerequisites:
  contracts:
    appworld.principal:
      version: 1
      inputs: {}
      outputs:
        email: prerequisite_principal_email
        phone: prerequisite_principal_phone
    appworld.password:
      version: 1
      inputs:
        account: prerequisite_account_name
      outputs:
        password: nv_password
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    account_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: scope
          path:
          - access_token
        output: token
    account_update:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    account_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    login:
    - id: principal
      contract: appworld.principal
      bindings:
      - input:
          lane: payload
          path:
          - username
        output: email
    - id: password
      contract: appworld.password
      arguments:
        account:
          kind: constant
          value: simple_note
      bindings:
      - input:
          lane: payload
          path:
          - password
        output: password
    logout:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    note_query:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: selection
          path:
          - access_token
        output: token
    note_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: arguments
          path:
          - access_token
        output: token
    note_create:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    note_update:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    note_append_content:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    note_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
