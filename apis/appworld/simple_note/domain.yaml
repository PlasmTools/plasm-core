version: 5
entry_id: simple_note
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored note text.
    severity: untrusted
entities:
  AuthSession:
    id_field: access_token
    description: Login session for Simple Note (Bearer token).
    discovery:
      names:
      - login
      - auth
      - access token
      seed_class: primary
      co_seed_with: catalog_primary
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Note:
    id_field: note_id
    description: A Simple Note document with title, content, and tags.
    discovery:
      names:
      - note
      - notes
      - memo
      seed_class: primary
    fields:
      note_id:
        required: true
        value_ref: nv_note_id
      title:
        required: true
        value_ref: nv_title
      content:
        required: false
        value_ref: nv_content
        data_class: untrusted
      tags:
        required: false
        value_ref: nv_tags
      pinned:
        required: false
        value_ref: nv_bool
      created_at:
        required: false
        value_ref: nv_datetime
      updated_at:
        required: false
        value_ref: nv_datetime
  Profile:
    id_field: email
    description: Simple Note user profile.
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
capabilities:
  login:
    description: Authenticate as this Simple Note account holder with their email and password.
    kind: action
    entity: AuthSession
    parameters:
    - name: username
      value_ref: nv_login_username
      required: true
    - name: password
      value_ref: nv_password
      required: true
    provides:
    - access_token
    - token_type
    output:
      type: side_effect
      description: Creates an authenticated session; use access_token on subsequent calls.
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    output:
      type: side_effect
      description: Ends the Simple Note session for this token.
  note_query:
    description: Search notes (titles/tags; content omitted in list).
    kind: search
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
      role: search
    - name: tags
      value_ref: nv_tags
      required: false
      role: filter
    - name: pinned
      value_ref: nv_bool
      required: false
      role: filter
    - name: page_index
      value_ref: nv_int
      required: false
      role: response_control
    - name: page_limit
      value_ref: nv_int
      required: false
      role: response_control
    - name: sort_by
      value_ref: nv_str
      required: false
      role: sort
    provides:
    - note_id
    - title
    - tags
    - pinned
    - created_at
    - updated_at
  note_get:
    description: Show one note including full content.
    kind: get
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    provides:
    - note_id
    - title
    - content
    - tags
    - pinned
    - created_at
    - updated_at
  note_create:
    description: Create a new note.
    kind: create
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: title
      value_ref: nv_title
      required: true
    - name: content
      value_ref: nv_content
      required: true
    - name: tags
      value_ref: nv_tags
      required: false
    - name: pinned
      value_ref: nv_bool
      required: false
    provides:
    - note_id
  note_update:
    description: Update note title, content, tags, or pinned flag.
    kind: update
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: title
      value_ref: nv_title
      required: false
    - name: content
      value_ref: nv_content
      required: false
    - name: tags
      value_ref: nv_tags
      required: false
    - name: pinned
      value_ref: nv_bool
      required: false
  note_append_content:
    description: Append or prepend text to an existing note body.
    kind: action
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: append_or_prepend
      value_ref: nv_append_mode
      required: true
    - name: content
      value_ref: nv_content
      required: true
    output:
      type: side_effect
      description: Mutates note content by appending or prepending text.
  note_delete:
    description: Delete a note.
    kind: delete
    entity: Note
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
  profile_get:
    description: Show Simple Note profile for an email (public lookup).
    kind: get
    entity: Profile
    parameters:
    - name: email
      value_ref: nv_email
      required: true
values:
  nv_str:
    type: string

    description: Free-form string.
  nv_email:
    type: email

    description: Email address of a user or counterparty.
  nv_login_username:
    type: string

    description: Account-holder login id for this service — not a counterparty.
  nv_password:
    type: string

    description: Account-holder password for this service.
  nv_access_token:
    type: string

    description: Bearer access token from login.
  nv_note_id:
    type: integer
    description: Note primary key.
  nv_title:
    type: string

    description: Note title.
  nv_content:
    type: document

    description: Note body text.
  nv_tags:
    type: array
    items:
      value_ref: nv_str
    description: Note tags.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_int:
    type: integer
    description: Integer.
  nv_datetime:
    type: rfc3339

    description: ISO datetime string.
  nv_append_mode:
    type: enum

    description: Whether to append or prepend content.
    enum:
    - append
    - prepend
