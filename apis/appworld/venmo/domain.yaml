version: 8
entry_id: venmo
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment card digits or owner identity.
    severity: sensitive
  external_pay:
    description: Outbound payment or payment request leaving the account boundary.
    severity: critical
values:
  nv_access_token:
    type: string
    description: Bearer access token returned by login.
  nv_token_type:
    type: enum
    description: OAuth token type from login.
    enum:
    - bearer
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — account-holder login username, not a payment counterparty.
  nv_email:
    type: email
    description: Email of a Venmo user (profile or counterparty).
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_person_name:
    type: string
    description: Display name of a Venmo user.
  nv_search_query:
    type: string
    description: Free-text search query.
  nv_description:
    type: markdown
    description: Payment or request note text.
  nv_status:
    type: enum
    description: Payment-request status filter.
    enum:
    - pending
    - approved
    - denied
  nv_direction:
    type: enum
    description: Transaction direction filter.
    enum:
    - sent
    - received
  nv_transfer_type:
    type: enum
    description: Bank transfer direction between linked card and Venmo balance.
    enum:
    - card_to_venmo
    - venmo_to_card
  nv_sort_field:
    type: string
    description: Sort attribute with optional +/- prefix (created_at
    like_count: null
    amount).: null
  nv_card_name:
    type: string
    description: Payment card display name.
  nv_card_digits:
    type: string
    description: Card last-four or digit string.
  nv_transaction_id:
    type: integer
    description: Transaction primary key.
  nv_bank_transfer_id:
    type: integer
    description: Bank transfer primary key.
  nv_payment_request_id:
    type: integer
    description: Payment request primary key.
  nv_payment_card_id:
    type: integer
    description: Payment card primary key.
  nv_comment_id:
    type: integer
    description: Transaction comment primary key.
  nv_notification_id:
    type: integer
    description: Notification primary key.
  nv_card_number:
    type: integer
    description: Card number digits as integer.
  nv_cvv:
    type: integer
    description: Card CVV digits as integer.
  nv_month:
    type: integer
    description: Card expiry month.
  nv_year:
    type: integer
    description: Card expiry year.
  nv_amount:
    type: number
    description: Money amount as JSON number.
  nv_count:
    type: integer
    description: Count or limit.
  nv_private:
    type: boolean
    description: Whether the payment/request is private.
  nv_read:
    type: boolean
    description: Whether a notification has been read.
  nv_comment:
    type: string
    description: Text body of a transaction comment.
  nv_notification_type:
    type: enum
    description: Venmo notification kind.
    enum:
    - payment_request_approved
    - payment_request_denied
    - payment_request_received
    - payment_request_reminded
    - received_money
  nv_notification_title:
    type: string
    description: Notification title.
  nv_notification_message:
    type: string
    description: Notification message body.
  nv_timestamp:
    type: rfc3339
    description: Instant on the wire (created_at / updated_at / …).
  nv_filter_date:
    type: iso8601_date
    description: Calendar date filter for min/max created_at (YYYY-MM-DD).
entities:
  AuthSession:
    id_field: access_token
    description: Establish or end authenticated access to Venmo.
    discovery:
      names:
      - login
      - logout
      - authentication
      - access token
      seed_class: primary
      co_seed_with: catalog_primary
    fields:
      access_token:
        value_ref: nv_access_token
        required: true
      token_type:
        value_ref: nv_token_type
  User:
    id_field: email
    description: >-
      Resolve a Venmo person by name or email to a user_email before paying,
      requesting money, or opening their profile — not friendship management.
    discovery:
      names:
      - user
      - person
      - profile
      - recipient
      - counterparty
      - who to pay
      - who to request from
      seed_class: primary
      co_seed_with: catalog_primary
    fields:
      email:
        value_ref: nv_email
        required: true
      first_name:
        value_ref: nv_person_name
      last_name:
        value_ref: nv_person_name
      registered_at:
        value_ref: nv_timestamp
      friends_since:
        value_ref: nv_timestamp
    relations:
      friends:
        target: Friend
        cardinality: many
        materialize:
          kind: query_scoped
          capability: friend_query
          param: user_email
  Friend:
    id_field: email
    description: >-
      Resolve a named friend to a Venmo email before requesting or sending
      money, or add/remove people on the friends list.
    discovery:
      names:
      - friend
      - friends
      - friendship
      - befriend
      - unfriend
      - contact
      - my friend
      - from my friend
      - named friend
      - friend named
      seed_class: primary
      # Teaching extra whenever a Venmo primary (PaymentRequest, Transaction, …)
      # is FO-seeded — peer email is not inventable from create params alone.
      co_seed_with: catalog_primary
    fields:
      email:
        value_ref: nv_email
        required: true
      first_name:
        value_ref: nv_person_name
      last_name:
        value_ref: nv_person_name
      registered_at:
        value_ref: nv_timestamp
      friends_since:
        value_ref: nv_timestamp
  Balance:
    id_field: venmo_balance
    description: Inspect Venmo cash on hand, or move it to/from a linked payment card (deposit or withdraw).
    discovery:
      names:
      - balance
      - wallet
      - funds
      - withdraw
      - deposit
      - cash out
      seed_class: primary
    fields:
      venmo_balance:
        value_ref: nv_amount
        required: true
  BankTransfer:
    id_field: bank_transfer_id
    primary_query: bank_transfer_query
    description: History of money moved between a linked payment card and Venmo balance (deposits and
      cash-outs) — not peer-to-peer payments (use Transaction).
    discovery:
      names:
      - bank transfer
      - card transfer
      - deposit history
      - cash out history
      - card to venmo
      - venmo to card
      seed_class: primary
    fields:
      bank_transfer_id:
        value_ref: nv_bank_transfer_id
        required: true
      transfer_type:
        value_ref: nv_transfer_type
        required: true
      amount:
        value_ref: nv_amount
        required: true
      payment_card_digits:
        value_ref: nv_card_digits
        required: true
        data_class: pii_payment
      created_at:
        value_ref: nv_timestamp
        required: true
  Transaction:
    id_field: transaction_id
    primary_query: transaction_query
    description: Review completed transfers or send money you already owe — not for asking someone to
      pay you.
    discovery:
      names:
      - transaction
      - payment
      - transfer
      - pay
      seed_class: primary
    fields:
      transaction_id:
        value_ref: nv_transaction_id
        required: true
      amount:
        value_ref: nv_amount
        required: true
      description:
        value_ref: nv_description
        data_class: untrusted
      created_at:
        value_ref: nv_timestamp
      updated_at:
        value_ref: nv_timestamp
      private:
        value_ref: nv_private
      like_count:
        value_ref: nv_count
      payment_card_digits:
        value_ref: nv_card_digits
        data_class: pii_payment
      comment_count:
        value_ref: nv_count
      sender_email:
        value_ref: nv_email
        required: false
        path:
        - sender
        - email
      sender_name:
        value_ref: nv_person_name
        required: false
        path:
        - sender
        - name
      receiver_email:
        value_ref: nv_email
        required: false
        path:
        - receiver
        - email
      receiver_name:
        value_ref: nv_person_name
        required: false
        path:
        - receiver
        - name
  PaymentRequest:
    id_field: payment_request_id
    primary_query: payment_request_received_query
    description: >-
      Money others asked you to pay (received payment requests). Not completed
      transfers (use Transaction) or card↔balance moves (use Balance).
    discovery:
      names:
      - payment request
      - money request
      - charge request
      - requested money
      - been requested
      - request money
      - ask to pay
      - charge someone
      - approve request
      - pending request
      seed_class: primary
    fields:
      payment_request_id:
        value_ref: nv_payment_request_id
        required: true
      amount:
        value_ref: nv_amount
        required: true
      description:
        value_ref: nv_description
        data_class: untrusted
      created_at:
        value_ref: nv_timestamp
      updated_at:
        value_ref: nv_timestamp
      approved_at:
        value_ref: nv_timestamp
      denied_at:
        value_ref: nv_timestamp
      private:
        value_ref: nv_private
  PaymentCard:
    id_field: payment_card_id
    description: A linked payment card used to fund balance moves and approve payment requests (match
      by last digits when needed).
    discovery:
      names:
      - payment card
      - card
      - funding source
      - card ending
      - last four
      seed_class: primary
    fields:
      payment_card_id:
        value_ref: nv_payment_card_id
        required: true
      card_name:
        value_ref: nv_card_name
      owner_name:
        value_ref: nv_person_name
      card_number:
        value_ref: nv_card_number
        data_class: pii_payment
      expiry_year:
        value_ref: nv_year
      expiry_month:
        value_ref: nv_month
      cvv_number:
        value_ref: nv_cvv
        data_class: pii_payment
  TransactionComment:
    id_field: comment_id
    description: Read or write comments on a Venmo transaction.
    discovery:
      names:
      - transaction comment
      - comment
      seed_class: dependent
    fields:
      comment_id:
        value_ref: nv_comment_id
        required: true
      transaction_id:
        value_ref: nv_transaction_id
        required: true
      comment:
        value_ref: nv_comment
        data_class: untrusted
      created_at:
        value_ref: nv_timestamp
      like_count:
        value_ref: nv_count
  Notification:
    id_field: notification_id
    description: Manage Venmo inbox notifications (payment requests, reminders, received money).
    discovery:
      names:
      - notification
      - alert
      - inbox
      seed_class: ambient
    fields:
      notification_id:
        value_ref: nv_notification_id
        required: true
      type:
        value_ref: nv_notification_type
      title:
        value_ref: nv_notification_title
      message:
        value_ref: nv_notification_message
        data_class: untrusted
      read:
        value_ref: nv_read
      created_at:
        value_ref: nv_timestamp
capabilities:
  login:
    description: Authenticate as this Venmo account holder (login id + password) — not a payment recipient.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: side_effect
      description: Creates an authenticated Venmo session.
  logout:
    description: Invalidate an authenticated Venmo session.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Venmo session represented by the access token.
  user_search:
    description: Search Venmo users by name or email.
    kind: search
    entity: User
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_search_query
      required: true
    provides:
    - email
    - first_name
    - last_name
    - registered_at
    - friends_since
  user_get:
    description: Show a user's public Venmo profile and friendship status.
    kind: get
    entity: User
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - email
    - first_name
    - last_name
    - registered_at
    - friends_since
  friend_query:
    description: >-
      Search friends by name or email and return their Venmo email for a later
      pay or request step (or list another user's friends when scoped).
    kind: query
    entity: Friend
    discovery:
      operation_terms:
      - search
      - find
      - look up
      - resolve
      target_terms:
      - friend
      - friends
      - named friend
    scope:
    - name: user_email
      value_ref: nv_email
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_search_query
    provides:
    - email
    - first_name
    - last_name
    - registered_at
    - friends_since
  friend_add:
    description: Add a Venmo user as a friend (befriend).
    kind: action
    entity: Friend
    discovery:
      operation_terms:
      - add
      - befriend
      - friend
      target_terms:
      - friend
      - friendship
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: user_email
          value_ref: nv_email
          required: true
    output:
      type: side_effect
      description: Creates a friendship with the specified Venmo user.
  friend_remove:
    description: Remove an existing Venmo friendship (unfriend).
    kind: delete
    entity: Friend
    discovery:
      operation_terms:
      - remove
      - unfriend
      - delete
      target_terms:
      - friend
      - friendship
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  balance_get:
    description: Show the authenticated user's current Venmo balance.
    kind: get
    entity: Balance
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - venmo_balance
  balance_add:
    description: Add money to the Venmo balance from a linked payment card.
    kind: action
    entity: Balance
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: amount
          value_ref: nv_amount
          required: true
        - name: payment_card_id
          value_ref: nv_payment_card_id
          required: true
    output:
      type: side_effect
      description: Increases the authenticated user's Venmo balance.
  balance_withdraw:
    description: Withdraw (cash out) Venmo balance to a linked payment card.
    kind: action
    entity: Balance
    discovery:
      operation_terms:
      - withdraw
      - cash out
      - transfer out
      target_terms:
      - balance
      - payment card
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: amount
          value_ref: nv_amount
          required: true
        - name: payment_card_id
          value_ref: nv_payment_card_id
          required: true
    output:
      type: side_effect
      description: Moves balance from Venmo onto the chosen payment card.
  bank_transfer_query:
    description: List history of money transfers between linked payment cards and Venmo balance.
    kind: query
    entity: BankTransfer
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: transfer_type
      value_ref: nv_transfer_type
    provides:
    - bank_transfer_id
    - transfer_type
    - amount
    - payment_card_digits
    - created_at
  transaction_query:
    description: Find the authenticated user's sent and received transactions.
    kind: query
    entity: Transaction
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_search_query
    - name: user_email
      value_ref: nv_email
    - name: min_created_at
      value_ref: nv_filter_date
    - name: max_created_at
      value_ref: nv_filter_date
    - name: min_like_count
      value_ref: nv_count
    - name: max_like_count
      value_ref: nv_count
    - name: min_amount
      value_ref: nv_amount
    - name: max_amount
      value_ref: nv_amount
    - name: private
      value_ref: nv_private
    - name: direction
      value_ref: nv_direction
    controls:
    - name: sort_by
      value_ref: nv_sort_field
    provides: &id001
    - transaction_id
    - amount
    - description
    - created_at
    - updated_at
    - private
    - like_count
    - payment_card_digits
    - comment_count
    - sender_email
    - sender_name
    - receiver_email
    - receiver_name
  transaction_get:
    description: Show the details of one Venmo transaction.
    kind: get
    entity: Transaction
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides: *id001
  transaction_create:
    description: Send your money to another Venmo user (you pay them).
    kind: create
    entity: Transaction
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: receiver_email
          value_ref: nv_email
          required: true
        - name: amount
          value_ref: nv_amount
          required: true
        - name: description
          value_ref: nv_description
          sink_class: external_pay
        - name: payment_card_id
          value_ref: nv_payment_card_id
        - name: private
          value_ref: nv_private
    provides:
    - transaction_id
  payment_request_received_query:
    description: 'List payment requests other people sent to you (money you have been asked to pay). Filter
      by status (pending / approved / denied) when needed.

      '
    kind: query
    entity: PaymentRequest
    discovery:
      operation_terms:
      - list
      - show
      - received
      - pending
      target_terms:
      - payment request
      - requested money
      - charge
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: status
      value_ref: nv_status
    provides: &id002
    - payment_request_id
    - amount
    - description
    - created_at
    - updated_at
    - approved_at
    - denied_at
    - private
  payment_request_sent_query:
    description: 'List payment requests you sent to others (money you asked them to pay you). Filter by
      status (pending / approved / denied) when needed.

      '
    kind: query
    entity: PaymentRequest
    discovery:
      operation_terms:
      - list
      - show
      - sent
      target_terms:
      - payment request
      - money request
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: status
      value_ref: nv_status
    provides: *id002
  payment_request_create:
    description: Ask another Venmo user to pay you (create a sent payment request).
    kind: create
    entity: PaymentRequest
    discovery:
      operation_terms:
      - request
      - create
      - ask
      - charge
      target_terms:
      - payment request
      - money
      - friend
      - user
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: user_email
          value_ref: nv_email
          required: true
        - name: amount
          value_ref: nv_amount
          required: true
        - name: description
          value_ref: nv_description
          sink_class: external_pay
        - name: private
          value_ref: nv_private
    provides:
    - payment_request_id
  payment_request_approve:
    description: Approve and pay a received payment request (you pay them).
    kind: action
    entity: PaymentRequest
    discovery:
      operation_terms:
      - approve
      - accept
      - pay
      target_terms:
      - payment request
      - received request
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: payment_card_id
          value_ref: nv_payment_card_id
    output:
      type: side_effect
      description: Approves the payment request and transfers the requested money.
  payment_request_deny:
    description: Deny a received payment request.
    kind: action
    entity: PaymentRequest
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Marks the payment request as denied.
  payment_request_update:
    description: Update amount, description, or privacy on a pending payment request you sent.
    kind: update
    entity: PaymentRequest
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: amount
          value_ref: nv_amount
        - name: description
          value_ref: nv_description
          sink_class: external_pay
        - name: private
          value_ref: nv_private
  payment_request_remind:
    description: Send a reminder notification about a pending payment request you sent.
    kind: action
    entity: PaymentRequest
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Notifies the recipient about the outstanding payment request.
  payment_request_delete:
    description: Delete a pending payment request you sent.
    kind: delete
    entity: PaymentRequest
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  transaction_update:
    description: Update description or privacy on a transaction you sent.
    kind: update
    entity: Transaction
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: description
          value_ref: nv_description
        - name: private
          value_ref: nv_private
  transaction_like:
    description: Like a transaction.
    kind: action
    entity: Transaction
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Records a like on the transaction.
  transaction_unlike:
    description: Unlike a transaction.
    kind: action
    entity: Transaction
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the authenticated user's like from the transaction.
  transaction_comment_create:
    description: Add a comment on a Venmo transaction.
    kind: create
    entity: TransactionComment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: transaction_id
          value_ref: nv_transaction_id
          required: true
        - name: comment
          value_ref: nv_comment
          required: true
    provides:
    - comment_id
  transaction_comment_update:
    description: Edit the text of a transaction comment you wrote.
    kind: update
    entity: TransactionComment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: comment
          value_ref: nv_comment
          required: true
  transaction_comment_delete:
    description: Delete a transaction comment you wrote.
    kind: delete
    entity: TransactionComment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  payment_card_query:
    description: List payment cards linked to the authenticated user's account.
    kind: query
    entity: PaymentCard
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    provides:
    - payment_card_id
    - card_name
    - owner_name
    - card_number
    - expiry_year
    - expiry_month
    - cvv_number
  payment_card_create:
