  - { type: literal, value: balance }
  auth: *request_auth
balance_add:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: balance }
  auth: *request_auth
  body:
    type: object
    fields:
    - [amount, { type: var, name: amount }]
    - [payment_card_id, { type: var, name: payment_card_id }]
balance_withdraw:
  method: DELETE
  path:
