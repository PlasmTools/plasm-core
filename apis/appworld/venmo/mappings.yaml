      left: { type: var, name: polarity }
      right: { type: const, value: sent }
    then_expr: { type: const, value: sent_payment_requests }
    else_expr: { type: const, value: received_payment_requests }
  auth: *request_auth
  query: &status_query
    type: object
    fields:
    - - status
