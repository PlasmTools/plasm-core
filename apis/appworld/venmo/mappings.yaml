        then_expr: { type: var, name: min_amount }
        else_expr: { type: const, value: null }
    - - max_amount
      - type: if
        condition: { type: exists, var: max_amount }
        then_expr: { type: var, name: max_amount }
        else_expr: { type: const, value: null }
    - - private
      - type: if
        condition: { type: exists, var: private }
        then_expr: { type: var, name: private }
        else_expr: { type: const, value: null }
    - - direction
      - type: if
        condition: { type: exists, var: direction }
        then_expr: { type: var, name: direction }
        else_expr: { type: const, value: null }
    - - sort_by
