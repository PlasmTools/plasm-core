  method: GET
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: bank_transfers }
  auth: *request_auth
  query:
    type: object
    fields:
    - - transfer_type
      - type: if
        condition: { type: exists, var: transfer_type }
        then_expr: { type: var, name: transfer_type }
        else_expr: { type: const, value: null }
  pagination: *appworld_page_index_limit
bank_transfer_receipt_download:
  method: GET
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: bank_transfers }
  - { type: var, name: id }
  - { type: literal, value: receipt }
  auth: *request_auth
  query:
    type: object
    fields:
    - - download_to_file_path
      - type: if
