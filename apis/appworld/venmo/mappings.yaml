_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token: { type: var, name: access_token }

# AppWorld OpenAPI list endpoints use page_index (0-based) + page_limit (default 5, max 20).
# Composable pagination enables default fetch-all for summarize / aggregate programs.
_appworld_page_index_limit: &appworld_page_index_limit
  params:
    page_index:
      counter: 0
    page_limit:
      fixed: 20
      role: page_size
  strategy: page_number
login:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]
logout:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: auth }
