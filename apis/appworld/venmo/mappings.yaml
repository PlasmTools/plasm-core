        condition: { type: exists, var: download_to_file_path }
        then_expr: { type: var, name: download_to_file_path }
        else_expr: { type: const, value: null }
    - - overwrite
      - type: if
        condition: { type: exists, var: overwrite }
        then_expr: { type: var, name: overwrite }
        else_expr: { type: const, value: null }
    - - file_system_access_token
      - type: if
        condition: { type: exists, var: file_system_access_token }
        then_expr: { type: var, name: file_system_access_token }
        else_expr: { type: const, value: null }
