_request_auth: &request_auth
  scheme: bearer
  token: { type: var, name: access_token }

# AppWorld OpenAPI list endpoints use page_index (0-based) + page_limit (default 5, max 20).
# Composable pagination enables default fetch-all for summarize / aggregate programs.
_appworld_page_index_limit: &appworld_page_index_limit
  params:
    page_index:
      counter: 0
    page_limit:
      fixed: 20
      role: page_size
  strategy: page_number
login:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]
logout:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  auth: *request_auth
user_search:
  method: GET
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: users }
  auth: *request_auth
  query:
    type: object
    fields:
    - [query, { type: var, name: query }]
  pagination: *appworld_page_index_limit
user_get:
  method: GET
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: profile }
  auth: *request_auth
  query:
    type: object
    fields:
    - [email, { type: var, name: id }]
friend_query:
  method: GET
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: friends }
  auth: *request_auth
  query:
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - user_email
      - type: if
        condition: { type: exists, var: owner_email }
        then_expr: { type: var, name: owner_email }
        else_expr: { type: const, value: null }
  pagination: *appworld_page_index_limit
friend_add:
  method: POST
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: friends }
  - { type: var, name: user_email }
  auth: *request_auth
friend_remove:
  method: DELETE
  path:
  - { type: literal, value: venmo }
  - { type: literal, value: friends }
  - { type: var, name: id }
  auth: *request_auth
balance_get:
  method: GET
