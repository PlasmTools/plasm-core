        then_expr: { type: var, name: download_to_file_path }
        else_expr: { type: const, value: null }
    - - overwrite
      - type: if
        condition: { type: exists, var: overwrite }
        then_expr: { type: var, name: overwrite }
        else_expr: { type: const, value: null }
    - - file_system_access_token
      - type: if
        condition: { type: exists, var: file_system_access_token }
        then_expr: { type: var, name: file_system_access_token }
        else_expr: { type: const, value: null }
transaction_query:
  method: GET
  path:
  - { type: literal, value: venmo }
  - type: if
    condition:
      type: equals
      left: { type: var, name: shelf }
      right: { type: const, value: social_feed }
    then_expr: { type: const, value: social_feed }
    else_expr: { type: const, value: transactions }
  auth: *request_auth
  pagination: *appworld_page_index_limit
transaction_get:
