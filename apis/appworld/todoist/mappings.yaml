# Todoist — AppWorld. Auth: login → access_token → Bearer header.

_request_auth: &request_auth
  scheme: bearer
  token: { type: var, name: access_token }

# AppWorld OpenAPI list endpoints use page_index (0-based) + page_limit (default 5, max 20).
_appworld_page_index_limit: &appworld_page_index_limit
  params:
    page_index:
      counter: 0
    page_limit:
      fixed: 20
      role: page_size
  strategy: page_number

login:
  method: POST
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  auth: *request_auth

project_query:
  method: GET
  pagination: *appworld_page_index_limit
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: projects }
  auth: *request_auth
  query:
    type: object
    fields:
    - [sort_by, {type: if, condition: {type: exists, var: sort_by}, then_expr: {type: var, name: sort_by}, else_expr: {type: const, value: null}}]
    - [is_favorite, {type: if, condition: {type: exists, var: is_favorite}, then_expr: {type: var, name: is_favorite}, else_expr: {type: const, value: null}}]
    - [is_archived, {type: if, condition: {type: exists, var: is_archived}, then_expr: {type: var, name: is_archived}, else_expr: {type: const, value: null}}]
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - color
      - type: if
        condition: { type: exists, var: color }
        then_expr: { type: var, name: color }
        else_expr: { type: const, value: null }

project_get:
  method: GET
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: projects }
  - { type: var, name: id }
  auth: *request_auth

project_create:
