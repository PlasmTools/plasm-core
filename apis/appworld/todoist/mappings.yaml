# Todoist — AppWorld. Auth: login → access_token → Bearer header.

_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token:
          type: var
          name: access_token

login:
  method: POST
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: todoist }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  headers: *auth_header

project_query:
  method: GET
  path:
