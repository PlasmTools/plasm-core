# Account lifecycle: registration, recovery and authenticated account management.
account_get:
  method: GET
  path:
  - type: literal
    value: todoist
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
  response: single
account_create:
  method: POST
  path:
  - type: literal
    value: todoist
  - type: literal
    value: account
  body:
    type: object
    fields:
    - - first_name
      - type: var
        name: first_name
    - - last_name
      - type: var
        name: last_name
    - - email
      - type: var
        name: email
    - - password
      - type: var
        name: password
account_update:
  method: PATCH
  path:
  - type: literal
    value: todoist
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
  body:
    type: object
    fields:
    - - first_name
      - type: if
        condition:
          type: exists
          var: first_name
        then_expr:
          type: var
          name: first_name
        else_expr:
          type: const
          value: null
    - - last_name
      - type: if
        condition:
          type: exists
          var: last_name
        then_expr:
          type: var
          name: last_name
        else_expr:
          type: const
          value: null
account_delete:
  method: DELETE
  path:
  - type: literal
    value: todoist
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
send_verification_code:
  method: POST
  path:
  - type: literal
    value: todoist
  - type: literal
    value: send_verification_code
  body:
    type: object
    fields:
    - - email
      - type: var
        name: email
verify_account:
  method: POST
  path:
