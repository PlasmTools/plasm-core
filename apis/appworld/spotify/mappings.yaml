# Spotify — AppWorld. Auth: login → access_token → Bearer header.

_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token:
          type: var
          name: access_token

login:
  method: POST
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  headers: *auth_header

song_search:
  method: GET
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: songs }
  headers: *auth_header
  query:
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - genre
      - type: if
        condition: { type: exists, var: genre }
        then_expr: { type: var, name: genre }
        else_expr: { type: const, value: null }
    - - artist_id
      - type: if
        condition: { type: exists, var: artist_id }
        then_expr: { type: var, name: artist_id }
        else_expr: { type: const, value: null }
    - - album_id
      - type: if
        condition: { type: exists, var: album_id }
        then_expr: { type: var, name: album_id }
        else_expr: { type: const, value: null }
    - - page_index
      - type: if
        condition: { type: exists, var: page_index }
        then_expr: { type: var, name: page_index }
        else_expr: { type: const, value: null }
    - - page_limit
      - type: if
        condition: { type: exists, var: page_limit }
        then_expr: { type: var, name: page_limit }
        else_expr: { type: const, value: null }
    - - sort_by
      - type: if
        condition: { type: exists, var: sort_by }
        then_expr: { type: var, name: sort_by }
        else_expr: { type: const, value: null }

