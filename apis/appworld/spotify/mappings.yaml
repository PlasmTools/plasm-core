# Spotify — AppWorld. Auth: login → access_token → Bearer header.

_request_auth: &request_auth
  scheme: bearer
  token: { type: var, name: access_token }

# AppWorld OpenAPI list endpoints use page_index (0-based) + page_limit (default 5, max 20).
_appworld_page_index_limit: &appworld_page_index_limit
  params:
    page_index:
      counter: 0
    page_limit:
      fixed: 20
      role: page_size
  strategy: page_number

login:
  method: POST
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  auth: *request_auth


song_get:
  method: GET
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: songs }
  - { type: var, name: song_id }
  auth: *request_auth

# Same Song detail wire as song_get — hydrates LikedSong.genre after liked_song_query.
# Path param MUST be song_id (OpenAPI `/spotify/songs/{song_id}`); `id` is wrong and
# breaks identity→path binding for LikedSong.id_field=song_id.
liked_song_get:
  method: GET
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: songs }
  - { type: var, name: song_id }
  auth: *request_auth

