downloaded_song_query:
  method: GET
  path:
  - { type: literal, value: spotify }
  - { type: literal, value: downloaded_songs }
  auth: *request_auth
  query:
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - min_downloaded_at
      - type: if
        condition: { type: exists, var: min_downloaded_at }
        then_expr: { type: var, name: min_downloaded_at }
        else_expr: { type: const, value: null }
    - - max_downloaded_at
      - type: if
        condition: { type: exists, var: max_downloaded_at }
        then_expr: { type: var, name: max_downloaded_at }
        else_expr: { type: const, value: null }
    - - sort_by
      - type: if
        condition: { type: exists, var: sort_by }
        then_expr: { type: var, name: sort_by }
        else_expr: { type: const, value: null }
  pagination: *appworld_page_index_limit

