      left: { type: var, name: shelf }
      right: { type: const, value: recommendations }
    then_expr: { type: const, value: recommendations }
    else_expr:
      type: if
      condition:
        type: equals
        left: { type: var, name: shelf }
        right: { type: const, value: library }
      then_expr: { type: const, value: library/songs }
      else_expr: { type: const, value: songs }
  auth: *request_auth
  query: &page_query
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - genre
