    - name: max_like_count
      value_ref: nv_int
      required: false
      description: Catalog shelf only. Maximum number of likes.
    - name: min_like_count
      value_ref: nv_int
      required: false
      description: Catalog shelf only. Minimum number of likes.
    - name: max_rating
      value_ref: nv_number
      required: false
      description: Catalog shelf only. Maximum average rating.
    - name: min_rating
