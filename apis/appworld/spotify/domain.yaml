version: 23
entry_id: spotify
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment-card numbers and CVV.
    severity: sensitive
  external_subscribe:
    description: Outbound premium subscription that charges a payment card.
    severity: critical
entities:
  AuthSession:
    id_field: access_token
    description: Login session for Spotify (Bearer token).
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Song:
    id_field: song_id
    primary_query: song_library_query
    description: A Spotify track on the catalog or library shelf. Not the liked-songs shelf (use LikedSong) and not the playback queue (use Player / QueueEntry).
    discovery:
      names:
      - song
      - songs
      - track
      - music
      - song library
      - library songs
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      genre:
        required: false
        value_ref: nv_genre
      release_date:
        required: false
        value_ref: nv_str
      play_count:
        required: false
        value_ref: nv_int
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      shareable_link:
        required: false
        value_ref: nv_str
  LikedSong:
    id_field: song_id
    primary_query: liked_song_query
    primary_read: liked_song_get
    description: A track on the user's liked-songs shelf (hearted favorites). Distinct from the library shelf and from catalog search.
    discovery:
      names:
      - liked song
      - liked songs
      - favorites
      - hearted song
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      # Filled by liked_song_get hydration (GET /songs/{song_id}); the liked_songs *list* wire has no genre.
      genre:
        required: false
        value_ref: nv_genre
      release_date:
        required: false
        value_ref: nv_str
      play_count:
        required: false
        value_ref: nv_int
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      shareable_link:
        required: false
        value_ref: nv_str
      liked_at:
        required: false
        value_ref: nv_datetime
    relations:
      song:
        description: Catalog song for this liked shelf entry (genre and play stats live here on the Song GET).
        target: Song
        cardinality: one
        materialize:
          kind: get_scoped_bindings
          capability: song_get
          bindings:
            song_id: song_id
  Album:
    id_field: album_id
    primary_query: album_library_query
    description: An album on the catalog and library shelf. Not the liked-albums shelf (use LikedAlbum).
    discovery:
      names:
      - album
      - albums
      - album library
      - library albums
    fields:
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_str
    relations:
      songs:
        description: Songs on this album.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: songs
          - wildcard: true
          - key: id
  LikedAlbum:
    id_field: album_id
    primary_query: liked_album_query
    description: 'An album on the user''s liked-albums shelf. Distinct from albums saved in the library.

      '
    discovery:
      names:
      - liked album
      - liked albums
    fields:
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_str
      liked_at:
        required: false
        value_ref: nv_datetime
  Artist:
    id_field: artist_id
    primary_query: following_artist_query
    description: Music artist.
    discovery:
      names:
      - artist
      - artists
    fields:
      artist_id:
        required: true
        value_ref: nv_artist_id
      name:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      follower_count:
        required: false
        value_ref: nv_int
  Profile:
    id_field: email
    description: Spotify user public profile.
    discovery:
      names:
      - profile
      - user
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
  Genre:
    id_field: name
    description: Music genre label from the Spotify catalog vocabulary.
    discovery:
      names:
      - genre
      - genres
      - music genre
    fields:
      name:
        required: true
        value_ref: nv_genre
  Playlist:
    id_field: playlist_id
    primary_query: playlist_library_query
    description: A playlist on the catalog and library shelf. Not the liked-playlists shelf (use LikedPlaylist).
    discovery:
      names:
      - playlist
      - playlists
      - playlist library
      - library playlists
    fields:
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      shareable_link:
        required: false
        value_ref: nv_str
    relations:
      songs:
        description: Songs currently on this playlist.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: songs
          - wildcard: true
          - key: id
  LikedPlaylist:
    id_field: playlist_id
    primary_query: liked_playlist_query
    description: 'A playlist on the user''s liked-playlists shelf. Distinct from playlists saved in the library.

      '
    discovery:
      names:
      - liked playlist
      - liked playlists
    fields:
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      liked_at:
        required: false
        value_ref: nv_datetime
  DownloadedSong:
    id_field: song_id
    description: A song downloaded for offline playback.
    discovery:
      names:
      - downloaded song
      - downloads
      - offline song
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      downloaded_at:
        required: false
        value_ref: nv_datetime
  Player:
    # Identity is the Bearer token (RA-5 get arg), not song_id — current playback has no path id;
    # song_id/title/… are output of player_current only. Wire SongPlayerResponse has no access_token;
    # request identity must override decode (same pattern as other bearer-scoped singletons).
    id_field: access_token
    implicit_request_identity: true
    primary_read: player_current
    description: Current playback session and queue control. Distinct from browsing songs or playlists.
    discovery:
      names:
      - player
      - queue
      - volume
      - playback
      - shuffle
      - previous song
      - next song
      - play
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      position:
        required: false
        value_ref: nv_int
      is_playing:
        required: false
        value_ref: nv_bool
      # Composed on player_current view: true when current song_id is on the LikedSong shelf.
      # Not on OpenAPI SongPlayerResponse — membership is Player×LikedSong, not a LikedSong field.
      is_liked:
        required: false
        value_ref: nv_bool
      # Intermediate for is_liked (song_id → count JSON from liked_song_query). Not a domain concept.
      liked_by_song_id:
        required: false
        value_ref: nv_str
      volume:
        required: false
        value_ref: nv_int
  QueueEntry:
    id_field: position
    description: A song in the player queue.
    fields:
      position:
        required: true
        value_ref: nv_int
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
  SongReview:
    id_field: song_review_id
    description: User review of a song.
    discovery:
      names:
      - song review
      - song reviews
      - rate song
    fields:
      song_review_id:
        required: true
        value_ref: nv_song_review_id
      song_id:
        required: true
        value_ref: nv_song_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  AlbumReview:
    id_field: album_review_id
    description: User review of an album.
    discovery:
      names:
      - album review
      - album reviews
      - rate album
    fields:
      album_review_id:
        required: true
        value_ref: nv_album_review_id
      album_id:
        required: true
        value_ref: nv_album_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  PlaylistReview:
    id_field: playlist_review_id
    description: User review of a playlist.
    discovery:
      names:
      - playlist review
      - playlist reviews
      - rate playlist
    fields:
      playlist_review_id:
        required: true
        value_ref: nv_playlist_review_id
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  PaymentCard:
    id_field: payment_card_id
    description: Saved payment card.
    discovery:
      names:
      - payment card
      - card
      - payment cards
    fields:
      payment_card_id:
        required: true
        value_ref: nv_payment_card_id
      card_name:
        required: false
        value_ref: nv_str
      owner_name:
        required: false
        value_ref: nv_str
      card_number:
        required: false
        value_ref: nv_card_number
        data_class: pii_payment
      expiry_year:
        required: false
        value_ref: nv_int
      expiry_month:
        required: false
        value_ref: nv_int
      cvv_number:
        required: false
        value_ref: nv_int
        data_class: pii_payment
  PremiumPlan:
    id_field: monthly
    description: Spotify premium pricing sheet.
    discovery:
      names:
      - premium plan
      - premium plans
      - premium pricing
    fields:
      monthly:
        required: true
        value_ref: nv_int
      yearly:
        required: true
        value_ref: nv_int
  PremiumSubscription:
    id_field: premium_subscription_id
    description: Spotify premium subscription period.
    discovery:
      names:
      - premium
      - premium subscription
      - subscription
    fields:
      premium_subscription_id:
        required: true
        value_ref: nv_premium_subscription_id
      start_date:
        required: false
        value_ref: nv_datetime
      end_date:
        required: false
        value_ref: nv_datetime
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      paid_amount:
        required: false
        value_ref: nv_number
capabilities:
  login:
    description: Login to Spotify; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Spotify session for this token.
  song_get:
    description: Show one song.
    kind: get
    entity: Song
    # Scope slot so LikedSong.song (get_scoped_bindings) can bind parent.song_id → this get.
    scope:
    - name: song_id
      value_ref: nv_song_id
      required: true
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_id
    - title
    - album_id
    - album_title
    - duration
    - genre
    - release_date
    - play_count
    - rating
    - like_count
    - shareable_link
  song_like:
    receiver: {kind: entity, entity: Song}
    description: Like a song.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the song.
  song_unlike:
    receiver: {kind: entity, entity: Song}
    description: Unlike a song.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the song.
  downloaded_song_query:
    description: Search downloaded songs for offline play.
    kind: query
    entity: DownloadedSong
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: min_downloaded_at
      value_ref: nv_datetime
      required: false
    - name: max_downloaded_at
      value_ref: nv_datetime
      required: false
    controls:
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - song_id
    - title
    - album_id
    - album_title
    - duration
    - downloaded_at
  song_download:
    receiver: {kind: entity, entity: Song}
    description: Download a song for offline playback.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Downloads this song for offline play.
  song_undownload:
    receiver: {kind: entity, entity: Song}
    description: Remove a song from offline downloads.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes this song from offline downloads.
  album_get:
    description: Show one album.
    kind: get
    entity: Album
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - album_id
    - title
    - genre
    - rating
    - like_count
    - release_date
  album_like:
    receiver: {kind: entity, entity: Album}
    description: Like an album.
    kind: action
    entity: Album
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the album.
  album_unlike:
    receiver: {kind: entity, entity: Album}
    description: Unlike an album.
    kind: action
    entity: Album
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the album.
  artist_get:
    description: Show one artist.
    kind: get
    entity: Artist
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - artist_id
    - name
    - genre
    - follower_count
  artist_follow:
    receiver: {kind: entity, entity: Artist}
    description: Follow an artist.
    kind: action
    entity: Artist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Follows the artist.
  artist_unfollow:
    receiver: {kind: entity, entity: Artist}
    description: Unfollow an artist.
    kind: action
    entity: Artist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unfollows the artist.
  playlist_get:
    description: Show one playlist.
    kind: get
    entity: Playlist
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - playlist_id
    - title
    - is_public
    - rating
    - like_count
    - created_at
    - shareable_link
  playlist_create:
    description: Create a playlist.
    kind: create
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_str
          required: true
        - name: is_public
          value_ref: nv_bool
          required: false
    provides:
    - playlist_id
  playlist_update:
    description: Update a playlist.
    kind: update
    entity: Playlist
    discovery:
      operation_terms:
      - update
      - rename
      - retitle
      - change title
      target_terms:
      - playlist
      - playlist title
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_str
          required: false
        - name: is_public
          value_ref: nv_bool
          required: false
  playlist_delete:
    description: Delete a playlist.
    kind: delete
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  playlist_add_song:
    receiver: {kind: entity, entity: Playlist}
    description: Add a song to this playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: true
    output:
      type: side_effect
      description: Adds song_id to the playlist.
  playlist_remove_song:
    receiver: {kind: entity, entity: Playlist}
    description: Remove a song from this playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: true
    output:
      type: side_effect
      description: Removes song_id from the playlist.
  playlist_like:
    receiver: {kind: entity, entity: Playlist}
    description: Like a playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the playlist.
  playlist_unlike:
    receiver: {kind: entity, entity: Playlist}
    description: Unlike a playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the playlist.
  player_current_wire:
    description: Show the current song on the music player wire (no liked-shelf membership).
    kind: get
    entity: Player
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_id
    - title
    - position
    - is_playing
  player_current:
    description: Show current playback including whether that song is on the liked shelf.
    kind: get
    entity: Player
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_id
    - title
    - position
    - is_playing
    - volume
    - is_liked
  player_play:
    description: Start or resume playback.
    kind: action
    entity: Player
    discovery:
      operation_terms:
      - play
      - resume
      - start
      target_terms:
      - player
      - song
      - playback
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: false
        - name: album_id
          value_ref: nv_album_id
          required: false
        - name: playlist_id
          value_ref: nv_playlist_id
          required: false
    output:
      type: side_effect
      description: Starts playback.
  player_pause:
    description: Pause playback.
    kind: action
    entity: Player
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Pauses playback.
  player_previous:
    description: Skip to the previous song in the playback queue.
    kind: action
    entity: Player
    discovery:
      operation_terms:
      - previous
      - back
      - skip back
      target_terms:
      - song
      - queue
      - player
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    # No provides: membership (`is_liked`) lives only on player_current. Side-effect-only so
    # iterate…until re-observes the composed Get. Invalidate Player so re-Get is not cache-stale.
    invalidates_entities:
    - Player
    output:
      type: side_effect
      description: Moves playback to the previous song in the queue.
  player_next:
    description: Skip to the next song in the playback queue.
    kind: action
    entity: Player
    discovery:
      operation_terms:
      - next
      - skip
      - skip forward
      target_terms:
      - song
      - queue
      - player
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    invalidates_entities:
    - Player
    output:
      type: side_effect
      description: Moves playback to the next song in the queue.
