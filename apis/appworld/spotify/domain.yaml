views:
  library:
    description: Saved music collections with distinct songs across saved tracks, albums and playlists.
    capability: library_query
    entity: Library
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
    nodes:
    - id: direct_songs
      capability: song_library_query
      bind:
        access_token: {kind: scope, param: access_token}
        shelf: {kind: literal, value: library}
    - id: albums
      capability: album_library_query
      bind:
        access_token: {kind: scope, param: access_token}
        shelf: {kind: literal, value: library}
    - id: playlists
      capability: playlist_library_query
      bind:
        access_token: {kind: scope, param: access_token}
        shelf: {kind: literal, value: library}
    - id: album_songs
      traverse: {node: albums, relation: songs}
    - id: playlist_songs
      traverse: {node: playlists, relation: songs}
    output:
      access_token: {kind: scope, param: access_token}
    relation_outputs:
    - relation: songs
      target: Song
      cardinality: many
      binding: {kind: node_union_rows, nodes: [direct_songs, album_songs, playlist_songs]}
    - relation: albums
      target: Album
      cardinality: many
      binding: {kind: node_all_rows, node: albums}
    - relation: playlists
      target: Playlist
      cardinality: many
      binding: {kind: node_all_rows, node: playlists}
  player_current:
    description: Current playback with liked-shelf membership for the song on the cursor.
    capability: player_current
    entity: Player
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
    nodes:
    - id: wire
      capability: player_current_wire
      bind:
        access_token:
          kind: scope
          param: access_token
    - id: volume
      capability: player_volume_get
      bind:
        access_token:
          kind: scope
          param: access_token
    - id: liked
      capability: liked_song_query
      bind:
        access_token:
          kind: scope
          param: access_token
    - id: current_artists
      traverse: {node: wire, relation: artists}
    locals:
      liked_by_song_id:
        kind: node_field_histogram_json
        node: liked
        field: song_id
    output:
      album_id: {kind: node_field, node: wire, field: album_id}
      album_title: {kind: node_field, node: wire, field: album_title}
      duration: {kind: node_field, node: wire, field: duration}
      played_seconds: {kind: node_field, node: wire, field: played_seconds}
      is_looping: {kind: node_field, node: wire, field: is_looping}
      access_token:
        kind: scope
        param: access_token
      song_id:
        kind: node_field
        node: wire
        field: song_id
      title:
        kind: node_field
        node: wire
        field: title
      position:
        kind: node_field
        node: wire
        field: position
      is_playing:
        kind: node_field
        node: wire
        field: is_playing
      volume:
        kind: node_field
        node: volume
        field: volume
      is_liked:
        kind: computed
        # Histogram keys are decimal strings; coerce song_id for map lookup.
        template: "{{ (song_id ~ '') in liked_by_song_id }}"
    relation_outputs:
    - relation: artists
      target: Artist
      cardinality: many
      binding: {kind: node_all_rows, node: current_artists}

values:
  artist_search_ordering:
    type: enum
    description: Order artist candidates by follower count within relevance-ranked pages.
    enum: ['+follower_count', '-follower_count']
  following_artist_query_ordering:
    type: enum
    description: Catalog ordering uses follower_count; following uses followed_at or name. With query, ordering is within ranked pages.
    enum: ['+follower_count', '-follower_count', '+followed_at', '-followed_at', '+name', '-name']
  album_library_query_ordering:
    type: enum
    description: Catalog ordering uses rating or release_date; library uses added_at or title. With query, ordering is within ranked pages.
    enum: ['+rating', '-rating', '+release_date', '-release_date', '+added_at', '-added_at', '+title', '-title']
  song_library_query_ordering:
    type: enum
    description: Catalog ordering uses rating, like_count or play_count; library uses added_at or title; recommendations have no ordering. With query, ordering is within ranked pages.
    enum: ['+rating', '-rating', '+like_count', '-like_count', '+play_count', '-play_count', '+added_at', '-added_at', '+title', '-title']
  downloaded_file_path:
    type: string
    description: Absolute path of the downloaded file in the account file system.
  account_name:
    type: string
    description: Account holder first or last name.
  account_email:
    type: email
    description: Email identifying the account being registered, verified, or recovered.
  account_password:
    type: string
    description: Password for account registration or recovery.
    min_length: 5
  account_verification_code:
    type: string
    description: Code delivered to the account owner to confirm account ownership.
  account_password_reset_code:
    type: string
    description: Code delivered to the account owner to authorize a password change.
  account_timestamp:
    type: rfc3339
    description: Account registration or last login time.
  account_verified:
    type: boolean
    description: Whether account ownership has been verified.
  account_premium:
    type: boolean
    description: Whether the account has premium membership.
  nv_album_ref:
    type: entity_ref
    target: Album
    description: Album containing this recording.
  nv_release_date:
    type: rfc3339
    description: Release time of a recording or album.
  nv_shareable_link:
    type: http_url
    description: Public link to a music item.
  nv_artist_name:
    type: string
    description: Artist name for resolving a named artist among candidates.
  nv_artist_search_text:
    type: string
    description: Text that ranks artist candidates; non-matching names may also be returned.
  nv_str:
    type: string
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_song_shelf:
    type: enum
    enum:
    - catalog
    - library
    - recommendations
    description: Song source — catalog, directly saved tracks only (library), or recommendations. Album and playlist tracks require their own relations or Library.songs.
  nv_album_shelf:
    type: enum
    enum:
    - catalog
    - library
    description: Album list shelf — catalog browse/filter or saved library.
  nv_artist_shelf:
    type: enum
    enum:
    - catalog
    - following
    description: Artist list shelf — all catalog artists or followed artists.
  nv_playlist_shelf:
    type: enum
    enum:
    - catalog
    - library
    description: Playlist list shelf — catalog browse/filter or saved library.
  nv_song_id:
    type: integer
    description: Identifies the song to read or act on.
  nv_album_id:
    type: integer
    description: Identifies the album to read or act on.
  nv_artist_id:
    type: integer
    description: Identifies the artist to read or act on.
  nv_playlist_id:
    type: integer
    description: Identifies the playlist to read or act on.
  nv_song_review_id:
    type: integer
    description: Identifies the song review to read or act on.
  nv_album_review_id:
    type: integer
    description: Identifies the album review to read or act on.
  nv_playlist_review_id:
    type: integer
    description: Identifies the playlist review to read or act on.
  nv_payment_card_id:
    type: integer
    description: Identifies the payment card to read or act on.
  nv_premium_subscription_id:
    type: integer
    description: Identifies the premium subscription to read or act on.
  nv_premium_duration:
    type: enum
    description: Premium subscription billing duration.
    enum:
    - monthly
    - yearly
  nv_genre:
    type: enum
    description: Music genre in the Spotify catalog.
    enum:
    - EDM
    - R&B
    - classical
    - country
    - hip-hop
    - indie
    - jazz
    - pop
    - reggae
    - rock
  nv_file_path:
    type: string
    description: File-system path for download or save — absolute /home/… or ~/subpath (bare ~ alone is invalid).
  nv_rating:
    type: integer
    description: Star rating from 1 to 5.
  nv_review_title:
    type: string
    description: Review title.
  nv_review_text:
    type: string
    description: Review body text.
  nv_number:
    type: number
  nv_bool:
    type: boolean
  nv_int:
    type: integer
  nv_card_number:
    type: digit_id
    description: Linked payment card primary account number.
  nv_card_name:
    type: string
    description: Payment card display name.
  nv_person_name:
    type: string
    description: Cardholder display name.
  nv_cvv:
    type: integer
    description: Card verification code (CVV).
  nv_month:
    type: integer
    description: Card expiry month.
  nv_year:
    type: integer
    description: Card expiry year.
  nv_like_count:
    type: integer
    description: Community/social popularity tally for this item — how many users have liked it, not whether the current user
      hearted it.
  nv_datetime:
    type: rfc3339
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
