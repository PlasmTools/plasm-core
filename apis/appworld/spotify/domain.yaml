    payload:
      input_type:
        type: object
        fields:
        - name: queue_position
          value_ref: nv_int
          required: false
          description: Zero-based queue position to begin playing.
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: false
