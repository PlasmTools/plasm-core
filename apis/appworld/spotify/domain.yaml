version: 33
entry_id: spotify
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment-card numbers and CVV.
    severity: sensitive
  external_subscribe:
    description: Outbound premium subscription that charges a payment card.
    severity: critical
entities:
  DownloadedFile:
    abstract: true
    id_field: file_path
    description: File written by a download operation in the account file system.
    fields:
      file_path:
        required: true
        value_ref: downloaded_file_path
        description: Actual destination path, including an automatically chosen path when none was supplied.
  SongMembership:
    implicit_request_identity: true
    id_field: song_id
    description: Your personal library, rating and following status for a song.
    fields:
      song_id:
        value_ref: nv_song_id
      liked:
        value_ref: nv_bool
        description: "Whether the account holder likes this song."
      reviewed:
        value_ref: nv_bool
        description: "Whether the account holder has reviewed this song."
      in_song_library:
        value_ref: nv_bool
        description: "Whether this song is directly saved in the account holder's song library."
      downloaded:
        value_ref: nv_bool
        description: "Whether the account holder has downloaded this song."
  AlbumMembership:
    implicit_request_identity: true
    id_field: album_id
    description: Your personal library, rating and following status for a album.
    fields:
      album_id:
        value_ref: nv_album_id
      liked:
        value_ref: nv_bool
        description: "Whether the account holder likes this album."
      reviewed:
        value_ref: nv_bool
        description: "Whether the account holder has reviewed this album."
      in_album_library:
        value_ref: nv_bool
        description: "Whether this album is saved in the account holder's album library."
  PlaylistMembership:
    implicit_request_identity: true
    id_field: playlist_id
    description: Your personal library, rating and following status for a playlist.
    fields:
      playlist_id:
        value_ref: nv_playlist_id
      liked:
        value_ref: nv_bool
        description: "Whether the account holder likes this playlist."
      reviewed:
        value_ref: nv_bool
        description: "Whether the account holder has reviewed this playlist."
      in_playlist_library:
        value_ref: nv_bool
        description: "Whether this playlist is saved in the account holder's playlist library."
  ArtistMembership:
    implicit_request_identity: true
    id_field: artist_id
    description: Your personal library, rating and following status for a artist.
    fields:
      artist_id:
        value_ref: nv_artist_id
      following:
        value_ref: nv_bool
        description: "Whether the account holder follows this artist."
  Account:
    id_field: email
    description: The signed-in spotify account, including private account details and
      registration, verification, recovery and deletion.
    discovery:
      names:
      - account
      - signup
      - sign up
      - registration
      - password reset
      - account verification
    fields:
      first_name:
        value_ref: account_name
      last_name:
        value_ref: account_name
      email:
        value_ref: account_email
      registered_at:
        value_ref: account_timestamp
      last_logged_in:
        value_ref: account_timestamp
      verified:
        value_ref: account_verified
      is_premium:
        value_ref: account_premium
  User:
    id_field: email
    description: Spotify directory user, searchable by name or email when identifying another listener.
    fields:
      email:
        required: true
        value_ref: nv_email
      first_name:
        value_ref: account_name
      last_name:
        value_ref: account_name
      registered_at:
        value_ref: account_timestamp
  AuthSession:
    id_field: access_token
    description: Authenticated session for Spotify.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Library:
    id_field: access_token
    implicit_request_identity: true
    primary_query: library_query
    description: "Saved collections. Library.songs is the distinct union of directly saved songs, saved-album songs, and saved-playlist songs. Likes are independent."
    discovery:
      names: [library, music library, library songs, saved music, song album and playlist libraries]
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
    relations:
      songs:
        description: "Members: directly saved songs UNION saved-album songs UNION saved-playlist songs. Identity: song_id (distinct). Song likes are independent. Genre and play counts come from Song details."
        target: Song
        cardinality: many
        materialize: {kind: view_embed, view: library}
      albums:
        description: Albums saved in the user's library.
        target: Album
        cardinality: many
        materialize: {kind: view_embed, view: library}
      playlists:
        description: Playlists saved in the user's library.
        target: Playlist
        cardinality: many
        materialize: {kind: view_embed, view: library}
  Song:
    id_field: song_id
    description: "A track. The library shelf contains directly saved songs only; Library.songs also includes saved-album and saved-playlist songs. Song likes are independent (LikedSong)."
    discovery:
      names:
      - song
      - songs
      - track
      - music
      - directly saved songs
      - saved tracks
    fields:
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this song.
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_ref
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
        description: "Playback duration in seconds."
      genre:
        required: false
        value_ref: nv_genre
      release_date:
        required: false
        value_ref: nv_release_date
      play_count:
        required: false
        value_ref: nv_int
        description: "Number of times the song has been played."
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      shareable_link:
        required: false
        value_ref: nv_shareable_link
    relations:
      artists:
        description: Artists credited on this recording.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: artists
          - wildcard: true
  LikedSong:
    id_field: song_id
    primary_query: liked_song_query
    primary_read: liked_song_get
    description: "Members: songs liked by this user. Identity: song_id. Saved-song, saved-album and saved-playlist membership are independent."
    discovery:
      names:
      - liked song
      - liked songs
      - favorites
      - hearted song
    fields:
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this song.
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_ref
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
        description: "Playback duration in seconds."
      # Filled by liked_song_get hydration (GET /songs/{song_id}); the liked_songs *list* wire has no genre.
      genre:
        required: false
        value_ref: nv_genre
      release_date:
        required: false
        value_ref: nv_release_date
      play_count:
        required: false
        value_ref: nv_int
        description: "Number of times the song has been played."
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      shareable_link:
        required: false
        value_ref: nv_shareable_link
      liked_at:
        required: false
        value_ref: nv_datetime
    relations:
      artists:
        description: Artists credited on this song.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: artists}, {wildcard: true}]
      song:
        description: Catalog song for this liked shelf entry (genre and play stats live here on the Song GET).
        target: Song
        cardinality: one
        materialize:
          kind: get_scoped_bindings
          capability: song_get
          bindings:
            song_id: song_id
  Album:
    id_field: album_id
    primary_query: album_library_query
    description: "An album. The library shelf contains saved albums. Album likes and contained-song likes are independent."
    discovery:
      names:
      - album
      - albums
      - album library
      - library albums
    fields:
      shareable_link:
        required: false
        value_ref: nv_shareable_link
        description: Public link to this album.
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this album.
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_release_date
    relations:
      artists:
        description: Artists credited on this recording.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: artists
          - wildcard: true
      songs:
        description: Songs on this album.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: songs
          - wildcard: true
          - key: id
  LikedAlbum:
    id_field: album_id
    primary_query: liked_album_query
    description: "Members: albums liked by this user. Identity: album_id. Saved-album membership and contained-song likes are independent."
    discovery:
      names:
      - liked album
      - liked albums
    fields:
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this album.
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_release_date
      liked_at:
        required: false
        value_ref: nv_datetime
    relations:
      songs:
        description: Songs contained in this liked album; their own likes are independent.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: song_ids}, {wildcard: true}]
      artists:
        description: Artists credited on this album.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: artists}, {wildcard: true}]
  Artist:
    id_field: artist_id
    primary_query: following_artist_query
    primary_search: artist_search
    description: Music artist.
    discovery:
      names:
      - artist
      - artists
    fields:
      created_at:
        required: false
        value_ref: nv_datetime
        description: Time this artist profile was created.
      artist_id:
        required: true
        value_ref: nv_artist_id
      name:
        required: true
        value_ref: nv_artist_name
      genre:
        required: false
        value_ref: nv_genre
      follower_count:
        required: false
        value_ref: nv_int
        description: "Number of users following this artist."
    relations:
      songs:
        description: Songs credited to this exact artist, selected by artist identity.
        target: Song
        cardinality: many
        materialize:
          kind: query_scoped
          capability: artist_songs_query
          param: artist_id
  Profile:
    id_field: email
    description: Spotify user public profile.
    discovery:
      names:
      - profile
      - user
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
  Genre:
    id_field: name
    description: Music genre label from the Spotify catalog vocabulary.
    discovery:
      names:
      - genre
      - genres
      - music genre
    fields:
      name:
        required: true
        value_ref: nv_genre
  Playlist:
    id_field: playlist_id
    primary_query: playlist_library_query
    description: "A playlist. The library shelf contains saved playlists. Playlist likes and contained-song likes are independent."
    discovery:
      names:
      - playlist
      - playlists
      - playlist library
      - library playlists
    fields:
      owner_name:
        required: false
        value_ref: nv_str
        description: Owner of this playlist display name.
        path: [owner, name]
      owner_email:
        required: false
        value_ref: nv_email
        description: Owner of this playlist email address.
        path: [owner, email]
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this playlist.
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
        description: "Whether other users can access this playlist."
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      shareable_link:
        required: false
        value_ref: nv_shareable_link
    relations:
      songs:
        description: Songs currently on this playlist.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: songs
          - wildcard: true
          - key: id
  LikedPlaylist:
    id_field: playlist_id
    primary_query: liked_playlist_query
    description: "Members: playlists liked by this user. Identity: playlist_id. Saved-playlist membership and contained-song likes are independent."
    discovery:
      names:
      - liked playlist
      - liked playlists
    fields:
      owner_name:
        required: false
        value_ref: nv_str
        description: Owner of this playlist display name.
        path: [owner, name]
      owner_email:
        required: false
        value_ref: nv_email
        description: Owner of this playlist email address.
        path: [owner, email]
      review_count:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this playlist.
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
        description: "Whether other users can access this playlist."
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      liked_at:
        required: false
        value_ref: nv_datetime
    relations:
      songs:
        description: Songs contained in this liked playlist; their own likes are independent.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: song_ids}, {wildcard: true}]
  DownloadedSong:
    id_field: song_id
    description: A song downloaded for offline playback.
    discovery:
      names:
      - downloaded song
      - downloads
      - offline song
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
        description: "Playback duration in seconds."
      downloaded_at:
        required: false
        value_ref: nv_datetime
    relations:
      artists:
        description: Artists credited on this song.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: artists}, {wildcard: true}]
  Player:
    # Identity is the Bearer token (RA-5 get arg), not song_id — current playback has no path id;
    # song_id/title/… are output of player_current only. Wire SongPlayerResponse has no access_token;
    # request identity must override decode (same pattern as other bearer-scoped singletons).
    id_field: access_token
    implicit_request_identity: true
    primary_read: player_current
    description: Current playback session and queue control. Distinct from browsing songs or playlists.
    discovery:
      names:
      - player
      - queue
      - volume
      - playback
      - shuffle
      - previous song
      - next song
      - play
    fields:
      is_looping:
        required: false
        value_ref: nv_bool
        description: Whether the current song repeats when it ends.
      played_seconds:
        required: false
        value_ref: nv_int
        description: Elapsed playback time of the current song in seconds.
      duration:
        required: false
        value_ref: nv_int
        description: Full duration of this song in seconds.
      album_title:
        required: false
        value_ref: nv_str
        description: Title of the album containing this song.
      album_id:
        required: false
        value_ref: nv_album_ref
        description: Album containing this song.
      access_token:
        required: true
        value_ref: nv_access_token
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      position:
        required: false
        value_ref: nv_int
        description: "Zero-based position of the current song in the playback queue."
      is_playing:
        required: false
        value_ref: nv_bool
        description: "Whether playback is running."
      # Composed on player_current view: true when current song_id is on the LikedSong shelf.
      # Not on OpenAPI SongPlayerResponse — membership is Player×LikedSong, not a LikedSong field.
      is_liked:
        required: false
        value_ref: nv_bool
        description: "Whether the currently playing song is liked by the account holder."
      volume:
        required: false
        value_ref: nv_int
        description: "Playback volume from 0 (silent) to 10 (maximum)."
    relations:
      artists:
        description: Artists credited on this song.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: artists}, {wildcard: true}]
  QueueEntry:
    id_field: position
    description: A song in the player queue.
    fields:
      is_current:
        required: false
        value_ref: nv_bool
        description: Whether the playback cursor points to this queue entry.
      is_playing:
        required: false
        value_ref: nv_bool
        description: Whether this queue entry is currently playing.
      duration:
        required: false
        value_ref: nv_int
        description: Full duration of this song in seconds.
      album_title:
        required: false
        value_ref: nv_str
        description: Title of the album containing this song.
      album_id:
        required: false
        value_ref: nv_album_ref
        description: Album containing this song.
      position:
        required: true
        value_ref: nv_int
        description: "Zero-based queue position; removing an earlier entry shifts later positions."
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
    relations:
      artists:
        description: Artists credited on this song.
        target: Artist
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: artists}, {wildcard: true}]
  SongReview:
    id_field: song_review_id
    description: User review of a song.
    discovery:
      names:
      - song review
      - song reviews
      - rate song
    fields:
      song_review_id:
        required: true
        value_ref: nv_song_review_id
      song_id:
        required: true
        value_ref: nv_song_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
      author_name:
        value_ref: nv_str
        path:
        - user
        - name
        description: Name of the person who wrote this review.
      author_email:
        value_ref: nv_email
        path:
        - user
        - email
        description: Email of the person who wrote this review.
      created_at:
        value_ref: nv_datetime
        description: When this review was written.
  AlbumReview:
    id_field: album_review_id
    description: User review of an album.
    discovery:
      names:
      - album review
      - album reviews
      - rate album
    fields:
      album_review_id:
        required: true
        value_ref: nv_album_review_id
      album_id:
        required: true
        value_ref: nv_album_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
      author_name:
        value_ref: nv_str
        path:
        - user
        - name
        description: Name of the person who wrote this review.
      author_email:
        value_ref: nv_email
        path:
        - user
        - email
        description: Email of the person who wrote this review.
      created_at:
        value_ref: nv_datetime
        description: When this review was written.
  PlaylistReview:
    id_field: playlist_review_id
    description: User review of a playlist.
    discovery:
      names:
      - playlist review
      - playlist reviews
      - rate playlist
    fields:
      playlist_review_id:
        required: true
        value_ref: nv_playlist_review_id
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
      author_name:
        value_ref: nv_str
        path:
        - user
        - name
        description: Name of the person who wrote this review.
      author_email:
        value_ref: nv_email
        path:
        - user
        - email
        description: Email of the person who wrote this review.
      created_at:
        value_ref: nv_datetime
        description: When this review was written.
  PaymentCard:
    id_field: payment_card_id
    description: Saved payment card.
    discovery:
      names:
      - payment card
      - card
      - payment cards
    fields:
      payment_card_id:
        required: true
        value_ref: nv_payment_card_id
      card_name:
        required: false
        value_ref: nv_card_name
      owner_name:
        required: false
        value_ref: nv_person_name
      card_number:
        required: false
        value_ref: nv_card_number
        data_class: pii_payment
      expiry_year:
        required: false
        value_ref: nv_year
      expiry_month:
        required: false
        value_ref: nv_month
      cvv_number:
        required: false
        value_ref: nv_cvv
        data_class: pii_payment
  PremiumPlan:
    id_field: monthly
    description: Spotify premium pricing sheet.
    discovery:
      names:
      - premium plan
      - premium plans
      - premium pricing
    fields:
      monthly:
        required: true
        value_ref: nv_int
        description: "Price of a monthly Premium subscription."
      yearly:
        required: true
        value_ref: nv_int
        description: "Price of a yearly Premium subscription."
  PremiumSubscription:
    id_field: premium_subscription_id
    description: Spotify premium subscription period.
    discovery:
      names:
      - premium
      - premium subscription
      - subscription
    fields:
      premium_subscription_id:
        required: true
        value_ref: nv_premium_subscription_id
      start_date:
        required: false
        value_ref: nv_datetime
      end_date:
        required: false
        value_ref: nv_datetime
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      paid_amount:
        required: false
        value_ref: nv_number
capabilities:
  song_review_get:
    kind: get
    entity: SongReview
    description: Read the selected SongReview and its details.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_review_id
    - song_id
    - rating
    - title
    - text
