version: 9
entry_id: spotify
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment-card numbers and CVV.
    severity: sensitive
  external_subscribe:
    description: Outbound premium subscription that charges a payment card.
    severity: critical
entities:
  AuthSession:
    id_field: access_token
    description: Login session for Spotify (Bearer token).
    discovery:
      names:
      - login
      - auth
      - access token
      seed_class: primary
      co_seed_with: catalog_primary
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Song:
    id_field: song_id
    primary_query: song_library_query
    description: 'A Spotify track on the catalog and library shelf — search, open one track, save or
      remove from the library, like/unlike, or offline download. Not the liked-songs shelf (use LikedSong)
      and not the playback queue (use Player / QueueEntry).

      '
    discovery:
      names:
      - song
      - songs
      - track
      - music
      - song library
      - library songs
      seed_class: primary
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      genre:
        required: false
        value_ref: nv_genre
      release_date:
        required: false
        value_ref: nv_str
      play_count:
        required: false
        value_ref: nv_int
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      shareable_link:
        required: false
        value_ref: nv_str
  LikedSong:
    id_field: song_id
    primary_query: liked_song_query
    description: 'A track on the user''s liked-songs shelf (hearted favorites). Distinct from the library
      shelf and from catalog search — open Song for full catalog fields such as genre.

      '
    discovery:
      names:
      - liked song
      - liked songs
      - favorites
      - hearted song
      seed_class: primary
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: true
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      liked_at:
        required: false
        value_ref: nv_datetime
  Album:
    id_field: album_id
    primary_query: album_library_query
    description: 'An album on the catalog and library shelf — search, open, save or remove from the library,
      like/unlike. Not the liked-albums shelf (use LikedAlbum).

      '
    discovery:
      names:
      - album
      - albums
      - album library
      - library albums
      seed_class: primary
    fields:
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_str
  LikedAlbum:
    id_field: album_id
    primary_query: liked_album_query
    description: 'An album on the user''s liked-albums shelf. Distinct from albums saved in the library.

      '
    discovery:
      names:
      - liked album
      - liked albums
      seed_class: primary
    fields:
      album_id:
        required: true
        value_ref: nv_album_id
      title:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      release_date:
        required: false
        value_ref: nv_str
      liked_at:
        required: false
        value_ref: nv_datetime
  Artist:
    id_field: artist_id
    primary_query: following_artist_query
    description: Music artist.
    discovery:
      names:
      - artist
      - artists
      seed_class: primary
    fields:
      artist_id:
        required: true
        value_ref: nv_artist_id
      name:
        required: true
        value_ref: nv_str
      genre:
        required: false
        value_ref: nv_genre
      follower_count:
        required: false
        value_ref: nv_int
  Profile:
    id_field: email
    description: Spotify user public profile.
    discovery:
      names:
      - profile
      - user
      seed_class: ambient
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
  Genre:
    id_field: name
    description: Music genre label from the Spotify catalog vocabulary.
    discovery:
      names:
      - genre
      - genres
      - music genre
      seed_class: ambient
    fields:
      name:
        required: true
        value_ref: nv_genre
  Playlist:
    id_field: playlist_id
    primary_query: playlist_library_query
    description: 'A playlist on the catalog and library shelf — create, edit, delete, add/remove songs,
      like/unlike. Not the liked-playlists shelf (use LikedPlaylist).

      '
    discovery:
      names:
      - playlist
      - playlists
      - playlist library
      - library playlists
      seed_class: primary
    fields:
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      shareable_link:
        required: false
        value_ref: nv_str
    relations:
      songs:
        description: Songs currently on this playlist.
        target: Song
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: songs
          - wildcard: true
          - key: id
  LikedPlaylist:
    id_field: playlist_id
    primary_query: liked_playlist_query
    description: 'A playlist on the user''s liked-playlists shelf. Distinct from playlists saved in the
      library.

      '
    discovery:
      names:
      - liked playlist
      - liked playlists
      seed_class: primary
    fields:
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      title:
        required: true
        value_ref: nv_str
      is_public:
        required: false
        value_ref: nv_bool
      rating:
        required: false
        value_ref: nv_number
      like_count:
        required: false
        value_ref: nv_like_count
      created_at:
        required: false
        value_ref: nv_datetime
      liked_at:
        required: false
        value_ref: nv_datetime
  DownloadedSong:
    id_field: song_id
    description: A song downloaded for offline playback.
    discovery:
      names:
      - downloaded song
      - downloads
      - offline song
      seed_class: primary
    fields:
      song_id:
        required: true
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      album_id:
        required: false
        value_ref: nv_album_id
      album_title:
        required: false
        value_ref: nv_str
      duration:
        required: false
        value_ref: nv_int
      downloaded_at:
        required: false
        value_ref: nv_datetime
  Player:
    id_field: song_id
    primary_read: player_current
    description: 'Playback control — play/pause, previous/next, seek, loop, volume, and shuffle or clear/rebuild
      the queue. Distinct from browsing songs or playlists.

      '
    discovery:
      names:
      - player
      - queue
      - volume
      - playback
      - shuffle
      - previous song
      - next song
      - play
      seed_class: primary
    fields:
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
      position:
        required: false
        value_ref: nv_int
      is_playing:
        required: false
        value_ref: nv_bool
      volume:
        required: false
        value_ref: nv_int
  QueueEntry:
    id_field: position
    description: A song in the player queue.
    fields:
      position:
        required: true
        value_ref: nv_int
      song_id:
        required: false
        value_ref: nv_song_id
      title:
        required: false
        value_ref: nv_str
  SongReview:
    id_field: song_review_id
    description: User review of a song.
    discovery:
      names:
      - song review
      - song reviews
      - rate song
      seed_class: primary
    fields:
      song_review_id:
        required: true
        value_ref: nv_song_review_id
      song_id:
        required: true
        value_ref: nv_song_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  AlbumReview:
    id_field: album_review_id
    description: User review of an album.
    discovery:
      names:
      - album review
      - album reviews
      - rate album
      seed_class: primary
    fields:
      album_review_id:
        required: true
        value_ref: nv_album_review_id
      album_id:
        required: true
        value_ref: nv_album_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  PlaylistReview:
    id_field: playlist_review_id
    description: User review of a playlist.
    discovery:
      names:
      - playlist review
      - playlist reviews
      - rate playlist
      seed_class: primary
    fields:
      playlist_review_id:
        required: true
        value_ref: nv_playlist_review_id
      playlist_id:
        required: true
        value_ref: nv_playlist_id
      rating:
        required: false
        value_ref: nv_rating
      title:
        required: false
        value_ref: nv_review_title
      text:
        required: false
        value_ref: nv_review_text
        data_class: untrusted
  PaymentCard:
    id_field: payment_card_id
    description: Saved payment card.
    discovery:
      names:
      - payment card
      - card
      - payment cards
      seed_class: primary
    fields:
      payment_card_id:
        required: true
        value_ref: nv_payment_card_id
      card_name:
        required: false
        value_ref: nv_str
      owner_name:
        required: false
        value_ref: nv_str
      card_number:
        required: false
        value_ref: nv_int
        data_class: pii_payment
      expiry_year:
        required: false
        value_ref: nv_int
      expiry_month:
        required: false
        value_ref: nv_int
      cvv_number:
        required: false
        value_ref: nv_int
        data_class: pii_payment
  PremiumPlan:
    id_field: monthly
    description: Spotify premium pricing sheet (monthly and yearly amounts).
    discovery:
      names:
      - premium plan
      - premium plans
      - premium pricing
      seed_class: dependent
    fields:
      monthly:
        required: true
        value_ref: nv_int
      yearly:
        required: true
        value_ref: nv_int
  PremiumSubscription:
    id_field: premium_subscription_id
    description: Spotify premium subscription period.
    discovery:
      names:
      - premium
      - premium subscription
      - subscription
      seed_class: dependent
    fields:
      premium_subscription_id:
        required: true
        value_ref: nv_premium_subscription_id
      start_date:
        required: false
        value_ref: nv_datetime
      end_date:
        required: false
        value_ref: nv_datetime
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      paid_amount:
        required: false
        value_ref: nv_number
capabilities:
  login:
    description: Login to Spotify; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: side_effect
      description: Creates an authenticated Spotify session.
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Spotify session for this token.
  song_search:
    description: Search songs.
    kind: query
    entity: Song
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: genre
      value_ref: nv_genre
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - song_id
    - title
    - album_id
    - album_title
    - duration
    - genre
    - release_date
    - play_count
    - rating
    - like_count
    - shareable_link
  song_get:
    description: Show one song.
    kind: get
    entity: Song
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_id
    - title
    - album_id
    - album_title
    - duration
    - genre
    - release_date
    - play_count
    - rating
    - like_count
    - shareable_link
  song_like:
    description: Like a song.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the song.
  song_unlike:
    description: Unlike a song.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the song.
  downloaded_song_query:
    description: Search downloaded songs for offline play.
    kind: query
    entity: DownloadedSong
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: min_downloaded_at
      value_ref: nv_datetime
      required: false
    - name: max_downloaded_at
      value_ref: nv_datetime
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - song_id
    - title
    - album_id
    - album_title
    - duration
    - downloaded_at
  song_download:
    description: Download a song for offline playback.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Downloads this song for offline play.
  song_undownload:
    description: Remove a song from offline downloads.
    kind: action
    entity: Song
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes this song from offline downloads.
  album_search:
    description: Search albums.
    kind: query
    entity: Album
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: genre
      value_ref: nv_genre
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - album_id
    - title
    - genre
    - rating
    - like_count
    - release_date
  album_get:
    description: Show one album.
    kind: get
    entity: Album
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - album_id
    - title
    - genre
    - rating
    - like_count
    - release_date
  album_like:
    description: Like an album.
    kind: action
    entity: Album
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the album.
  album_unlike:
    description: Unlike an album.
    kind: action
    entity: Album
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the album.
  artist_search:
    description: Search artists.
    kind: query
    entity: Artist
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    provides:
    - artist_id
    - name
    - genre
    - follower_count
  artist_get:
    description: Show one artist.
    kind: get
    entity: Artist
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - artist_id
    - name
    - genre
    - follower_count
  artist_follow:
    description: Follow an artist.
    kind: action
    entity: Artist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Follows the artist.
  artist_unfollow:
    description: Unfollow an artist.
    kind: action
    entity: Artist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unfollows the artist.
  playlist_search:
    description: Search playlists.
    kind: query
    entity: Playlist
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - playlist_id
    - title
    - is_public
    - rating
    - like_count
    - created_at
    - shareable_link
  playlist_get:
    description: Show one playlist including its songs.
    kind: get
    entity: Playlist
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - playlist_id
    - title
    - is_public
    - rating
    - like_count
    - created_at
    - shareable_link
  playlist_create:
    description: Create a playlist.
    kind: create
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_str
          required: true
        - name: is_public
          value_ref: nv_bool
          required: false
    provides:
    - playlist_id
  playlist_update:
    description: Update a playlist's title and/or public visibility.
    kind: update
    entity: Playlist
    discovery:
      operation_terms:
      - update
      - rename
      - retitle
      - change title
      target_terms:
      - playlist
      - playlist title
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: title
          value_ref: nv_str
          required: false
        - name: is_public
          value_ref: nv_bool
          required: false
  playlist_delete:
    description: Delete a playlist.
    kind: delete
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  playlist_add_song:
    description: Add a song to this playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: true
    output:
      type: side_effect
      description: Adds song_id to the playlist.
  playlist_remove_song:
    description: Remove a song from this playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: song_id
          value_ref: nv_song_id
          required: true
    output:
      type: side_effect
      description: Removes song_id from the playlist.
  playlist_like:
    description: Like a playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Likes the playlist.
  playlist_unlike:
    description: Unlike a playlist.
    kind: action
    entity: Playlist
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Unlikes the playlist.
  player_current:
    description: Show the current song in the music player.
    kind: get
    entity: Player
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - song_id
    - title
    - position
    - is_playing
    - volume
  player_play:
    description: Start or resume playback (optionally of a song, album, or playlist).
    kind: action
    entity: Player
    discovery:
      operation_terms:
      - play
      - resume
      - start
      target_terms:
      - player
      - song
      - playback
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
