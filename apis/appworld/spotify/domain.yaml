# OpenAPI SongPlayerResponse has no liked flag. Compose player wire + liked_songs list;
# is_liked := current song_id appears in the liked shelf (Player membership, not LikedSong.is_liked).
views:
  player_current:
    description: Current playback with liked-shelf membership for the song on the cursor.
    capability: player_current
    entity: Player
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
    nodes:
    - id: wire
      capability: player_current_wire
      bind:
        access_token:
          kind: scope
          param: access_token
    - id: volume
      capability: player_volume_get
      bind:
        access_token:
          kind: scope
          param: access_token
    - id: liked
      capability: liked_song_query
      bind:
        access_token:
          kind: scope
          param: access_token
    output:
      access_token:
        kind: scope
        param: access_token
      song_id:
        kind: node_field
        node: wire
        field: song_id
      title:
        kind: node_field
        node: wire
        field: title
      position:
        kind: node_field
        node: wire
        field: position
      is_playing:
        kind: node_field
        node: wire
        field: is_playing
      volume:
        kind: node_field
        node: volume
        field: volume
      liked_by_song_id:
        kind: node_field_histogram_json
        node: liked
        field: song_id
      is_liked:
        kind: computed
        # Histogram keys are decimal strings; coerce song_id for map lookup.
        template: "{{ (song_id ~ '') in liked_by_song_id }}"

values:
  nv_str:
    type: string
    description: Free-form string.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_song_shelf:
    type: enum
    enum:
    - catalog
    - library
    - recommendations
    description: Song list shelf — catalog browse/filter, saved library, or personalized recommendations.
  nv_album_shelf:
    type: enum
    enum:
    - catalog
    - library
    description: Album list shelf — catalog browse/filter or saved library.
  nv_artist_shelf:
    type: enum
    enum:
    - catalog
    - following
    description: Artist list shelf — catalog browse/filter or followed artists.
  nv_playlist_shelf:
    type: enum
    enum:
    - catalog
    - library
    description: Playlist list shelf — catalog browse/filter or saved library.
  nv_song_id:
    type: integer
    description: Song primary key.
  nv_album_id:
    type: integer
    description: Album primary key.
  nv_artist_id:
    type: integer
    description: Artist primary key.
  nv_playlist_id:
    type: integer
    description: Playlist primary key.
  nv_song_review_id:
    type: integer
    description: Song review primary key.
  nv_album_review_id:
    type: integer
    description: Album review primary key.
  nv_playlist_review_id:
    type: integer
    description: Playlist review primary key.
  nv_payment_card_id:
    type: integer
    description: Payment card primary key.
  nv_premium_subscription_id:
    type: integer
    description: Premium subscription primary key.
  nv_premium_duration:
    type: enum
    description: Premium subscription billing duration.
    enum:
    - monthly
    - yearly
  nv_genre:
    type: enum
    description: Music genre in the Spotify catalog.
    enum:
    - EDM
    - R&B
    - classical
    - country
    - hip-hop
    - indie
    - jazz
    - pop
    - reggae
    - rock
  nv_file_path:
    type: string
    description: File-system path for download or save — absolute /home/… or ~/subpath (bare ~ alone is invalid).
  nv_rating:
    type: integer
    description: Star rating from 1 to 5.
  nv_review_title:
    type: string
    description: Review title.
  nv_review_text:
    type: string
    description: Review body text.
  nv_number:
    type: number
    description: Rating or numeric value.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_int:
    type: integer
    description: Integer.
  nv_card_number:
    type: digit_id
    description: Linked payment card primary account number.
  nv_like_count:
    type: integer
    description: Community/social popularity tally for this item — how many users have liked it, not whether the current user
      hearted it.
  nv_datetime:
    type: rfc3339
    description: ISO datetime string.
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
