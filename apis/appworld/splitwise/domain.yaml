version: 23
entry_id: splitwise
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored expense or group text.
    severity: untrusted
  external_settle:
    description: Settlement payment recorded between group members.
    severity: critical
entities:
  ActivityDebtor:
    abstract: true
    id_field: email
    key_vars: [record_type, record_id, email]
    description: A person owing money on one expense or payment activity record.
    fields:
      record_type: {required: true, value_ref: nv_activity_record_type}
      record_id: {required: true, value_ref: nv_int}
      email: {required: true, value_ref: nv_email}
      name: {value_ref: nv_str, description: Debtor display name.}
      amount: {value_ref: nv_number, description: Amount this person owes on the activity record.}
  GroupIncomingDebt:
    abstract: true
    id_field: counterparty_email
    key_vars: [group_id, participant_email, counterparty_email]
    description: Amount this counterparty owes the participant.
    fields:
      group_id: {required: true, value_ref: nv_group_id}
      participant_email: {required: true, value_ref: nv_email}
      counterparty_email: {required: true, value_ref: nv_email, path: [email]}
      counterparty_name: {value_ref: nv_str, path: [name], description: Counterparty display name.}
      amount: {value_ref: nv_number, description: Amount this counterparty owes the participant.}
  GroupOutgoingDebt:
    abstract: true
    id_field: counterparty_email
    key_vars: [group_id, participant_email, counterparty_email]
    description: Amount this participant owes the counterparty.
    fields:
      group_id: {required: true, value_ref: nv_group_id}
      participant_email: {required: true, value_ref: nv_email}
      counterparty_email: {required: true, value_ref: nv_email, path: [email]}
      counterparty_name: {value_ref: nv_str, path: [name], description: Counterparty display name.}
      amount: {value_ref: nv_number, description: Amount this participant owes the counterparty.}
  GroupBalanceParticipant:
    abstract: true
    id_field: participant_email
    key_vars: [group_id, participant_email]
    description: One group member's incoming and outgoing debt totals.
    fields:
      group_id: {required: true, value_ref: nv_group_id}
      participant_email: {required: true, value_ref: nv_email, path: [source, email]}
      participant_name: {value_ref: nv_str, path: [source, name], description: Group member display name.}
      owes: {value_ref: nv_number, path: [source_owes_to_targets, total], description: Total this member owes other group members.}
      is_owed: {value_ref: nv_number, path: [targets_owe_to_source, total], description: Total other group members owe this member.}
    relations:
      incoming:
        description: Amount this counterparty owes the participant.
        target: GroupIncomingDebt
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: targets_owe_to_source}, {key: breakdown}, {wildcard: true}]
      outgoing:
        description: Amount this participant owes the counterparty.
        target: GroupOutgoingDebt
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: source_owes_to_targets}, {key: breakdown}, {wildcard: true}]
  BalanceSummary:
    id_field: access_token
    implicit_request_identity: true
    description: Account-wide interpersonal debt totals and the counterparty breakdown.
    fields:
      access_token: {required: true, value_ref: nv_access_token}
      you_owe_others: {value_ref: nv_number, description: Total amount the account holder owes other people.}
      others_owe_you: {value_ref: nv_number, description: Total amount other people owe the account holder.}
    relations:
      people:
        target: PeerBalance
        cardinality: many
        description: Counterparty identities, debt directions and amounts contributing to the totals.
        materialize:
          kind: from_parent_get
          path: [{key: breakdown}, {wildcard: true}]
  DownloadedFile:
    abstract: true
    id_field: file_path
    description: File written by a download operation in the account file system.
    fields:
      file_path:
        required: true
        value_ref: downloaded_file_path
        description: Actual destination path, including an automatically chosen path when none was supplied.
  ExpenseShare:
    abstract: true
    id_field: debtor_email
    key_vars: [expense_id, debtor_email]
    description: One person's allocated debt within a particular expense.
    fields:
      expense_id:
        required: true
        value_ref: nv_expense_id
      debtor_email:
        required: true
        value_ref: nv_email
        path: [debtor, email]
        description: Person who owes this expense share.
      debtor_name:
        value_ref: nv_str
        path: [debtor, name]
        description: Display name of the person owing this share.
      debt_amount:
        value_ref: nv_number
        description: Amount allocated to this person for this expense.
  NotificationSummary:
    id_field: access_token
    implicit_request_identity: true
    description: Notification totals for the signed-in account.
    fields:
      access_token:
        value_ref: nv_access_token
      notifications_count:
        value_ref: notification_count
  Account:
    id_field: email
    description: The signed-in splitwise account, including private account details
      and registration, verification, recovery and deletion.
    discovery:
      names:
      - account
      - signup
      - sign up
      - registration
      - password reset
      - account verification
    fields:
      first_name:
        value_ref: account_name
      last_name:
        value_ref: account_name
      email:
        value_ref: account_email
      registered_at:
        value_ref: account_timestamp
      last_logged_in:
        value_ref: account_timestamp
      verified:
        value_ref: account_verified
  AuthSession:
    id_field: access_token
    description: Authenticated session for Splitwise.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Group:
    id_field: group_id
    description: Shared expense group.
    discovery:
      names:
      - group
      - groups
      - trip
      - household
    fields:
      creator_name:
        required: false
        value_ref: nv_str
        description: Creator of this group display name.
        path: [creator, name]
      creator_email:
        required: false
        value_ref: nv_email
        description: Creator of this group email address.
        path: [creator, email]
      group_id:
        required: true
        value_ref: nv_group_id
      name:
        required: true
        value_ref: nv_str
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      deleted:
        required: false
        value_ref: nv_bool
        description: "Whether this group has been deleted."
      invitation_code:
        required: false
        value_ref: nv_str
    relations:
      members:
        description: People belonging to this group.
        target: GroupMember
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: members
          - wildcard: true
      expenses:
        target: Expense
        cardinality: many
        materialize:
          kind: query_scoped
          capability: expense_query
          param: group_id
      payments:
        target: Payment
        cardinality: many
        materialize:
          kind: query_scoped
          capability: payment_query
          param: group_id
      balances:
        description: Debt position within this group.
        target: GroupBalance
        cardinality: one
        materialize:
          kind: get_scoped_bindings
          capability: group_balance_get
          bindings:
            group_id: group_id
  GroupMember:
    abstract: true
    id_field: email
    description: Member of a shared expense group.
    discovery:
      names:
      - group member
      - member
      - members
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
  Expense:
    id_field: expense_id
    primary_query: expense_query
    description: Expense shared between people, optionally belonging to a group.
    discovery:
      names:
      - expense
      - bill
      - cost
      - split
    fields:
      payer_name:
        required: false
        value_ref: nv_str
        description: Payer of this expense display name.
        path: [payer, name]
      payer_email:
        required: false
        value_ref: nv_email
        description: Payer of this expense email address.
        path: [payer, email]
      creator_name:
        required: false
        value_ref: nv_str
        description: Creator of this expense display name.
        path: [creator, name]
      creator_email:
        required: false
        value_ref: nv_email
        description: Creator of this expense email address.
        path: [creator, email]
      receipt_file_name:
        required: false
        value_ref: nv_str
        description: Filename of the receipt attached to this expense.
      expense_id:
        required: true
        value_ref: nv_expense_id
      group_id:
        required: false
        value_ref: nv_group_ref
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      paid_amount:
        required: false
        value_ref: nv_number
      deleted:
        required: false
        value_ref: nv_bool
        description: "Whether this expense has been deleted."
      created_at:
        required: false
        value_ref: nv_datetime
    relations:
      shares:
        description: Debtors and the amount each owes for this expense.
        target: ExpenseShare
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: shares}, {wildcard: true}]
      comments:
        target: ExpenseComment
        cardinality: many
        description: Comments posted on this expense.
        materialize:
          kind: query_scoped
          capability: expense_comment_query
          param: expense_id
  Payment:
    id_field: payment_id
    primary_query: payment_query
    description: Settlement payment between members.
    discovery:
      names:
      - payment
      - settle
      - repayment
    fields:
      receiver_name:
        required: false
        value_ref: nv_str
        description: Receiver of this payment display name.
        path: [receiver, name]
      receiver_email:
        required: false
        value_ref: nv_email
        description: Receiver of this payment email address.
        path: [receiver, email]
      payer_name:
        required: false
        value_ref: nv_str
        description: Payer of this payment display name.
        path: [payer, name]
      payer_email:
        required: false
        value_ref: nv_email
        description: Payer of this payment email address.
        path: [payer, email]
      creator_name:
        required: false
        value_ref: nv_str
        description: Creator of this payment display name.
        path: [creator, name]
      creator_email:
        required: false
        value_ref: nv_email
        description: Creator of this payment email address.
        path: [creator, email]
      receipt_file_name:
        required: false
        value_ref: nv_str
        description: Filename of the receipt attached to this payment.
      payment_id:
        required: true
        value_ref: nv_payment_id
      group_id:
        required: false
        value_ref: nv_group_ref
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      paid_amount:
        required: false
        value_ref: nv_number
      deleted:
        required: false
        value_ref: nv_bool
      created_at:
        required: false
        value_ref: nv_datetime
    relations:
      comments:
        target: PaymentComment
        cardinality: many
        description: Comments posted on this payment.
        materialize:
          kind: query_scoped
          capability: payment_comment_query
          param: payment_id
  ExpenseComment:
    id_field: expense_comment_id
    description: Comment on a shared expense.
    discovery:
      names:
      - expense comment
      - comment on expense
    fields:
      expense_comment_id:
        required: true
        value_ref: nv_expense_comment_id
      expense_id:
        required: true
        value_ref: nv_expense_id
      comment:
        required: true
        value_ref: nv_comment
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      author_name:
        value_ref: nv_str
        path:
        - user
        - name
        description: Name of the person who wrote this comment.
      author_email:
        value_ref: nv_email
        path:
        - user
        - email
        description: Email of the person who wrote this comment.
  PaymentComment:
    id_field: payment_comment_id
    description: Comment on a settlement payment.
    discovery:
      names:
      - payment comment
      - comment on payment
    fields:
      payment_comment_id:
        required: true
        value_ref: nv_payment_comment_id
      payment_id:
        required: true
        value_ref: nv_payment_id
      comment:
        required: true
        value_ref: nv_comment
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      author_name:
        value_ref: nv_str
        path:
        - user
        - name
        description: Name of the person who wrote this comment.
      author_email:
        value_ref: nv_email
        path:
        - user
        - email
        description: Email of the person who wrote this comment.
  Notification:
    id_field: notification_id
    description: Inbox notification for the authenticated Splitwise user.
    discovery:
      names:
      - notification
      - alert
      - inbox
    fields:
      exited_member_id:
        required: false
        value_ref: nv_int
        description: Backend identifier of the member who left.
        path: [data, exited_member_id]
      joined_member_id:
        required: false
        value_ref: nv_int
        description: Backend identifier of the member who joined.
        path: [data, joined_member_id]
      action_by_id:
        required: false
        value_ref: nv_int
        description: Backend identifier of the person who caused this notification; this is not an email identity.
        path: [data, action_by_id]
      payment_comment_id:
        required: false
        value_ref: notification_payment_comment_id_ref
        description: PaymentComment referenced by this notification, when applicable.
        path: [data, payment_comment_id]
      payment_id:
        required: false
        value_ref: notification_payment_id_ref
        description: Payment referenced by this notification, when applicable.
        path: [data, payment_id]
      expense_comment_id:
        required: false
        value_ref: notification_expense_comment_id_ref
        description: ExpenseComment referenced by this notification, when applicable.
        path: [data, expense_comment_id]
      expense_id:
        required: false
        value_ref: notification_expense_id_ref
        description: Expense referenced by this notification, when applicable.
        path: [data, expense_id]
      group_id:
        required: false
        value_ref: notification_group_id_ref
        description: Group referenced by this notification, when applicable.
        path: [data, group_id]
      notification_id:
        required: true
        value_ref: nv_notification_id
      type:
        required: false
        value_ref: nv_notification_type
      title:
        required: false
        value_ref: nv_notification_title
      message:
        required: false
        value_ref: nv_notification_message
        data_class: untrusted
      read:
        required: false
        value_ref: nv_read
      created_at:
        required: false
        value_ref: nv_datetime
  Activity:
    id_field: record_id
    key_vars: [record_type, record_id]
    primary_query: activity_query
    description: Combined expense and payment history for the authenticated account.
    discovery:
      names:
      - activity
      - history
      - ledger
    fields:
      paid_by_name:
        required: false
        value_ref: nv_str
        description: Payer on this activity entry display name.
        path: [paid_by, name]
      paid_by_email:
        required: false
        value_ref: nv_email
        description: Payer on this activity entry email address.
        path: [paid_by, email]
      record_id:
        required: false
        value_ref: nv_int
        description: Identifier of the expense or payment, interpreted using record_type.
      record_type:
        required: true
        value_ref: nv_activity_record_type
      amount:
        required: true
        value_ref: nv_number
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      group_id:
        required: false
        value_ref: nv_group_ref
      group_name:
        required: true
        value_ref: nv_str
      created_at:
        required: true
        value_ref: nv_datetime
    relations:
      owed_by:
        description: Debtor identities and amounts on this activity record.
        target: ActivityDebtor
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: owed_by}, {wildcard: true}]
  Balance:
    id_field: access_token
    implicit_request_identity: true
    primary_read: balance_get
    description: Account debt totals with the full breakdown by group.
    discovery:
      names: [balance, group balances, owing, debt]
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      you_owe_others:
        required: false
        value_ref: nv_number
      others_owe_you:
        required: false
        value_ref: nv_number
      breakdown:
        required: false
        value_ref: nv_balance_breakdown
  GroupBalance:
    id_field: group_id
    implicit_request_identity: true
    primary_read: group_balance_get
    description: Debt position within the group used as the read key, including every participant and counterparty.
    discovery:
      names: [group balance, group debt, group owing]
    fields:
      group_id:
        required: true
        value_ref: nv_group_id
    relations:
      participants:
        description: Group members, their debt totals and typed counterparty breakdowns.
        target: GroupBalanceParticipant
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: participants}, {wildcard: true}]
  User:
    id_field: email
    description: Splitwise person with optional balance direction toward the authenticated user.
    discovery:
      names:
      - user
      - person
      - member
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
      direction:
        required: false
        value_ref: nv_balance_direction
      amount:
        required: false
        value_ref: nv_number
  Profile:
    id_field: email
    description: Splitwise public profile.
    discovery:
      names:
      - profile
    fields:
      email:
        required: true
        value_ref: nv_email
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      registered_at:
        required: false
        value_ref: nv_datetime
  PeerBalance:
    id_field: email
    primary_query: peer_balance_query
    description: One counterparty's interpersonal debt position.
    discovery:
      names: [peer balance, counterparty balance, owing, debt]
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
      direction:
        required: false
        value_ref: nv_balance_direction
      amount:
        required: false
        value_ref: nv_number
  PersonBalance:
    id_field: email
    implicit_request_identity: true
    primary_read: person_balance_get
    description: Debt position with the person used as the read key, including the group breakdown.
    discovery:
      names: [person balance, counterparty balance]
    fields:
      email:
        required: true
        value_ref: nv_email
      direction:
        required: false
        value_ref: nv_person_balance_direction
      total:
        required: false
        value_ref: nv_number
      breakdown:
        required: false
        value_ref: nv_balance_breakdown
capabilities:
  balance_summary_get:
    kind: get
    entity: BalanceSummary
    description: Read account-wide debt totals and counterparty balances.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides: [you_owe_others, others_owe_you]
  expense_comment_get:
    kind: get
    entity: ExpenseComment
    description: Read the selected ExpenseComment and its details.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - expense_comment_id
    - expense_id
    - comment
    - created_at
    - author_name
    - author_email
  payment_comment_get:
    kind: get
    entity: PaymentComment
    description: Read the selected PaymentComment and its details.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - payment_comment_id
    - payment_id
    - comment
    - created_at
    - author_name
    - author_email
  notification_count:
    kind: get
    entity: NotificationSummary
    description: Count account notifications, optionally by read status.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: read
          value_ref: notification_read_filter
          required: false
    provides:
    - notifications_count
  account_get:
    description: Show the signed-in splitwise account.
    kind: query
    entity: Account
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - last_logged_in
    - verified
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
  account_create:
    description: Sign up a new splitwise account.
    kind: action
    receiver:
      kind: none
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: true
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: true
        - name: email
          value_ref: account_email
          required: true
        - name: password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Creates the splitwise account for this email.
  account_update:
    description: Update the signed-in account holder's name.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: false
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: false
    output:
      type: side_effect
      description: Updates the account holder's display name.
    receiver:
      kind: none
  account_delete:
    description: Delete the signed-in splitwise account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Deletes the signed-in splitwise account.
    receiver:
      kind: none
  send_verification_code:
    description: Email a verification code to confirm an splitwise account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends an account verification code to the email.
    receiver:
      kind: none
  verify_account:
    description: Confirm an splitwise account with a verification code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: verification_code
          value_ref: account_verification_code
          required: true
    output:
      type: side_effect
      description: Marks the account as verified.
    receiver:
      kind: none
  send_password_reset_code:
    description: Email a password-reset code for an splitwise account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends a password-reset code to the email.
    receiver:
      kind: none
  reset_password:
    description: Set a new splitwise password using a reset code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: password_reset_code
          value_ref: account_password_reset_code
          required: true
        - name: new_password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Replaces the account password.
    receiver:
      kind: none
  login:
