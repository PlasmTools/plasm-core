    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_body:
    type: markdown
    description: Long text body.
  nv_group_id:
    type: integer
    description: Identifies the group to read or act on.
  nv_group_ref:
    type: entity_ref
    target: Group
    description: Identifies the group to read or act on.
  nv_expense_id:
    type: integer
    description: Identifies the expense to read or act on.
  nv_payment_id:
    type: integer
    description: Identifies the payment to read or act on.
  nv_expense_payer_email:
    type: email
    description: "Email of the person who already paid and is owed by every debtor. For 'I owe Alex', use Alex here."
  nv_expense_debtor_email:
    type: email
    description: "Email of a person who owes the payer a share. For 'I owe Alex', use me here; may include payer for their own share."
  nv_expense_debtor_emails:
    type: array
    items:
      value_ref: nv_expense_debtor_email
    description: "People who owe payer shares; include payer only when assigning their own share. For 'I owe Alex', this is [me]."
  nv_expense_paid_amount:
    type: number
    description: Total amount already paid by the expense payer, to be divided into debtor shares.
  nv_email_list:
    type: array
    items:
      value_ref: nv_email
    description: List of email addresses.
  nv_number:
    type: number
    description: Numeric amount.
  nv_number_list:
    type: array
    items:
      value_ref: nv_number
    description: List of numeric amounts.
  nv_bool:
    type: boolean
  nv_int:
    type: integer
  nv_datetime:
    type: rfc3339
  nv_file_path:
    type: string
    description: Receipt file path for upload — absolute /home/… (or resolved ~/… with a subpath). Relative paths and bare ~ are rejected.
  nv_expense_comment_id:
    type: integer
    description: Identifies the expense comment to read or act on.
  nv_payment_comment_id:
    type: integer
    description: Identifies the payment comment to read or act on.
  nv_notification_id:
    type: integer
    description: Identifies the notification to read or act on.
