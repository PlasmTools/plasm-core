          value_ref: nv_access_token
          required: true
    provides: [email, direction, total, breakdown]
values:
  nv_person_balance_direction:
    type: enum
    enum: [you_owe_them, they_owe_you, no_balance]
    description: Direction of the net balance with one person.
  nv_balance_breakdown:
    type: json
    description: Full balance entries with their group context, directions and amounts.
  nv_group_balance_participants:
    type: json
    description: Group participants with their outgoing and incoming debt breakdowns.
  nv_str:
    type: string
    description: Free-form string.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_body:
    type: markdown
    description: Long text body.
  nv_group_id:
    type: integer
    description: Group primary key.
  nv_group_ref:
    type: entity_ref
    target: Group
    description: Group primary key.
  nv_expense_id:
    type: integer
    description: Expense primary key.
  nv_payment_id:
    type: integer
    description: Payment primary key.
  nv_email_list:
    type: array
    items:
      value_ref: nv_email
    description: List of email addresses.
  nv_number:
    type: number
    description: Numeric amount.
  nv_number_list:
    type: array
    items:
      value_ref: nv_number
    description: List of numeric amounts.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_int:
    type: integer
    description: Integer.
  nv_datetime:
    type: rfc3339
    description: ISO datetime string.
  nv_file_path:
    type: string
    description: Receipt file path for upload — absolute /home/… (or resolved ~/… with a subpath). Relative paths and bare ~ are rejected.
  nv_expense_comment_id:
    type: integer
    description: Expense comment primary key.
  nv_payment_comment_id:
    type: integer
    description: Payment comment primary key.
  nv_notification_id:
    type: integer
    description: Notification primary key.
  nv_comment:
    type: string
    description: Text body of an expense or payment comment.
  nv_read:
    type: boolean
    description: Whether a notification has been read.
  nv_balance_direction:
    type: enum
    description: Who owes whom for a balance entry.
    enum:
    - you_owe_them
    - they_owe_you
    - no_balance
  nv_notification_type:
    type: enum
    description: Inbox notification kind from Splitwise activity.
    enum:
    - expense_added
    - expense_comment_added
    - expense_deleted
    - expense_undeleted
    - expense_updated
    - group_deleted
    - group_member_added
    - group_member_exited
    - group_member_joined
    - group_member_removed
    - group_undeleted
    - group_updated
    - payment_added
    - payment_comment_added
    - payment_deleted
    - payment_undeleted
    - payment_updated
    - you_added_to_group
  nv_notification_title:
    type: string
    description: Notification title.
  nv_notification_message:
    type: string
    description: Notification message body.
  nv_activity_record_type:
    type: enum
    description: Whether an activity entry is an expense or a payment.
    enum:
    - expense
    - payment
  nv_activity_paid_by:
    type: json
    description: Payer identity on an activity entry.
  nv_activity_owed_by:
    type: json
    description: Debtor identities and amounts on an activity entry.
  nv_balance_shelf:
    type: enum
    enum:
    - group
    - groups
    description: Group balance shelf
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
prerequisites:
  contracts:
    appworld.principal:
      version: 1
      inputs: {}
      outputs:
        email: prerequisite_principal_email
        phone: prerequisite_principal_phone
    appworld.password:
      version: 1
      inputs:
        account: prerequisite_account_name
      outputs:
        password: nv_password
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    login:
    - id: principal
      contract: appworld.principal
      bindings:
      - input:
          lane: payload
          path:
          - username
        output: email
