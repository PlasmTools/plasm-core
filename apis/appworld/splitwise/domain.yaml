version: 18
entry_id: splitwise
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored expense or group text.
    severity: untrusted
  external_settle:
    description: Settlement payment recorded between group members.
    severity: critical
entities:
  AuthSession:
    id_field: access_token
    description: Login session for Splitwise (Bearer token).
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  Group:
    id_field: group_id
    description: Shared expense group.
    discovery:
      names:
      - group
      - groups
      - trip
      - household
    fields:
      group_id:
        required: true
        value_ref: nv_group_id
      name:
        required: true
        value_ref: nv_str
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      deleted:
        required: false
        value_ref: nv_bool
      invitation_code:
        required: false
        value_ref: nv_str
    relations:
      members:
        description: People belonging to this group.
        target: GroupMember
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: members
          - wildcard: true
      expenses:
        target: Expense
        cardinality: many
        materialize:
          kind: query_scoped
          capability: expense_query
          param: group_id
      payments:
        target: Payment
        cardinality: many
        materialize:
          kind: query_scoped
          capability: payment_query
          param: group_id
      balances:
        description: Debt position within this group.
        target: GroupBalance
        cardinality: one
        materialize:
          kind: get_scoped_bindings
          capability: group_balance_get
          bindings:
            group_id: group_id
  GroupMember:
    abstract: true
    id_field: email
    description: Member of a shared expense group.
    discovery:
      names:
      - group member
      - member
      - members
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
  Expense:
    id_field: expense_id
    primary_query: expense_query
    description: Shared expense among group members.
    discovery:
      names:
      - expense
      - bill
      - cost
      - split
    fields:
      expense_id:
        required: true
        value_ref: nv_expense_id
      group_id:
        required: false
        value_ref: nv_group_ref
      description:
        required: true
        value_ref: nv_body
        data_class: untrusted
      paid_amount:
        required: false
        value_ref: nv_number
      deleted:
        required: false
        value_ref: nv_bool
      created_at:
        required: false
        value_ref: nv_datetime
    relations:
      comments:
        target: ExpenseComment
        cardinality: many
        description: Comments posted on this expense.
        materialize:
          kind: query_scoped
          capability: expense_comment_query
          param: expense_id
  Payment:
    id_field: payment_id
    primary_query: payment_query
    description: Settlement payment between members.
    discovery:
      names:
      - payment
      - settle
      - repayment
    fields:
      payment_id:
        required: true
        value_ref: nv_payment_id
      group_id:
        required: false
        value_ref: nv_group_ref
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      paid_amount:
        required: false
        value_ref: nv_number
      deleted:
        required: false
        value_ref: nv_bool
      created_at:
        required: false
        value_ref: nv_datetime
    relations:
      comments:
        target: PaymentComment
        cardinality: many
        description: Comments posted on this payment.
        materialize:
          kind: query_scoped
          capability: payment_comment_query
          param: payment_id
  ExpenseComment:
    id_field: expense_comment_id
    description: Comment on a shared expense.
    discovery:
      names:
      - expense comment
      - comment on expense
    fields:
      expense_comment_id:
        required: true
        value_ref: nv_expense_comment_id
      expense_id:
        required: true
        value_ref: nv_expense_id
      comment:
        required: true
        value_ref: nv_comment
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  PaymentComment:
    id_field: payment_comment_id
    description: Comment on a settlement payment.
    discovery:
      names:
      - payment comment
      - comment on payment
    fields:
      payment_comment_id:
        required: true
        value_ref: nv_payment_comment_id
      payment_id:
        required: true
        value_ref: nv_payment_id
      comment:
        required: true
        value_ref: nv_comment
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  Notification:
    id_field: notification_id
    description: Inbox notification for the authenticated Splitwise user.
    discovery:
      names:
      - notification
      - alert
      - inbox
    fields:
      notification_id:
        required: true
        value_ref: nv_notification_id
      type:
        required: false
        value_ref: nv_notification_type
      title:
        required: false
        value_ref: nv_notification_title
      message:
        required: false
        value_ref: nv_notification_message
        data_class: untrusted
      read:
        required: false
        value_ref: nv_read
      created_at:
        required: false
        value_ref: nv_datetime
  Activity:
    id_field: created_at
    primary_query: activity_query
    description: Combined expense and payment history for the authenticated account.
    discovery:
      names:
      - activity
      - history
      - ledger
    fields:
      record_type:
        required: true
        value_ref: nv_activity_record_type
      amount:
        required: true
        value_ref: nv_number
      paid_by:
        required: true
        value_ref: nv_activity_paid_by
      owed_by:
        required: true
        value_ref: nv_activity_owed_by
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      group_id:
        required: false
        value_ref: nv_group_ref
      group_name:
        required: true
        value_ref: nv_str
      created_at:
        required: true
        value_ref: nv_datetime
  Balance:
    id_field: access_token
    implicit_request_identity: true
    primary_read: balance_get
    description: Account debt totals with the full breakdown by group.
    discovery:
      names: [balance, group balances, owing, debt]
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      you_owe_others:
        required: false
        value_ref: nv_number
      others_owe_you:
        required: false
        value_ref: nv_number
      breakdown:
        required: false
        value_ref: nv_balance_breakdown
  GroupBalance:
    id_field: group_id
    implicit_request_identity: true
    primary_read: group_balance_get
    description: Debt position within the group used as the read key, including every participant and counterparty.
    discovery:
      names: [group balance, group debt, group owing]
    fields:
      group_id:
        required: true
        value_ref: nv_group_id
      participants:
        required: false
        value_ref: nv_group_balance_participants
  User:
    id_field: email
    description: Splitwise person with optional balance direction toward the authenticated user.
    discovery:
      names:
      - user
      - person
      - member
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      registered_at:
        required: false
        value_ref: nv_datetime
      direction:
        required: false
        value_ref: nv_balance_direction
      amount:
        required: false
        value_ref: nv_number
  Profile:
    id_field: email
    description: Splitwise public profile.
    discovery:
      names:
      - profile
    fields:
      email:
        required: true
        value_ref: nv_email
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      registered_at:
        required: false
        value_ref: nv_datetime
  PeerBalance:
    id_field: email
    primary_query: peer_balance_query
    description: One counterparty's interpersonal debt position.
    discovery:
      names: [peer balance, counterparty balance, owing, debt]
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
      direction:
        required: false
        value_ref: nv_balance_direction
      amount:
        required: false
        value_ref: nv_number
  PersonBalance:
    id_field: email
    implicit_request_identity: true
    primary_read: person_balance_get
    description: Debt position with the person used as the read key, including the group breakdown.
    discovery:
      names: [person balance, counterparty balance]
    fields:
      email:
        required: true
        value_ref: nv_email
      direction:
        required: false
        value_ref: nv_person_balance_direction
      total:
        required: false
        value_ref: nv_number
      breakdown:
        required: false
        value_ref: nv_balance_breakdown
capabilities:
  login:
    description: Login to Splitwise; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Splitwise session for this token.
  group_query:
    description: List expense groups.
    kind: query
    entity: Group
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: delete
      value_ref: nv_bool
      required: false
    provides:
    - group_id
    - name
    - description
    - created_at
    - deleted
    - invitation_code
  group_get:
    description: Show one group.
    kind: get
    entity: Group
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - group_id
    - name
    - description
    - created_at
    - deleted
    - invitation_code
  group_create:
    description: Create a group with member emails.
    kind: create
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: name
          value_ref: nv_str
          required: true
        - name: member_emails
          value_ref: nv_email_list
          required: true
        - name: description
          value_ref: nv_body
          required: false
    provides:
    - group_id
  group_update:
    description: Rename or describe a group.
    kind: update
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: name
          value_ref: nv_str
          required: false
        - name: description
          value_ref: nv_body
          required: false
    provides:
    - group_id
  group_delete:
    description: Delete a group.
    kind: delete
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  group_add_member:
    receiver: {kind: entity, entity: Group}
    description: Add a member to a group by email.
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: user_email
          value_ref: nv_email
          required: true
    output:
      type: side_effect
      description: Adds the email as a group member.
  group_remove_member:
    receiver: {kind: entity, entity: Group}
    description: Remove a member from a group.
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: user_email
          value_ref: nv_email
          required: true
    output:
      type: side_effect
      description: Removes the email from the group.
  group_exit:
    receiver: {kind: entity, entity: Group}
    description: Exit a group you belong to.
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the current user from the group.
  group_undelete:
    receiver: {kind: entity, entity: Group}
    description: Restore a deleted group (and its expenses/payments).
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Clears the deleted flag on the group and related items.
  group_accept_invitation:
    description: Accept a group invitation by invitation code.
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: invitation_code
          value_ref: nv_str
          required: true
    output:
      type: side_effect
      description: Joins the current user to the invited group.
  group_regenerate_invitation:
    receiver: {kind: entity, entity: Group}
    description: Regenerate a group's invitation code.
    kind: action
    entity: Group
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - invitation_code
    output:
      type: side_effect
      description: Issues a new invitation code for the group.
  expense_query:
    description: List expenses — with group_id for a group, or ungrouped when omitted.
    kind: query
    entity: Expense
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: participant_email
      value_ref: nv_email
      required: false
    - name: min_amount
      value_ref: nv_number
      required: false
    - name: max_amount
      value_ref: nv_number
      required: false
    controls:
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - expense_id
    - group_id
    - description
    - paid_amount
    - deleted
    - created_at
    scope:
    - name: group_id
      value_ref: nv_group_ref
      required: false
  expense_get:
    description: Show one expense.
    kind: get
    entity: Expense
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - expense_id
    - group_id
    - description
    - paid_amount
    - deleted
    - created_at
  expense_create:
    description: Create a shared expense with payer and debtors.
    kind: create
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: description
          value_ref: nv_body
          required: true
        - name: paid_amount
          value_ref: nv_number
          required: true
        - name: payer_email
          value_ref: nv_email
          required: true
        - name: debtor_emails
          value_ref: nv_email_list
          required: true
        - name: debt_amounts
          value_ref: nv_number_list
          required: false
        - name: group_id
          value_ref: nv_group_ref
          required: false
    provides:
    - expense_id
  expense_update:
    description: Update an expense.
    kind: update
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: description
          value_ref: nv_body
          required: false
        - name: paid_amount
          value_ref: nv_number
          required: false
        - name: payer_email
          value_ref: nv_email
          required: false
        - name: debtor_emails
          value_ref: nv_email_list
          required: false
        - name: debt_amounts
          value_ref: nv_number_list
          required: false
    provides:
    - expense_id
  expense_delete:
    description: Delete an expense.
    kind: delete
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  expense_undelete:
    receiver: {kind: entity, entity: Expense}
    description: Restore a previously deleted expense.
    kind: action
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Clears the deleted flag on the expense.
  expense_attach_receipt:
    receiver: {kind: entity, entity: Expense}
    description: Attach a file-system receipt file to an expense. receipt_file_path must be absolute /home/… (or resolved ~/subpath), not a relative path.
    kind: action
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: receipt_file_path
          value_ref: nv_file_path
          required: true
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: true
    output:
      type: side_effect
      description: Copies the file-system file onto the expense as a receipt.
  expense_delete_receipt:
    receiver: {kind: entity, entity: Expense}
    description: Delete the receipt file attached to an expense.
    kind: action
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the receipt file from the expense.
  expense_receipt_download:
    receiver: {kind: entity, entity: Expense}
    description: Download the receipt attached to an expense onto a file-system path.
    kind: action
    entity: Expense
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: download_to_file_path
          value_ref: nv_file_path
          required: false
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: false
    output:
      type: side_effect
      description: Writes the expense receipt to the given file path.
  payment_query:
    description: List payments — with group_id for a group, or ungrouped when omitted.
    kind: query
    entity: Payment
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: participant_email
      value_ref: nv_email
      required: false
    controls:
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - payment_id
    - group_id
    - description
    - paid_amount
    - deleted
    - created_at
    scope:
    - name: group_id
      value_ref: nv_group_ref
      required: false
  payment_get:
    description: Show one payment.
    kind: get
    entity: Payment
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - payment_id
    - group_id
    - description
    - paid_amount
    - deleted
    - created_at
  payment_create:
    description: Record a payment from one member to another.
    kind: create
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: payer_email
          value_ref: nv_email
          required: true
        - name: receiver_email
          value_ref: nv_email
          required: true
        - name: amount
          value_ref: nv_number
          required: true
          sink_class: external_settle
        - name: group_id
          value_ref: nv_group_ref
          required: false
        - name: description
          value_ref: nv_body
          required: false
          sink_class: external_settle
    provides:
    - payment_id
  payment_delete:
    description: Delete a payment.
    kind: delete
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  payment_update:
    description: Update a settlement payment.
    kind: update
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: amount
          value_ref: nv_number
          required: false
        - name: description
          value_ref: nv_str
          required: false
  payment_undelete:
    receiver: {kind: entity, entity: Payment}
    description: Restore a previously deleted payment.
    kind: action
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Restores the deleted payment.
  payment_attach_receipt:
    receiver: {kind: entity, entity: Payment}
    description: Attach a file-system receipt file to a payment. receipt_file_path must be absolute /home/… (or resolved ~/subpath), not a relative path.
    kind: action
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: receipt_file_path
          value_ref: nv_file_path
          required: true
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: true
    output:
      type: side_effect
      description: Copies the file-system file onto the payment as a receipt.
  payment_delete_receipt:
    receiver: {kind: entity, entity: Payment}
    description: Delete the receipt file attached to a payment.
    kind: action
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the receipt file from the payment.
  payment_receipt_download:
    receiver: {kind: entity, entity: Payment}
    description: Download the receipt attached to a payment onto a file-system path.
    kind: action
    entity: Payment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: download_to_file_path
          value_ref: nv_file_path
          required: false
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: true
    output:
      type: side_effect
      description: Writes the payment receipt to the given file path.
  settle_up:
    description: Settle up balances with a person (optionally within a group).
    kind: action
    entity: Balance
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
