# Splitwise — AppWorld. Auth: login → access_token → Bearer header.

_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token:
          type: var
          name: access_token

login:
  method: POST
  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  headers: *auth_header

group_query:
  method: GET
  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: groups }
  headers: *auth_header
  query:
    type: object
    fields:
    - - delete
      - type: if
        condition: { type: exists, var: delete }
        then_expr: { type: var, name: delete }
        else_expr: { type: const, value: null }
    - - page_index
      - type: if
        condition: { type: exists, var: page_index }
        then_expr: { type: var, name: page_index }
        else_expr: { type: const, value: null }
    - - page_limit
      - type: if
        condition: { type: exists, var: page_limit }
        then_expr: { type: var, name: page_limit }
        else_expr: { type: const, value: null }

