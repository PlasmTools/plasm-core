  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: groups }
  - { type: var, name: id }
  headers: *auth_header

group_create:
  method: POST
  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: groups }
  headers: *auth_header
  body:
    type: object
    fields:
    - [name, { type: var, name: name }]
    - [member_emails, { type: var, name: member_emails }]
    - - description
      - type: if
        condition: { type: exists, var: description }
        then_expr: { type: var, name: description }
        else_expr: { type: const, value: null }

group_update:
  method: PATCH
  path:
  - { type: literal, value: splitwise }
  - { type: literal, value: groups }
  - { type: var, name: id }
  headers: *auth_header
  body:
    type: object
    fields:
    - - name
      - type: if
        condition: { type: exists, var: name }
        then_expr: { type: var, name: name }
        else_expr: { type: const, value: null }
    - - description
      - type: if
        condition: { type: exists, var: description }
        then_expr: { type: var, name: description }
        else_expr: { type: const, value: null }

