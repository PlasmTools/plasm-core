  - { type: literal, value: email_threads }
  - { type: literal, value: category }
  - { type: var, name: mailbox }
  auth: *request_auth
  query: &thread_search_query
    type: object
    fields:
    - [sort_by, {type: if, condition: {type: exists, var: sort_by}, then_expr: {type: var, name: sort_by}, else_expr: {type: const, value: null}}]
    - [snoozed, {type: if, condition: {type: exists, var: snoozed}, then_expr: {type: var, name: snoozed}, else_expr: {type: const, value: null}}]
    - [spam, {type: if, condition: {type: exists, var: spam}, then_expr: {type: var, name: spam}, else_expr: {type: const, value: null}}]
    - [archived, {type: if, condition: {type: exists, var: archived}, then_expr: {type: var, name: archived}, else_expr: {type: const, value: null}}]
    - [starred, {type: if, condition: {type: exists, var: starred}, then_expr: {type: var, name: starred}, else_expr: {type: const, value: null}}]
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - label
      - type: if
        condition: { type: exists, var: label }
        then_expr: { type: var, name: label }
        else_expr: { type: const, value: null }
    - - read
      - type: if
        condition: {type: exists, var: read}
        then_expr: {type: var, name: read}
        else_expr: {type: const, value: null}
    - - attachment
      - type: if
        condition: {type: exists, var: attachment}
        then_expr: {type: var, name: attachment}
        else_expr: {type: const, value: null}
    - - from_email
      - type: if
        condition: {type: exists, var: from_email}
        then_expr: {type: var, name: from_email}
        else_expr: {type: const, value: null}
    - - to_email
      - type: if
        condition: {type: exists, var: to_email}
        then_expr: {type: var, name: to_email}
        else_expr: {type: const, value: null}
    - - min_created_at
      - type: if
        condition: {type: exists, var: min_created_at}
        then_expr: {type: datetime_format, value: {type: var, name: min_created_at}, format: "%Y-%m-%d"}
        else_expr: {type: const, value: null}
    - - max_created_at
      - type: if
        condition: {type: exists, var: max_created_at}
        then_expr: {type: datetime_format, value: {type: var, name: max_created_at}, format: "%Y-%m-%d"}
        else_expr: {type: const, value: null}
  pagination: *appworld_page_index_limit
