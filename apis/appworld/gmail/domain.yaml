version: 16
entry_id: gmail
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_email:
    description: Email address treated as personally identifiable.
    severity: sensitive
  external_send:
    description: Outbound email body delivered outside the mailbox.
    severity: critical
entities:
  DownloadedFile:
    abstract: true
    id_field: file_path
    description: File written by a download operation in the account file system.
    fields:
      file_path:
        required: true
        value_ref: downloaded_file_path
        description: Actual destination path, including an automatically chosen path when none was supplied.
  AuthSession:
    id_field: access_token
    description: Authenticated session for Gmail.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  EmailThread:
    id_field: email_thread_id
    primary_query: email_thread_query
    description: Mailbox conversation; traverse emails for message subjects, bodies and participants.
    discovery:
      names:
      - thread
      - inbox
      - email thread
      - snoozed
    fields:
      email_thread_id:
        required: true
        value_ref: nv_thread_id
      label:
        required: false
        value_ref: nv_str
        description: "Label assigned to this thread in the account holder's mailbox."
      read:
        required: false
        value_ref: nv_bool
        description: "Whether the account holder has marked this thread as read."
      starred:
        required: false
        value_ref: nv_bool
        description: "Whether the account holder has starred this thread."
      archived:
        required: false
        value_ref: nv_bool
        description: "Whether the thread is archived in the account holder's mailbox."
      spam:
        required: false
        value_ref: nv_bool
        description: "Whether the thread is marked as spam in the account holder's mailbox."
      incoming:
        required: false
        value_ref: nv_bool
        description: "Whether the thread contains mail received by the account holder."
      outgoing:
        required: false
        value_ref: nv_bool
        description: "Whether the thread contains mail sent by the account holder."
      created_at:
        required: false
        value_ref: nv_datetime
      updated_at:
        required: false
        value_ref: nv_datetime
      snoozed_until:
        required: false
        value_ref: nv_datetime
        description: Time when the snoozed thread returns to the inbox.
    relations:
      emails:
        description: Messages in this thread.
        target: Email
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: emails}, {wildcard: true}]
      drafts:
        description: Draft messages in this thread.
        target: Draft
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: drafts}, {wildcard: true}]
  Email:
    id_field: email_id
    description: A single email message.
    discovery:
      names:
      - email
      - message
      - mail
    fields:
      email_id:
        required: true
        value_ref: nv_email_id
      subject:
        required: false
        value_ref: nv_str
      body:
        required: false
        value_ref: nv_body
        data_class: untrusted
      response_to_email_id:
        required: false
        value_ref: nv_email_id
      created_at:
        required: false
        value_ref: nv_datetime
      sender_email:
        required: false
        value_ref: nv_email
        path: [sender, email]
        description: Email address of the person who sent this message.
      sender_name:
        required: false
        value_ref: nv_str
        path: [sender, name]
        description: Display name of this message's sender.
    relations:
      recipients:
        description: People addressed by this message, with their names and email addresses.
        target: Correspondent
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: recipients}, {wildcard: true}]
      attachments:
        description: Files attached to this message, including filenames and download identities.
        target: Attachment
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: attachments}, {wildcard: true}]
  Draft:
    id_field: draft_id
    description: Unsent email, optionally scheduled for automatic delivery.
    discovery:
      names:
      - draft
      - drafts
    fields:
      draft_id:
        required: true
        value_ref: nv_draft_id
      subject:
        required: false
        value_ref: nv_str
      body:
        required: false
        value_ref: nv_body
        data_class: untrusted
      scheduled_send_at:
        required: false
        value_ref: nv_datetime
        description: Future time for automatic delivery; absent means the draft waits for manual sending.
      created_at:
        required: false
        value_ref: nv_datetime
      belongs_to_email_thread_id:
        required: false
        value_ref: nv_thread_id
        description: Conversation containing this draft, when it belongs to an existing thread.
      response_to_email_id:
        required: false
        value_ref: nv_email_id
        description: Message this draft replies to, when it is a reply.
      updated_at:
        required: false
        value_ref: nv_datetime
        description: Time of the most recent draft update.
    relations:
      recipients:
        description: People addressed by this message, with their names and email addresses.
        target: Correspondent
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: recipients}, {wildcard: true}]
      attachments:
        description: Files attached to this message, including filenames and download identities.
        target: Attachment
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: attachments}, {wildcard: true}]
  Profile:
    id_field: email
    description: Gmail user profile.
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
      status:
        required: false
        value_ref: nv_availability_status
        description: Availability status shown for this user.
  Account:
    id_field: email
    description: Signed-in Gmail account.
    discovery:
      names:
      - account
      - mailbox account
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
      last_logged_in:
        required: false
        value_ref: nv_datetime
      status:
        required: false
        value_ref: nv_availability_status
        description: Availability status shown for this user.
  User:
    id_field: email
    description: Gmail directory person for addressing mail.
    discovery:
      names:
      - user
      - contact
      - recipient
    fields:
      email:
        required: true
        value_ref: nv_email
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      registered_at:
        required: false
        value_ref: nv_datetime
      status:
        required: false
        value_ref: nv_availability_status
        description: Availability status shown for this user.
  CategorySizes:
    id_field: inbox
    description: Mailbox category size snapshot.
    discovery:
      names:
      - category sizes
      - mailbox counts
      - inbox count
      - thread counts
    fields:
      inbox:
        required: true
        value_ref: nv_int
        description: "Number of threads in the inbox."
      outbox:
        required: true
        value_ref: nv_int
        description: "Number of threads in the outbox."
      archived:
        required: true
        value_ref: nv_int
        description: "Number of archived threads."
      spam:
        required: true
        value_ref: nv_int
        description: "Number of spam threads."
      unscheduled_drafts:
        required: true
        value_ref: nv_int
        description: "Number of drafts without a scheduled send time."
      scheduled_drafts:
        required: true
        value_ref: nv_int
        description: "Number of drafts scheduled for sending."
      snoozed:
        required: true
        value_ref: nv_int
        description: Number of currently snoozed threads.
      starred:
        required: true
        value_ref: nv_int
        description: Number of starred threads.
  Attachment:
    id_field: attachment_id
    description: File attachment on an email message.
    discovery:
      names:
      - attachment
      - attachments
    fields:
      attachment_id:
        required: true
        value_ref: nv_attachment_id
        path: [id]
      file_name:
        required: false
        value_ref: nv_str
        description: Filename of the attached file, including its extension.
  Correspondent:
    abstract: true
    id_field: email
    description: A message recipient identified by email address, as recorded on an email or draft.
    fields:
      email:
        required: true
        value_ref: nv_email
      name:
        required: false
        value_ref: nv_str
        description: Recipient display name recorded on the message.
  Label:
    id_field: name
    description: Label assigned to mailbox threads, searchable by name.
    fields:
      name:
        required: true
        value_ref: nv_str
capabilities:
  login:
    description: Login to Gmail; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Gmail session for this token.
  email_thread_query:
    description: 'List threads in a mailbox category. The optional query ranks text matches; inspect message content to verify exact identity.

      '
    kind: query
    entity: EmailThread
    discovery:
      operation_terms:
      - list
      - show
      - search
      target_terms:
      - email thread
      - inbox
      - outbox
      - archived
      - spam
    selection:
    - name: snoozed
      value_ref: nv_bool
      required: false
      description: Select by snooze status in inbox, outbox or starred.
    - name: spam
      value_ref: nv_bool
      required: false
      description: Select by spam status in inbox, outbox or starred.
    - name: archived
      value_ref: nv_bool
      required: false
      description: Select by archive status in inbox, outbox or starred.
    - name: starred
      value_ref: nv_bool
      required: false
      description: Select by starred status; supported in categories other than starred.
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: mailbox
      value_ref: nv_email_thread_mailbox
      required: true
      description: inbox | outbox | archived | spam | starred | snoozed
    - name: query
      value_ref: nv_str
      required: false
    - name: label
      value_ref: nv_str
      required: false
    - name: read
      value_ref: nv_bool
      required: false
      description: Select threads by whether they have been marked read.
    - name: attachment
      value_ref: nv_bool
      required: false
      description: Select threads by whether their messages have attachments.
    - name: from_email
      value_ref: nv_email
      required: false
      description: Select threads containing messages from this sender address.
    - name: to_email
      value_ref: nv_email
      required: false
      description: Select threads containing messages addressed to this recipient.
    - name: min_created_at
      value_ref: nv_datetime
      required: false
      description: Earliest thread creation time to include.
    - name: max_created_at
      value_ref: nv_datetime
      required: false
      description: Latest thread creation time to include.
    provides:
    - email_thread_id
    - label
    - read
    - starred
    - archived
    - spam
    - incoming
    - outgoing
    - created_at
    - updated_at
    controls:
    - name: sort_by
      value_ref: email_thread_query_ordering
      required: false
      description: Thread ordering; with query, relevance determines pages and ordering applies within each page.
  email_thread_get:
    description: Show one email thread including messages.
    kind: get
    entity: EmailThread
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - email_thread_id
    - label
    - read
    - starred
    - archived
    - spam
    - incoming
    - outgoing
    - created_at
    - updated_at
  email_thread_delete:
    description: Delete an email thread.
    kind: delete
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  email_thread_mark_read:
    receiver: {kind: entity, entity: EmailThread}
    description: Mark a thread as read.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Marks the thread read.
  email_thread_mark_unread:
    receiver: {kind: entity, entity: EmailThread}
    description: Mark a thread as unread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Marks the thread unread.
  email_thread_star:
    receiver: {kind: entity, entity: EmailThread}
    description: Star a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Stars the thread.
  email_thread_unstar:
    receiver: {kind: entity, entity: EmailThread}
    description: Unstar a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the star from the thread.
  email_thread_archive:
    receiver: {kind: entity, entity: EmailThread}
    description: Archive a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Archives the thread.
  email_thread_unarchive:
    receiver: {kind: entity, entity: EmailThread}
    description: Unarchive a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Moves the thread out of archive.
  email_get:
    description: Show one email including body.
    kind: get
    entity: Email
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - email_id
    - subject
    - body
    - response_to_email_id
    - created_at
    - sender_email
    - sender_name
  email_send:
    description: Send a new email to one or more addresses.
    kind: action
    entity: Email
    payload:
      input_type:
        type: object
        fields:
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: false
          description: File-system session authorizing attachment reads.
        - name: attachment_file_paths
          value_ref: nv_file_path_list
          required: false
          description: Files to attach from the account file system.
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_addresses
          value_ref: nv_email_list
          required: true
        - name: subject
          value_ref: nv_str
          required: true
        - name: body
          value_ref: nv_body
          required: true
          sink_class: external_send
    output:
      type: side_effect
      description: Sends an email to the given addresses.
  email_reply:
    receiver: {kind: entity, entity: Email}
    description: Reply to the selected email within its conversation.
    kind: action
    entity: Email
    payload:
      input_type:
        type: object
        fields:
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: false
          description: File-system session authorizing attachment reads.
        - name: attachment_file_paths
          value_ref: nv_file_path_list
          required: false
          description: Files to attach from the account file system.
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_thread_id
          value_ref: nv_thread_id
          required: true
        - name: body
          value_ref: nv_body
          required: true
          sink_class: external_send
        - name: email_addresses
          value_ref: nv_email_list
          required: false
    output:
      type: side_effect
      description: Posts a reply on the thread.
  email_delete_in_thread:
    description: Delete one email from its thread.
    kind: delete
    entity: Email
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_thread_id
          value_ref: nv_thread_id
          required: true
  draft_query:
    description: List drafts.
    kind: query
    entity: Draft
    selection:
    - name: max_created_at
      value_ref: nv_datetime
      required: false
      description: Inclusive creation-date bound; the backend compares calendar dates.
    - name: min_created_at
      value_ref: nv_datetime
      required: false
      description: Inclusive creation-date bound; the backend compares calendar dates.
    - name: response_to_email_id
      value_ref: nv_email_id
      required: false
      description: Select drafts replying to this message.
    - name: belongs_to_email_thread_id
      value_ref: nv_thread_id
      required: false
      description: Select drafts belonging to this thread.
    - name: recipient_email
      value_ref: nv_email
      required: false
      description: Select drafts addressed to this recipient.
    - name: scheduled
      value_ref: nv_bool
      required: false
      description: Select scheduled or unscheduled drafts.
    - name: attachment
      value_ref: nv_bool
      required: false
      description: Select drafts by presence of attachments.
    - name: query
      value_ref: nv_str
      required: false
      description: Rank drafts by text relevance; verify exact identity in returned content.
    - name: access_token
      value_ref: nv_access_token
      required: true
    provides:
    - draft_id
    - subject
    - body
    - scheduled_send_at
    - created_at
    controls:
    - name: sort_by
      value_ref: draft_query_ordering
      required: false
      description: Draft ordering; with query, relevance determines pages and ordering applies within each page.
  draft_get:
    description: Show one draft.
    kind: get
    entity: Draft
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - draft_id
    - subject
    - body
    - scheduled_send_at
    - created_at
  draft_create:
    description: Create an unsent draft; setting scheduled_send_at schedules automatic delivery without a separate send.
    kind: create
    entity: Draft
    payload:
      input_type:
        type: object
        fields:
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: false
          description: File-system session authorizing attachment reads.
        - name: attachment_file_paths
          value_ref: nv_file_path_list
          required: false
          description: Files to attach from the account file system.
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: recipient_email_addresses
          value_ref: nv_email_list
          required: false
        - name: subject
          value_ref: nv_str
          required: false
        - name: body
          value_ref: nv_body
          required: false
        - name: belongs_to_email_thread_id
          value_ref: nv_thread_id
          required: false
        - name: response_to_email_id
          value_ref: nv_email_id
          required: false
        - name: scheduled_send_at
          value_ref: nv_datetime
          required: false
          description: Future time for automatic delivery; no separate send operation is needed.
    provides:
    - draft_id
  draft_update:
    description: Update an unsent draft or its automatic delivery schedule.
    kind: update
    entity: Draft
    payload:
      input_type:
        type: object
        fields:
        - name: response_to_email_id
          value_ref: nv_email_id
          required: false
          description: Message this draft replies to.
        - name: belongs_to_email_thread_id
          value_ref: nv_thread_id
          required: false
          description: Thread to associate with this draft.
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_addresses
          value_ref: nv_email_list
          required: false
        - name: subject
          value_ref: nv_str
          required: false
        - name: body
          value_ref: nv_body
          required: false
        - name: scheduled_send_at
          value_ref: nv_datetime
          required: false
          description: Future time for automatic delivery; no separate send operation is needed.
  draft_delete:
    description: Delete a draft.
    kind: delete
    entity: Draft
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  draft_send:
    receiver: {kind: entity, entity: Draft}
    description: Send an existing draft immediately, even if scheduled for later.
    kind: action
    entity: Draft
    payload:
      input_type:
        type: object
        fields:
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: false
          description: File-system session authorizing attachment reads.
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Sends the email immediately and removes the draft.
  profile_get:
    description: Show Gmail profile for an email.
    kind: get
    entity: Profile
    arguments:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: nv_email
          required: true
    provides:
    - first_name
    - last_name
    - email
    - registered_at
  account_get:
    description: Show the signed-in Gmail account.
    kind: get
    entity: Account
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - last_logged_in
  account_create:
    description: Sign up a new Gmail account.
    kind: action
    receiver: {kind: none}
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: first_name
          value_ref: nv_str
          required: true
        - name: last_name
          value_ref: nv_str
          required: true
        - name: email
          value_ref: nv_email
          required: true
        - name: password
          value_ref: nv_password
          required: true
    output:
      type: side_effect
      description: Creates the Gmail account for this email.
  account_update:
    description: Update the signed-in account holder's name.
    kind: update
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: first_name
          value_ref: nv_str
          required: false
        - name: last_name
          value_ref: nv_str
          required: false
    output:
      type: side_effect
      description: Updates the account holder's display name.
  account_delete:
    description: Delete the signed-in Gmail account.
    kind: delete
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Deletes the signed-in Gmail account.
  send_password_reset_code:
    description: Email a password-reset code for a Gmail account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: nv_email
          required: true
    output:
      type: side_effect
      description: Sends a password-reset code to the email.
  reset_password:
    description: Set a new Gmail password using a reset code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: nv_email
          required: true
        - name: password_reset_code
          value_ref: nv_str
          required: true
        - name: new_password
          value_ref: nv_password
          required: true
    output:
      type: side_effect
      description: Replaces the account password.
  user_query:
    description: List or filter Gmail directory users before composing.
    kind: query
    entity: User
    selection:
    - name: query
      value_ref: nv_str
      required: false
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    discovery:
      operation_terms:
      - list
      - find
      - search
      target_terms:
      - user
      - recipient
      - contact
  category_sizes_get:
    description: Show mailbox category size counts for the authenticated user.
    kind: get
    entity: CategorySizes
    arguments:
      input_type:
        type: object
        fields:
        - name: read
          value_ref: nv_bool
          required: false
          description: Count read or unread threads; omit to count both.
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - inbox
    - outbox
    - archived
    - spam
    - unscheduled_drafts
    - scheduled_drafts
  email_thread_label:
    receiver: {kind: entity, entity: EmailThread}
    description: Assign a label to a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: label
          value_ref: nv_str
          required: true
    output:
      type: side_effect
      description: Applies the label to the thread.
  email_thread_unlabel:
    receiver: {kind: entity, entity: EmailThread}
    description: Remove the label from a thread.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the label from the thread.
  email_thread_mark_spam:
    receiver: {kind: entity, entity: EmailThread}
    description: Mark a thread as spam.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Moves the thread to spam.
  email_thread_mark_not_spam:
    receiver: {kind: entity, entity: EmailThread}
    description: Mark a thread as not spam.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the thread from spam.
  email_forward:
    receiver: {kind: entity, entity: Email}
    description: Forward this email to one or more addresses.
    kind: action
    entity: Email
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_thread_id
          value_ref: nv_thread_id
          required: true
        - name: email_addresses
          value_ref: nv_email_list
          required: true
          sink_class: external_send
        - name: draft_not_send
          value_ref: nv_bool
          required: false
    output:
      type: side_effect
      description: Forwards the email to the given addresses.
  email_thread_forward:
    receiver: {kind: entity, entity: EmailThread}
    description: Forward an entire thread to one or more addresses.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: email_addresses
          value_ref: nv_email_list
          required: true
          sink_class: external_send
        - name: draft_not_send
          value_ref: nv_bool
          required: false
    output:
      type: side_effect
      description: Forwards the thread to the given addresses.
  attachment_download:
    receiver: {kind: entity, entity: Attachment}
    description: Download an attachment to a file-system path.
    kind: action
    entity: Attachment
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: download_to_file_path
          value_ref: nv_file_path
          required: false
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: true
    output: {type: entity, entity_type: DownloadedFile}
  draft_attachment_upload:
    description: Upload file-system paths as attachments on a draft.
    kind: action
    entity: Draft
    receiver: { kind: entity, entity: Draft }
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: attachment_file_paths
          value_ref: nv_file_path_list
          required: true
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
          value_ref: nv_file_access_token
          required: true
    output:
      type: side_effect
      description: Attaches the given file-system paths onto the draft.
  draft_attachment_remove:
    description: Remove an attachment from a draft.
    kind: action
    entity: Draft
    receiver: { kind: entity, entity: Draft }
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: attachment_file_name
          value_ref: nv_attachment_file_name
          required: true
    output:
      type: side_effect
      description: Removes the named attachment from the draft.

  label_search:
    description: Find mailbox thread labels by a text query.
    kind: search
    entity: Label
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: true
    provides: [name]
  account_set_status:
    description: Set the account holder's availability status.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: status
          value_ref: nv_availability_status
          required: true
    output:
      type: side_effect
      description: Changes the account holder's availability status.
  email_thread_snooze:
    receiver: {kind: entity, entity: EmailThread}
    description: Hide a thread until a future time, when it returns unread to its inbox or outbox and leaves archived or spam categories.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: snooze_until
          value_ref: nv_datetime
          required: true
    output:
      type: side_effect
      description: Snoozes the thread until the specified future instant.
  email_thread_unsnooze:
    receiver: {kind: entity, entity: EmailThread}
    description: Return a snoozed thread to its mailbox now.
    kind: action
    entity: EmailThread
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes the thread snooze.

values:
  draft_query_ordering:
    type: enum
    description: Draft ordering; with query, relevance determines pages and ordering applies within each page.
    enum: ['+created_at', '-created_at', '+updated_at', '-updated_at']
  email_thread_query_ordering:
    type: enum
    description: Thread ordering; with query, relevance determines pages and ordering applies within each page.
    enum: ['+created_at', '-created_at', '+updated_at', '-updated_at']
  downloaded_file_path:
    type: string
    description: Absolute path of the downloaded file in the account file system.
  nv_availability_status:
    type: enum
    enum: [active, do_not_disturb, away]
    description: Availability displayed to other Gmail users.
  nv_email_thread_mailbox:
    type: enum
    enum:
    - inbox
    - outbox
    - archived
    - spam
    - starred
    - snoozed
    description: Mailbox shelf used to select email threads.
  nv_str:
    type: string
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_body:
    type: markdown
    description: Email body text.
  nv_thread_id:
    type: integer
    description: Identifies the email thread to read or act on.
  nv_email_id:
    type: integer
    description: Identifies the email to read or act on.
  nv_draft_id:
    type: integer
    description: Identifies the draft to read or act on.
  nv_email_list:
    type: array
    items:
      value_ref: nv_email
    description: List of email addresses.
  nv_bool:
    type: boolean
  nv_int:
    type: integer
  nv_datetime:
    type: rfc3339
  nv_attachment_file_name:
    type: string
    description: Filename of an attachment on a draft.
  nv_attachment_id:
    type: integer
    description: Identifies the attachment to read or act on.
  nv_file_path:
    type: string
    description: File-system path for download or save.
  nv_file_path_list:
    type: array
    items:
      value_ref: nv_file_path
    description: Absolute file-system paths to attach from the file_system app.
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
prerequisites:
  contracts:
    appworld.principal:
      version: 1
      inputs: {}
      outputs:
        email: prerequisite_principal_email
        phone: prerequisite_principal_phone
    appworld.password:
      version: 1
      inputs:
        account: prerequisite_account_name
      outputs:
        password: nv_password
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    login:
    - id: principal
      contract: appworld.principal
      bindings:
      - input:
          lane: payload
          path:
          - username
        output: email
    - id: password
      contract: appworld.password
      arguments:
        account:
          kind: constant
          value: gmail
      bindings:
      - input:
          lane: payload
          path:
          - password
        output: password
    logout:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
