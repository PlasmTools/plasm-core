# Amazon — AppWorld. Auth: login → access_token → Bearer header.

_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token:
          type: var
          name: access_token

login:
  method: POST
  path:
  - { type: literal, value: amazon }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: amazon }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  headers: *auth_header

product_query:
  method: GET
  path:
  - { type: literal, value: amazon }
  - { type: literal, value: products }
  headers: *auth_header
  query:
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - product_type
      - type: if
        condition: { type: exists, var: product_type }
        then_expr: { type: var, name: product_type }
        else_expr: { type: const, value: null }
    - - color
      - type: if
        condition: { type: exists, var: color }
        then_expr: { type: var, name: color }
        else_expr: { type: const, value: null }
    - - relative_size
      - type: if
        condition: { type: exists, var: relative_size }
        then_expr: { type: var, name: relative_size }
        else_expr: { type: const, value: null }
    - - min_price
      - type: if
        condition: { type: exists, var: min_price }
        then_expr: { type: var, name: min_price }
        else_expr: { type: const, value: null }
    - - max_price
      - type: if
        condition: { type: exists, var: max_price }
        then_expr: { type: var, name: max_price }
        else_expr: { type: const, value: null }
    - - seller_id
      - type: if
        condition: { type: exists, var: seller_id }
        then_expr: { type: var, name: seller_id }
        else_expr: { type: const, value: null }
    - - page_index
      - type: if
        condition: { type: exists, var: page_index }
        then_expr: { type: var, name: page_index }
        else_expr: { type: const, value: null }
    - - page_limit
      - type: if
        condition: { type: exists, var: page_limit }
        then_expr: { type: var, name: page_limit }
        else_expr: { type: const, value: null }
    - - sort_by
      - type: if
        condition: { type: exists, var: sort_by }
        then_expr: { type: var, name: sort_by }
        else_expr: { type: const, value: null }

