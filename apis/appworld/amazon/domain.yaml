values:
  nv_str:
    type: string
    description: Free-form string.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_body:
    type: markdown
    description: Long text body.
  nv_product_id:
    type: entity_ref
    target: Product
    description: Product primary key.
  nv_order_id:
    type: integer
    description: Order primary key.
  nv_address_id:
    type: integer
    description: Address primary key.
  nv_card_id:
    type: integer
    description: Payment card primary key.
  nv_review_id:
    type: integer
    description: Product review primary key.
  nv_return_id:
    type: integer
    description: Product return primary key.
  nv_deliverer_id:
    type: integer
    description: Return deliverer primary key.
  nv_question_id:
    type: integer
    description: Product question primary key.
  nv_question_answer_id:
    type: integer
    description: Product question answer primary key.
  nv_seller_id:
    type: integer
    description: Seller primary key.
  nv_prime_subscription_id:
    type: integer
    description: Prime subscription primary key.
  nv_prime_duration:
    type: enum
    description: Prime subscription billing duration.
    enum:
    - monthly
    - yearly
  nv_relative_size:
    type: enum
    description: Product size band (filter and product attribute).
    enum:
    - extra-small
    - small
    - medium
    - large
    - extra-large
  nv_deliverer_name:
    type: enum
    description: Carrier that handled a return shipment.
    enum:
    - UPS
    - USPS
    - FedEx
  nv_str_list:
    type: array
    items:
      value_ref: nv_str
    description: List of string values.
  nv_relative_size_list:
    type: array
    items:
      value_ref: nv_relative_size
    description: List of relative size enum values.
  nv_file_path:
    type: string
    description: File-system path for download or save.
  nv_number:
    type: number
    description: Numeric amount or rating.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_int:
    type: integer
    description: Integer.
  nv_datetime:
    type: rfc3339
    description: ISO datetime string.
