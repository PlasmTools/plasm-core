version: 20
entry_id: amazon
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment card digits or owner identity.
    severity: sensitive
  external_order:
    description: Outbound purchase that charges a payment card.
    severity: critical
entities:
  DownloadedFile:
    abstract: true
    id_field: file_path
    description: File written by a download operation in the account file system.
    fields:
      file_path:
        required: true
        value_ref: downloaded_file_path
        description: Actual destination path, including an automatically chosen path when none was supplied.
  ProductVariant:
    abstract: true
    id_field: product_id
    description: A size and color variation of a product listing.
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      product:
        value_ref: nv_product_ref
        path: [product_id]
        description: Product listing for this variation, including price and inventory.
      relative_size:
        value_ref: nv_relative_size
        description: Size of this product variation.
      color:
        value_ref: nv_product_color
        description: Color of this product variation.
  LastPurchase:
    id_field: requested_product_id
    implicit_request_identity: true
    description: Latest purchase of a requested product or one of its size and color variations; the purchased product may differ from the requested product.
    fields:
      requested_product_id:
        required: true
        value_ref: nv_product_id
        description: Product used to look up purchase history, including its variations.
      product_id:
        required: true
        value_ref: nv_product_ref
        description: Actual product variation purchased.
      order_id:
        required: true
        value_ref: nv_order_ref
      ordered_at:
        required: true
        value_ref: nv_datetime
      product_name:
        required: true
        value_ref: nv_product_name
      product_relative_size:
        required: false
        value_ref: nv_relative_size
      product_color:
        required: false
        value_ref: nv_product_color
  RatingDistribution:
    id_field: product_id
    implicit_request_identity: true
    description: Review rating average, total review count and star-by-star distribution for one product.
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      rating:
        required: true
        value_ref: nv_number
        description: Average rating across the product's reviews.
      num_product_reviews:
        required: true
        value_ref: nv_int
        description: Total number of reviews of this product.
    relations:
      breakdown:
        description: Counts and percentages for each star rating within this product.
        target: RatingBucket
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: breakdown}, {wildcard: true}]
  RatingBucket:
    abstract: true
    id_field: rating
    key_vars: [product_id, rating]
    description: Review count and percentage for one star rating of one product.
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      rating:
        required: true
        value_ref: nv_int
        description: Number of stars, from one to five.
      percentage:
        required: true
        value_ref: nv_number
        description: Percentage of this product's reviews with this star rating, from zero to one hundred.
      count:
        required: true
        value_ref: nv_int
        description: Number of reviews of this product with this star rating.
  AuthSession:
    id_field: access_token
    description: Authenticated session for Amazon.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  User:
    id_field: email
    description: Amazon user public profile or signed-in account.
    discovery:
      names:
      - profile
      - user
      - account holder
      - account
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
      last_logged_in:
        required: false
        value_ref: nv_datetime
      verified:
        required: false
        value_ref: nv_bool
        description: "Whether this account has completed ownership verification."
      is_prime:
        required: false
        value_ref: nv_bool
        description: "Whether this user has an active Prime subscription."
      track_browsing_history:
        required: false
        value_ref: nv_bool
        description: Whether the account records products in browsing history.
  Product:
    id_field: product_id
    description: Amazon retail catalog listing.
    discovery:
      names:
      - product
      - products
      - item
      - product search
      - catalog search
      - browse products
    fields: &product_fields
      shareable_link:
        required: false
        value_ref: nv_str
        description: Public link to this product listing.
      num_product_questions:
        required: false
        value_ref: nv_int
        description: Number of questions posted about this product.
      num_product_reviews:
        required: false
        value_ref: nv_int
        description: Number of reviews submitted for this product.
      product_id:
        required: true
        value_ref: nv_product_id
      seller_id:
        required: false
        value_ref: nv_seller_id
      product_type:
        required: false
        value_ref: nv_product_type
      name:
        required: true
        value_ref: nv_product_name
      description:
        required: false
        value_ref: nv_product_description
        data_class: untrusted
      price:
        required: false
        value_ref: nv_product_price
      delivery_days:
        required: false
        value_ref: nv_product_delivery_days
      inventory_quantity:
        required: false
        value_ref: nv_product_stock
      weight:
        required: false
        value_ref: nv_product_weight_kg
      length:
        required: false
        value_ref: nv_product_length_inches
      width:
        required: false
        value_ref: nv_product_width_inches
      height:
        required: false
        value_ref: nv_product_height_inches
      color:
        required: false
        value_ref: nv_product_color
      relative_size:
        required: false
        value_ref: nv_relative_size
      rating:
        required: false
        value_ref: nv_product_rating
    relations:
      variations:
        description: Other size and color variations of this product.
        target: ProductVariant
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: variations}, {wildcard: true}]
  Seller:
    id_field: seller_id
    description: Third-party seller on Amazon.
    discovery:
      names:
      - seller
      - sellers
      - merchant
    fields:
      seller_id:
        required: true
        value_ref: nv_seller_id
      name:
        required: false
        value_ref: nv_str
      rating:
        required: false
        value_ref: nv_seller_rating
  ProductType:
    id_field: name
    description: Product category in the retail catalog.
    discovery:
      names:
      - product type
      - product types
      - category
    fields:
      name:
        required: true
        value_ref: nv_product_type
  ProductFeatureChoices:
    id_field: product_type
    implicit_request_identity: true
    description: Filterable feature options for a product type.
    discovery:
      names:
      - feature choices
      - product filters
      - colors sizes sellers
    fields:
      product_type:
        required: true
        value_ref: nv_product_type
      colors:
        required: false
        value_ref: nv_str_list
      relative_sizes:
        required: false
        value_ref: nv_relative_size_list
    relations:
      seller_options:
        description: Sellers offering products of this type.
        target: Seller
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: sellers
          - wildcard: true
  CartItem:
    id_field: product_id
    description: A product line currently in the shopping cart.
    discovery:
      names:
      - cart item
      - cart line
      - items in cart
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      product_name:
        required: false
        value_ref: nv_product_name
      delivery_days:
        required: false
        value_ref: nv_int
      quantity:
        required: false
        value_ref: nv_int
        description: "Units of this product in the cart."
      price:
        required: false
        value_ref: nv_number
      gift_wrap_quantity:
        required: false
        value_ref: nv_int
        description: "Units of this cart item to gift-wrap."
  WishListItem:
    id_field: product_id
    description: A product saved on the wish list.
    discovery:
      names:
      - wish list
      - wishlist
      - wish list item
    fields:
      inventory_quantity:
        required: false
        value_ref: nv_int
        description: Units of this wished-for product available for purchase.
      color:
        required: false
        value_ref: nv_product_color
        description: Color of this wished-for product.
      relative_size:
        required: false
        value_ref: nv_relative_size
        description: Size of this wished-for product.
      rating:
        required: false
        value_ref: nv_number
        description: Average customer rating of this wished-for product.
      product_type:
        required: false
        value_ref: nv_product_type
        description: Retail category of this wished-for product.
      product_id:
        required: true
        value_ref: nv_product_id
      product_name:
        required: false
        value_ref: nv_product_name
      quantity:
        required: false
        value_ref: nv_int
        description: "Desired units of this product."
      price:
        required: false
        value_ref: nv_number
  Cart:
    id_field: access_token
    implicit_request_identity: true
    description: Current shopping cart for the authenticated account, including the complete checkout cost.
    discovery:
      names:
      - cart
      - basket
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      delivery_fee:
        required: false
        value_ref: nv_number
      base_cost:
        required: false
        value_ref: nv_number
      tax:
        required: false
        value_ref: nv_number
      gift_wrap_fee:
        required: false
        value_ref: nv_number
      discount:
        required: false
        value_ref: nv_number
      total_cost:
        required: true
        value_ref: nv_number
      promo_code:
        required: false
        value_ref: nv_str
      promo_valid:
        required: false
        value_ref: nv_bool
        description: "Whether the supplied promotion code is valid for this cart."
    relations:
      cart_items:
        description: Line items currently in the cart.
        target: CartItem
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: cart_items
          - wildcard: true
  Order:
    id_field: order_id
    description: Placed Amazon order.
    discovery:
      names:
      - order
      - orders
      - purchase
    fields:
      order_id:
        required: true
        value_ref: nv_order_id
      address_id:
        required: false
        value_ref: nv_address_id
      payment_card_id:
        required: false
        value_ref: nv_card_id
      tax:
        required: false
        value_ref: nv_number
      delivery_fee:
        required: false
        value_ref: nv_number
      gift_wrap_fee:
        required: false
        value_ref: nv_number
      discount:
        required: false
        value_ref: nv_number
      paid_amount:
        required: false
        value_ref: nv_number
      address_text:
        required: false
        value_ref: nv_str
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      created_at:
        required: false
        value_ref: nv_datetime
    relations:
      items:
        description: Products purchased in this order, with order-specific quantities, prices and delivery dates.
        target: OrderItem
        cardinality: many
        materialize:
          kind: from_parent_get
          path: [{key: order_items}, {wildcard: true}]
  OrderItem:
    abstract: true
    id_field: product_id
    key_vars: [order_id, product_id]
    description: A purchased product line identified within its order; prices and quantities belong to that purchase.
    fields:
      order_id:
        required: true
        value_ref: nv_order_id
      product_id:
        required: true
        value_ref: nv_product_id
      product:
        required: true
        value_ref: nv_product_ref
        path: [product_id]
        description: Catalogue product purchased on this line; follow it for seller and product details.
      product_name:
        required: false
        value_ref: nv_product_name
        description: Name of the purchased product.
      product_review_id:
        required: false
        value_ref: nv_review_id
        description: Review written for this purchased product, if present.
      ordered_quantity:
        required: false
        value_ref: nv_int
        description: Number of units purchased on this order line.
      returned_quantity:
        required: false
        value_ref: nv_int
        description: Number of purchased units returned.
      gift_wrap_quantity:
        required: false
        value_ref: nv_int
        description: Number of purchased units gift wrapped.
      price:
        required: false
        value_ref: nv_number
        description: Product price recorded for this order line.
      expected_delivery_at:
        required: false
        value_ref: nv_datetime
        description: Expected delivery time for this order line.
      delivered_at:
        required: false
        value_ref: nv_datetime
        description: Actual delivery time, when delivered.
  Address:
    id_field: address_id
    description: Shipping address on the account.
    discovery:
      names:
      - address
      - addresses
      - shipping
    fields:
      address_id:
        required: true
        value_ref: nv_address_id
      name:
        required: false
        value_ref: nv_str
      street_address:
        required: true
        value_ref: nv_str
      city:
        required: true
        value_ref: nv_str
      state:
        required: false
        value_ref: nv_str
      country:
        required: false
        value_ref: nv_str
      zip_code:
        required: false
        value_ref: nv_int
  PaymentCard:
    id_field: payment_card_id
    description: Saved payment card.
    fields:
      payment_card_id:
        required: true
        value_ref: nv_card_id
      card_name:
        required: false
        value_ref: nv_card_name
      owner_name:
        required: false
        value_ref: nv_person_name
      card_number:
        required: false
        value_ref: nv_card_number
        data_class: pii_payment
      expiry_year:
        required: false
        value_ref: nv_year
      expiry_month:
        required: false
        value_ref: nv_month
      cvv_number:
        required: false
        value_ref: nv_cvv
        data_class: pii_payment
  ProductReview:
    id_field: review_id
    description: Customer review of a product.
    discovery:
      names:
      - review
      - reviews
      - product review
    fields:
      user_name:
        required: false
        value_ref: nv_str
        description: Author of this review display name.
        path: [user, name]
      user_email:
        required: false
        value_ref: nv_email
        description: Author of this review email address.
        path: [user, email]
      review_id:
        required: true
        value_ref: nv_review_id
      product_id:
        required: true
        value_ref: nv_product_ref
      is_verified:
        required: false
        value_ref: nv_bool
        description: "Whether the reviewer has purchased this product."
      rating:
        required: false
        value_ref: nv_int
        description: "Reviewer score from 1 to 5."
      title:
        required: false
        value_ref: nv_str
      text:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  ReturnDeliverer:
    id_field: deliverer_id
    description: Carrier available for product return shipments.
    discovery:
      names:
      - return deliverer
      - return carrier
      - deliverer
    fields:
      deliverer_id:
        required: true
        value_ref: nv_deliverer_id
      deliverer_name:
        required: false
        value_ref: nv_deliverer_name
        path: name
  ProductReturn:
    id_field: return_id
    description: Product return initiated for an order line.
    discovery:
      names:
      - return
      - returns
      - product return
    fields:
      return_id:
        required: true
        value_ref: nv_return_id
      order_id:
        required: true
        value_ref: nv_order_id
      product_id:
        required: true
        value_ref: nv_product_ref
      product_name:
        required: false
        value_ref: nv_product_name
      quantity:
        required: true
        value_ref: nv_int
        description: "Units of the purchased product being returned."
      deliverer_id:
        required: true
        value_ref: nv_deliverer_id
      deliverer_name:
        required: false
        value_ref: nv_deliverer_name
      refund_amount:
        required: false
        value_ref: nv_number
      initiated_at:
        required: false
        value_ref: nv_datetime
      returned_at:
        required: false
        value_ref: nv_datetime
      confirmation_code:
        required: false
        value_ref: nv_str
  ProductQuestion:
    id_field: question_id
    description: Customer question about a product.
    discovery:
      names:
      - question
      - questions
      - product question
    fields:
      num_answers:
        required: false
        value_ref: nv_int
        description: Number of answers posted to this product question.
      user_name:
        required: false
        value_ref: nv_str
        description: Author of this question display name.
        path: [user, name]
      user_email:
        required: false
        value_ref: nv_email
        description: Author of this question email address.
        path: [user, email]
      question_id:
        required: true
        value_ref: nv_question_id
      product_id:
        required: true
        value_ref: nv_product_ref
      question:
        required: true
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  ProductQuestionAnswer:
    id_field: question_answer_id
    description: Answer posted to a product question.
    discovery:
      names:
      - question answer
      - product answer
      - Q&A answer
    fields:
      question_answer_id:
        required: true
        value_ref: nv_question_answer_id
      question_id:
        required: false
        value_ref: nv_question_id
      is_verified:
        required: false
        value_ref: nv_bool
        description: "Whether the answer author has purchased this product."
      answer:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      user_name:
        required: false
        value_ref: nv_str
        path: [user, name]
      user_email:
        required: false
        value_ref: nv_email
        path: [user, email]
  PrimePlan:
    id_field: monthly
    description: Amazon Prime subscription plan prices.
    discovery:
      names:
      - prime plans
      - prime pricing
      - monthly yearly prime
    fields:
      monthly:
        required: true
        value_ref: nv_int
        description: "Price of a monthly Prime subscription."
      yearly:
        required: true
        value_ref: nv_int
        description: "Price of a yearly Prime subscription."
  PrimeSubscription:
    id_field: prime_subscription_id
    description: Amazon Prime subscription period.
    discovery:
      names:
      - prime
      - prime subscription
      - subscription
    fields:
      prime_subscription_id:
        required: true
        value_ref: nv_prime_subscription_id
      start_date:
        required: false
        value_ref: nv_datetime
      end_date:
        required: false
        value_ref: nv_datetime
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      paid_amount:
        required: false
        value_ref: nv_number
  RecommendedProduct:
    id_field: product_id
    description: A product recommended for the account holder.
    fields: *product_fields
    relations:
      product:
        description: Current catalogue details of this product.
        target: Product
        cardinality: one
        materialize:
          kind: from_parent_get
          path: [{key: product_id}]
  ViewedProduct:
    id_field: product_id
    description: A product in the account holder browsing history.
    fields: *product_fields
    relations:
      product:
        description: Current catalogue details of this product.
        target: Product
        cardinality: one
        materialize:
          kind: from_parent_get
          path: [{key: product_id}]
  PurchasedProduct:
    id_field: product_id
    description: A product previously purchased by the account holder; this collection is not an order-line ledger.
    fields: *product_fields
    relations:
      product:
        description: Current catalogue details of this product.
        target: Product
        cardinality: one
        materialize:
          kind: from_parent_get
          path: [{key: product_id}]
capabilities:
  product_rating_distribution_get:
    description: Read the average rating and star-by-star review distribution of a product.
    kind: get
    entity: RatingDistribution
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides: [product_id, rating, num_product_reviews]
  product_last_purchase_get:
    description: Read the most recent purchase of a product or its size and color variations.
    kind: get
    entity: LastPurchase
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides: [requested_product_id, product_id, order_id, ordered_at, product_name, product_relative_size, product_color]
  login:
    description: Login to Amazon; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Amazon session for this token.
  profile_get:
    description: Show public Amazon profile by optional email.
    kind: query
    entity: User
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: email
      value_ref: nv_email
      required: false
    provides:
    - first_name
    - last_name
    - email
    - registered_at
  account_get:
    description: Show the signed-in Amazon account.
    kind: get
    entity: User
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - last_logged_in
    - verified
    - is_prime
  account_create:
    description: Sign up a new Amazon account.
    kind: action
    receiver: {kind: none}
    entity: User
    payload:
      input_type:
        type: object
        fields:
        - name: first_name
          value_ref: nv_str
          required: true
        - name: last_name
          value_ref: nv_str
          required: true
        - name: email
          value_ref: nv_email
          required: true
        - name: password
          value_ref: nv_password
          required: true
    output:
      type: side_effect
      description: Creates the Amazon account for this email.
  account_update:
    description: Update the signed-in account holder's name.
    kind: update
    entity: User
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: first_name
          value_ref: nv_str
          required: false
        - name: last_name
          value_ref: nv_str
          required: false
    output:
      type: side_effect
      description: Updates the account holder's display name.
  account_delete:
    description: Delete the signed-in Amazon account.
    kind: delete
    entity: User
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Deletes the signed-in Amazon account.
  send_verification_code:
    description: Email a verification code to confirm an Amazon account.
    kind: action
    entity: User
    payload:
