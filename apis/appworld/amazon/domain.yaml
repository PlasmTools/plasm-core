values:
  nv_str:
    type: string
    description: Free-form string.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_body:
    type: markdown
    description: Long text body.
  nv_product_id:
    type: integer
    description: Product primary key.
  nv_product_ref:
    type: entity_ref
    target: Product
    description: Reference to a Product by primary key.
  nv_order_id:
    type: integer
    description: Order primary key.
  nv_address_id:
    type: integer
    description: Address primary key.
  nv_card_id:
    type: integer
    description: Payment card primary key.
  nv_review_id:
    type: integer
    description: Product review primary key.
  nv_return_id:
    type: integer
    description: Product return primary key.
  nv_deliverer_id:
    type: integer
    description: Return deliverer primary key.
  nv_question_id:
    type: integer
    description: Product question primary key.
  nv_question_answer_id:
    type: integer
    description: Product question answer primary key.
  nv_seller_id:
    type: integer
    description: Seller primary key.
  nv_prime_subscription_id:
    type: integer
    description: Prime subscription primary key.
  nv_prime_duration:
    type: enum
    description: Prime subscription billing duration.
    enum:
    - monthly
    - yearly
  nv_relative_size:
    type: enum
    description: Product size band (filter and product attribute).
    enum:
    - extra-small
    - small
    - medium
    - large
    - extra-large
  nv_deliverer_name:
    type: enum
    description: Carrier that handled a return shipment.
    enum:
    - UPS
    - USPS
    - FedEx
  nv_str_list:
    type: array
    items:
      value_ref: nv_str
    description: List of string values.
  nv_relative_size_list:
    type: array
    items:
      value_ref: nv_relative_size
    description: List of relative size enum values.
  nv_file_path:
    type: string
    description: File-system path for download or save.
  nv_number:
    type: number
    description: Numeric amount or rating.
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_int:
    type: integer
    description: Integer.
  nv_card_number:
    type: digit_id
    description: Linked payment card primary account number.
  nv_datetime:
    type: rfc3339
    description: ISO datetime string.
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
prerequisites:
  contracts:
    appworld.principal:
      version: 1
      inputs: {}
      outputs:
        email: prerequisite_principal_email
        phone: prerequisite_principal_phone
    appworld.password:
      version: 1
      inputs:
        account: prerequisite_account_name
      outputs:
        password: nv_password
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    login:
    - id: principal
      contract: appworld.principal
      bindings:
      - input:
          lane: payload
          path:
          - username
        output: email
    - id: password
      contract: appworld.password
      arguments:
        account:
          kind: constant
          value: amazon
      bindings:
      - input:
          lane: payload
          path:
          - password
        output: password
    logout:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    profile_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: selection
          path:
          - access_token
        output: token
    account_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: arguments
          path:
          - access_token
        output: token
    account_update:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    account_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    product_query:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: selection
          path:
