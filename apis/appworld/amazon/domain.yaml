version: 5
entry_id: amazon
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
  pii_payment:
    description: Payment card digits or owner identity.
    severity: sensitive
  external_order:
    description: Outbound purchase that charges a payment card.
    severity: critical
entities:
  AuthSession:
    id_field: access_token
    description: Login session for Amazon (Bearer token).
    discovery:
      names:
      - login
      - auth
      - access token
      seed_class: primary
      co_seed_with: catalog_primary
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  User:
    id_field: email
    description: Amazon user public profile.
    discovery:
      names:
      - profile
      - user
      - account holder
      seed_class: ambient
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
  Product:
    id_field: product_id
    description: Amazon product listing.
    discovery:
      names:
      - product
      - products
      - item
      seed_class: primary
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      seller_id:
        required: false
        value_ref: nv_int
      product_type:
        required: false
        value_ref: nv_str
      name:
        required: true
        value_ref: nv_str
      description:
        required: false
        value_ref: nv_body
        data_class: untrusted
      price:
        required: false
        value_ref: nv_number
      delivery_days:
        required: false
        value_ref: nv_int
      inventory_quantity:
        required: false
        value_ref: nv_int
      color:
        required: false
        value_ref: nv_str
      relative_size:
        required: false
        value_ref: nv_relative_size
      rating:
        required: false
        value_ref: nv_number
  Seller:
    id_field: seller_id
    description: Third-party seller on Amazon.
    discovery:
      names:
      - seller
      - sellers
      - merchant
      seed_class: ambient
    fields:
      seller_id:
        required: true
        value_ref: nv_seller_id
      name:
        required: false
        value_ref: nv_str
      rating:
        required: false
        value_ref: nv_number
  ProductType:
    id_field: name
    description: Product category label used to filter catalog search.
    discovery:
      names:
      - product type
      - product types
      - category
      seed_class: ambient
    fields:
      name:
        required: true
        value_ref: nv_str
  ProductFeatureChoices:
    id_field: product_type
    description: Aggregated color, size, and seller options for a product type filter.
    discovery:
      names:
      - feature choices
      - product filters
      - colors sizes sellers
      seed_class: ambient
    fields:
      product_type:
        required: false
        value_ref: nv_str
      colors:
        required: false
        value_ref: nv_str_list
      relative_sizes:
        required: false
        value_ref: nv_relative_size_list
    relations:
      seller_options:
        description: Sellers offering products of this type.
        target: Seller
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: sellers
          - wildcard: true
  CartItem:
    id_field: product_id
    description: A product line currently in the shopping cart.
    discovery:
      names:
      - cart item
      - cart line
      - items in cart
      seed_class: dependent
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      product_name:
        required: false
        value_ref: nv_str
      delivery_days:
        required: false
        value_ref: nv_int
      quantity:
        required: false
        value_ref: nv_int
      price:
        required: false
        value_ref: nv_number
      gift_wrap_quantity:
        required: false
        value_ref: nv_int
  WishListItem:
    id_field: product_id
    description: A product saved on the wish list.
    discovery:
      names:
      - wish list
      - wishlist
      - wish list item
      seed_class: primary
    fields:
      product_id:
        required: true
        value_ref: nv_product_id
      product_name:
        required: false
        value_ref: nv_str
      quantity:
        required: false
        value_ref: nv_int
      price:
        required: false
        value_ref: nv_number
  Cart:
    id_field: total_cost
    description: Shopping cart summary with totals and line items.
    discovery:
      names:
      - cart
      - basket
      seed_class: primary
    fields:
      delivery_fee:
        required: false
        value_ref: nv_number
      base_cost:
        required: false
        value_ref: nv_number
      tax:
        required: false
        value_ref: nv_number
      gift_wrap_fee:
        required: false
        value_ref: nv_number
      discount:
        required: false
        value_ref: nv_number
      total_cost:
        required: true
        value_ref: nv_number
      promo_code:
        required: false
        value_ref: nv_str
      promo_valid:
        required: false
        value_ref: nv_bool
    relations:
      cart_items:
        description: Line items currently in the cart.
        target: CartItem
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: cart_items
          - wildcard: true
  Order:
    id_field: order_id
    description: Placed Amazon order.
    discovery:
      names:
      - order
      - orders
      - purchase
      seed_class: primary
    fields:
      order_id:
        required: true
        value_ref: nv_order_id
      address_id:
        required: false
        value_ref: nv_address_id
      payment_card_id:
        required: false
        value_ref: nv_card_id
      name:
        required: false
        value_ref: nv_str
      tax:
        required: false
        value_ref: nv_number
      delivery_fee:
        required: false
        value_ref: nv_number
      discount:
        required: false
        value_ref: nv_number
      paid_amount:
        required: false
        value_ref: nv_number
      address_text:
        required: false
        value_ref: nv_str
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      created_at:
        required: false
        value_ref: nv_datetime
  Address:
    id_field: address_id
    description: Shipping address on the account.
    discovery:
      names:
      - address
      - addresses
      - shipping
      seed_class: primary
    fields:
      address_id:
        required: true
        value_ref: nv_address_id
      name:
        required: false
        value_ref: nv_str
      street_address:
        required: true
        value_ref: nv_str
      city:
        required: true
        value_ref: nv_str
      state:
        required: false
        value_ref: nv_str
      country:
        required: false
        value_ref: nv_str
      zip_code:
        required: false
        value_ref: nv_int
  PaymentCard:
    id_field: payment_card_id
    description: Saved payment card.
    fields:
      payment_card_id:
        required: true
        value_ref: nv_card_id
      card_name:
        required: false
        value_ref: nv_str
      owner_name:
        required: false
        value_ref: nv_str
      card_number:
        required: false
        value_ref: nv_int
        data_class: pii_payment
      expiry_year:
        required: false
        value_ref: nv_int
      expiry_month:
        required: false
        value_ref: nv_int
  ProductReview:
    id_field: review_id
    description: Customer review of a product.
    discovery:
      names:
      - review
      - reviews
      - product review
      seed_class: primary
    fields:
      review_id:
        required: true
        value_ref: nv_review_id
      product_id:
        required: true
        value_ref: nv_product_id
      is_verified:
        required: false
        value_ref: nv_bool
      rating:
        required: false
        value_ref: nv_int
      title:
        required: false
        value_ref: nv_str
      text:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  ReturnDeliverer:
    id_field: deliverer_id
    description: Carrier available for product return shipments.
    discovery:
      names:
      - return deliverer
      - return carrier
      - deliverer
      seed_class: ambient
    fields:
      deliverer_id:
        required: true
        value_ref: nv_deliverer_id
      deliverer_name:
        required: false
        value_ref: nv_deliverer_name
        path: name
  ProductReturn:
    id_field: return_id
    description: Product return initiated for an order line.
    discovery:
      names:
      - return
      - returns
      - product return
      seed_class: dependent
    fields:
      return_id:
        required: true
        value_ref: nv_return_id
      order_id:
        required: true
        value_ref: nv_order_id
      product_id:
        required: true
        value_ref: nv_product_id
      product_name:
        required: false
        value_ref: nv_str
      quantity:
        required: true
        value_ref: nv_int
      deliverer_id:
        required: true
        value_ref: nv_deliverer_id
      deliverer_name:
        required: false
        value_ref: nv_deliverer_name
      refund_amount:
        required: false
        value_ref: nv_number
      initiated_at:
        required: false
        value_ref: nv_datetime
      returned_at:
        required: false
        value_ref: nv_datetime
  ProductQuestion:
    id_field: question_id
    description: Customer question about a product.
    discovery:
      names:
      - question
      - questions
      - product question
      seed_class: dependent
    fields:
      question_id:
        required: true
        value_ref: nv_question_id
      product_id:
        required: true
        value_ref: nv_product_id
      question:
        required: true
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
  ProductQuestionAnswer:
    id_field: question_answer_id
    description: Answer posted to a product question.
    discovery:
      names:
      - question answer
      - product answer
      - Q&A answer
      seed_class: dependent
    fields:
      question_answer_id:
        required: true
        value_ref: nv_question_answer_id
      question_id:
        required: false
        value_ref: nv_question_id
      is_verified:
        required: false
        value_ref: nv_bool
      answer:
        required: false
        value_ref: nv_body
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      user_name:
        required: false
        value_ref: nv_str
      user_email:
        required: false
        value_ref: nv_email
  PrimeSubscription:
    id_field: prime_subscription_id
    description: Amazon Prime subscription period.
    discovery:
      names:
      - prime
      - prime subscription
      - subscription
      seed_class: dependent
    fields:
      prime_subscription_id:
        required: true
        value_ref: nv_prime_subscription_id
      start_date:
        required: false
        value_ref: nv_datetime
      end_date:
        required: false
        value_ref: nv_datetime
      payment_card_digits:
        required: false
        value_ref: nv_str
        data_class: pii_payment
      paid_amount:
        required: false
        value_ref: nv_number
capabilities:
  login:
    description: Login to Amazon; returns access_token for Bearer auth.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: side_effect
      description: Creates an authenticated Amazon session.
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the Amazon session for this token.
  profile_get:
    description: Show public Amazon profile by optional email.
    kind: query
    entity: User
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: email
      value_ref: nv_email
      required: false
    provides:
    - first_name
    - last_name
    - email
    - registered_at
  product_query:
    description: Search products by query and filters.
    kind: query
    entity: Product
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    - name: product_type
      value_ref: nv_str
      required: false
    - name: color
      value_ref: nv_str
      required: false
    - name: relative_size
      value_ref: nv_relative_size
      required: false
    - name: min_price
      value_ref: nv_number
      required: false
    - name: max_price
      value_ref: nv_number
      required: false
    - name: seller_id
      value_ref: nv_int
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - product_id
    - seller_id
    - product_type
    - name
    - description
    - price
    - delivery_days
    - inventory_quantity
    - color
    - relative_size
    - rating
  product_get:
    description: Show one product.
    kind: get
    entity: Product
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - product_id
    - seller_id
    - product_type
    - name
    - description
    - price
    - delivery_days
    - inventory_quantity
    - color
    - relative_size
    - rating
  seller_query:
    description: List or filter third-party sellers by name.
    kind: query
    entity: Seller
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    provides:
    - seller_id
    - name
    discovery:
      operation_terms:
      - list
      - find
      - search
      target_terms:
      - seller
      - merchant
  seller_get:
    description: Show one seller with rating.
    kind: get
    entity: Seller
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - seller_id
    - name
    - rating
  product_type_query:
    description: List or filter product type labels used for catalog filters.
    kind: query
    entity: ProductType
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    provides:
    - name
    discovery:
      operation_terms:
      - list
      - find
      - search
      target_terms:
      - product type
      - category
  product_feature_choices_query:
    description: Show aggregated color, size, and seller choices for a product type.
    kind: query
    entity: ProductFeatureChoices
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: product_type
      value_ref: nv_str
      required: false
    provides:
    - colors
    - relative_sizes
  cart_get:
    description: Show the current cart totals and line items.
    kind: get
    entity: Cart
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - delivery_fee
    - base_cost
    - tax
    - gift_wrap_fee
    - discount
    - total_cost
    - promo_code
    - promo_valid
  cart_item_query:
    description: List products currently in the cart.
    kind: query
    entity: CartItem
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    provides:
    - product_id
    - product_name
    - delivery_days
    - quantity
    - price
    - gift_wrap_quantity
  wish_list_query:
    description: List products on the wish list.
    kind: query
    entity: WishListItem
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    provides:
    - product_id
    - product_name
    - quantity
    - price
  wish_list_add:
    description: Add a product to the wish list.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: false
        - name: clear_wish_list_first
          value_ref: nv_bool
          required: false
    output:
      type: side_effect
      description: Adds this product to the wish list.
  wish_list_update_quantity:
    description: Update quantity of a product already on the wish list.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: true
    output:
      type: side_effect
      description: Updates wish-list quantity for this product.
  wish_list_remove:
    description: Remove a product from the wish list.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes this product from the wish list.
  wish_list_clear:
    description: Clear the entire wish list.
    kind: action
    entity: WishListItem
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Empties the wish list.
  cart_move_to_wish_list:
    description: Move a product from the cart to the wish list.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: false
    output:
      type: side_effect
      description: Moves this product from cart to wish list.
  wish_list_move_to_cart:
    description: Move a product from the wish list to the cart.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: false
    output:
      type: side_effect
      description: Moves this product from wish list to cart.
  cart_add_product:
    description: Add a product to the cart.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: false
        - name: clear_cart_first
          value_ref: nv_bool
          required: false
    output:
      type: side_effect
      description: Adds this product to the cart.
  cart_update_quantity:
    description: Update quantity of a product already in the cart.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: quantity
          value_ref: nv_int
          required: true
    output:
      type: side_effect
      description: Updates cart line quantity for this product.
  cart_remove_product:
    description: Remove a product from the cart.
    kind: action
    entity: Product
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Removes this product from the cart.
  cart_clear:
    description: Clear the entire cart.
    kind: action
    entity: Cart
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Empties the shopping cart.
  cart_apply_promo:
    description: Apply a promo code to the cart.
    kind: action
    entity: Cart
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: promo_code
          value_ref: nv_str
          required: true
    output:
      type: side_effect
      description: Applies the promo code to cart totals.
  cart_remove_promo:
    description: Remove the promo code from the cart.
    kind: action
    entity: Cart
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Clears the applied promo code from the cart.
  order_query:
    description: List past orders.
    kind: query
    entity: Order
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_str
      required: false
    controls:
    - name: page_index
      value_ref: nv_int
      required: false
    - name: page_limit
      value_ref: nv_int
      required: false
    - name: sort_by
      value_ref: nv_str
      required: false
    provides:
    - order_id
    - address_id
    - payment_card_id
    - name
    - tax
    - delivery_fee
    - discount
    - paid_amount
    - address_text
    - payment_card_digits
    - created_at
  order_get:
    description: Show one order.
    kind: get
    entity: Order
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - order_id
    - address_id
    - payment_card_id
    - name
    - tax
    - delivery_fee
    - discount
    - paid_amount
    - address_text
    - payment_card_digits
    - created_at
  order_place:
    description: Place an order from the current cart.
    kind: create
    entity: Order
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: payment_card_id
          value_ref: nv_card_id
          required: true
          sink_class: external_order
        - name: address_id
          value_ref: nv_address_id
          required: true
    provides:
    - order_id
  order_receipt_download:
    description: Download an order receipt to a file-system path.
    kind: action
    entity: Order
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: download_to_file_path
          value_ref: nv_file_path
          required: false
        - name: overwrite
          value_ref: nv_bool
          required: false
        - name: file_system_access_token
