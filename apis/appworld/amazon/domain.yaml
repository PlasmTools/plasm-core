values:
  downloaded_file_path:
    type: string
    description: Absolute path of the downloaded file in the account file system.
  nv_order_ref:
    type: entity_ref
    target: Order
    description: Purchase order containing this product purchase.
  nv_product_type:
    type: string
    description: Product category used to classify and filter catalog listings.
  nv_product_name:
    type: string
    description: Name of the product listing.
  nv_product_description:
    type: markdown
    description: Description of the product and its features.
  nv_product_price:
    type: number
    description: Price of one unit of the product.
  nv_product_rating:
    type: number
    description: Product rating on a 0 to 5 scale.
  nv_seller_rating:
    type: number
    description: Seller rating on a 0 to 5 scale.
  nv_product_color:
    type: string
    description: Color of the product variation.
  nv_product_delivery_days:
    type: integer
    description: Number of days required to deliver the product.
  nv_product_stock:
    type: integer
    description: Units currently available for purchase.
  nv_product_length_inches:
    type: number
    description: Product length in inches.
  nv_product_width_inches:
    type: number
    description: Product width in inches.
  nv_product_height_inches:
    type: number
    description: Product height in inches.
  nv_product_search_text:
    type: string
    description: Text query used to find relevant product listings.
  nv_page_index:
    type: integer
    description: Zero-based result page index.
  nv_page_limit:
    type: integer
    description: Maximum results per page, from 1 to 20.
  nv_product_sort:
    type: string
    description: Product ordering by rating, price or delivery_days, prefixed with + for ascending or - for descending. With a non-empty text query, relevance determines pagination and this ordering applies only within each page.
  nv_product_weight_kg:
    type: number
    description: Product weight in kilograms.
  nv_str:
    type: string
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_file_access_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_body:
    type: markdown
    description: Long text body.
  nv_product_id:
    type: integer
    description: Identifies the product to read or act on.
  nv_product_ref:
    type: entity_ref
    target: Product
    description: Identifies the reference to a product by to read or act on.
  nv_order_id:
    type: integer
    description: Identifies the order to read or act on.
  nv_address_id:
    type: integer
    description: Identifies the address to read or act on.
  nv_card_id:
    type: integer
    description: Identifies the payment card to read or act on.
  nv_review_id:
    type: integer
    description: Identifies the product review to read or act on.
  nv_return_id:
    type: integer
    description: Identifies the product return to read or act on.
  nv_deliverer_id:
    type: integer
    description: Identifies the return deliverer to read or act on.
  nv_question_id:
    type: integer
    description: Identifies the product question to read or act on.
  nv_question_answer_id:
    type: integer
    description: Identifies the product question answer to read or act on.
  nv_seller_id:
    type: integer
    description: Identifies the seller to read or act on.
  nv_prime_subscription_id:
    type: integer
    description: Identifies the prime subscription to read or act on.
  nv_prime_duration:
    type: enum
    description: Prime subscription billing duration.
    enum:
    - monthly
    - yearly
  nv_relative_size:
    type: enum
    description: Product size band (filter and product attribute).
    enum:
    - extra-small
    - small
    - medium
    - large
    - extra-large
  nv_deliverer_name:
    type: enum
    description: Carrier that handled a return shipment.
    enum:
    - UPS
    - USPS
    - FedEx
  nv_str_list:
    type: array
    items:
      value_ref: nv_str
    description: List of string values.
  nv_relative_size_list:
    type: array
    items:
      value_ref: nv_relative_size
    description: List of relative size enum values.
  nv_file_path:
    type: string
    description: File-system path for download or save.
  nv_number:
    type: number
    description: Numeric amount or rating.
  nv_bool:
    type: boolean
  nv_int:
    type: integer
  nv_card_number:
    type: digit_id
    description: Linked payment card primary account number.
  nv_card_name:
    type: string
    description: Payment card display name.
  nv_person_name:
    type: string
    description: Cardholder display name.
  nv_cvv:
    type: integer
    description: Card verification code (CVV).
  nv_month:
    type: integer
    description: Card expiry month.
  nv_year:
    type: integer
    description: Card expiry year.
  nv_datetime:
    type: rfc3339
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
