    - - last_name
      - type: if
        condition: { type: exists, var: last_name }
        then_expr: { type: var, name: last_name }
        else_expr: { type: const, value: null }
    - [phone_number, { type: var, name: phone_number }]
    - - email
      - type: if
        condition: { type: exists, var: email }
        then_expr: { type: var, name: email }
        else_expr: { type: const, value: null }
    - - relationships
