# Phone — AppWorld. Auth: login → access_token → Bearer header.

_auth_header: &auth_header
  type: object
  fields:
  - - Authorization
    - type: format
      template: "Bearer {token}"
      vars:
        token:
          type: var
          name: access_token

login:
  method: POST
  path:
  - { type: literal, value: phone }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: phone }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  headers: *auth_header

contact_query:
  method: GET
  path:
  - { type: literal, value: phone }
  - { type: literal, value: contacts }
  headers: *auth_header
  query:
    type: object
    fields:
    - - query
      - type: if
        condition: { type: exists, var: query }
        then_expr: { type: var, name: query }
        else_expr: { type: const, value: null }
    - - relationship
      - type: if
        condition: { type: exists, var: relationship }
        then_expr: { type: var, name: relationship }
        else_expr: { type: const, value: null }
    - - page_index
      - type: if
        condition: { type: exists, var: page_index }
        then_expr: { type: var, name: page_index }
        else_expr: { type: const, value: null }
    - - page_limit
      - type: if
        condition: { type: exists, var: page_limit }
        then_expr: { type: var, name: page_limit }
        else_expr: { type: const, value: null }

