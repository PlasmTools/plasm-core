version: 15
entry_id: file_system
auth:
  scheme: none
http_backend: http://127.0.0.1:9000
data_classes:
  untrusted:
    description: User-authored file content.
    severity: untrusted
entities:
  Account:
    id_field: email
    description: The signed-in file system account, including private account details
      and registration, verification, recovery and deletion.
    discovery:
      names:
      - account
      - signup
      - sign up
      - registration
      - password reset
      - account verification
    fields:
      first_name:
        value_ref: account_name
      last_name:
        value_ref: account_name
      email:
        value_ref: account_email
      registered_at:
        value_ref: account_timestamp
      last_logged_in:
        value_ref: account_timestamp
      verified:
        value_ref: account_verified
  AuthSession:
    id_field: access_token
    description: Authenticated session for File System.
    discovery:
      names:
      - login
      - auth
      - access token
    fields:
      access_token:
        required: true
        value_ref: nv_access_token
      token_type:
        required: false
        value_ref: nv_str
  File:
    id_field: path
    primary_query: file_query
    primary_read: file_get
    description: A file stored in the AppWorld file system.
    discovery:
      names:
      - file
      - files
      - document
      - markdown
      - note file
      - csv
      - spreadsheet
    fields:
      file_id:
        required: false
        value_ref: nv_file_id
      path:
        required: true
        value_ref: nv_path
      content:
        required: false
        value_ref: nv_content
        data_class: untrusted
      created_at:
        required: false
        value_ref: nv_datetime
      updated_at:
        required: false
        value_ref: nv_datetime
      compressed_file_path:
        required: false
        value_ref: nv_path
  DirectoryEntry:
    id_field: path
    description: A path entry returned when listing a directory.
    discovery:
      names:
      - directory
      - folder
      - listing
      - list directory
      - list folder
      - directory listing
    fields:
      path:
        required: true
        value_ref: nv_path
      decompressed_directory_path:
        required: false
        value_ref: nv_path
  PathExists:
    id_field: path
    description: Whether a file or directory path exists.
    fields:
      path:
        required: true
        value_ref: nv_path
      exists:
        required: true
        value_ref: nv_bool
  Profile:
    id_field: email
    description: File System user public profile.
    discovery:
      names:
      - profile
      - user
    fields:
      first_name:
        required: false
        value_ref: nv_str
      last_name:
        required: false
        value_ref: nv_str
      email:
        required: true
        value_ref: nv_email
      registered_at:
        required: false
        value_ref: nv_datetime
capabilities:
  account_get:
    description: Show the signed-in file system account.
    kind: query
    entity: Account
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - last_logged_in
    - verified
    scope:
    - name: access_token
      value_ref: nv_access_token
      required: true
  account_create:
    description: Sign up a new file system account.
    kind: action
    receiver:
      kind: none
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: true
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: true
        - name: email
          value_ref: account_email
          required: true
        - name: password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Creates the file system account for this email.
  account_update:
    description: Update the signed-in account holder's name.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: first_name
          description: Given name of the account holder.
          value_ref: account_name
          required: false
        - name: last_name
          description: Family name of the account holder.
          value_ref: account_name
          required: false
    output:
      type: side_effect
      description: Updates the account holder's display name.
    receiver:
      kind: none
  account_delete:
    description: Delete the signed-in file system account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Deletes the signed-in file system account.
    receiver:
      kind: none
  send_verification_code:
    description: Email a verification code to confirm an file system account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends an account verification code to the email.
    receiver:
      kind: none
  verify_account:
    description: Confirm an file system account with a verification code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: verification_code
          value_ref: account_verification_code
          required: true
    output:
      type: side_effect
      description: Marks the account as verified.
    receiver:
      kind: none
  send_password_reset_code:
    description: Email a password-reset code for an file system account.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
    output:
      type: side_effect
      description: Sends a password-reset code to the email.
    receiver:
      kind: none
  reset_password:
    description: Set a new file system password using a reset code.
    kind: action
    entity: Account
    payload:
      input_type:
        type: object
        fields:
        - name: email
          value_ref: account_email
          required: true
        - name: password_reset_code
          value_ref: account_password_reset_code
          required: true
        - name: new_password
          value_ref: account_password
          required: true
    output:
      type: side_effect
      description: Replaces the account password.
    receiver:
      kind: none
  login:
    description: Sign in to File System and obtain a session credential for file operations.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_login_username
          required: true
        - name: password
          value_ref: nv_password
          required: true
    provides:
    - access_token
    - token_type
    output:
      type: entity
      entity_type: AuthSession
  logout:
    description: Logout and invalidate the access token.
    kind: action
    entity: AuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    output:
      type: side_effect
      description: Ends the File System session for this token.
  directory_query:
    description: List paths under a directory.
    kind: query
    entity: DirectoryEntry
    discovery:
      operation_terms:
      - list
      - show
      - ls
      - browse
      target_terms:
      - directory
      - folder
      - files
      - paths
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: directory_path
      value_ref: nv_path
      required: false
    - name: substring
      value_ref: nv_str
      required: false
    - name: entry_type
      value_ref: nv_entry_type
      required: false
    - name: recursive
      value_ref: nv_bool
      required: false
    provides:
    - path
  directory_create:
    description: Create a directory.
    kind: action
    entity: DirectoryEntry
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: directory_path
          value_ref: nv_path
          required: true
        - name: recursive
          value_ref: nv_bool
          required: false
    output:
      type: side_effect
      description: Creates a directory at directory_path.
  directory_delete:
    description: Delete a directory.
    kind: action
    entity: DirectoryEntry
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: directory_path
          value_ref: nv_path
          required: true
    output:
      type: side_effect
      description: Deletes the directory at directory_path.
  directory_exists:
    description: Check whether a directory path exists.
    kind: action
    entity: PathExists
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: directory_path
          value_ref: nv_path
          required: true
    provides:
    - exists
    output:
      type: side_effect
      description: Reports whether directory_path exists.
  directory_copy:
    description: Copy a directory to a destination path.
    kind: action
    entity: DirectoryEntry
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: source_directory_path
          value_ref: nv_path
          required: true
        - name: destination_directory_path
          value_ref: nv_path
          required: true
    output:
      type: side_effect
      description: Copies a directory tree to the destination.
  directory_move:
    description: Move a directory to a destination path.
    kind: action
    entity: DirectoryEntry
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: source_directory_path
          value_ref: nv_path
          required: true
        - name: destination_directory_path
          value_ref: nv_path
          required: true
    output:
      type: side_effect
      description: Moves a directory to the destination.
  directory_compress:
    description: Compress a directory into an archive file.
    kind: action
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: directory_path
          value_ref: nv_path
          required: true
        - name: compressed_file_path
          value_ref: nv_path
          required: false
        - name: delete_directory
          value_ref: nv_bool
          required: false
        - name: overwrite
          value_ref: nv_bool
          required: false
    provides:
    - compressed_file_path
    output:
      type: side_effect
      description: Writes a compressed archive and returns its path.
  file_query:
    description: List files under a directory, optionally narrowed by path substring.
    kind: query
    entity: File
    discovery:
      operation_terms:
      - list
      - find
      - show
      - ls
      target_terms:
      - file
      - files
      - csv
      - document
    selection:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: directory_path
      value_ref: nv_path
      required: false
    - name: substring
      value_ref: nv_str
      required: false
    - name: recursive
      value_ref: nv_bool
      required: false
    provides:
    - path
  file_get:
    description: Read a file at its full path.
    kind: get
    entity: File
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
    provides:
    - file_id
    - path
    - content
    - created_at
    - updated_at
  file_create:
    description: Create a file with content.
    kind: create
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: file_path
          value_ref: nv_path
          required: true
        - name: content
          value_ref: nv_content
          required: true
        - name: overwrite
          value_ref: nv_bool
          required: false
    provides:
    - path
  file_update:
    description: Replace the contents of the file selected by its full path.
    kind: update
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: content
          value_ref: nv_content
          required: true
  file_delete:
    description: Delete the file at the selected full path.
    kind: delete
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
  file_exists:
    description: Check whether a file path exists.
    kind: action
    entity: PathExists
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: file_path
          value_ref: nv_path
          required: true
    provides:
    - exists
    output:
      type: side_effect
      description: Reports whether file_path exists.
  file_copy:
    description: Copy a file to a destination path.
    kind: action
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: source_file_path
          value_ref: nv_path
          required: true
        - name: destination_file_path
          value_ref: nv_path
          required: true
    output:
      type: side_effect
      description: Copies a file to the destination path.
  file_move:
    description: Move a file to a destination path.
    kind: action
    entity: File
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: source_file_path
          value_ref: nv_path
          required: true
        - name: destination_file_path
          value_ref: nv_path
          required: true
    output:
      type: side_effect
      description: Moves a file to the destination path.
  file_decompress:
    description: Decompress an archive file into a directory.
    kind: action
    entity: DirectoryEntry
    payload:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_access_token
          required: true
        - name: compressed_file_path
          value_ref: nv_path
          required: true
        - name: decompressed_directory_path
          value_ref: nv_path
          required: false
        - name: retain_dates
          value_ref: nv_bool
          required: false
        - name: delete_compressed_file
          value_ref: nv_bool
          required: false
    provides:
    - decompressed_directory_path
    output:
      type: side_effect
      description: Expands the archive and returns the destination directory path.
  profile_get:
    description: Show a File System user's public profile (omit email for the default profile).
    kind: query
    entity: Profile
    selection:
    - name: email
      value_ref: nv_email
      required: false
    provides:
    - first_name
    - last_name
    - email
    - registered_at
    - registered_at
values:
  account_name:
    type: string
    description: Account holder first or last name.
  account_email:
    type: email
    description: Email identifying the account being registered, verified, or recovered.
  account_password:
    type: string
    description: Password for account registration or recovery.
    min_length: 5
  account_verification_code:
    type: string
    description: Code delivered to the account owner to confirm account ownership.
  account_password_reset_code:
    type: string
    description: Code delivered to the account owner to authorize a password change.
  account_timestamp:
    type: rfc3339
    description: Account registration or last login time.
  account_verified:
    type: boolean
    description: Whether account ownership has been verified.
  nv_str:
    type: string
    description: Free-form string.
  nv_email:
    type: email
    description: Email address of a user or counterparty.
  nv_login_username:
    type: email
    description: Task-principal email from Supervisor — the login username for this service (not a counterparty).
  nv_password:
    type: string
    description: Account-holder password for this service.
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_path:
    type: string
    description: Full file or directory path, such as /home/user/documents/report.csv or ~/documents/report.csv. A home-relative path must include the file or directory name.
  nv_content:
    type: document
    description: File body text.
  nv_file_id:
    type: integer
    description: Numeric reference shown in file details. File operations select files by their full path.
  nv_entry_type:
    type: enum
    description: Directory listing filter — files, directories, or both.
    enum:
    - all
    - files
    - directories
  nv_bool:
    type: boolean
    description: Boolean flag.
  nv_datetime:
    type: rfc3339
    description: ISO datetime string.
  prerequisite_principal_email:
    type: email
    description: Account holder email.
  prerequisite_principal_phone:
    type: e164
    description: Account holder phone number.
  prerequisite_account_name:
    type: string
    description: Service account identifier.
prerequisites:
  contracts:
    appworld.principal:
      version: 1
      inputs: {}
      outputs:
        email: prerequisite_principal_email
        phone: prerequisite_principal_phone
    appworld.password:
      version: 1
      inputs:
        account: prerequisite_account_name
      outputs:
        password: nv_password
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    account_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: scope
          path:
          - access_token
        output: token
    account_update:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    account_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    login:
    - id: principal
      contract: appworld.principal
      bindings:
      - input:
          lane: payload
          path:
          - username
        output: email
    - id: password
      contract: appworld.password
      arguments:
        account:
          kind: constant
          value: file_system
      bindings:
      - input:
          lane: payload
          path:
          - password
        output: password
    logout:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_query:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: selection
          path:
          - access_token
        output: token
    directory_create:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_exists:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_copy:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_move:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    directory_compress:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_query:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: selection
          path:
          - access_token
        output: token
    file_get:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: arguments
          path:
          - access_token
        output: token
    file_create:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_update:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_delete:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_exists:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_copy:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_move:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
    file_decompress:
    - id: session
      contract: appworld.session
      bindings:
      - input:
          lane: payload
          path:
          - access_token
        output: token
