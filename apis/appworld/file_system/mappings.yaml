# File System — AppWorld. Auth: login → access_token → Bearer header.

_request_auth: &request_auth
  scheme: bearer
  token: { type: var, name: access_token }

login:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: auth }
  - { type: literal, value: token }
  body_format: form_urlencoded
  body:
    type: object
    fields:
    - [username, { type: var, name: username }]
    - [password, { type: var, name: password }]

logout:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: auth }
  - { type: literal, value: logout }
  auth: *request_auth

directory_query:
  method: GET
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  auth: *request_auth
  query:
    type: object
    fields:
    - - directory_path
      - type: if
        condition: { type: exists, var: directory_path }
        then_expr: { type: var, name: directory_path }
        else_expr: { type: const, value: null }
    - - substring
      - type: if
        condition: { type: exists, var: substring }
        then_expr: { type: var, name: substring }
        else_expr: { type: const, value: null }
    - - entry_type
      - type: if
        condition: { type: exists, var: entry_type }
        then_expr: { type: var, name: entry_type }
        else_expr: { type: const, value: null }
    - - recursive
      - type: if
        condition: { type: exists, var: recursive }
        then_expr: { type: var, name: recursive }
        else_expr: { type: const, value: null }

directory_create:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  auth: *request_auth
  body:
    type: object
    fields:
    - [directory_path, { type: var, name: directory_path }]
    - - recursive
      - type: if
        condition: { type: exists, var: recursive }
        then_expr: { type: var, name: recursive }
        else_expr: { type: const, value: null }

directory_delete:
  method: DELETE
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  auth: *request_auth
  query:
    type: object
    fields:
    - [directory_path, { type: var, name: directory_path }]

directory_exists:
  method: GET
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  - { type: literal, value: exists }
  auth: *request_auth
  query:
    type: object
    fields:
    - [directory_path, { type: var, name: directory_path }]

directory_copy:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  - { type: literal, value: copy }
  auth: *request_auth
  body:
    type: object
    fields:
    - [source_directory_path, { type: var, name: source_directory_path }]
    - [destination_directory_path, { type: var, name: destination_directory_path }]

directory_move:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  - { type: literal, value: move }
  auth: *request_auth
  body:
    type: object
    fields:
    - [source_directory_path, { type: var, name: source_directory_path }]
    - [destination_directory_path, { type: var, name: destination_directory_path }]

directory_compress:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  - { type: literal, value: compress }
  auth: *request_auth
  body:
    type: object
    fields:
    - [directory_path, { type: var, name: directory_path }]
    - - compressed_file_path
      - type: if
        condition: { type: exists, var: compressed_file_path }
        then_expr: { type: var, name: compressed_file_path }
        else_expr: { type: const, value: null }
    - - delete_directory
      - type: if
        condition: { type: exists, var: delete_directory }
        then_expr: { type: var, name: delete_directory }
        else_expr: { type: const, value: null }
    - - overwrite
      - type: if
        condition: { type: exists, var: overwrite }
        then_expr: { type: var, name: overwrite }
        else_expr: { type: const, value: null }

file_query:
  method: GET
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: directory }
  auth: *request_auth
  query:
    type: object
    fields:
    - - directory_path
      - type: if
        condition: { type: exists, var: directory_path }
        then_expr: { type: var, name: directory_path }
        else_expr: { type: const, value: null }
    - - substring
      - type: if
        condition: { type: exists, var: substring }
        then_expr: { type: var, name: substring }
        else_expr: { type: const, value: null }
    - - entry_type
      - type: const
        value: files
    - - recursive
      - type: if
        condition: { type: exists, var: recursive }
        then_expr: { type: var, name: recursive }
        else_expr: { type: const, value: null }

file_get:
  method: GET
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  auth: *request_auth
  query:
    type: object
    fields:
    - [file_path, { type: var, name: id }]

file_create:
  method: POST
  response:
    response_preprocess:
      kind: object_projection
      fields:
        path: [file_path]
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  auth: *request_auth
  body:
    type: object
    fields:
    - [file_path, { type: var, name: file_path }]
    - [content, { type: var, name: content }]
    - - overwrite
      - type: if
        condition: { type: exists, var: overwrite }
        then_expr: { type: var, name: overwrite }
        else_expr: { type: const, value: null }

file_update:
  method: PATCH
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  auth: *request_auth
  body:
    type: object
    fields:
    - [file_path, { type: var, name: id }]
    - [content, { type: var, name: content }]

file_delete:
  method: DELETE
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  auth: *request_auth
  query:
    type: object
    fields:
    - [file_path, { type: var, name: id }]

file_exists:
  method: GET
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  - { type: literal, value: exists }
  auth: *request_auth
  query:
    type: object
    fields:
    - [file_path, { type: var, name: file_path }]

file_copy:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  - { type: literal, value: copy }
  auth: *request_auth
  body:
    type: object
    fields:
    - [source_file_path, { type: var, name: source_file_path }]
    - [destination_file_path, { type: var, name: destination_file_path }]

file_move:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  - { type: literal, value: move }
  auth: *request_auth
  body:
    type: object
    fields:
    - [source_file_path, { type: var, name: source_file_path }]
    - [destination_file_path, { type: var, name: destination_file_path }]

file_decompress:
  method: POST
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: file }
  - { type: literal, value: decompress }
  auth: *request_auth
  body:
    type: object
    fields:
    - [compressed_file_path, { type: var, name: compressed_file_path }]
    - - decompressed_directory_path
      - type: if
        condition: { type: exists, var: decompressed_directory_path }
        then_expr: { type: var, name: decompressed_directory_path }
        else_expr: { type: const, value: null }
    - - retain_dates
      - type: if
        condition: { type: exists, var: retain_dates }
        then_expr: { type: var, name: retain_dates }
        else_expr: { type: const, value: null }
    - - delete_compressed_file
      - type: if
        condition: { type: exists, var: delete_compressed_file }
        then_expr: { type: var, name: delete_compressed_file }
        else_expr: { type: const, value: null }

profile_get:
  method: GET
  response: single
  path:
  - { type: literal, value: file_system }
  - { type: literal, value: profile }
  query:
    type: object
    fields:
    - - email
      - type: if
        condition: { type: exists, var: email }
        then_expr: { type: var, name: email }
        else_expr: { type: const, value: null }

# Account lifecycle: registration, recovery and authenticated account management.
account_get:
  method: GET
  path:
  - type: literal
    value: file_system
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
  response: single
account_create:
  method: POST
  path:
  - type: literal
    value: file_system
  - type: literal
    value: account
  body:
    type: object
    fields:
    - - first_name
      - type: var
        name: first_name
    - - last_name
      - type: var
        name: last_name
    - - email
      - type: var
        name: email
    - - password
      - type: var
        name: password
account_update:
  method: PATCH
  path:
  - type: literal
    value: file_system
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
  body:
    type: object
    fields:
    - - first_name
      - type: if
        condition:
          type: exists
          var: first_name
        then_expr:
          type: var
          name: first_name
        else_expr:
          type: const
          value: null
    - - last_name
      - type: if
        condition:
          type: exists
          var: last_name
        then_expr:
          type: var
          name: last_name
        else_expr:
          type: const
          value: null
account_delete:
  method: DELETE
  path:
  - type: literal
    value: file_system
  - type: literal
    value: account
  auth:
    scheme: bearer
    token:
      type: var
      name: access_token
send_verification_code:
  method: POST
  path:
  - type: literal
    value: file_system
  - type: literal
    value: send_verification_code
  body:
    type: object
    fields:
    - - email
      - type: var
        name: email
verify_account:
  method: POST
  path:
  - type: literal
    value: file_system
  - type: literal
    value: verify_account
  body:
    type: object
    fields:
    - - email
      - type: var
        name: email
    - - verification_code
      - type: var
        name: verification_code
send_password_reset_code:
  method: POST
  path:
  - type: literal
    value: file_system
  - type: literal
    value: send_password_reset_code
  body:
    type: object
    fields:
    - - email
      - type: var
        name: email
reset_password:
  method: POST
  path:
  - type: literal
    value: file_system
  - type: literal
    value: reset_password
  body:
    type: object
    fields:
    - - email
      - type: var
        name: email
    - - password_reset_code
      - type: var
        name: password_reset_code
    - - new_password
      - type: var
        name: new_password
