document_share_bind:
  transport: credential_bind
  lifetime_seconds: 86400
  slot: document_access
  origin: https://www.proofeditor.ai
  resource:
    type: let
    bindings:
    - name: document_url
      value:
        type: url_project
        value:
          type: format
          template: https://www.proofeditor.ai/d/{document}
          vars:
            document:
              type: var
              name: document
        projection:
          origins:
          - https://www.proofeditor.ai
          - https://proofeditor.ai
          path:
          - kind: literal
            value: d
          - kind: capture
            name: document
          query: {}
    value:
      type: assert
      condition:
        type: equals
        left:
          type: field
          value:
            type: var
            name: document_url
          path:
          - document
        right:
          type: var
          name: document
      code: invalid_document_identity
      value:
        type: object
        fields:
        - - document
          - type: var
            name: document
  source:
    scheme: host
