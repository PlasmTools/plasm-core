_document_auth_1: &document_auth_1
  scheme: when
  condition:
    type: exists
    var: access
  then_auth:
    scheme: credential
    slot: document_access
    resource:
      type: object
      fields:
      - - document
        - type: var
          name: slug
    reference:
      type: var
      name: access
  else_auth:
    scheme: host

_document_auth_2: &document_auth_2
  scheme: when
  condition:
    type: exists
    var: access
  then_auth:
    scheme: credential
    slot: document_access
    resource:
      type: object
      fields:
      - - document
        - type: var
          name: document_id
    reference:
      type: var
      name: access
  else_auth:
    scheme: host

# Proof — HTTP mappings for hosted `www.proofeditor.ai`.
# Slug-scoped agent routes use `/api/agent/:slug/…` (plain `/documents/:slug/…` returns 404 HTML on hosted).
# Share negotiation stays `GET /d/:slug`; new docs use `POST /share/markdown`. See apis/proof/README.md.
# Auth: explicit scoped `access` reference, or the declared host bearer source when omitted.

annotation_comment_add:
  method: POST
  path:
  - type: literal
    value: api
  - type: literal
    value: agent
  - type: var
    name: slug
  - type: literal
    value: ops
  headers:
    type: object
    fields:
    - - X-Agent-Id
      - type: var
        name: agent_id
  body:
    type: object
    fields:
    - - type
      - type: const
        value: comment.add
    - - by
      - type: var
        name: by
    - - quote
      - type: var
        name: quote
    - - text
      - type: var
        name: text
    - - baseToken
      - type: var
        name: base_token
  response:
    single: true
  auth: *document_auth_1
