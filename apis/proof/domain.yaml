version: 30
http_backend: https://www.proofeditor.ai
auth:
  scheme: bearer_token
  env: PROOF_API_TOKEN
  hosted_kv: plasm:outbound:v1:catalog:proof
  optional_env: true
data_classes:
  untrusted:
    description: User-authored or externally sourced text (document/block/event content from any collaborator).
    severity: untrusted
  credentials:
    description: Access token or secret used to authenticate document access.
    severity: critical
  external_publish:
    description: Document content change visible to all collaborators on the shared document.
    severity: critical
entities:
  DocumentAccess:
    id_field: reference
    description: Opaque session credential reference scoped to one document and catalog revision.
    fields:
      reference:
        value_ref: nv_proof_access_id
        required: true
      document:
        value_ref: nv_proof_document_ref
        required: true
        path: resource.document
  Document:
    id_field: slug
    description: Read or edit a shared Proof document (title, body, auth hints).
    primary_read: document_get
    discovery:
      names:
      - proof document
      - shared document
    fields:
      slug:
        value_ref: nv_proof_document_id
        required: true
      markdown:
        value_ref: nv_proof_markdown
        required: false
        data_class: untrusted
      title:
        value_ref: nv_proof_str
        required: false
      links:
        value_ref: nv_proof_json
        required: false
        path: _links
        description: SDK link bundle (state, ops, docs). Wire key _links.
      agent_auth:
        value_ref: nv_proof_json
        required: false
        path: agent.auth
        description: Auth hints from share JSON agent.auth (token source, header names).
    relations:
      blocks:
        target: Block
        cardinality: many
        description: Blocks from the latest snapshot—use for edits that need stable block ids.
        materialize:
          kind: query_scoped
          capability: block_query
          param: document_id
      collaboration_events:
        target: CollaborationEvent
        cardinality: many
        description: Recent collaboration updates you have not acknowledged yet.
        materialize:
          kind: query_scoped
          capability: collaboration_event_query
          param: document_id
  EditorState:
    id_field: slug
    description: Fetch before editing with others—includes snapshot revision, baseToken precondition,
      marks, and collaboration rules.
    domain_projection_examples: false
    fields:
      slug:
        value_ref: nv_proof_document_id
        required: true
      marks:
        value_ref: nv_proof_json
        required: false
        path: marks
      contract:
        value_ref: nv_proof_json
        required: false
        path: contract
        description: Rules for how this session may edit the document.
      connected_clients:
        value_ref: nv_proof_int
        required: false
        path: connectedClients
      revision:
        value_ref: nv_proof_int
        required: false
        description: Snapshot revision number—send as base_revision on edit/v2 only (not as an event cursor).
      base_token:
        value_ref: nv_proof_base_token
        required: false
        path: []
        derive:
          type: colon_pair_prefer_keys_else_block_refs
          prefer_keys:
          - baseToken
          blocks_key: blocks
          ref_field: ref
          segment: mt1
        description: Mutation precondition token (mt1 snapshot-hash segment)—from wire baseToken when
          set; otherwise parsed from the first block ref (colon-separated snapshot ref). The host caches
          it for /ops after editor_state_get
      collab:
        value_ref: nv_proof_json
        required: false
        path: collab
      raw:
        value_ref: nv_proof_json
        required: false
        description: Full server state when you need fields not listed above.
  Block:
    id_field: ref
    description: One chunk of the document in the current snapshot. Refresh the snapshot after others
      edit before you change structure again
    domain_projection_examples: false
    fields:
      ref:
        value_ref: nv_proof_block_ref
        required: true
      ordinal_ref:
        value_ref: nv_proof_block_ref
        required: false
        path: ordinalRef
      markdown:
        value_ref: nv_proof_markdown
        required: false
        data_class: untrusted
      block_kind:
        value_ref: nv_proof_str
        required: false
        path: type
  CollaborationEvent:
    id_field: id
    description: One collaboration update. Poll for new rows; acknowledge what you processed.
    domain_projection_examples: false
    fields:
      id:
        value_ref: nv_proof_event_id
        required: true
      kind:
        value_ref: nv_proof_str
        required: false
        path: type
        description: Server event type string (wire `type`).
      at:
        value_ref: nv_proof_str
        required: false
        path: createdAt
      payload:
        value_ref: nv_proof_json
        required: false
        path: data
        description: Parsed event body—comment/mark/thread details live here (wire `data`).
        data_class: untrusted
      actor:
        value_ref: nv_proof_str
        required: false
        path: actor
      acked_at:
        value_ref: nv_proof_str
        required: false
        path: ackedAt
      acked_by:
        value_ref: nv_proof_str
        required: false
        path: ackedBy
  ShareLink:
    id_field: slug
    description: Result of creating a new shared document (ids, link, token).
    fields:
      slug:
        value_ref: nv_proof_document_id
        required: false
      url:
        value_ref: nv_proof_str
        required: false
        description: Short doc path from create (`url`).
      share_url:
        value_ref: nv_proof_str
        required: false
        path: shareUrl
        description: Web share URL without query token.
      token_url:
        value_ref: nv_proof_str
        required: false
        path: tokenUrl
        description: Full share URL including `?token=`. Provision access through the host credential injection mechanism.
        data_class: credentials
      token_path:
        value_ref: nv_proof_str
        required: false
        path: tokenPath
        description: Path-style URL with token query for CLI-style copy/paste.
        data_class: credentials
      token:
        value_ref: nv_proof_str
        required: false
        path: accessToken
        description: Link access token (`accessToken` on wire). Provision through the host credential injection mechanism.
        data_class: credentials
      raw:
        value_ref: nv_proof_json
        required: false
  BugReport:
    id_field: id
    description: Response after you report a bug to Proof support.
    domain_projection_examples: false
    fields:
      id:
        value_ref: nv_proof_str
        required: false
      status:
        value_ref: nv_proof_str
        required: false
      fixer_brief:
        value_ref: nv_proof_markdown
        required: false
      raw:
        value_ref: nv_proof_json
        required: false
capabilities:
  document_get:
    description: Get title, body, links, and auth hints for this document.
    kind: get
    entity: Document
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
    provides:
    - slug
    - markdown
    - title
    - links
    - agent_auth
  document_get_markdown:
    description: Get the document body as markdown only.
    kind: get
    entity: Document
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
    provides:
    - slug
    - markdown
  document_share_bind:
    description: Bind the configured host credential injection source to this document and return an immutable
      DocumentAccess reference. Configure credentials through the existing connection mechanism; this reviewed
      local operation stores only scope and source metadata and makes no HTTP request.
    kind: create
    entity: DocumentAccess
    payload:
      input_type:
        type: object
        fields:
        - name: document
          value_ref: nv_proof_document_ref
          required: true
    provides:
    - reference
    - document
    output:
      type: entity
      entity_type: DocumentAccess
  editor_state_get:
    description: Read current editor state and bind base_token explicitly into the next document operation.
    kind: get
    entity: EditorState
    controls:
    - name: kinds
      value_ref: nv_proof_str
      required: false
    provides:
    - slug
    - marks
    - contract
    - connected_clients
    - revision
    - base_token
    - collab
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
    output:
      type: entity
      entity_type: EditorState
    scope:
    - name: slug
      value_ref: nv_proof_document_ref
      required: true
  block_query:
    description: List blocks from the current snapshot so edits use stable block ids.
    kind: query
    entity: Block
    scope:
    - name: document_id
      value_ref: nv_proof_document_ref
      required: true
    - name: access
      value_ref: nv_proof_access_ref
      required: false
      description: DocumentAccess.reference for this document; omit to use configured host authentication.
    provides:
    - ref
    - ordinal_ref
    - markdown
    - block_kind
  collaboration_event_query:
    description: List collaboration updates after a given event id.
    kind: query
    entity: CollaborationEvent
    scope:
    - name: document_id
      value_ref: nv_proof_document_ref
      required: true
    - name: access
      value_ref: nv_proof_access_ref
      required: false
      description: DocumentAccess.reference for this document; omit to use configured host authentication.
    selection:
    - name: after
      value_ref: nv_proof_event_id
      required: false
    controls:
    - name: limit
      value_ref: nv_proof_int
      required: false
    provides:
    - id
    - kind
    - at
    - payload
    - actor
    - acked_at
    - acked_by
  document_edit_v2:
    receiver: {kind: entity, entity: Document}
    description: 'Apply one batch of block edits. Use base_revision from your latest snapshot (integer—not
      baseToken). Combine replace, insert, delete, range replace, and find/replace steps in one request
      when needed.

      '
    kind: action
    entity: Document
    payload:
      description: 'Send author id, snapshot base_revision, and an ordered list of edit operations.

        '
      input_type:
        type: object
        additional_fields: false
        fields:
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: base_revision
          value_ref: nv_proof_int
          required: true
        - name: operations
          required: true
          input_type:
            type: array
            element_type:
              type: union
              variants:
              - name: replace_block
                constructor_symbol: v101
                description: Replace one block’s markdown.
                wire:
                  field: op
                  value: replace_block
                fields:
                - name: ref
                  value_ref: nv_proof_block_ref
                  required: true
                - name: markdown
                  value_ref: nv_proof_markdown
                  required: true
                  wire_json_path:
                  - block
                  - markdown
                  sink_class: external_publish
              - name: insert_before
                constructor_symbol: v102
                description: Insert blocks before the anchor block.
                wire:
                  field: op
                  value: insert_before
                fields:
                - name: ref
                  value_ref: nv_proof_block_ref
                  required: true
                - name: blocks
                  value_ref: nv_proof_insert_blocks_markdown
                  required: true
                  wire_array_element_key: markdown
                  sink_class: external_publish
              - name: insert_after
                constructor_symbol: v103
                description: Insert blocks after the anchor block.
                wire:
                  field: op
                  value: insert_after
                fields:
                - name: ref
                  value_ref: nv_proof_block_ref
                  required: true
                - name: blocks
                  value_ref: nv_proof_insert_blocks_markdown
                  required: true
                  wire_array_element_key: markdown
                  sink_class: external_publish
              - name: delete_block
                constructor_symbol: v104
                description: Delete one block.
                wire:
                  field: op
                  value: delete_block
                fields:
                - name: ref
                  value_ref: nv_proof_block_ref
                  required: true
              - name: replace_range
                constructor_symbol: v105
                description: Replace a range of blocks with new blocks.
                wire:
                  field: op
                  value: replace_range
                fields:
                - name: fromRef
                  value_ref: nv_proof_block_ref
                  required: true
                - name: toRef
                  value_ref: nv_proof_block_ref
                  required: true
                - name: blocks
                  value_ref: nv_proof_insert_blocks_markdown
                  required: true
                  wire_array_element_key: markdown
                  sink_class: external_publish
              - name: find_replace_in_block
                constructor_symbol: v106
                description: Find and replace text inside one block.
                wire:
                  field: op
                  value: find_replace_in_block
                fields:
                - name: ref
                  value_ref: nv_proof_block_ref
                  required: true
                - name: find
                  value_ref: nv_proof_markdown
                  required: true
                - name: replace
                  value_ref: nv_proof_markdown
                  required: true
                  sink_class: external_publish
                - name: occurrence
                  value_ref: nv_proof_occurrence
                  required: false
              - name: find_replace_in_doc
                constructor_symbol: v107
                description: Find and replace text across the document (optional block range or kind filter).
                wire:
                  field: op
                  value: find_replace_in_doc
                fields:
                - name: find
                  value_ref: nv_proof_markdown
                  required: true
                - name: replace
                  value_ref: nv_proof_markdown
                  required: true
                  sink_class: external_publish
                - name: occurrence
                  value_ref: nv_proof_occurrence
                  required: false
                - name: fromRef
                  value_ref: nv_proof_block_ref
                  required: false
                - name: toRef
                  value_ref: nv_proof_block_ref
                  required: false
                - name: blockFilter
                  value_ref: nv_proof_str
                  required: false
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: idempotency_key
          value_ref: nv_proof_uuid
          required: false
      validation:
        allow_null: false
    output:
      type: side_effect
      description: Updates document content when base_revision matches the server snapshot.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_comment_add:
    receiver: {kind: entity, entity: Document}
    description: Start a comment thread on quoted text from the document.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: quote
          value_ref: nv_proof_markdown
          required: true
        - name: text
          value_ref: nv_proof_markdown
          required: true
          sink_class: external_publish
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Adds a comment thread on that quote.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_comment_reply:
    receiver: {kind: entity, entity: Document}
    description: Reply in a thread; optionally mark it resolved in the same step.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: mark_id
          value_ref: nv_proof_str
          required: true
        - name: text
          value_ref: nv_proof_markdown
          required: true
          sink_class: external_publish
        - name: resolve
          value_ref: nv_proof_bool
          required: false
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Adds the reply and updates resolved state if you set resolve.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_comment_resolve:
    receiver: {kind: entity, entity: Document}
    description: Mark a thread resolved; history stays visible.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: mark_id
          value_ref: nv_proof_str
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Shows the thread as resolved for everyone.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_comment_unresolve:
    receiver: {kind: entity, entity: Document}
    description: Open a resolved thread for more discussion.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: mark_id
          value_ref: nv_proof_str
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Marks the thread open again.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_suggestion_insert:
    receiver: {kind: entity, entity: Document}
    description: Propose inserting text after a quoted passage for a human to accept or reject.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: quote
          value_ref: nv_proof_markdown
          required: true
        - name: content
          value_ref: nv_proof_markdown
          required: true
          sink_class: external_publish
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
        - name: idempotency_key
          value_ref: nv_proof_uuid
          required: false
        - name: status
          value_ref: nv_proof_str
          required: false
    output:
      type: side_effect
      description: Creates a pending insert suggestion others can accept or reject.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_suggestion_delete:
    receiver: {kind: entity, entity: Document}
    description: Propose deleting a quoted passage for a human to accept or reject.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: quote
          value_ref: nv_proof_markdown
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
        - name: idempotency_key
          value_ref: nv_proof_uuid
          required: false
        - name: status
          value_ref: nv_proof_str
          required: false
    output:
      type: side_effect
      description: Creates a pending delete suggestion others can accept or reject.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_suggestion_replace:
    receiver: {kind: entity, entity: Document}
    description: Propose replacing a quoted passage with new content for a human to accept or reject.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: quote
          value_ref: nv_proof_markdown
          required: true
        - name: content
          value_ref: nv_proof_markdown
          required: true
          sink_class: external_publish
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
        - name: idempotency_key
          value_ref: nv_proof_uuid
          required: false
        - name: status
          value_ref: nv_proof_str
          required: false
    output:
      type: side_effect
      description: Creates a pending replace suggestion others can accept or reject.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_suggestion_accept:
    receiver: {kind: entity, entity: Document}
    description: Accept a pending suggestion and apply it to the document.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: mark_id
          value_ref: nv_proof_str
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Applies the change per server rules and updates the suggestion mark.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_suggestion_reject:
    receiver: {kind: entity, entity: Document}
    description: Reject a pending suggestion without changing the document body.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: mark_id
          value_ref: nv_proof_str
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
    output:
      type: side_effect
      description: Removes the suggestion from the active list.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  annotation_comment_batch_apply:
    receiver: {kind: entity, entity: Document}
    description: Apply several comment updates in one request.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        additional_fields: false
        fields:
        - name: operations
          required: true
          input_type:
            type: array
            element_type:
              type: union
              variants:
              - name: comment_reply
                constructor_symbol: v210
                description: Reply in a thread; optionally resolve in the same step.
                wire:
                  field: type
                  value: comment.reply
                fields:
                - name: mark_id
                  value_ref: nv_proof_str
                  required: true
                  wire_json_path:
                  - markId
                - name: text
                  value_ref: nv_proof_markdown
                  required: true
                  sink_class: external_publish
                - name: resolve
                  value_ref: nv_proof_bool
                  required: false
              - name: comment_resolve
                constructor_symbol: v211
                description: Resolve a thread; keep history.
                wire:
                  field: type
                  value: comment.resolve
                fields:
                - name: mark_id
                  value_ref: nv_proof_str
                  required: true
                  wire_json_path:
                  - markId
              - name: comment_unresolve
                constructor_symbol: v212
                description: Unresolve a thread for more replies.
                wire:
                  field: type
                  value: comment.unresolve
                fields:
                - name: mark_id
                  value_ref: nv_proof_str
                  required: true
                  wire_json_path:
                  - markId
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
        - name: base_token
          value_ref: nv_proof_base_token
          required: true
          description: Current EditorState.base_token, explicitly bound for this write.
      validation:
        allow_null: false
      description: Ordered list of reply, resolve, or unresolve steps from one author.
    output:
      type: side_effect
      description: Applies every step or applies none, per server rules.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  collaboration_event_ack:
    receiver: {kind: entity, entity: Document}
    description: Tell the server how far you read the collaboration event stream.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: up_to_id
          value_ref: nv_proof_event_id
          required: true
        - name: by
          value_ref: nv_proof_str
          required: true
    output:
      type: side_effect
      description: Records how far you processed events for later polls.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  presence_update:
    receiver: {kind: entity, entity: Document}
    description: 'You MUST announce presence before you edit or comment—call this once per document after
      share binding

      '
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: agent_id
          value_ref: nv_proof_agent_id
          required: true
        - name: presence_status
          value_ref: nv_proof_str
          required: false
    output:
      type: side_effect
      description: Shows this agent as active in the document session for collaborators.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit to use configured host authentication.
  share_link_create:
    description: Create a new shared document from markdown.
    kind: create
    entity: ShareLink
    payload:
      input_type:
        type: object
        fields:
        - name: markdown
          value_ref: nv_proof_markdown
          required: true
          sink_class: external_publish
  bug_report_submit:
    description: Report a bug in Proof itself—not about editing this document.
    kind: create
    entity: BugReport
    payload:
      input_type:
        type: object
        fields:
        - name: report
          value_ref: nv_proof_markdown
          required: true
          description: Full bug report (steps, expected vs actual, errors, request ids, environment).
  document_bug_report_submit:
    description: Report a bug and include this document as context.
    kind: action
    entity: Document
    payload:
      input_type:
        type: object
        fields:
        - name: report
          value_ref: nv_proof_markdown
          required: true
          description: Full bug report (steps, expected vs actual, errors, request ids, environment).
    provides:
    - status
    - fixer_brief
    - raw
    output:
      type: side_effect
      description: Sends diagnostics only; does not change the document.
    arguments:
      input_type:
        type: object
        fields:
        - name: access
          value_ref: nv_proof_access_ref
          required: false
          description: DocumentAccess.reference for this document; omit for configured host authentication.
values:
  nv_proof_access_id:
    type: string
    description: Opaque document session credential identity.
  nv_proof_document_id:
    type: string
    description: Document slug or id.
  nv_proof_access_ref:
    type: entity_ref
    target: DocumentAccess
    description: Opaque reference returned by document_share_bind; never a raw token.
  nv_proof_document_ref:
    type: entity_ref
    target: Document
    description: Document slug or id this API uses.
  nv_proof_event_id:
    type: string
    description: Event id from the pending collaboration stream—use for after= and ack up_to_id only.
  nv_proof_base_token:
    type: string
    description: mt1 precondition string exposed on EditorState (wire baseToken or derived from block
      refs); explicitly bind the current value into each mutation
  nv_proof_block_ref:
    type: string
    description: 'Block id from your current snapshot. Refresh the snapshot after others edit before you
      reuse ids.

      '
  nv_proof_agent_id:
    type: string
    description: Stable name for this agent on edits (shows in attribution).
  nv_proof_str:
    type: string
    description: Short text.
  nv_proof_markdown:
    type: markdown
  nv_proof_json:
    type: json
    description: JSON object (links, auth hints, extra fields).
  nv_proof_int:
    type: integer
    description: Integer (revision, counts, limits).
  nv_proof_bool:
    type: boolean
    description: true/false flag (for example resolve thread).
  nv_proof_uuid:
    type: uuid
    description: Optional idempotency key so you can retry the same edit batch safely.
  nv_proof_occurrence:
    type: enum
    enum:
    - first
    - all
    description: Replace only the first match or every match in range.
  nv_proof_insert_blocks_markdown:
    type: array
    items:
      value_ref: nv_proof_markdown
    description: New blocks in order from top to bottom.

prerequisites:
  contracts:
    proof.document_precondition:
      version: 1
      inputs:
        document: nv_proof_document_ref
        access: nv_proof_access_ref
      outputs:
        base_token: nv_proof_base_token
  providers:
    editor_state:
      contract: proof.document_precondition
      capability: editor_state_get
      inputs:
        document:
          lane: scope
          path:
          - slug
        access:
          lane: arguments
          path:
          - access
      outputs:
        base_token: base_token
  requirements:
