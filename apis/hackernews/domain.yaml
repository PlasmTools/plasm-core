version: 5
auth:
  scheme: none
http_backend: https://hacker-news.firebaseio.com
data_classes:
  untrusted:
    description: User-authored or externally sourced text.
    severity: untrusted
entities:
  Item:
    id_field: id
    primary_search: item_search
    description: A Hacker News story or comment — trending tech discussion, front-page stories, and comment threads.
    discovery:
      names:
      - trending discussion
      - front page
      - hacker news story
      - story
    fields:
      id:
        required: true
        value_ref: nv_item_id
      type:
        required: false
        value_ref: nv_item_type
      by:
        required: false
        value_ref: nv_item_by
      time:
        required: false
        value_ref: nv_item_time
      title:
        required: false
        value_ref: nv_item_title
        data_class: untrusted
      text:
        required: false
        value_ref: nv_item_text
        data_class: untrusted
      url:
        required: false
        value_ref: nv_item_url
      score:
        required: false
        value_ref: nv_item_score
      descendants:
        required: false
        value_ref: nv_item_descendants
      parent:
        required: false
        value_ref: nv_item_parent
      poll:
        required: false
        value_ref: nv_item_poll
      parts:
        required: false
        value_ref: nv_item_parts
      deleted:
        required: false
        value_ref: nv_item_deleted
      dead:
        required: false
        value_ref: nv_item_dead
    relations:
      kids:
        description: Direct child item ids (typically comments under a story).
        target: Item
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: kids
          - wildcard: true
      poll_options:
        description: Poll option rows referenced by parts (each id is an Item).
        target: Item
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: parts
          - wildcard: true
  User:
    id_field: id
    description: A Hacker News user profile keyed by username. The submitted list holds item ids only; fetch each via item_get.
      when you need titles or comment bodies.
    fields:
      id:
        required: true
        value_ref: nv_user_id
      created:
        required: false
        value_ref: nv_user_created
      karma:
        required: false
        value_ref: nv_user_karma
      about:
        required: false
        value_ref: nv_user_about
        data_class: untrusted
      delay:
        required: false
        value_ref: nv_user_delay
    relations:
      submitted:
        description: Item ids this user has submitted.
        target: Item
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: submitted
          - wildcard: true
  MaxItemId:
    id_field: id
    description: Current largest item id reported by maxitem.json (a bare JSON integer on the wire). Hydrate the referenced.
      row with item_get when you need the full record.
    fields:
      id:
        required: true
        value_ref: nv_max_item_id_id
  RecentUpdatedItem:
    id_field: id
    description: Item ids listed under updates.json items (live slice of ids with recent activity). Each entry is an id only.
      use item_get for payloads.
    fields:
      id:
        required: true
        value_ref: nv_recent_updated_item_id
  RecentUpdatedUser:
    id_field: id
    description: Usernames listed under updates.json profiles (accounts whose profile data changed). Each entry is the username.
      string only; use user_get for karma and about text.
    fields:
      id:
        required: true
        value_ref: nv_recent_updated_user_id
capabilities:
  item_search:
    description: Search Hacker News for trending discussion and stories about regulation, policy, or tech debate.
    kind: search
    entity: Item
    discovery:
      operation_terms:
      - search discussion
      - trending
      target_terms:
      - trending discussion
      - discussion
      - regulation
      - front page
    provides:
    - id
    - title
    - url
    selection:
    - name: shelf
      value_ref: nv_item_search_shelf
      required: true
      description: relevance | by_date
    - name: query
      value_ref: nv_wire_str_short
      required: true
    - name: tags
      value_ref: nv_wire_str_short
      required: false
    controls:
    - name: page
      value_ref: nv_wire_int
      required: false
    - name: per_page
      value_ref: nv_wire_int
      required: false
  item_feed_query:
    description: Browse Hacker News front-page feeds — top, new, best, ask, or show stories for trending discussion.
    kind: query
    entity: Item
    discovery:
      operation_terms:
      - trending
      - front page
      - hot feed
      target_terms:
      - trending discussion
      - discussion
      - hot
      - rising
    provides:
    - id
    selection:
    - name: feed
      value_ref: nv_item_feed_query_feed
      required: true
  max_item_id_query:
    description: Current largest item id (maxitem.json).
    kind: query
    entity: MaxItemId
    provides:
    - id
  recent_updated_item_query:
    description: Recently active Hacker News items — trending discussion with recent updates.
    kind: query
    entity: RecentUpdatedItem
    discovery:
      target_terms:
      - trending discussion
      - trending
      - hot
    provides:
    - id
  recent_updated_user_query:
    description: Usernames from the live updates snapshot (updates.json profiles array).
    kind: query
    entity: RecentUpdatedUser
    provides:
    - id
  item_get:
    kind: get
    entity: Item
    provides:
    - id
    - type
    - by
    - time
    - title
    - text
    - url
    - score
    - descendants
    - parent
    - poll
    - parts
    - deleted
    - dead
  user_get:
    description: Load a user profile by username.
    kind: get
    entity: User
    provides:
    - id
    - created
    - karma
    - about
    - delay
values:
  nv_item_by:
    type: string
    description: Username of the author when present.
  nv_item_dead:
    type: boolean
    description: Whether the item is dead.
  nv_item_deleted:
    type: boolean
    description: Whether the item was deleted.
  nv_item_descendants:
    type: integer
    description: Comment count for stories when known.
  nv_item_feed_query_feed:
    type: enum
    enum:
    - top
    - new
    - best
    - ask
    - show
    - job
  nv_item_id:
    type: integer
    description: Numeric item id used in Firebase paths.
  nv_item_parent:
    type: integer
    description: Parent item id for comments and poll options.
  nv_item_poll:
    type: integer
    description: Poll id when this item is a story that hosts a poll.
  nv_item_score:
    type: integer
    description: Net votes for stories and jobs when present.
  nv_item_text:
    type: markdown
    description: Comment or story text payload when present.
  nv_item_time:
    type: integer
    description: Unix time the item was created.
  nv_item_title:
    type: string
    description: Story or job title when applicable.
  nv_item_type:
    type: string
    description: Wire kind such as story, comment, job, poll, or pollopt.
  nv_item_url:
    type: string
    description: Outbound link for link posts when present.
  nv_max_item_id_id:
    type: integer
    description: Largest item id currently allocated on HN.
  nv_recent_updated_item_id:
    type: integer
    description: Item id from the live updates snapshot.
  nv_recent_updated_user_id:
    type: string
    description: Username from the live updates snapshot.
  nv_user_about:
    type: markdown
    description: Self-description text when set.
  nv_user_created:
    type: integer
    description: Unix time the account was created.
  nv_user_delay:
    type: integer
    description: Account delay setting when present.
  nv_user_id:
    type: string
    description: Unique username.
  nv_user_karma:
    type: integer
    description: User karma score.
  nv_wire_int:
    type: integer
  nv_wire_str_short:
    type: string
  nv_item_parts:
    type: array
    items:
      value_ref: nv_wire_int
    description: Poll option item ids when type is poll (empty or absent otherwise).
  nv_item_search_shelf:
    type: enum
    enum:
    - relevance
    - by_date
    description: Search HN items by shelf — relevance or by_date.
