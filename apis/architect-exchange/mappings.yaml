fill_query:
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: fill_for_order
    then_expr:
      type: const
      value: orders/order-fills
    else_expr:
      type: const
      value: api/fills
  query:
    type: object
    fields:
    - - account_id
      - type: if
        condition:
          type: exists
          var: account_id
        then_expr:
          type: var
          name: account_id
        else_expr:
          type: const
          value: null
    - - order_id
      - type: if
        condition:
          type: exists
          var: order_id
        then_expr:
          type: var
          name: order_id
        else_expr:
          type: const
          value: null
    - - symbol
      - type: if
        condition:
          type: exists
          var: symbol
        then_expr:
          type: var
          name: symbol
        else_expr:
          type: const
          value: null
    - - start_timestamp_ns
      - type: if
        condition:
          type: exists
          var: start_timestamp_ns
        then_expr:
          type: var
          name: start_timestamp_ns
        else_expr:
          type: const
          value: null
    - - end_timestamp_ns
      - type: if
        condition:
          type: exists
          var: end_timestamp_ns
        then_expr:
          type: var
          name: end_timestamp_ns
        else_expr:
          type: const
          value: null
    - - sort_ts
      - type: if
        condition:
          type: exists
          var: sort_ts
        then_expr:
          type: var
          name: sort_ts
        else_expr:
          type: const
          value: null
  response:
    items: fills
  pagination:
    location: query
    params:
      cursor:
        from_response: next_cursor
      limit:
        fixed: 100
        role: page_size
    strategy: cursor
transaction_query:
  method: GET
  path:
  - type: literal
    value: api
  - type: literal
    value: transactions
  query:
    type: object
    fields:
    - - account_id
      - type: if
        condition:
          type: exists
          var: account_id
        then_expr:
          type: var
          name: account_id
        else_expr:
          type: const
          value: null
    - - transaction_types
      - type: join
        sep: ','
        expr:
          type: var
          name: transaction_types
    - - start_timestamp_ns
      - type: var
        name: start_timestamp_ns
    - - end_timestamp_ns
      - type: var
        name: end_timestamp_ns
    - - sort_ts
      - type: if
        condition:
          type: exists
          var: sort_ts
        then_expr:
          type: var
          name: sort_ts
        else_expr:
          type: const
          value: null
  response:
    items: transactions
  pagination:
    location: query
    params:
      cursor:
        from_response: next_cursor
      limit:
        fixed: 100
        role: page_size
    strategy: cursor
