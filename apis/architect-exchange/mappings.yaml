order_history_query:
  method: GET
  path:
    - { type: literal, value: orders }
    - { type: literal, value: orders }
  query:
    type: object
    fields:
      - - symbol
        - type: if
          condition: { type: exists, var: symbol }
          then_expr: { type: var, name: symbol }
          else_expr: { type: const, value: null }
      - - start_timestamp_ns
        - type: var
          name: start_timestamp_ns
      - - end_timestamp_ns
        - type: var
          name: end_timestamp_ns
      - - sort_ts
        - type: if
          condition: { type: exists, var: sort_ts }
          then_expr: { type: var, name: sort_ts }
          else_expr: { type: const, value: null }
      - - order_states
        - type: if
          condition: { type: exists, var: order_states }
          then_expr: { type: join, sep: ",", expr: { type: var, name: order_states } }
          else_expr: { type: const, value: null }
      - - order_id
        - type: if
          condition: { type: exists, var: order_id }
          then_expr: { type: var, name: order_id }
          else_expr: { type: const, value: null }
      - - order_ids
        - type: if
          condition: { type: exists, var: order_ids }
          then_expr: { type: join, sep: ",", expr: { type: var, name: order_ids } }
          else_expr: { type: const, value: null }
      - - account_id
        - type: if
          condition: { type: exists, var: account_id }
          then_expr: { type: var, name: account_id }
          else_expr: { type: const, value: null }
  response:
