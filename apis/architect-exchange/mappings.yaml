order_preview:
  method: POST
  path:
  - type: literal
    value: orders
  - type: literal
    value: preview-order
  body:
    type: object
    fields:
    - - s
      - type: var
        name: symbol
    - - d
      - type: var
        name: side
    - - q
      - type: var
        name: quantity
    - - p
      - type: var
        name: price
    - - tif
      - type: var
        name: time_in_force
    - - aid
      - type: if
        condition:
          type: exists
          var: account_id
        then_expr:
          type: var
          name: account_id
        else_expr:
          type: const
          value: null
    - - cid
      - type: if
        condition:
          type: exists
          var: client_order_id
        then_expr:
          type: var
          name: client_order_id
        else_expr:
          type: const
          value: null
    - - po
      - type: if
        condition:
          type: exists
          var: post_only
        then_expr:
          type: var
          name: post_only
        else_expr:
          type: const
          value: null
    - - rb
      - type: if
        condition:
          type: exists
          var: reprice_behavior
        then_expr:
          type: var
          name: reprice_behavior
        else_expr:
          type: const
          value: null
    - - st
      - type: if
        condition:
          type: exists
          var: self_trade_behavior
        then_expr:
          type: var
          name: self_trade_behavior
        else_expr:
          type: const
          value: null
    - - tag
      - type: if
        condition:
          type: exists
          var: tag
        then_expr:
          type: var
          name: tag
        else_expr:
          type: const
          value: null
  response: single
