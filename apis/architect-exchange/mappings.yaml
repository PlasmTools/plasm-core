api_key_query:
  method: GET
  path:
    - { type: literal, value: api }
    - { type: literal, value: api-keys }
  response:
    items: api_keys

api_key_create:
  method: POST
  path:
    - { type: literal, value: api }
    - { type: literal, value: api-keys }
  body:
    type: object
    fields:
      - - account_ids
        - type: if
          condition: { type: exists, var: account_ids }
          then_expr: { type: var, name: account_ids }
          else_expr: { type: const, value: null }
      - - allowed_ips
        - type: if
          condition: { type: exists, var: allowed_ips }
          then_expr: { type: var, name: allowed_ips }
          else_expr: { type: const, value: null }
      - - permissions
        - type: object
          fields:
            - - can_list
              - type: if
                condition: { type: exists, var: can_list }
                then_expr: { type: var, name: can_list }
                else_expr: { type: const, value: null }
            - - can_read
              - type: if
                condition: { type: exists, var: can_read }
                then_expr: { type: var, name: can_read }
                else_expr: { type: const, value: null }
            - - can_set_limits
              - type: if
                condition: { type: exists, var: can_set_limits }
                then_expr: { type: var, name: can_set_limits }
                else_expr: { type: const, value: null }
            - - can_reduce_or_close
              - type: if
                condition: { type: exists, var: can_reduce_or_close }
                then_expr: { type: var, name: can_reduce_or_close }
                else_expr: { type: const, value: null }
            - - can_trade
              - type: if
                condition: { type: exists, var: can_trade }
                then_expr: { type: var, name: can_trade }
                else_expr: { type: const, value: null }
  response: single

api_key_update:
  method: PATCH
  path:
    - { type: literal, value: api }
    - { type: literal, value: api-keys }
    - { type: literal, value: allowed-ips }
  body:
    type: object
    fields:
      - - api_key
        - type: var
          name: id
      - - allowed_ips
        - type: var
          name: allowed_ips

api_key_delete:
  method: DELETE
  path:
    - { type: literal, value: api }
    - { type: literal, value: api-keys }
  query:
    type: object
    fields:
