# Architect Exchange — dual gateway on https://gateway.architect.exchange
# User/portfolio/marketdata → /api/...
# Order lifecycle → /orders/...
# Auth: Bearer ARCHITECT_EXCHANGE_TOKEN (mint via POST /api/authenticate; not modeled).

user_query:
  method: GET
  path:
    - { type: literal, value: api }
    - { type: literal, value: whoami }
  response: single

account_query:
  method: GET
  path:
    - { type: literal, value: api }
    - { type: literal, value: whoami }
  response:
    items: accounts

customer_query:
  method: GET
  path:
    - { type: literal, value: api }
