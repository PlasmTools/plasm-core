repo_search:
  method: GET
  path:
  - type: literal
    value: search
  - type: literal
    value: repositories
  response:
    items: items
  query:
    type: object
    fields:
    - - q
      - type: var
        name: q
    - - sort
      - type: if
        condition:
          type: exists
          var: sort
        then_expr:
          type: var
          name: sort
        else_expr:
          type: const
          value: null
    - - order
      - type: if
        condition:
          type: exists
          var: order
        then_expr:
          type: var
          name: order
        else_expr:
          type: const
          value: null
  pagination:
    params:
      page:
        counter: 1
        max: 33
      per_page:
        fixed: 30
        role: page_size
    strategy: page_number
user_repos_query:
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: auth_user_repos
    then_expr:
      type: const
      value: user/repos
    else_expr:
      type: if
      condition:
        type: equals
        left:
          type: var
          name: shelf
        right:
          type: const
          value: repo_forks
      then_expr:
        type: const
        value: repos/{owner}/{repo}/forks
      else_expr:
        type: if
        condition:
          type: equals
          left:
            type: var
            name: shelf
          right:
            type: const
            value: org_repos
        then_expr:
          type: const
          value: orgs/{org}/repos
        else_expr:
          type: if
          condition:
            type: equals
            left:
              type: var
              name: shelf
            right:
              type: const
              value: org_public_repos
          then_expr:
            type: const
            value: orgs/{org}/repos
          else_expr:
            type: const
            value: users/{username}/repos
  response: bare_list
  query:
    type: object
    fields:
    - - type
      - type: if
        condition:
          type: exists
          var: type
        then_expr:
          type: var
          name: type
        else_expr:
          type: const
          value: null
    - - sort
      - type: if
        condition:
          type: exists
          var: sort
        then_expr:
          type: var
          name: sort
        else_expr:
          type: const
          value: null
    - - direction
      - type: if
        condition:
          type: exists
          var: direction
        then_expr:
          type: var
          name: direction
        else_expr:
          type: const
          value: null
  pagination:
    params:
      page:
        counter: 1
      per_page:
        fixed: 30
        role: page_size
    strategy: page_number
