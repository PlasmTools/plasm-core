views:
  dashboard_summary:
    description: Compact dashboard overview without loading full panel JSON.
    capability: dashboard_summary_query
    entity: DashboardSummary
    scope:
    - name: dashboard_uid
      value_ref: nv_grafana_dashboard_uid
    nodes:
    - id: dash
      capability: dashboard_get
      bind:
        uid:
          kind: scope
          param: dashboard_uid
    output:
      uid:
        kind: scope
        param: dashboard_uid
      title:
        kind: node_field
        node: dash
        field: title
      description:
        kind: node_field
        node: dash
        field: description
      tags:
        kind: node_field
        node: dash
        field: tags
      folder_uid:
        kind: node_field
        node: dash
        field: folder_uid
      version:
        kind: node_field
        node: dash
        field: version
      schema_version:
        kind: node_field
        node: dash
        field: schema_version
    relation_outputs:
    - relation: dashboard
      target: Dashboard
      cardinality: one
      binding:
        kind: node_single_row
        node: dash
  deeplink_generate:
    description: Fetch appUrl and assemble navigation URL (dashboard, panel, or Explore).
    capability: deeplink_generate_query
    entity: NavigationLink
    scope:
    - name: resource_type
      value_ref: nv_grafana_deeplink_type
      required: true
    - name: dashboard_uid
      value_ref: nv_grafana_dashboard_uid
    - name: panel_id
      value_ref: nv_wire_int
    - name: datasource_uid
      value_ref: nv_grafana_datasource_uid
    - name: queries_json
      value_ref: nv_grafana_json_text
    - name: query_params_json
      value_ref: nv_grafana_json_text
    - name: from
      value_ref: nv_grafana_time_range
    - name: to
      value_ref: nv_grafana_time_range
    nodes:
    - id: frontend
      capability: frontend_settings_query
      bind: {}
    output:
      resource_type:
        kind: scope
        param: resource_type
      app_url:
        kind: node_field
        node: frontend
        field: app_url
      dashboard_uid:
        kind: scope
        param: dashboard_uid
      panel_id:
        kind: scope
        param: panel_id
      datasource_uid:
        kind: scope
        param: datasource_uid
      queries_json:
        kind: scope
        param: queries_json
      query_params_json:
        kind: scope
        param: query_params_json
      from:
        kind: scope
        param: from
      to:
        kind: scope
        param: to
      url:
        kind: computed
        template: '{%- set base = app_url | strip_trailing_slash -%}

          {%- if resource_type == ''dashboard'' -%}

          {{ base }}/d/{{ dashboard_uid }}{% if from or to or query_params_json %}?{%
          endif %}{% if from %}from={{ from | wire_time(''unix_ms'') }}{% endif %}{%
          if from and to %}&{% endif %}{% if to %}to={{ to | wire_time(''unix_ms'')
          }}{% endif %}{% if query_params_json %}{{ query_params_json | wire_query_suffix
          }}{% endif %}

          {%- elif resource_type == ''panel'' -%}

          {{ base }}/d/{{ dashboard_uid }}?viewPanel={{ panel_id }}{% if from or to
          or query_params_json %}&{% endif %}{% if from %}from={{ from | wire_time(''unix_ms'')
          }}{% endif %}{% if from and to %}&{% endif %}{% if to %}to={{ to | wire_time(''unix_ms'')
          }}{% endif %}{% if query_params_json %}{{ query_params_json | wire_query_suffix
          }}{% endif %}

          {%- elif resource_type == ''explore'' -%}

          {%- set left = ''{"datasource":'' ~ (datasource_uid | json_encode) -%}

          {%- if queries_json -%}

          {%- set left = left ~ '',"queries":'' ~ queries_json -%}

          {%- endif -%}

          {%- if from or to -%}

          {%- set left = left ~ '',"range":{'' -%}

          {%- if from -%}

          {%- set left = left ~ ''"from":'' ~ (from | wire_time(''unix_ms'') | json_encode)
          -%}

          {%- endif -%}

          {%- if from and to -%}

          {%- set left = left ~ '','' -%}

          {%- endif -%}

          {%- if to -%}

          {%- set left = left ~ ''"to":'' ~ (to | wire_time(''unix_ms'') | json_encode)
          -%}

          {%- endif -%}

          {%- set left = left ~ ''}'' -%}

          {%- endif -%}

          {%- set left = left ~ ''}'' -%}

          {{ base }}/explore?left={{ left | urlencode }}

          {%- else -%}

          {{ base }}

          {%- endif -%}

          '
auth:
  scheme: bearer_token
  env: GRAFANA_SERVICE_ACCOUNT_TOKEN
