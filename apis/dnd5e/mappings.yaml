proficiency_query:
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: class_proficiencies
    then_expr:
      type: const
      value: api/classes/{class_index}/proficiencies
    else_expr:
      type: if
      condition:
        type: equals
        left:
          type: var
          name: shelf
        right:
          type: const
          value: race_proficiencies
      then_expr:
        type: const
        value: api/races/{race_index}/proficiencies
      else_expr:
        type: if
        condition:
          type: equals
          left:
            type: var
            name: shelf
          right:
            type: const
            value: subrace_proficiencies
        then_expr:
          type: const
          value: api/subraces/{subrace_index}/proficiencies
        else_expr:
          type: const
          value: api/proficiencies
  query:
    type: object
    fields:
    - - class_index
      - type: if
        condition:
          type: exists
          var: class_index
        then_expr:
          type: var
          name: class_index
        else_expr:
          type: const
          value: null
    - - race_index
      - type: if
        condition:
          type: exists
          var: race_index
        then_expr:
          type: var
          name: race_index
        else_expr:
          type: const
          value: null
    - - subrace_index
      - type: if
        condition:
          type: exists
          var: subrace_index
        then_expr:
          type: var
          name: subrace_index
        else_expr:
          type: const
          value: null
