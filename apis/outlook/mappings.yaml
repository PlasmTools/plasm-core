mail_folder_child_query:
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: mail_folder_child
    then_expr:
      type: format
      template: v1.0/me/mailFolders/{mailFolderId}/childFolders
      vars:
        mailFolderId:
          type: var
          name: mailFolderId
    else_expr:
      type: const
      value: v1.0/me/mailFolders
  response:
    items: value
  query:
    type: object
    fields:
    - - includeHiddenFolders
      - type: var
        name: includeHiddenFolders
        if: { exists: includeHiddenFolders }
  pagination:
    location: response_next_url
    response_next_url_field: '@odata.nextLink'
    params:
      $top:
        fixed: 100
        role: page_size
    strategy: next_url
mail_folder_get:
  method: GET
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: mailFolders
  - type: var
    name: id
  response: single
message_folder_query:
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: message_folder
    then_expr:
      type: format
      template: v1.0/me/mailFolders/{mailFolderId}/messages
      vars:
        mailFolderId:
          type: var
          name: mailFolderId
    else_expr:
      type: const
      value: v1.0/me/messages
  response:
    items: value
  query:
    type: object
    fields:
    - - $filter
      - type: var
        name: filter
        if: { exists: filter }
    - - $orderby
      - type: var
        name: orderBy
        if: { exists: orderBy }
  pagination:
    location: response_next_url
    response_next_url_field: '@odata.nextLink'
    params:
      $top:
        fixed: 100
        role: page_size
    strategy: next_url
message_get:
  method: GET
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: messages
  - type: var
    name: id
  response: single
  query:
    type: object
    fields:
    - - $select
      - type: const
        value: id,subject,bodyPreview,body,internetMessageId,conversationId,parentFolderId,from,receivedDateTime,sentDateTime,hasAttachments,isDraft,isRead,importance,categories,webLink
message_create:
  method: POST
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: messages
  response: single
  body:
    type: object
    fields:
    - - subject
      - type: var
        name: subject
    - - body
      - type: object
        fields:
        - - contentType
          - type: if
            condition:
              type: exists
              var: bodyContentType
            then_expr:
              type: var
              name: bodyContentType
            else_expr:
              type: const
              value: html
        - - content
          - type: var
            name: bodyContent
    - - toRecipients
      - type: array
        elements:
        - type: object
          fields:
          - - emailAddress
            - type: object
              fields:
              - - address
                - type: var
                  name: toAddress
message_update:
  method: PATCH
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: messages
  - type: var
    name: id
  response: single
  body:
    type: object
    fields:
    - - isRead
      - type: var
        name: isRead
        if: { exists: isRead }
    - - importance
      - type: var
        name: importance
        if: { exists: importance }
    - - categories
      - type: var
        name: categories
        if: { exists: categories }
message_move:
