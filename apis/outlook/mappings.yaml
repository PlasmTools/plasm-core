event_get:
  method: GET
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: events
  - type: var
    name: id
  response: single
  query:
    type: object
    fields:
    - - $select
      - type: const
        value: id,subject,bodyPreview,start,end,location,isAllDay,isCancelled,organizer,webLink
event_create:
  method: POST
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: events
  response: single
  body:
    type: object
    fields:
    - - subject
      - type: var
        name: subject
    - - start
      - type: object
        fields:
        - - dateTime
          - type: var
            name: startDateTime
        - - timeZone
          - type: if
            condition:
              type: exists
              var: timeZone
            then_expr:
              type: var
              name: timeZone
            else_expr:
              type: const
              value: UTC
    - - end
      - type: object
        fields:
        - - dateTime
          - type: var
            name: endDateTime
        - - timeZone
          - type: if
            condition:
              type: exists
              var: timeZone
            then_expr:
              type: var
              name: timeZone
            else_expr:
              type: const
              value: UTC
    - - body
      - type: if
        condition:
          type: exists
          var: bodyContent
        then_expr:
          type: object
          fields:
          - - contentType
            - type: if
              condition:
                type: exists
                var: bodyContentType
              then_expr:
                type: var
                name: bodyContentType
              else_expr:
                type: const
                value: html
          - - content
            - type: var
              name: bodyContent
        else_expr:
          type: const
          value: null
    - - location
      - type: if
        condition:
          type: exists
          var: locationDisplayName
        then_expr:
          type: object
          fields:
          - - displayName
            - type: var
              name: locationDisplayName
        else_expr:
          type: const
          value: null
event_delete:
  method: DELETE
  path:
  - type: literal
    value: v1.0
  - type: literal
    value: me
  - type: literal
    value: events
  - type: var
    name: id
