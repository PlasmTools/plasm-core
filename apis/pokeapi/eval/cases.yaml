# NL eval cases for PokéAPI — scoped filter/aggregate and long-operation gates.
# Run: cargo run -p plasm-eval -- --schema apis/pokeapi --cases apis/pokeapi/eval/cases.yaml
#
# Live/MCP notes:
# - pk-01/pk-02 row filters run after `pokemon_query` fetch-all (paginated HTTP). Expect async long ops even with `.limit(10)`.
# - pk-03 (type → pokemon relation) is the fast live smoke; uses Type.pokemon prefer embed from type_get.
# - pk-05 is the intentional unbounded/async stress case.

- id: pk-01
  schema: pokeapi
  goal: "List Pokémon with base experience at least 300, sorted by experience descending, limit 10"
  tags: [query, filter, sort, limit]
  covers: [postfix_row_filter, postfix_sort, postfix_limit]
  expect:
    entities_any: [Pokemon]

- id: pk-02
  schema: pokeapi
  goal: "Count how many Pokémon have base experience at least 200"
  tags: [aggregate, filter]
  covers: [postfix_aggregate, postfix_row_filter]
  expect:
    entities_any: [Pokemon]

- id: pk-03
  schema: pokeapi
  goal: "List the first 5 electric-type Pokémon names via the electric type relation"
  tags: [get, relation, limit]
  covers: [get, relation_nav]
  expect:
    entities_any: [Type, Pokemon]

- id: pk-04
  schema: pokeapi
  goal: "Group Pokémon by whether they are default forms and count each group"
  tags: [group_by, aggregate]
  covers: [postfix_group_by, postfix_aggregate]
  expect:
    entities_any: [Pokemon]

- id: pk-05
  schema: pokeapi
  goal: "Fetch every Pokémon name with no limit"
  tags: [requires_force, unbounded]
  covers: [query_all]
  expect:
    entities_any: [Pokemon]
