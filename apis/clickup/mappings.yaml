team_create_space:
  response: single
  method: POST
  path:
  - type: literal
    value: v2
  - type: literal
    value: team
  - type: var
    name: team_id
  - type: literal
    value: space
  body:
    type: object
    fields:
    - - name
      - type: var
        name: name
    - - multiple_assignees
      - type: if
        condition:
          type: exists
          var: multiple_assignees
        then_expr:
          type: var
          name: multiple_assignees
        else_expr:
          type: const
          value: true
    - - features
      - type: if
        condition:
          type: exists
          var: features
        then_expr:
          type: var
          name: features
        else_expr:
          type: const
          value:
            due_dates:
              enabled: true
              start_date: false
              remap_due_dates: true
              remap_closed_due_date: false
            time_tracking:
              enabled: false
            tags:
              enabled: true
            time_estimates:
              enabled: true
            checklists:
              enabled: true
            custom_fields:
              enabled: true
            remap_dependencies:
              enabled: true
            dependency_warning:
              enabled: true
            portfolios:
              enabled: true
