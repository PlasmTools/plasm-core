team_member_query:
  response:
    items: members
    response_preprocess:
      kind: array_find_pluck
      path:
      - teams
      id_field: id
      id_var: team_id
      nested_array: members
  method: GET
  path:
  - type: if
    condition:
      type: equals
      left:
        type: var
        name: shelf
      right:
        type: const
        value: list_members
    then_expr:
      type: const
      value: v2/list/{list_id}/member
    else_expr:
      type: if
      condition:
        type: equals
        left:
          type: var
          name: shelf
        right:
          type: const
          value: task_member
      then_expr:
        type: const
        value: v2/task/{task_id}/member
      else_expr:
        type: const
        value: v2/team
  query:
    type: object
    fields:
    - - team_id
      - type: if
        condition:
          type: exists
          var: team_id
        then_expr:
          type: var
          name: team_id
        else_expr:
          type: const
          value: null
    - - list_id
      - type: if
        condition:
          type: exists
          var: list_id
        then_expr:
          type: var
          name: list_id
        else_expr:
          type: const
          value: null
    - - task_id
      - type: if
        condition:
          type: exists
          var: task_id
        then_expr:
          type: var
          name: task_id
        else_expr:
          type: const
          value: null
