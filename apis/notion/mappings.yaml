database_get:
  method: GET
  path:
  - type: literal
    value: v1
  - type: literal
    value: databases
  - type: var
    name: id
  headers:
    type: object
    fields:
    - - Notion-Version
      - type: const
        value: '2026-03-11'
database_query:
  method: POST
  path:
  - type: literal
    value: v1
  - type: if
    condition: &id001
      type: exists
      var: database_id
    then_expr:
      type: format
      template: databases/{database_id}/query
      vars:
        database_id:
          type: var
          name: database_id
    else_expr:
      type: const
      value: search
  body:
    type: if
    condition: *id001
    then_expr:
      type: object
      fields:
      - - page_size
        - type: var
          name: page_size
          if: { exists: page_size }
    else_expr:
      type: object
      fields:
      - - query
        - type: var
          name: query
          if: { exists: query }
      - - filter
        - type: object
          fields:
          - - property
            - type: const
              value: object
          - - value
            - type: const
              value: page
      - - sort
        - type: if
          condition:
            type: exists
            var: sort_direction
          then_expr:
            type: object
            fields:
            - - timestamp
              - type: const
                value: last_edited_time
            - - direction
              - type: var
                name: sort_direction
          else_expr:
            type: const
            value: null
      - - page_size
        - type: var
          name: page_size
          if: { exists: page_size }
  headers:
    type: object
    fields:
    - - Notion-Version
      - type: const
        value: '2026-03-11'
user_get:
  method: GET
  path:
  - type: literal
    value: v1
  - type: literal
    value: users
  - type: var
    name: id
  headers:
    type: object
    fields:
    - - Notion-Version
      - type: const
        value: '2026-03-11'
user_query:
  method: GET
  path:
  - type: literal
    value: v1
  - type: literal
    value: users
  pagination:
    params:
      start_cursor:
        from_response: next_cursor
      page_size:
        fixed: 100
        role: page_size
    stop_when:
      field: has_more
      eq: false
    strategy: cursor
  headers:
    type: object
    fields:
    - - Notion-Version
      - type: const
        value: '2026-03-11'
