name: MCP Surface Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-surfacecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surfacecheck:
    name: MCP surface check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upstream action.yml calls sentinel.py but the repo ships surfacecheck.py (v1 tag).
      - uses: actions/checkout@v4
        with:
          repository: major-matters/mcp-surfacecheck
          ref: v1
          path: .mcp-surfacecheck
      - name: MCP surface check
        run: |
          set -euo pipefail
          python3 .mcp-surfacecheck/surfacecheck.py --github-summary . >> "$GITHUB_STEP_SUMMARY"
          python3 .mcp-surfacecheck/surfacecheck.py --fail-on high .
