# Publishes MkDocs to GitHub Pages via Actions artifact.
#
# One-time per repository: Settings → Pages → Build and deployment → Source:
# **GitHub Actions**. If Source is still “Deploy from a branch”, deploy-pages
# fails with HTTP 404 when creating the deployment.
#
# Org repos: ensure Pages is allowed for the repo (org policy may disable it).

name: docs

on:
  push:
    branches: [main]
    paths:
      - "doc-site/**"
      - "skills/**"
      - "apis/README.md"
      - "scripts/guards/check_docs_contracts.sh"
      - "crates/plasm-core/**"
      - "fixtures/schemas/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "doc-site/**"
      - "skills/**"
      - "apis/README.md"
      - "scripts/guards/check_docs_contracts.sh"
      - "crates/plasm-core/**"
      - "fixtures/schemas/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r doc-site/requirements.txt

      - name: Check authoring skill projection
        run: python doc-site/scripts/sync_allowlisted_docs.py --check

      - name: Docs contract guard
        run: bash scripts/guards/check_docs_contracts.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fenced Plasm examples parse
        run: cargo test -p plasm-core doc_fenced_plasm_examples_parse_under_language_matrix -- --nocapture

      - name: Build site
        run: mkdocs build --strict -f doc-site/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: doc-site/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
