[package]
name = "plasm"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Open-source `plasm-mcp` / `plasm` (HTTP terminal) / `plasm-pack-catalogs` and `plasm_agent` re-exports of plasm-agent-core"
readme = "README.md"

[features]
default = []
# Local-only: allow bootstrap secrets from process env when `PLASM_SECRETS_DIR` is unset (never enable for k8s images).
local_env_bootstrap_secrets = ["plasm-agent-core/local_env_bootstrap_secrets"]
# Forward to plasm-compile for EVM-backed schemas (e.g. apis/evm-erc20).
evm = ["plasm-agent-core/evm"]
# OSS appliance: bundle pg-embed; autostart unless `PLASM_EMBEDDED_POSTGRES=0` or external Postgres URLs (see `embedded_postgres`).
embedded_postgres = ["dep:pg-embed", "dep:libc"]

[lib]
name = "plasm_agent"
path = "src/lib.rs"

[[bin]]
name = "plasm-mcp"
path = "src/bin/plasm_mcp.rs"

[[bin]]
name = "plasm"
path = "src/bin/plasm.rs"

[[bin]]
name = "plasm-pack-catalogs"
path = "src/bin/plasm_pack_catalogs.rs"

[dependencies]
plasm-agent-core = { path = "../plasm-agent-core", default-features = false }
plasm-core = { path = "../plasm-core" }
plasm-compile = { path = "../plasm-compile" }
plasm-runtime = { path = "../plasm-runtime" }
plasm-trace = { path = "../plasm-trace" }
plasm-otel = { path = "../plasm-otel" }
arc-swap = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
indexmap = { workspace = true }
http-problem = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
toon = { workspace = true }
rust-mcp-sdk = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
pg-embed = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true, features = ["json"] }
jsonwebtoken = { workspace = true }
auth-framework = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_urlencoded = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
sqlx = { workspace = true, features = ["postgres"] }
tower = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
plasm-core = { path = "../plasm-core" }
plasm-runtime = { path = "../plasm-runtime" }
