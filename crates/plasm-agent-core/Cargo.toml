[package]
name = "plasm-agent-core"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
build = "build.rs"

[features]
default = []
# Heap profiling integration test (`tests/plasm_plan_run_alloc_budget.rs`).
alloc-bench = []
# Local-only: allow bootstrap secrets from process env when `PLASM_SECRETS_DIR` is unset (never enable for k8s images).
local_env_bootstrap_secrets = []
# Forward to plasm-compile for EVM-backed schemas (e.g. apis/evm-erc20).
evm = ["plasm-compile/evm"]
# Intent-only plasm_context: semantic seed-set selector (requires OPENROUTER_API_KEY).
semantic-auto-seed = ["dep:plasm-semantic-seed", "plasm-semantic-seed/baml"]

[lib]
name = "plasm_agent_core"
path = "src/lib.rs"

[dependencies]
plasm-core = { path = "../plasm-core" }
plasm-evidence = { path = "../plasm-evidence", features = ["signatures"] }
plasm-discovery = { path = "../plasm-discovery", default-features = false }
plasm-compile = { path = "../plasm-compile" }
plasm-runtime = { path = "../plasm-runtime" }
plasm-trace = { path = "../plasm-trace" }
plasm-trace-wire = { path = "../plasm-trace-wire" }
plasm-otel = { path = "../plasm-otel" }
plasm-semantic-seed = { path = "../plasm-semantic-seed", optional = true }
arc-swap = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
indexmap = { workspace = true }
http-problem = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
toon = { workspace = true }
rust-mcp-sdk = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
subtle = { workspace = true }
# Upstream QuickStart references `.postgres()` without `cfg(feature)`; compile needs `postgres-storage`
# even when we only use `InMemoryStorage` at runtime (see auth_framework::storage::memory).
auth-framework = { workspace = true }
sqlx = { workspace = true, features = ["migrate", "chrono", "uuid"] }
sqlx-tracing = { workspace = true }
opentelemetry = { workspace = true }
minijinja = { version = "2.19.0", default-features = false, features = ["builtins", "serde"] }
futures = { workspace = true }
redis = { workspace = true }
dashmap = { workspace = true }

[dev-dependencies]
plasm-otel = { path = "../plasm-otel", features = ["testing"] }
dhat = "0.3"
tempfile = { workspace = true }
insta = { workspace = true, features = ["json"] }
jsonwebtoken = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde_urlencoded = { workspace = true }
testcontainers-modules = { workspace = true }
tower = { workspace = true }
shuttle = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
