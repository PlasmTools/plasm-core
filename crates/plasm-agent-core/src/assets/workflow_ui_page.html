<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Workflow</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #171a22;
      --border: #2a3140;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #6ea8ff;
      --ok: #3ecf8e;
      --warn: #f5a623;
      --danger: #ff6b6b;
      --canvas-bg: oklch(0.12 0.02 260 / 0.9);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .shell { padding: 16px; display: grid; gap: 16px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    h1 { font-size: 1.1rem; margin: 0; }
    label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); }
    select, input, textarea, button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    button {
      cursor: pointer;
      background: #1f2937;
    }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 0.95rem; }
    .field { margin-bottom: 10px; }
    .status { font-size: 0.8rem; color: var(--muted); }
    .banner {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }
    .banner.error { border-color: var(--danger); color: #ffb4b4; }
    .plan-panel { display: grid; gap: 12px; }
    .plan-review-banner {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .plan-review-banner.ok { border-color: var(--ok); }
    .plan-review-banner.review { border-color: var(--warn); }
    .plan-review-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
    }
    .plan-review-verdict { font-weight: 600; }
    .plan-review-banner.ok .plan-review-verdict { color: var(--ok); }
    .plan-review-banner.review .plan-review-verdict { color: var(--warn); }
    .plan-review-metrics { color: var(--muted); font-size: 0.8rem; }
    .plan-review-warnings, .plan-review-gates {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .plan-canvas-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(200px, 260px);
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .plan-canvas-layout { grid-template-columns: 1fr; }
    }
    .plan-column-headers {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }
    .plan-column-header {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      border: 1px solid rgba(110, 168, 255, 0.35);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .plan-canvas-host {
      position: relative;
      min-height: 14rem;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--canvas-bg);
      padding: 8px;
    }
    .plan-canvas-error,
    .plan-canvas-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      font-size: 0.8rem;
      color: #ffb4b4;
    }
    .plan-canvas-loading { color: var(--muted); }
    .plan-inspector {
      min-height: 14rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      padding: 12px;
      font-size: 0.82rem;
    }
    .plan-inspector-empty { color: var(--muted); margin: 0; }
    .plan-inspector-body { display: grid; gap: 6px; }
    .plan-inspector-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: baseline;
      margin: 0;
    }
    .plan-inspector-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(248, 250, 255, 0.92);
    }
    .plan-inspector-ir {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .plan-inspector-kind { color: var(--muted); font-size: 0.75rem; }
    .plan-inspector-badge {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 4px;
      padding: 2px 6px;
      border: 1px solid;
    }
    .plan-inspector-badge.return {
      color: oklch(0.88 0.06 290);
      border-color: oklch(0.62 0.12 290 / 0.45);
      background: oklch(0.22 0.06 290 / 0.55);
    }
    .plan-inspector-badge.gate {
      color: var(--warn);
      border-color: rgba(245, 166, 35, 0.45);
      background: rgba(245, 166, 35, 0.12);
    }
    .plan-inspector-op { margin: 0; color: rgba(230, 236, 248, 0.85); line-height: 1.4; }
    .plan-inspector-meta, .plan-inspector-deps {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      word-break: break-word;
    }
    details.program-source {
      margin-top: 8px;
      font-size: 0.8rem;
    }
    details.program-source pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.72rem;
      background: #0b0d12;
      padding: 10px;
      border-radius: 8px;
      max-height: 200px;
      overflow: auto;
      margin: 8px 0 0;
    }
  </style>
  <script type="module" src="/v1/workflows/ui/app.js?v=5f3366bcb989"></script>
  <style>

display:grid;gap:8px}.plan-inspector-head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:0}.plan-inspector-id{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#f8faffeb;font-size:.82rem}.plan-inspector-ir{font-family:ui-monospace,monospace;font-size:.68rem;color:var(--muted, #9aa3b5)}.plan-inspector-kind{color:var(--muted, #9aa3b5);font-size:.72rem}.plan-inspector-badge{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:2px 6px;border:1px solid}.plan-inspector-badge.return{color:#d6d2fd;border-color:#8678c973;background:#1b14348c}.plan-inspector-badge.gate{color:var(--warn, #f5a623);border-color:#f5a62373;background:#f5a6231f}.plan-inspector-table{display:grid;grid-template-columns:auto 1fr;gap:.35rem .65rem;margin:0;font-size:.75rem}.plan-inspector-table dt{margin:0;color:var(--muted, #9aa3b5);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding-top:.15rem}.plan-inspector-table dd{margin:0;min-width:0}.plan-inspector-op-code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:.7rem;line-height:1.35;white-space:pre-wrap;word-break:break-word;color:#e6ecf8e0}.plan-inspector-widget-chip,.plan-inspector-effect{display:inline-block;font-size:.65rem;padding:.1rem .45rem;border-radius:var(--radius-chip, 999px);border:1px solid var(--border, #2a3140);background:#0c121a}.plan-inspector-dep-chip{font-family:ui-monospace,monospace}details.program-source{margin-top:6px;font-size:.75rem}details.program-source pre{white-space:pre-wrap;word-break:break-word;font-size:.68rem;background:#0b0d12;padding:8px;border-radius:8px;max-height:160px;overflow:auto;margin:6px 0 0}

</style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 id="title">Plasm Workflow</h1>
        <div class="status" id="status">Initializing…</div>
      </div>
      <label>Workflow
        <select id="workflow-id"></select>
      </label>
      <button class="primary" id="open-btn">Open session</button>
      <button id="dry-btn" disabled>Dry-run plan</button>
      <button id="run-btn" disabled>Run</button>
    </header>
    <div id="readiness" class="banner error" hidden></div>
    <div class="grid">
      <section class="panel">
        <h2>Parameters</h2>
        <form id="param-form"></form>
      </section>
      <section class="panel plan-panel">
        <h2>Plan canvas</h2>
        <div id="review-banner" class="plan-review-banner" hidden></div>
        <div id="column-headers" class="plan-column-headers" hidden></div>
        <div class="plan-canvas-layout">
          <div id="plan-canvas-host" class="plan-canvas-host">
            <p class="plan-inspector-empty">Dry-run a workflow to render the Program DAG.</p>
          </div>
          <div id="plan-inspector" class="plan-inspector">
            <p class="plan-inspector-empty">Select a plan step to inspect.</p>
          </div>
        </div>
        <details class="program-source" id="program-details" hidden>
          <summary>Program source</summary>
          <pre id="program"></pre>
        </details>
      </section>
    </div>
  </div>
</body>
</html>
