<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Run Explorer</title>
  <script type="module" src="/v1/run/ui/app.js?v=be616f456b73"></script>
  <style>
:root{color-scheme:dark;--bg: oklch(.14 .02 260);--panel: oklch(.17 .025 260);--border: oklch(.28 .03 260);--text: oklch(.93 .01 260);--muted: oklch(.68 .02 260);--accent: oklch(.58 .233 277);--ok: oklch(.72 .17 155);--warn: oklch(.78 .14 75);--danger: oklch(.65 .2 25);--canvas-bg: oklch(.12 .02 260 / .9);--radius-panel: 8px;--radius-chip: 999px;font-family:Geist,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.run-shell{display:grid;grid-template-rows:auto auto auto 1fr;gap:10px;padding:16px;min-height:100vh}.run-header h1{margin:0;font-size:.95rem;font-weight:600}.run-telemetry{font-size:.78rem;color:var(--muted);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;margin-top:4px}.run-status{font-size:.8rem;color:var(--muted);margin-top:2px}.run-op-strip{font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.75rem;color:var(--text);background:#03060d;border:1px solid var(--border);border-radius:var(--radius-panel);padding:8px 10px;display:grid;gap:4px}.run-op-line{color:var(--muted)}.run-op-line:last-child{color:var(--text)}.run-program-details{font-size:.8rem;color:var(--muted)}.run-program-details summary{cursor:pointer}.run-program-excerpt{margin:8px 0 0;padding:10px 12px;border-radius:var(--radius-panel);background:#03060d;border:1px solid var(--border);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.76rem;line-height:1.45;white-space:pre-wrap;overflow-x:auto}.run-layout{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:12px;min-height:0}@media(max-width:720px){.run-layout{grid-template-columns:1fr}}.run-step-rail,.run-table-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-panel);padding:12px;min-height:200px}.run-step-list{display:grid;gap:6px}.run-step-btn{display:grid;gap:2px;text-align:left;width:100%;padding:8px 10px;border-radius:var(--radius-panel);border:1px solid var(--border);border-left:3px solid transparent;background:#050911;color:var(--text);cursor:pointer;font:inherit}.run-step-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.run-step-btn.active{border-left-color:var(--accent);background:#605dff1a}.run-step-title{font-size:.85rem;font-weight:600}.run-step-display{font-size:.72rem;color:var(--muted);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace}.run-step-meta{font-size:.72rem;color:var(--muted)}.run-badge{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:var(--radius-chip);background:#202938;color:var(--muted);margin-right:4px;width:fit-content}.run-badge.warn{background:#eba94126;color:var(--warn)}.run-badge.ok{background:#22c3731f;color:var(--ok)}.run-table-wrap{overflow:auto;max-height:calc(100vh - 180px)}.run-table{width:100%;border-collapse:collapse;font-size:.78rem}.run-table th,.run-table td{border-bottom:1px solid var(--border);padding:.45rem .55rem;text-align:left;vertical-align:top}.run-table th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;z-index:1}.run-cell-index{color:var(--muted);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;width:2rem}.run-cell-muted{color:var(--muted);font-style:italic}.run-table-footer{margin-top:8px;font-size:.72rem;color:var(--muted)}.run-empty,.run-loading,.run-error{font-size:.85rem;color:var(--muted)}.run-skeleton{animation:run-pulse 1.2s ease-in-out infinite}@keyframes run-pulse{0%,to{opacity:.55}50%{opacity:1}}.run-error{color:var(--danger)}

</style>
</head>
<body>
  <div class="run-shell">
    <header class="run-header">
      <h1>Run Explorer</h1>
      <div class="run-telemetry" id="telemetry-header" aria-live="polite">—</div>
      <div class="run-status" id="status" aria-live="polite">Initializing…</div>
    </header>
    <div class="run-op-strip" id="op-strip" hidden aria-live="polite"></div>
    <details id="program-details" class="run-program-details" hidden>
      <summary>Program (from host)</summary>
      <pre id="program-excerpt" class="run-program-excerpt"></pre>
    </details>
    <div class="run-layout">
      <aside class="run-step-rail" id="step-rail" aria-label="Node results"></aside>
      <section class="run-table-panel" id="table-host" aria-label="Entity rows">
        <p class="run-empty">Waiting for run results from host…</p>
      </section>
    </div>
  </div>
</body>
</html>
