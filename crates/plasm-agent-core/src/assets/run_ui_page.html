<!DOCTYPE html>

radius:var(--radius-panel);padding:6px 8px;display:grid;gap:3px}.run-op-line{color:var(--muted)}.run-op-line:last-child{color:var(--text)}.run-op-strip[hidden]{display:none}.run-program-details{font-size:.75rem;color:var(--muted)}.run-program-details summary{cursor:pointer}.run-program-excerpt{margin:6px 0 0;padding:8px 10px;border-radius:var(--radius-panel);background:#03060d;border:1px solid var(--border);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.72rem;line-height:1.35;white-space:pre-wrap;overflow-x:auto}.run-program-review{margin:8px 0 0;padding:8px 10px;border-radius:var(--radius-panel);border:1px solid oklch(.55 .12 85 / .45);background:#19100040;background:oklch(.18 .04 85 / .25);color:var(--text);font-size:.72rem;line-height:1.4}.run-program-review[hidden]{display:none}.run-dag-panel{display:grid;grid-template-columns:1fr;gap:8px;padding:4px 0 6px;border-bottom:1px solid oklch(.28 .03 260 / .35)}.run-dag-panel[hidden]{display:none}@media(min-width:720px){.run-dag-panel{grid-template-columns:minmax(0,1fr) minmax(160px,220px)}}.run-dag-host{min-height:0;overflow:auto}.run-dag-panel:not([hidden]) .run-dag-host{min-height:100px}.run-dag-host svg{display:block;max-width:100%}.run-dag-inspector{border-top:1px solid var(--border);padding-top:8px;font-size:.75rem}@media(min-width:720px){.run-dag-inspector{border-top:none;border-left:1px solid var(--border);padding-top:0;padding-left:8px}}.run-dag-inspector-title{margin:0 0 4px;font-weight:600}.run-dag-inspector-op{display:block;font-size:.68rem;margin-bottom:6px;word-break:break-word}.run-dag-phase{display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:999px;border:1px solid var(--border)}.run-dag-phase-queued{color:var(--muted)}.run-dag-phase-running{color:var(--accent);border-color:#605dff73}.run-dag-phase-done{color:#43c07a;border-color:#43c07a59}.run-dag-node-pulse{animation:run-dag-pulse 1.2s ease-in-out infinite}@keyframes run-dag-pulse{0%,to{opacity:.35}50%{opacity:1}}.run-progress-title{margin:0 0 6px;font-size:.82rem;font-weight:600}.run-layout{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}@media(min-width:720px){.run-layout:not(.run-layout--single){display:grid;grid-template-columns:minmax(160px,200px) 1fr;grid-template-rows:1fr}}.run-layout--single .run-step-rail{display:none}.run-step-rail{min-height:0;padding:2px 0 4px}.run-step-rail[hidden]{display:none}.run-table-panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:0}.run-step-list{display:flex;flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px}@media(min-width:720px){.run-step-list{flex-direction:column;overflow-x:visible}}.run-step-btn{display:grid;gap:2px;text-align:left;flex:0 0 auto;min-width:8.5rem;max-width:14rem;padding:6px 8px;border-radius:var(--radius-panel);border:1px solid var(--border);border-left:3px solid transparent;background:#050911;color:var(--text);cursor:pointer;font:inherit}@media(min-width:720px){.run-step-btn{width:100%;max-width:none}}.run-step-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.run-step-btn.active{border-left-color:var(--accent);background:#605dff1a}.run-step-title{font-size:.8rem;font-weight:600}.run-step-display{font-size:.68rem;color:var(--muted);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace}.run-step-meta{font-size:.68rem;color:var(--muted)}.run-badge{display:inline-block;font-size:.6rem;padding:1px 5px;border-radius:var(--radius-chip);background:#202938;color:var(--muted);margin-right:4px;width:fit-content}.run-badge.warn{background:#eba94126;color:var(--warn)}.run-badge.ok{background:#22c3731f;color:var(--ok)}.run-table-wrap{overflow:auto;flex:1;min-height:0;max-height:none}.run-table th:first-child,.run-table td.run-cell-index{max-width:2rem;width:2rem}.run-table td.run-cell-num{text-align:right;font-variant-numeric:tabular-nums;max-width:4.5rem}.run-cell-index{color:var(--muted);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace}.run-cell-muted{color:var(--muted);font-style:italic}.run-table-footer{margin-top:6px;font-size:.68rem;color:var(--muted)}.run-empty,.run-loading,.run-error{font-size:.8rem;color:var(--muted)}.run-skeleton{animation:run-pulse 1.2s ease-in-out infinite}@keyframes run-pulse{0%,to{opacity:.55}50%{opacity:1}}.run-error{color:var(--danger)}.run-degraded-banner{margin-bottom:8px;font-size:.78rem}.run-degraded-preview{margin-bottom:8px}.run-snapshot-uri{margin-top:4px;font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.65rem;word-break:break-all}.run-detail-layout{display:flex;flex-direction:column;gap:10px}.run-detail-card{border:1px solid var(--border);border-radius:var(--radius-panel);padding:8px 10px;background:#02040b}.run-detail-card-title{margin:0 0 6px;font-size:.78rem;font-weight:600}.run-detail-fields{margin:0;display:grid;gap:6px}.run-detail-fields dt{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.run-detail-fields dd{margin:0 0 4px}.run-cell-markdown.mcp-markdown{max-height:none;overflow:visible}

</style>
</head>
<body>
  <div class="run-shell" id="run-shell">
    <header class="run-header">
      <h1>Run Explorer</h1>
      <div class="run-header-row">
        <div class="run-telemetry" id="telemetry-header" aria-live="polite">—</div>
        <button type="button" class="run-session-ref" id="session-ref" title="Copy session ref" hidden></button>
      </div>
      <div class="run-status" id="status" aria-live="polite">Initializing…</div>
    </header>
    <div class="run-op-strip" id="op-strip" hidden aria-live="polite"></div>
    <details id="program-details" class="run-program-details" hidden>
      <summary>Program (from host)</summary>
      <pre id="program-excerpt" class="run-program-excerpt"></pre>
      <p id="program-review-warnings" class="run-program-review" hidden aria-live="polite"></p>
    </details>
    <section class="run-dag-panel" id="dag-panel" aria-label="Plan execution" hidden>
      <div id="dag-host" class="run-dag-host"></div>
      <div id="dag-inspector" class="run-dag-inspector">
        <p class="run-empty">Select a plan step to inspect.</p>
      </div>
    </section>
    <div class="run-layout" id="run-layout">
      <aside class="run-step-rail" id="step-rail" aria-label="Node results" hidden></aside>
      <section class="run-table-panel" id="table-host" aria-label="Entity rows">
        <p class="run-empty">Waiting for run results from host…</p>
      </section>
    </div>
  </div>
</body>
</html>
