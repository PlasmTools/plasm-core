<body>
  <div class="plan-shell">
    <header class="plan-header">
      <h1 class="plan-header-title" id="view-title">Plan Review</h1>
      <div class="plan-header-row">
        <button type="button" class="plan-commit-ref" id="plan-commit-ref" hidden title="Plan commit ref for plasm_run">—</button>
        <button type="button" class="plan-session-ref" id="session-ref" title="Logical session">—</button>
        <div id="review-inline" class="plan-review-inline" hidden aria-live="polite"></div>
      </div>
      <p class="plan-status" id="status" aria-live="polite">Initializing…</p>
      <div class="plan-tabs" role="tablist">
