<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Plan Review</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 100%;
    }
    .plan-program-details {
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid oklch(0.28 0.03 260 / 0.55);
      padding-top: 6px;
      flex-shrink: 0;
    }
    .plan-program-details summary { cursor: pointer; }
    .plan-program-excerpt {
      margin: 6px 0 0;
      padding: 8px 10px;
      border-radius: var(--radius-panel);
      background: oklch(0.12 0.02 260);
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .plan-run-banner {
      font-size: 0.75rem;
      color: var(--accent);
      padding: 4px 8px;
      border-radius: var(--radius-panel);
      border: 1px solid oklch(0.58 0.233 277 / 0.35);
      background: oklch(0.58 0.233 277 / 0.08);
      flex-shrink: 0;
    }
    .plan-run-banner[hidden] { display: none; }
    #approval-slot { display: none; }
  </style>

<body>
  <div class="plan-shell">
    <header class="plan-header">
      <h1 class="plan-header-title">Plan Review</h1>
      <div class="plan-header-row">
        <button type="button" class="plan-commit-ref" id="plan-commit-ref" hidden title="Plan commit ref for plasm_run">—</button>
        <button type="button" class="plan-session-ref" id="session-ref" title="Logical session">—</button>
        <div id="review-inline" class="plan-review-inline" hidden aria-live="polite"></div>
      </div>
      <p class="plan-status" id="status" aria-live="polite">Initializing…</p>
      <div class="plan-tabs" role="tablist">
        <button type="button" id="tab-plan" class="plan-tab" role="tab" aria-selected="true" aria-controls="panel-plan">Plan</button>
        <button type="button" id="tab-flow" class="plan-tab" role="tab" aria-selected="false" aria-controls="panel-flow">Flow</button>
      </div>
    </header>
    <div id="run-banner" class="plan-run-banner" hidden>Live execution started — see Run Explorer</div>
    <main class="plan-main">
      <div id="panel-plan" class="plan-tab-panel" role="tabpanel" aria-labelledby="tab-plan">
        <div id="column-headers" class="plan-column-headers" hidden></div>
        <div class="plan-dag-row">
          <div id="plan-canvas-host" class="plan-canvas-host">
            <p class="plan-inspector-empty">Waiting for plan from host…</p>
          </div>
          <aside id="plan-inspector" class="plan-inspector">
            <p class="plan-inspector-empty">Select a step.</p>
          </aside>
        </div>
        <details id="program-details" class="plan-program-details" hidden>
          <summary>Program (from host)</summary>
          <pre id="program-excerpt" class="plan-program-excerpt"></pre>
        </details>
      </div>
      <div id="panel-flow" class="plan-tab-panel" role="tabpanel" aria-labelledby="tab-flow" hidden>
        <div id="plan-flow-host" class="plan-flow-panel">
          <p class="plan-inspector-empty">Waiting for plan from host…</p>
        </div>
      </div>
    </main>
  </div>
