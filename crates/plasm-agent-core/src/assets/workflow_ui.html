<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Workflow</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .shell { padding: 8px 10px; display: grid; gap: 10px; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    h1 { font-size: 1rem; margin: 0; }
    label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); }
    select, input, textarea, button {
      background: oklch(0.17 0.025 260);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-panel);
      padding: 8px 10px;
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: oklch(0.45 0.18 277);
      border-color: oklch(0.52 0.2 277);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 10px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: oklch(0.15 0.02 260);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      padding: 10px 12px;
    }
    .panel h2 { margin: 0 0 10px; font-size: 0.95rem; }
    .field { margin-bottom: 10px; }
    .status { font-size: 0.75rem; color: var(--muted); }
    .banner {
      padding: 8px 10px;
      border-radius: var(--radius-panel);
      font-size: 0.82rem;
      border: 1px solid var(--border);
    }
    .banner.error { border-color: var(--danger); color: #ffb4b4; }
    .plan-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      padding-bottom: 8px;
    }
    .plan-section .plan-header {
      border-bottom: 1px solid oklch(0.28 0.03 260 / 0.55);
      padding-bottom: 6px;
    }
    .plan-section .plan-header-title {
      margin: 0;
    }
    .plan-section .plan-main {
      flex: 1;
      min-height: 0;
    }
    .plan-section .plan-dag-row {
      min-height: 12rem;
    }
    details.program-source {
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid oklch(0.28 0.03 260 / 0.55);
      padding-top: 6px;
      flex-shrink: 0;
    }
    details.program-source summary { cursor: pointer; }
  </style>

<body>
  <div class="shell">
    <header>
      <div>
        <h1 id="title">Plasm Workflow</h1>
        <div class="status" id="status">Initializing…</div>
      </div>
      <label>Workflow
        <select id="workflow-id"></select>
      </label>
      <button class="primary" id="open-btn">Open session</button>
      <button id="dry-btn" disabled>Dry-run plan</button>
      <button id="run-btn" disabled>Run</button>
    </header>
    <div id="readiness" class="banner error" hidden></div>
    <div class="grid">
      <section class="panel">
        <h2>Parameters</h2>
        <form id="param-form"></form>
      </section>
      <section class="panel plan-section">
        <header class="plan-header">
          <h2 class="plan-header-title">Plan canvas</h2>
          <div class="plan-header-row">
            <div id="review-inline" class="plan-review-inline" hidden aria-live="polite"></div>
          </div>
        </header>
        <main class="plan-main">
          <div id="column-headers" class="plan-column-headers" hidden></div>
          <div class="plan-dag-row">
            <div id="plan-canvas-host" class="plan-canvas-host">
              <p class="plan-inspector-empty">Dry-run a workflow to render the Program DAG.</p>
            </div>
            <aside id="plan-inspector" class="plan-inspector">
              <p class="plan-inspector-empty">Select a step.</p>
            </aside>
          </div>
          <details id="program-details" class="plan-program-details program-source" hidden>
            <summary>Program source</summary>
            <pre id="program" class="plan-program-excerpt"></pre>
          </details>
        </main>
      </section>
    </div>
  </div>
