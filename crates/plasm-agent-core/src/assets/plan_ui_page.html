<body>
  <div class="plan-shell">
    <header class="plan-header">
      <h1 class="plan-header-title" id="view-title">Plan Review</h1>
      <div class="plan-header-row">
        <button type="button" class="plan-commit-ref" id="plan-commit-ref" hidden title="Plan commit ref for plasm_run">—</button>
        <button type="button" class="plan-session-ref" id="session-ref" title="Logical session">—</button>
        <div id="review-inline" class="plan-review-inline" hidden aria-live="polite"></div>
      </div>
      <p class="plan-status" id="status" aria-live="polite">Initializing…</p>
      <div class="plan-tabs" role="tablist">
        <button type="button" id="tab-results" class="plan-tab" role="tab" aria-selected="false" aria-controls="panel-results" hidden>Results</button>
        <button type="button" id="tab-plan" class="plan-tab" role="tab" aria-selected="true" aria-controls="panel-plan">Plan</button>
        <button type="button" id="tab-python" class="plan-tab" role="tab" aria-selected="false" aria-controls="panel-python">Python</button>
        <button type="button" id="tab-flow" class="plan-tab" role="tab" aria-selected="false" aria-controls="panel-flow">Policy</button>
      </div>
    </header>
    <div id="run-banner" class="plan-run-banner" hidden>Live execution started — see Run Explorer</div>
    <main class="plan-main">
      <div id="panel-results" class="plan-tab-panel" role="tabpanel" aria-labelledby="tab-results" hidden>
        <div class="run-layout" id="run-layout">
          <aside class="run-step-rail" id="step-rail" aria-label="Node results" hidden></aside>
          <section class="run-table-panel" id="table-host" aria-label="Entity rows"></section>
        </div>
      </div>
      <div id="panel-plan" class="plan-tab-panel" role="tabpanel" aria-labelledby="tab-plan">
        <div id="column-headers" class="plan-column-headers" hidden></div>
        <div class="plan-dag-row">
          <div id="plan-canvas-host" class="plan-canvas-host">
            <p class="plan-inspector-empty">Waiting for tool result from host…</p>
          </div>
          <aside id="plan-inspector" class="plan-inspector">
            <p class="plan-inspector-empty">Select a step.</p>
          </aside>
        </div>
      </div>
      <div id="panel-python" class="plan-tab-panel evidence-source-panel" role="tabpanel" aria-labelledby="tab-python" hidden>
        <details id="program-details" class="plan-program-details" open hidden>
          <summary>Submitted Python</summary>
          <button type="button" id="copy-source" class="plan-tab">Copy source</button>
          <pre id="program-excerpt" class="plan-program-excerpt"></pre>
        </details>
        <p class="source-unavailable plan-inspector-empty">Original source was not supplied to this view.</p>
      </div>
      <div id="panel-flow" class="plan-tab-panel" role="tabpanel" aria-labelledby="tab-flow" hidden>
        <div id="plan-flow-host" class="plan-flow-panel">
          <p class="plan-inspector-empty">Waiting for tool result from host…</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
