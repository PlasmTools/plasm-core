<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Plan Review</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .shell { padding: 16px; display: grid; gap: 12px; }
    .plan-meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: baseline;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .plan-meta-strip h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .plan-meta-strip dl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 0;
    }
    .plan-meta-strip dt { font-weight: 500; }
    .plan-meta-strip dd { margin: 0; color: var(--text); }
    #approval-slot { margin-left: auto; }
    .plan-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .plan-program-details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .plan-program-details summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .plan-program-excerpt {
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: var(--radius-panel);
      background: oklch(0.12 0.02 260);
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .plan-run-banner {
      font-size: 0.8rem;
      color: var(--accent);
      padding: 6px 10px;
      border-radius: var(--radius-panel);
      border: 1px solid oklch(0.58 0.233 277 / 0.35);
      background: oklch(0.58 0.233 277 / 0.08);
    }
    .plan-run-banner[hidden] { display: none; }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status[aria-live] { min-height: 1.2em; }
  </style>
  <script type="module" src="/v1/plan/ui/app.js?v=195b33218e81"></script>
  <style>
:root{color-scheme:dark;--bg: oklch(.14 .02 260);--panel: oklch(.17 .025 260);--border: oklch(.28 .03 260);--text: oklch(.93 .01 260);--muted: oklch(.68 .02 260);--accent: oklch(.58 .233 277);--ok: oklch(.72 .17 155);--warn: oklch(.78 .14 75);--danger: oklch(.65 .2 25);--canvas-bg: oklch(.12 .02 260 / .9);--radius-panel: 8px;--radius-chip: 999px;--mcp-frame-width: 390px;--mcp-frame-max-height: 100dvh;font-family:Geist,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.mcp-ref-chip{display:inline-flex;align-items:baseline;gap:.2rem;font-size:.68rem;line-height:1.3;padding:.1rem .45rem;border-radius:var(--radius-chip);border:1px solid oklch(.38 .04 260);background:#0f1621;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mcp-ref-chip-type{color:var(--accent);font-weight:600}.mcp-ref-chip-slot{color:var(--text);font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace}.mcp-cell-chips{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}.mcp-chip-more{font:inherit;font-size:.62rem;padding:.1rem .4rem;border-radius:var(--radius-chip);border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer}.mcp-bool-pill{display:inline-block;font-size:.65rem;padding:.05rem .4rem;border-radius:var(--radius-chip);border:1px solid var(--border);color:var(--muted)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.mcp-markdown{max-height:12rem;overflow:auto;white-space:normal;font-size:.8rem;line-height:1.45}.mcp-markdown h1,.mcp-markdown h2,.mcp-markdown h3{margin:.4em 0 .25em;font-size:.95rem;font-weight:600}.mcp-markdown p{margin:.35em 0}.mcp-markdown ul,.mcp-markdown ol{margin:.35em 0;padding-left:1.2em}.mcp-markdown code{font-family:JetBrains Mono,ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:.85em;background:#050911;padding:.1em .35em;border-radius:3px}.mcp-entity-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:.72rem;table-layout:fixed}.mcp-entity-table th,.mcp-entity-table td{border-bottom:1px solid var(--border);padding:.28rem .45rem;text-align:left;vertical-align:top;line-height:1.35;max-width:12rem;overflow:hidden}.mcp-entity-table th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;z-index:1;font-size:.68rem}.mcp-status-empty,.mcp-status-loading,.mcp-status-error{font-size:.8rem;color:var(--muted)}.mcp-status-error{color:var(--danger)}.plan-panel{display:grid;gap:10px}.plan-review-banner{padding:8px 10px;border-radius:8px;border:1px solid var(--border, #2a3140);font-size:.82rem}.plan-review-banner.ok{border-color:var(--ok, #3ecf8e)}.plan-review-banner.review{border-color:var(--warn, #f5a623)}.plan-review-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}.plan-review-verdict{font-weight:600}.plan-review-banner.ok .plan-review-verdict{color:var(--ok, #3ecf8e)}.plan-review-banner.review .plan-review-verdict{color:var(--warn, #f5a623)}.plan-review-metrics{color:var(--muted, #9aa3b5);font-size:.75rem}.plan-review-warnings,.plan-review-gates{margin:6px 0 0;font-size:.75rem;color:var(--muted, #9aa3b5)}.plan-canvas-layout{display:flex;flex-direction:column;gap:8px;min-height:0}@media(min-width:720px){.plan-canvas-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,240px);align-items:start}}.plan-column-headers{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:2px}.plan-column-header{flex:0 0 auto;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent, #6ea8ff);border:1px solid rgba(110,168,255,.35);border-radius:999px;padding:3px 8px;white-space:nowrap}.plan-canvas-host{position:relative;min-height:11rem;max-height:42vh;overflow:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:var(--canvas-bg, oklch(.12 .02 260 / .9));padding:6px}@media(max-width:430px){.plan-canvas-host{min-height:9rem;max-height:36vh}}.plan-canvas-error,.plan-canvas-loading{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:.78rem;color:#ffb4b4}.plan-canvas-loading{color:var(--muted, #9aa3b5)}.plan-inspector{min-height:0;border-radius:8px;border:1px solid var(--border, #2a3140);background:#00000040;padding:10px;font-size:.78rem}.plan-inspector-empty{color:var(--muted, #9aa3b5);margin:0}.plan-inspector-body{display:grid;gap:8px}.plan-inspector-head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:0}.plan-inspector-id{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#f8faffeb;font-size:.82rem}.plan-inspector-ir{font-family:ui-monospace,monospace;font-size:.68rem;color:var(--muted, #9aa3b5)}.plan-inspector-kind{color:var(--muted, #9aa3b5);font-size:.72rem}.plan-inspector-badge{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:2px 6px;border:1px solid}.plan-inspector-badge.return{color:#d6d2fd;border-color:#8678c973;background:#1b14348c}.plan-inspector-badge.gate{color:var(--warn, #f5a623);border-color:#f5a62373;background:#f5a6231f}.plan-inspector-table{display:grid;grid-template-columns:auto 1fr;gap:.35rem .65rem;margin:0;font-size:.75rem}.plan-inspector-table dt{margin:0;color:var(--muted, #9aa3b5);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding-top:.15rem}.plan-inspector-table dd{margin:0;min-width:0}.plan-inspector-op-code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:.7rem;line-height:1.35;white-space:pre-wrap;word-break:break-word;color:#e6ecf8e0}.plan-inspector-widget-chip,.plan-inspector-effect{display:inline-block;font-size:.65rem;padding:.1rem .45rem;border-radius:var(--radius-chip, 999px);border:1px solid var(--border, #2a3140);background:#0c121a}.plan-inspector-dep-chip{font-family:ui-monospace,monospace}details.program-source{margin-top:6px;font-size:.75rem}details.program-source pre{white-space:pre-wrap;word-break:break-word;font-size:.68rem;background:#0b0d12;padding:8px;border-radius:8px;max-height:160px;overflow:auto;margin:6px 0 0}

</style>
</head>
<body>
  <div class="shell">
    <header class="plan-meta-strip">
      <h1>Plan Review</h1>
      <dl>
        <div><dt>Session</dt><dd id="session-ref">—</dd></div>
        <div><dt>Status</dt><dd><span class="status" id="status" aria-live="polite">Initializing…</span></dd></div>
      </dl>
      <div id="approval-slot" hidden aria-hidden="true"></div>
    </header>
    <div id="run-banner" class="plan-run-banner" hidden>Live execution started — see Run Explorer</div>
    <section class="plan-panel">
      <div id="review-banner" class="plan-review-banner" hidden></div>
      <div id="column-headers" class="plan-column-headers" hidden></div>
      <div class="plan-canvas-layout">
        <div id="plan-canvas-host" class="plan-canvas-host">
          <p class="plan-inspector-empty">Waiting for plan from host…</p>
        </div>
        <div id="plan-inspector" class="plan-inspector">
          <p class="plan-inspector-empty">Select a plan step to inspect.</p>
        </div>
      </div>
      <details id="program-details" class="plan-program-details" hidden>
        <summary>Program (from host)</summary>
        <pre id="program-excerpt" class="plan-program-excerpt"></pre>
      </details>
    </section>
  </div>
</body>
</html>
