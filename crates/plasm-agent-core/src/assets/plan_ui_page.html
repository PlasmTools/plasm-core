<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Plan Review</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .shell { padding: 16px; display: grid; gap: 12px; }
    .plan-meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: baseline;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .plan-meta-strip h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .plan-meta-strip dl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin: 0;
    }
    .plan-meta-strip dt { font-weight: 500; }
    .plan-meta-strip dd { margin: 0; color: var(--text); }
    #approval-slot { margin-left: auto; }
    .plan-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    .plan-program-details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .plan-program-details summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .plan-program-excerpt {
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: var(--radius-panel);
      background: oklch(0.12 0.02 260);
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .plan-run-banner {
      font-size: 0.8rem;
      color: var(--accent);
      padding: 6px 10px;
      border-radius: var(--radius-panel);
      border: 1px solid oklch(0.58 0.233 277 / 0.35);
      background: oklch(0.58 0.233 277 / 0.08);
    }
    .plan-run-banner[hidden] { display: none; }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status[aria-live] { min-height: 1.2em; }
  </style>
  <script type="module" src="/v1/plan/ui/app.js?v=be600d15befb"></script>
  <style>
:root{color-scheme:dark;--bg: oklch(.14 .02 260);--panel: oklch(.17 .025 260);--border: oklch(.28 .03 260);--text: oklch(.93 .01 260);--muted: oklch(.68 .02 260);--accent: oklch(.58 .233 277);--ok: oklch(.72 .17 155);--warn: oklch(.78 .14 75);--danger: oklch(.65 .2 25);--canvas-bg: oklch(.12 .02 260 / .9);--radius-panel: 8px;--radius-chip: 999px;font-family:Geist,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.plan-panel{display:grid;gap:12px}.plan-review-banner{padding:10px 12px;border-radius:8px;border:1px solid var(--border, #2a3140);font-size:.85rem}.plan-review-banner.ok{border-color:var(--ok, #3ecf8e)}.plan-review-banner.review{border-color:var(--warn, #f5a623)}.plan-review-row{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline}.plan-review-verdict{font-weight:600}.plan-review-banner.ok .plan-review-verdict{color:var(--ok, #3ecf8e)}.plan-review-banner.review .plan-review-verdict{color:var(--warn, #f5a623)}.plan-review-metrics{color:var(--muted, #9aa3b5);font-size:.8rem}.plan-review-warnings,.plan-review-gates{margin:8px 0 0;font-size:.8rem;color:var(--muted, #9aa3b5)}.plan-canvas-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:12px;align-items:start}@media(max-width:700px){.plan-canvas-layout{grid-template-columns:1fr}}.plan-column-headers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}.plan-column-header{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent, #6ea8ff);border:1px solid rgba(110,168,255,.35);border-radius:999px;padding:4px 10px}.plan-canvas-host{position:relative;min-height:14rem;overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:var(--canvas-bg, oklch(.12 .02 260 / .9));padding:8px}.plan-canvas-error,.plan-canvas-loading{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-size:.8rem;color:#ffb4b4}.plan-canvas-loading{color:var(--muted, #9aa3b5)}.plan-inspector{min-height:14rem;border-radius:8px;border:1px solid var(--border, #2a3140);background:#00000040;padding:12px;font-size:.82rem}.plan-inspector-empty{color:var(--muted, #9aa3b5);margin:0}.plan-inspector-body{display:grid;gap:6px}.plan-inspector-head{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:0}.plan-inspector-id{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#f8faffeb}.plan-inspector-ir{font-family:ui-monospace,monospace;font-size:.7rem;color:var(--muted, #9aa3b5)}.plan-inspector-kind{color:var(--muted, #9aa3b5);font-size:.75rem}.plan-inspector-badge{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:2px 6px;border:1px solid}.plan-inspector-badge.return{color:#d6d2fd;border-color:#8678c973;background:#1b14348c}.plan-inspector-badge.gate{color:var(--warn, #f5a623);border-color:#f5a62373;background:#f5a6231f}.plan-inspector-op{margin:0;color:#e6ecf8d9;line-height:1.4}.plan-inspector-meta,.plan-inspector-deps{margin:0;color:var(--muted, #9aa3b5);font-size:.75rem;word-break:break-word}details.program-source{margin-top:8px;font-size:.8rem}details.program-source pre{white-space:pre-wrap;word-break:break-word;font-size:.72rem;background:#0b0d12;padding:10px;border-radius:8px;max-height:200px;overflow:auto;margin:8px 0 0}

</style>
</head>
<body>
  <div class="shell">
    <header class="plan-meta-strip">
      <h1>Plan Review</h1>
      <dl>
        <div><dt>Session</dt><dd id="session-ref">—</dd></div>
        <div><dt>Status</dt><dd><span class="status" id="status" aria-live="polite">Initializing…</span></dd></div>
      </dl>
      <div id="approval-slot" hidden aria-hidden="true"></div>
    </header>
    <div id="run-banner" class="plan-run-banner" hidden>Live execution started — see Run Explorer</div>
    <section class="plan-panel">
      <div id="review-banner" class="plan-review-banner" hidden></div>
      <div id="column-headers" class="plan-column-headers" hidden></div>
      <div class="plan-canvas-layout">
        <div id="plan-canvas-host" class="plan-canvas-host">
          <p class="plan-inspector-empty">Waiting for plan from host…</p>
        </div>
        <div id="plan-inspector" class="plan-inspector">
          <p class="plan-inspector-empty">Select a plan step to inspect.</p>
        </div>
      </div>
      <details id="program-details" class="plan-program-details" hidden>
        <summary>Program (from host)</summary>
        <pre id="program-excerpt" class="plan-program-excerpt"></pre>
      </details>
    </section>
  </div>
</body>
</html>
