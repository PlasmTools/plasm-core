<body>
  <div class="run-shell" id="run-shell">
    <header class="run-header">
      <h1>Run Explorer</h1>
      <div class="run-header-row">
        <div class="run-telemetry" id="telemetry-header" aria-live="polite">—</div>
        <button type="button" class="run-session-ref" id="session-ref" title="Copy session ref" hidden></button>
      </div>
      <div class="run-status" id="status" aria-live="polite">Initializing…</div>
    </header>
    <div class="run-op-strip" id="op-strip" hidden aria-live="polite"></div>
    <details id="program-details" class="run-program-details" hidden>
      <summary>Program (from host)</summary>
      <pre id="program-excerpt" class="run-program-excerpt"></pre>
      <p id="program-review-warnings" class="run-program-review" hidden aria-live="polite"></p>
    </details>
    <section class="run-dag-panel" id="dag-panel" aria-label="Plan execution" hidden>
      <div id="dag-host" class="run-dag-host"></div>
      <div id="dag-inspector" class="run-dag-inspector">
        <p class="run-empty">Select a plan step to inspect.</p>
      </div>
    </section>
    <div class="run-layout" id="run-layout">
      <aside class="run-step-rail" id="step-rail" aria-label="Node results" hidden></aside>
      <section class="run-table-panel" id="table-host" aria-label="Entity rows">
        <p class="run-empty">Waiting for run results from host…</p>
      </section>
    </div>
  </div>
