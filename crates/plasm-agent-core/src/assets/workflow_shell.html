<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasm Workflow</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #111; color: #eee; }
    body.shell-app { overflow: hidden; }
    .gate {
      padding: 24px;
      max-width: 520px;
      margin: 48px auto;
      display: grid;
      gap: 12px;
    }
    body.shell-connecting .gate,
    body.shell-app .gate { display: none; }
    .connecting {
      display: none;
      min-height: 100vh;
      place-content: center;
      justify-items: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    body.shell-connecting .connecting { display: grid; }
    body.shell-app .connecting { display: none; }
    .connecting-status {
      margin: 0;
      font-size: 0.95rem;
      color: #e8ecf4;
    }
    .connecting-detail {
      margin: 0;
      font-size: 0.8rem;
      color: #9aa3b5;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #6ea8ff;
      border-radius: 50%;
      animation: shell-spin 0.8s linear infinite;
    }
    @keyframes shell-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255, 255, 255, 0.35); }
    }
    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #eee;
      font: inherit;
    }
    button { cursor: pointer; background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #app {
      display: none;
      border: 0;
      background: #0f1117;
    }
    body.shell-app #app {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hint { font-size: 0.85rem; color: #9aa3b5; line-height: 1.5; }
    code { background: #222; padding: 2px 6px; border-radius: 4px; }
  </style>
  <script type="module" src="/v1/workflows/ui/shell.js?v=50b4962a5623"></script>
</head>
<body class="shell-gate">
  <div class="connecting" id="connecting" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p class="connecting-status" id="connecting-status">Connecting…</p>
    <p class="connecting-detail" id="connecting-detail">Opening MCP session</p>
  </div>
  <div class="gate" id="gate">
    <h1>Plasm Workflow</h1>
    <p class="hint">
      Provision a Bearer key with
      <code>plasm-server mcp keys add --name workflow</code>, then paste it below
      or open this page with <code>#token=YOUR_KEY</code>.
    </p>
    <label>Bearer token<input id="token-input" type="password" autocomplete="off" /></label>
    <button id="connect" type="button">Connect</button>
    <p class="hint" id="error" hidden></p>
  </div>
  <iframe id="app" title="Plasm Workflow App"></iframe>
</body>
</html>
