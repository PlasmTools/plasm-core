[package]
name = "plasm-core"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["ranked_capability_gate"]
# Non-read capabilities also require membership in an optional sorted capability-name list when that list is non-empty.
ranked_capability_gate = []
# Subscriber for the `dump_prompt` binary only — library code must not own a global subscriber.
dump-prompt = ["dep:tracing-subscriber"]

[dependencies]
bm25 = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
chrono = { workspace = true }
chrono-english = { workspace = true }
rust_decimal = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rustc-hash = "2"
riptoken = "0.3.0"
rayon = { workspace = true }
minijinja = { version = "2.19.0", default-features = false, features = ["builtins", "serde"] }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
plasm-discovery = { path = "../plasm-discovery" }
plasm-discovery-eval = { path = "../plasm-discovery-eval" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bin]]
name = "dump_prompt"
path = "src/bin/dump_prompt.rs"
required-features = ["dump-prompt"]

[[bench]]
name = "schema_load"
harness = false

[[bench]]
name = "teaching_prompt_render"
harness = false
