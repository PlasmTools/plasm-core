[package]
name = "plasm-otel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Shared OpenTelemetry OTLP bootstrap (traces, metrics, logs) from standard OTEL_* env vars"
readme = "README.md"

[features]
default = []
# In-memory span exporter + capture helpers for span-graph tests in dependent crates.
testing = ["opentelemetry_sdk/testing"]

[dependencies]
anyhow = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tracing-opentelemetry = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
