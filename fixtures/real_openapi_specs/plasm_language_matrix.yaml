openapi: 3.0.3
info:
  title: Plasm Language Matrix API
  version: "1.0.0"
paths:
  /language/v1/compound-branches:
    get:
      summary: Read a branch by all three identity components
      parameters:
        - name: owner
          in: query
          required: true
          schema: {type: string}
        - name: item_id
          in: query
          required: true
          schema: {type: string}
        - name: name
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Branch identity and payload
          content:
            application/json:
              schema:
                type: object
                required: [owner, item_id, name, color]
                properties:
                  owner: {type: string, example: alice}
                  item_id: {type: string, example: i1}
                  name: {type: string, example: main}
                  color: {type: string, example: blue}
              example: {owner: alice, item_id: i1, name: main, color: blue}
  /language/v1/items:
    get:
      summary: List items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: owner
          in: query
          schema:
            type: string
        - name: score
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LangItem"
              example:
                - id: "i1"
                  title: "Alpha"
                  score: 10
                  owner: "alice"
                  lines:
                    - id: "l1"
                      item_id: "i1"
                      note: "line-a"
                    - id: "l2"
                      item_id: "i1"
                      note: "line-b"
                  tags:
                    - id: "t1"
                      item_id: "i1"
                      label: "urgent"
                    - id: "t2"
                      item_id: "i1"
                      label: "review"
                - id: "i2"
                  title: "Beta"
                  score: 20
                  owner: "bob"
                - id: "i3"
                  title: "Gamma"
                  score: 15
                  owner: "alice"
                - id: "i4"
                  title: "Delta"
                  score: 25
                  owner: "alice"
                - id: "i5"
                  title: "Epsilon"
                  score: 5
                  owner: "carol"
    post:
      summary: Create item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LangItemCreate"
            example:
              title: "Created"
              score: 99
              owner: "tester"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangItem"
              example:
                id: "i-new"
                title: "Created"
                score: 99
                owner: "tester"
  /language/v1/items/search:
    get:
      summary: Search items
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LangItem"
              example:
                - id: "i1"
                  title: "Alpha"
                  score: 10
                  owner: "alice"
  /language/v1/viewer:
    get:
      summary: Current viewer (dashboard seed)
      responses:
        "200":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangViewer"
              example:
                id: "viewer-alice"
                display_name: "alice"
  /language/v1/viewer/nobody:
    get:
      summary: Viewer with no assigned items
      responses:
        "200":
          description: Viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangViewer"
              example:
                id: "viewer-nobody"
                display_name: "nobody"
  /language/v1/items/{id}:
    get:
      summary: Get item by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangItemWithLines"
              example:
                id: "i1"
                title: "Alpha"
                score: 10
                owner: "alice"
                summary:
                  id: "sum-i1"
                  headline: "Alpha summary"
                  detail:
                    id: "det-i1"
                    body: "nested detail"
                lines:
                  - id: "l1"
                    item_id: "i1"
                    note: "line-a"
                  - id: "l2"
                    item_id: "i1"
                    note: "line-b"
                tags:
                  - id: "t1"
                    item_id: "i1"
                    label: "urgent"
                  - id: "t2"
                    item_id: "i1"
                    label: "review"
                children:
                  - id: "i1-child-a"
                    title: "Child A"
                    score: 1
                    owner: "alice"
                  - id: "i1-child-b"
                    title: "Child B"
                    score: 2
                    owner: "alice"
    patch:
      summary: Patch item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LangItemPatch"
            example:
              title: "Patched"
              score: 11
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangItem"
              example:
                id: "i1"
                title: "Patched"
                score: 11
                owner: "alice"
                lines:
                  - id: "l1"
                    item_id: "i1"
                    note: "line-a"
                  - id: "l2"
                    item_id: "i1"
                    note: "line-b"
    delete:
      summary: Delete item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /language/v1/items/{id}/ping:
    post:
      summary: Ping item (side-effect)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ack
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
  /language/v1/items/{id}/secured_touch:
    post:
      summary: Secured touch (Bearer access_token; for_each auth×fanout matrix)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ack
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
              example:
                ok: true
                id: "i1"
  /language/v1/items/broadcast:
    post:
      summary: Pathless broadcast (federated stamp matrix)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Ack
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true
  /language/v1/sessions/login:
    post:
      summary: Pathless login returning access_token (provides / MutationResult matrix)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
              example:
                access_token: matrix-token-linear
                token_type: Bearer
  /language/v1/secured_notes:
    get:
      summary: Search secured notes (Bearer access_token required)
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secured notes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [note_id, title]
                  properties:
                    note_id:
                      type: integer
                    title:
                      type: string
              example:
                - note_id: 1
                  title: trip itinerary
  /language/v1/secured_notes/{note_id}:
    get:
      summary: Get a secured note including body (Bearer access_token required; summary hydrate)
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secured note detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangSecuredNote"
              example:
                note_id: 1
                title: trip itinerary
                body: trip body
  /language/v1/secured_groups:
    get:
      summary: List secured groups (Bearer access_token required; dual-auth witness)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secured groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [group_id, name]
                  properties:
                    group_id:
                      type: integer
                    name:
                      type: string
              example:
                - group_id: 42
                  name: trip expenses
  /language/v1/tags/{id}:
    get:
      summary: Get tag by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangTag"
              example:
                id: "t1"
                item_id: "i1"
                label: "urgent"
  /language/v1/tags:
    get:
      summary: Tags for an item
      parameters:
        - name: item_id
          in: query
          required: true
          schema:
            type: string
        - name: seq
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LangTag"
              example:
                - id: "t1"
                  item_id: "i1"
                  label: "urgent"
                - id: "t2"
                  item_id: "i1"
                  label: "review"
  /language/v1/lines/{line_id}:
    get:
      summary: Get line by id
      parameters:
        - name: line_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangLine"
              example:
                id: "l1"
                item_id: "i1"
                note: "line-a"
  /language/v1/lines:
    get:
      summary: Lines for an item (list form; also embedded on item GET)
      parameters:
        - name: item_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LangLine"
              example:
                - id: "l1"
                  item_id: "i1"
                  note: "line-a"
                - id: "l2"
                  item_id: "i1"
                  note: "line-b"
  /language/v1/offers:
    get:
      summary: List priced offers (money type lock)
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LangOffer"
              example:
                - id: "o1"
                  price: "12.50"
                  quote_currency: "USD"
                - id: "o2"
                  price: "3.00"
                  quote_currency: "USD"
    post:
      summary: Create offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LangOfferCreate"
            example:
              price: "12.50"
              quote_currency: "USD"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LangOffer"
              example:
                id: "o-new"
                price: "12.50"
                quote_currency: "USD"
components:
  schemas:
    LangSecuredNote:
      type: object
      required: [note_id, title, body]
      example:
        note_id: 1
        title: trip itinerary
        body: trip body
      properties:
        note_id:
          type: integer
          example: 1
        title:
          type: string
          example: trip itinerary
        body:
          type: string
          example: trip body
    LangItem:
      type: object
      required: [id, title]
      example:
        id: "i1"
        title: "Alpha"
        score: 10
        owner: "alice"
        lines:
          - id: "l1"
            item_id: "i1"
            note: "line-a"
          - id: "l2"
            item_id: "i1"
            note: "line-b"
      properties:
        id:
          type: string
          example: "i1"
        title:
          type: string
          example: "Alpha"
        score:
          type: integer
          example: 10
        owner:
          type: string
          example: "alice"
    LangItemCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        score:
          type: integer
        owner:
          type: string
    LangItemPatch:
      type: object
      properties:
        title:
          type: string
        score:
          type: integer
        owner:
          type: string
    LangLine:
      type: object
      required: [id, item_id, note]
      properties:
        id:
          type: string
        item_id:
          type: string
        note:
          type: string
    LangOffer:
      type: object
      required: [id, price, quote_currency]
      properties:
        id:
          type: string
        price:
          type: string
        quote_currency:
          type: string
      example:
        id: "o1"
        price: "12.50"
        quote_currency: "USD"
    LangOfferCreate:
      type: object
      required: [price, quote_currency]
      properties:
        price:
          type: string
        quote_currency:
          type: string
    LangViewer:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
        display_name:
          type: string
    LangItemWithLines:
      allOf:
        - $ref: "#/components/schemas/LangItem"
        - type: object
          properties:
            summary:
              $ref: "#/components/schemas/LangSummary"
            lines:
              type: array
              items:
                $ref: "#/components/schemas/LangLine"
            tags:
              type: array
              items:
                $ref: "#/components/schemas/LangTag"
            children:
              type: array
              items:
                $ref: "#/components/schemas/LangItem"
      example:
        id: "i1"
        title: "Alpha"
        score: 10
        owner: "alice"
        summary:
          id: "sum-i1"
          headline: "Alpha summary"
          detail:
            id: "det-i1"
            body: "nested detail"
        lines:
          - id: "l1"
            item_id: "i1"
            note: "line-a"
          - id: "l2"
            item_id: "i1"
            note: "line-b"
        tags:
          - id: "t1"
            item_id: "i1"
            label: "urgent"
          - id: "t2"
            item_id: "i1"
            label: "review"
        children:
          - id: "i1-child-a"
            title: "Child A"
            score: 1
            owner: "alice"
          - id: "i1-child-b"
            title: "Child B"
            score: 2
            owner: "alice"
    LangSummary:
      type: object
      required: [id, headline]
      properties:
        id:
          type: string
        headline:
          type: string
        detail:
          $ref: "#/components/schemas/LangDetail"
    LangDetail:
      type: object
      required: [id, body]
      properties:
        id:
          type: string
        body:
          type: string
    LangTag:
      type: object
      required: [id, item_id, label]
      properties:
        id:
          type: string
        item_id:
          type: string
        label:
          type: string
