langitem_query:
  method: GET
  path:
  - type: literal
    value: language
  - type: literal
    value: v1
  - type: literal
    value: items

langitem_query_owner:
  method: GET
  path:
  - type: literal
    value: language
  - type: literal
    value: v1
  - type: literal
    value: items
  query:
    type: object
    fields:
    - ["owner", { type: var, name: owner }]

langitem_search:
