version: 1
entry_id: matrix
http_backend: http://127.0.0.1:9
auth: { scheme: none }
values:
  source: { type: string, description: Source material for preparation. }
  prepared: { type: string, description: Prepared material accepted by processing. }
  result: { type: string, description: Processing result. }
entities:
  Source:
    id_field: value
    description: Original source with embedded prepared observations.
    fields:
      value: { value_ref: source, required: true }
    relations:
      observations:
        target: Prepared
        cardinality: many
        description: Complete prepared observations embedded in the source read.
        materialize:
          kind: from_parent_get
          collection_coverage: complete
          path: [{key: observations}, {wildcard: true}]
  Prepared:
    id_field: value
    description: Prepared resources.
    fields:
      value: { value_ref: prepared, required: true }
  Result:
    id_field: value
    description: Processing results.
    fields:
      value: { value_ref: result, required: true }
capabilities:
  source_read:
    entity: Source
    kind: get
    description: Read original source material and its embedded prepared observations without changing it.
    provides: [value]
    output: { type: entity, entity_type: Source }
  prepare:
    entity: Prepared
    kind: action
    description: Prepare source material for processing without deleting the original.
    arguments:
      input_type:
        type: object
        fields:
          - { name: resource, value_ref: source, required: true }
    provides: [value]
    output: { type: entity, entity_type: Prepared }
  process:
    entity: Result
    kind: action
    description: Process prepared material into a final result.
    arguments:
      input_type:
        type: object
        fields:
          - { name: resource, value_ref: prepared, required: true }
    provides: [value]
    output: { type: entity, entity_type: Result }
  opaque:
    entity: Result
    kind: action
    description: Apply the configured routine; its result is unspecified.
    output: { type: side_effect, description: Performs an unspecified configured change. }
