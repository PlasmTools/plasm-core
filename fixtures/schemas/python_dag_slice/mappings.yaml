item_query:
  method: GET
  path: [{type: literal, value: items}]
tag_query:
  method: GET
  path:
    - {type: literal, value: items}
    - {type: var, name: item_id}
    - {type: literal, value: tags}

item_get:
  method: GET
  path:
    - {type: literal, value: items}
    - {type: var, name: id}

item_touch:
  method: POST
  path: [{type: literal, value: touch}]

item_publish:
  method: POST
  path: [{type: literal, value: publish}]
  body:
    type: object
    fields:
      - - content
        - {type: var, name: content}

item_mark:
  method: POST
  path:
    - {type: literal, value: marks}
    - {type: var, name: id}
