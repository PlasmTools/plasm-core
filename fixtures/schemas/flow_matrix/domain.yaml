version: 1
auth:
  scheme: none
http_backend: http://localhost:1080

data_classes:
  credentials:
    severity: critical
    dimension: confidentiality
    description: API keys, tokens, passwords, and kubeconfig secrets.
  pii_email:
    severity: sensitive
    dimension: confidentiality
    description: User account email addresses.
  untrusted:
    severity: untrusted
    dimension: integrity
    description: User-authored content that may not be trusted as safe input.
  outbound_body:
    severity: critical
    dimension: confidentiality
    description: Outbound sink for remote message bodies (also registry key for sink_class).
  permission_grant:
    severity: critical
    dimension: integrity
    description: ACL / firewall / authz write sink (also registry key for sink_class).

values:
  nv_id:
    type: string
    string_semantics: short
  nv_str:
    type: string
    string_semantics: short
  nv_pattern_list:
    type: array
    items:
      value_ref: nv_str

entities:
  Message:
    id_field: id
    description: An outbound message with a body and optional subject.
    fields:
      id:
        value_ref: nv_id
        required: true
      body:
        value_ref: nv_str
        required: true
        data_class: untrusted
        description: Message body text (user-authored; untrusted).
      subject:
        value_ref: nv_str
        required: false
        description: Optional subject line.

  Redactor:
    id_field: id
    description: Service entity for credential-stripping transforms.
    fields:
      id:
        value_ref: nv_id
        required: true

capabilities:
  message_query:
    kind: query
    entity: Message
    description: List messages.
    provides: [id, body, subject]

  send:
    kind: action
    entity: Message
    description: Deliver a message to an external endpoint.
    parameters:
      - name: body
        value_ref: nv_str
        required: true
        description: Message body to deliver.
        sink_class: outbound_body
      - name: subject
        value_ref: nv_str
        required: false
        description: Optional subject line.
    output:
      type: side_effect
      description: Sends the message to the configured delivery channel.

  grant_permission:
    kind: action
    entity: Message
    description: Apply an ACL / firewall style permission grant.
    parameters:
      - name: target
        value_ref: nv_str
        required: true
        description: Target expression for the grant.
        sink_class: permission_grant
    output:
      type: side_effect
      description: Mutates ACL / permission state.

  sanitize_body:
    kind: action
    entity: Message
    description: Strip untrusted content from a message body.
    sanitizes: [untrusted]
    output:
      type: side_effect
      description: Removes untrusted markup and injections from the body field.

  redact:
    kind: action
    entity: Redactor
    description: Redact credential-class data from a payload string, optionally keeping allowed patterns.
    sanitizes: [credentials]
    parameters:
      - name: payload
        value_ref: nv_str
        required: true
        description: The text payload to redact.
      - name: keep_patterns
        value_ref: nv_pattern_list
        required: false
        description: Regex patterns whose matches are preserved (safe list).
    output:
      type: side_effect
      description: Produces a redacted copy of the payload with credential-class data removed.
