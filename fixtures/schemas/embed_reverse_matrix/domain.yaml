version: 1
auth:
  scheme: none
http_backend: http://embed.test
values:
  nv_berry_name:
    type: string
    description: Unique berry name used as its identifier
  nv_berry_url:
    type: string
    description: API endpoint URL for full berry details
  wire_id:
    type: integer
entities:
  Pokemon:
    id_field: name
    fields:
      name:
        value_ref: nv_berry_name
        required: true
      id:
        value_ref: wire_id
      url:
        value_ref: nv_berry_url
  Type:
    id_field: name
    fields:
      name:
        value_ref: nv_berry_name
        required: true
      id:
        value_ref: wire_id
      url:
        value_ref: nv_berry_url
    relations:
      pokemon:
        target: Pokemon
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: pokemon
          - wildcard: true
          - key: pokemon
  Ability:
    id_field: name
    fields:
      name:
        value_ref: nv_berry_name
        required: true
      id:
        value_ref: wire_id
      url:
        value_ref: nv_berry_url
    relations:
      pokemon:
        target: Pokemon
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: pokemon
          - wildcard: true
          - key: pokemon
capabilities:
  pokemon_get:
    kind: get
    entity: Pokemon
    provides:
    - name
    - id
    - url
  type_get:
    kind: get
    entity: Type
    provides:
    - name
    - id
    - url
  ability_get:
    kind: get
    entity: Ability
    provides:
    - name
    - id
    - url
