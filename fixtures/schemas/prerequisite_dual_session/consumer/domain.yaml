version: 1
entry_id: consumer
auth: {scheme: none}
http_backend: http://127.0.0.1:9
values:
  nv_access_token:
    type: string
    description: Bearer access token from login.
  nv_source_token:
    type: string
    description: Bearer token authorizing the file-path argument, distinct from this service's login token.
  nv_id:
    type: string
    description: Record primary key.
  nv_path:
    type: string
    description: File path.
  nv_file_id:
    type: string
    description: File primary key on the source store.
entities:
  AuthSession:
    id_field: access_token
    description: Login session for the consumer service.
    fields:
      access_token: {value_ref: nv_access_token, required: true}
  Record:
    id_field: id
    description: A business record that can receive a file.
    fields:
      id: {value_ref: nv_id, required: true}
    relations:
      files:
        description: Files held for this record on the source store.
        target: File
        cardinality: many
        materialize:
          kind: query_scoped
          capability: file_query
          param: id
  File:
    id_field: file_id
    description: A file held by the source store and listed for a record.
    fields:
      file_id: {value_ref: nv_file_id, required: true}
      id: {value_ref: nv_id, required: true}
capabilities:
  login:
    entity: AuthSession
    kind: action
    description: Login to the consumer service; returns access_token for Bearer auth.
    provides: [access_token]
    output: {type: entity, entity_type: AuthSession}
  record_get:
    entity: Record
    kind: get
    description: Fetch a record by id.
    provides: [id]
    arguments:
      input_type:
        type: object
        fields:
          - {name: access_token, value_ref: nv_access_token, required: true}
  file_query:
    entity: File
    kind: query
    description: List files for a record from the source store.
    scope:
      - {name: id, value_ref: nv_id, required: true}
    selection:
      - {name: access_token, value_ref: nv_access_token, required: true}
    provides: [file_id, id]
  attach:
    receiver: {kind: entity, entity: Record}
    entity: Record
    kind: action
    description: Attach a file to a record.
    payload:
      input_type:
        type: object
        fields:
          - {name: access_token, value_ref: nv_access_token, required: true}
          - {name: file_path, value_ref: nv_path, required: true}
          - {name: source_access_token, value_ref: nv_source_token, required: true}
    output:
      type: side_effect
      description: Copies the file onto the record.
prerequisites:
  contracts:
    appworld.session:
      version: 1
      inputs: {}
      outputs:
        token: nv_access_token
  providers:
    session:
      contract: appworld.session
      capability: login
      outputs:
        token: access_token
  requirements:
    attach:
      - id: session
        contract: appworld.session
        bindings:
          - input: {lane: payload, path: [access_token]}
            output: token
      - id: source_session
        contract: appworld.session
        bindings:
          - input: {lane: payload, path: [source_access_token]}
            output: token
    file_query:
      - id: source_session
        contract: appworld.session
        bindings:
          - input: {lane: selection, path: [access_token]}
            output: token
