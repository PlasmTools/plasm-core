{
  "version": 1,
  "entry_id": "diagnostic",
  "http_backend": "http://127.0.0.1:9",
  "auth": {
    "scheme": "none"
  },
  "values": {
    "item_id": {
      "type": "string",
      "description": "Identity of a controlled item."
    },
    "ticket_id": {
      "type": "string",
      "description": "Opaque routing token identity."
    }
  },
  "entities": {
    "Item": {
      "id_field": "id",
      "fields": {
        "id": {
          "value_ref": "item_id",
          "required": true
        }
      }
    },
    "Token": {
      "id_field": "id",
      "fields": {
        "id": {
          "value_ref": "ticket_id",
          "required": true
        }
      }
    }
  },
  "capabilities": {
    "op_a": {
      "entity": "Token",
      "kind": "get",
      "description": "Obtain a routing token identified by its id.",
      "provides": [
        "id"
      ],
      "output": {
        "type": "entity",
        "entity_type": "Token"
      }
    },
    "op_b": {
      "entity": "Item",
      "kind": "action",
      "description": "List the archived calibration dates.",
      "arguments": {
        "input_type": {
          "type": "object",
          "fields": [
            {
              "name": "token",
              "value_ref": "ticket_id",
              "required": true
            }
          ]
        }
      },
      "output": {
        "type": "side_effect",
        "description": "List the archived calibration dates."
      }
    }
  }
}
