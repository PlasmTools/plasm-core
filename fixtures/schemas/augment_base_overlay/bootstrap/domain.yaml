version: 1
http_backend: https://api.clickup.com

schema_overlay:
  source:
    capability: custom_field_query
  projection:
    mode: augment_base
    items_path:
      - fields
  entity:
    from_template: Task
    name:
      template: Task
    scope_key:
      template: global
    dynamic_fields:
      from:
        kind: array
        path: []
      wire_name_path:
        - name
      wire_type_path:
        - type
      name:
        template: "{{ field.name | sanitize_identifier }}"
      type_map:
        text: nv_wire_str_short
        number: nv_wire_int
      default: nv_wire_str_short
      extract:
        kind: name_value_array
        array_path:
          - custom_fields
        match_key_field: name
        match_equals:
          template: "{{ field.name }}"
        value_field: value
  decode:
    scope:
      params: []
      key:
        template: global
    capabilities:
      - task_get

entities:
  Task:
    id_field: id
    description: ClickUp task (overlay augments with custom fields).
    fields:
      id:
        required: true
        value_ref: nv_wire_str_short
      name:
        required: false
        value_ref: nv_wire_str_short

capabilities:
  custom_field_query:
    description: List workspace custom fields.
    kind: query
    entity: Task
  task_get:
    description: Get a task.
    kind: get
    entity: Task

values:
  nv_wire_str_short:
    type: string
    string_semantics: short
  nv_wire_int:
    type: integer
