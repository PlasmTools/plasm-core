version: 1
http_backend: http://localhost:1080
values:
  nv_datasource_uid:
    type: string
  nv_datasource_type:
    type: string
  nv_query_expr:
    type: string
  nv_query_time:
    type: string
  nv_query_results:
    type: json
entities:
  Datasource:
    id_field: uid
    description: Datasource used to test invoke-target preflight hydration.
    fields:
      uid:
        required: true
        value_ref: nv_datasource_uid
      type:
        required: true
        value_ref: nv_datasource_type
      query_results:
        required: false
        value_ref: nv_query_results
capabilities:
  datasource_get:
    kind: get
    entity: Datasource
    provides:
    - uid
  datasource_run:
    kind: action
    entity: Datasource
    payload:
      input_type:
        type: object
        fields:
        - name: expr
          value_ref: nv_query_expr
          required: true
        - name: from
          value_ref: nv_query_time
          required: true
        - name: to
          value_ref: nv_query_time
          required: true
    provides:
    - uid
    - query_results
    preflight:
    - kind: hydrate_invoke_target
      get: datasource_get
      prefix: ds
  datasource_run_typo:
    kind: action
    entity: Datasource
    payload:
      input_type:
        type: object
        fields:
        - name: expr
          value_ref: nv_query_expr
          required: true
    provides:
    - uid
    - query_results
    preflight:
    - kind: hydrate_invoke_target
      get: datasource_get
      prefix: ds
  datasource_run_source_prefix:
    kind: action
    entity: Datasource
    payload:
      input_type:
        type: object
        fields:
        - name: expr
          value_ref: nv_query_expr
          required: true
    provides:
    - uid
    - query_results
    preflight:
    - kind: hydrate_invoke_target
      get: datasource_get
      prefix: source
auth:
  scheme: none
