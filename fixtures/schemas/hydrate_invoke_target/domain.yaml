version: 1
http_backend: http://localhost:1080

values:
  nv_datasource_uid:
    type: string
    string_semantics: short
  nv_datasource_type:
    type: string
    string_semantics: short
  nv_query_expr:
    type: string
    string_semantics: short
  nv_query_time:
    type: string
    string_semantics: short
  nv_query_results:
    type: json
  nv_request_id:
    type: uuid
  nv_observed_at:
    type: date
    value_format: rfc3339
  nv_observed_at_ms:
    type: date
    value_format: unix_ms
  nv_team_key:
    type: string
    string_semantics: short
  nv_team_ref:
    type: entity_ref
    target: Team

entities:
  Team:
    id_field: key
    fields:
      key:
        required: true
        value_ref: nv_team_key
  Datasource:
    id_field: uid
    description: Datasource used to test invoke-target preflight hydration.
    fields:
      uid:
        required: true
        value_ref: nv_datasource_uid
      type:
        required: true
        value_ref: nv_datasource_type
      query_results:
        required: false
        value_ref: nv_query_results
      request_id:
        required: false
        value_ref: nv_request_id
      observed_at:
        required: false
        value_ref: nv_observed_at
      observed_at_ms:
        required: false
        value_ref: nv_observed_at_ms
      team:
        required: false
        value_ref: nv_team_ref

capabilities:
  team_get:
    kind: get
    entity: Team

  datasource_get:
    kind: get
    entity: Datasource
    provides:
      - uid
      # `type` is deliberately omitted: provides must not restrict decoded-row hydration.
      # Unknown provides entries also degrade gracefully.
      - unavailable_legacy_field

  datasource_run:
    kind: action
    entity: Datasource
    preflight:
      - kind: hydrate_invoke_target
        get: datasource_get
        prefix: ds
    parameters:
      - name: expr
        value_ref: nv_query_expr
        required: true
      - name: from
        value_ref: nv_query_time
        required: true
      - name: to
        value_ref: nv_query_time
        required: true
    provides:
      - uid
      - query_results

  datasource_run_typo:
    kind: action
    entity: Datasource
    preflight:
      - kind: hydrate_invoke_target
        get: datasource_get
        prefix: ds
    parameters:
      - name: expr
        value_ref: nv_query_expr
        required: true
    provides:
      - uid
      - query_results

  datasource_run_source_prefix:
    kind: action
    entity: Datasource
    preflight:
      - kind: hydrate_invoke_target
        get: datasource_get
        prefix: source
    parameters:
      - name: expr
        value_ref: nv_query_expr
        required: true
    provides:
      - uid
      - query_results

auth:
  scheme: none
