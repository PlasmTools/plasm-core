acquire:
  method: POST
  path: [{type: literal, value: acquire}]
  body:
    type: object
    fields:
      - [account, {type: var, name: account}]
read:
  method: GET
  path: [{type: literal, value: records}]
  query:
    type: object
    fields:
      - [credential, {type: var, name: credential}]
create:
  method: POST
  path: [{type: literal, value: records}]
operate:
  method: POST
  path: [{type: literal, value: operate}]
  body:
    type: object
    fields:
      - [id, {type: var, name: id}]
