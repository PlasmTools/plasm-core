version: 4
auth:
  scheme: none
http_backend: http://127.0.0.1:9
entities:
  LangDetail:
    id_field: id
    description: Nested detail under LangSummary (one-cardinality chain target).
    fields:
      id:
        required: true
        value_ref: nv_lang_detail_id
      body:
        required: true
        value_ref: nv_lang_detail_body
    relations: {}
  LangSummary:
    id_field: id
    description: Nested summary on LangItem GET (one-cardinality hop).
    fields:
      id:
        required: true
        value_ref: nv_lang_summary_id
      headline:
        required: true
        value_ref: nv_lang_summary_headline
    relations:
      detail:
        description: Detail embedded on summary objects in LangItem GET
        target: LangDetail
        cardinality: one
        materialize:
          kind: from_parent_get
          path:
          - key: detail
  LangTag:
    id_field: id
    description: Tags scoped to a LangItem (query_scoped relation target).
    fields:
      id:
        required: true
        value_ref: nv_lang_tag_id
      item_id:
        required: true
        value_ref: nv_lang_tag_item_id
      label:
        required: true
        value_ref: nv_lang_tag_label
      seq:
        required: false
        value_ref: nv_langtag_by_score_query_seq
    relations: {}
  CompoundBranch:
    id_field: name
    description: Compound-key matrix entity (plan/run hydrate + id_field projection regression).
    key_vars:
    - owner
    - item_id
    - name
    fields:
      owner:
        required: true
        value_ref: nv_compound_branch_owner
      item_id:
        required: true
        value_ref: nv_compound_branch_item_id
      name:
        required: true
        value_ref: nv_compound_branch_name
      color:
        required: false
        value_ref: nv_compound_branch_color
    relations: {}
  HomographRowA:
    id_field: id
    description: Matrix homograph left row (shared value-domain fingerprint, distinct wire).
    fields:
      id:
        required: true
        value_ref: nv_lang_item_id
      headline:
        required: true
        value_ref: nv_homograph_shared_short
    relations: {}
  HomographRowB:
    id_field: id
    description: Matrix homograph right row (shared value-domain fingerprint, distinct wire).
    fields:
      id:
        required: true
        value_ref: nv_lang_item_id
      caption:
        required: true
        value_ref: nv_homograph_shared_short
    relations: {}
  LangLine:
    id_field: id
    description: Child line embedded under LangItem GET (from_parent_get).
    fields:
      id:
        required: true
        value_ref: nv_lang_line_id
      item_id:
        required: true
        value_ref: nv_lang_line_item_id
      note:
        required: true
        value_ref: nv_lang_line_note
    relations: {}
  LangAuthSession:
    id_field: access_token
    description: Login session whose primary key is access_token (AppWorld AuthSession-shaped; federated
      provides + hole fill).
    fields:
      access_token:
        required: true
        value_ref: nv_lang_auth_access_token
      token_type:
        required: false
        value_ref: nv_lang_auth_token_type
    relations: {}
  LangSecuredNote:
    id_field: note_id
    description: Secured note
    fields:
      note_id:
        required: true
        value_ref: nv_lang_secured_note_id
      title:
        required: true
        value_ref: nv_lang_secured_note_title
      body:
        required: true
        value_ref: nv_lang_secured_note_body
    relations: {}
  LangSecuredGroup:
    id_field: group_id
    description: Secured group
    fields:
      group_id:
        required: true
        value_ref: nv_lang_secured_group_id
      name:
        required: true
        value_ref: nv_lang_secured_group_name
    relations: {}
  LangItem:
    id_field: id
    description: Primary matrix item
    fields:
      id:
        required: true
        value_ref: nv_lang_item_id
      title:
        required: true
        value_ref: nv_lang_item_title
      score:
        required: false
        value_ref: nv_lang_item_score
      owner:
        required: false
        value_ref: nv_lang_item_owner
      active:
        required: false
        value_ref: nv_lang_item_active
      contact_email:
        required: false
        value_ref: nv_lang_item_contact_email
      trace_id:
        required: false
        value_ref: nv_lang_item_trace_id
      status:
        required: false
        value_ref: nv_lang_item_status
      tag_labels:
        required: false
        value_ref: nv_lang_item_tag_labels
      recorded_at:
        required: false
        value_ref: nv_lang_item_recorded_at
      code:
        required: false
        value_ref: nv_lang_item_code
      team_key:
        required: false
        value_ref: nv_langitem_search_team_key
    relations:
      summary:
        description: Summary object embedded on LangItem GET responses
        target: LangSummary
        cardinality: one
        materialize:
          kind: from_parent_get
          path:
          - key: summary
      lines:
        description: Lines embedded on LangItem GET responses
        target: LangLine
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: lines
          - wildcard: true
      tags:
        description: Tags embedded on LangItem GET when present; scoped query per item when embed is absent
          or incomplete
        target: LangTag
        cardinality: many
        materialize:
          kind: prefer_from_parent_get
          on_embed_miss: fallback_scoped
          path:
          - key: tags
          - wildcard: true
          fallback:
            kind: query_scoped
            capability: langtag_query
            param: item_id
      tags_by_score:
        description: Tags scoped by integer score (query_scoped_bindings proof)
        target: LangTag
        cardinality: many
        materialize:
          kind: query_scoped_bindings
          capability: langtag_query
          bindings:
            seq: score
      compound_branches:
        description: Compound-key branches via prefer embed with GET hydrate fallback
        target: CompoundBranch
        cardinality: many
        materialize:
          kind: prefer_from_parent_get
          on_embed_miss: fallback_scoped
          path:
          - key: compound_branches
          - wildcard: true
          fallback:
            kind: hydrate_from_embed_path
            get_capability: langcompoundbranch_get
      children:
        description: Child LangItems on parent GET (homonymous relation target for federation tests)
        target: LangItem
        cardinality: many
        materialize:
          kind: from_parent_get
          path:
          - key: children
          - wildcard: true
  LangOffer:
    id_field: id
    description: Priced offer used to lock money decode, compare, and create-body encode.
    fields:
      id:
        required: true
        value_ref: nv_lang_offer_id
      price:
        required: true
        value_ref: nv_lang_offer_price
        currency_field: quote_currency
      quote_currency:
        required: true
        value_ref: nv_lang_offer_currency
    relations: {}
  QueryOnlyRequest:
    id_field: request_id
    primary_query: queryonly_request_received_query
    description: 'Matrix query-only entity — money someone asked you to pay (received requests). Query
      anchor must precede void action mutators in the teaching table.

      '
    fields:
      request_id:
        required: true
        value_ref: nv_queryonly_request_id
      amount:
        required: true
        value_ref: nv_lang_offer_price
      status:
        required: false
        value_ref: nv_lang_item_status
    relations: {}
  LangCursor:
    id_field: id
    description: Neutral state cursor for PLP-8 iterate-until (phase advances only via tick).
    fields:
      id:
        required: true
        value_ref: nv_lang_cursor_id
      phase:
        required: true
        value_ref: nv_lang_cursor_phase
      ticks:
        required: false
        value_ref: nv_lang_cursor_ticks
    relations: {}
  LangVault:
    id_field: id
    description: Credential vault row used to lock singleton Get extract and password-domain policy.
    fields:
      id:
        required: true
        value_ref: nv_lang_vault_id
      service:
        required: true
        value_ref: nv_lang_vault_service
      password:
        required: true
        value_ref: nv_lang_vault_password
    relations: {}
  LangLane:
    id_field: id
    description: Shelf-scoped lane row whose query requires an authored shelf slot.
    fields:
      id:
        required: true
        value_ref: nv_lang_lane_id
      title:
        required: true
        value_ref: nv_lang_lane_title
      shelf:
        required: true
        value_ref: nv_lang_lane_shelf
    relations: {}
  LangLaneStock:
    id_field: id
    description: Shelf-scoped stock lane whose query authors a default shelf.
    fields:
      id:
        required: true
        value_ref: nv_lang_lane_stock_id
      title:
        required: true
        value_ref: nv_lang_lane_stock_title
      shelf:
        required: true
        value_ref: nv_lang_lane_stock_shelf
    relations: {}
capabilities:
  langitem_query:
    description: List LangItem rows (optional tags filter; optional owner filter uses owner-scoped path)
    kind: query
    entity: LangItem
    selection:
    - name: tags
      value_ref: nv_langitem_query_tags
      required: false
    - name: owner
      value_ref: nv_langitem_query_owner_owner
      required: false
    provides:
    - id
    - title
    - score
    - owner
  langitem_search:
    description: Search LangItem rows
    kind: search
    entity: LangItem
    selection:
    - name: q
      value_ref: nv_langitem_search_q
      required: true
    - name: team_key
      value_ref: nv_langitem_search_team_key
      required: false
    provides:
    - id
    - title
    - score
    - owner
    - team_key
  langitem_get:
    description: Get LangItem by id (includes embedded lines in wire JSON)
    kind: get
    entity: LangItem
    provides:
    - id
    - title
    - score
    - owner
  langitem_create:
    description: Create LangItem
    kind: create
    entity: LangItem
    payload:
      input_type:
        type: object
        fields:
        - name: title
          value_ref: nv_langitem_create_title
          required: true
        - name: score
          value_ref: nv_langitem_create_score
          required: false
        - name: owner
          value_ref: nv_langitem_create_owner
          required: false
        - name: active
          value_ref: nv_langitem_create_active
          required: false
        - name: recorded_at
          value_ref: nv_langitem_create_recorded_at
          required: false
        - name: tags
          value_ref: nv_langitem_create_tags
          required: false
    provides:
    - id
    - title
    - score
    - owner
    - active
    - recorded_at
  langitem_update:
    description: Patch LangItem
    kind: update
    entity: LangItem
    payload:
      input_type:
        type: object
        fields:
        - name: title
          value_ref: nv_langitem_update_title
          required: false
        - name: score
          value_ref: nv_langitem_update_score
          required: false
        - name: owner
          value_ref: nv_langitem_update_owner
          required: false
        - name: active
          value_ref: nv_langitem_update_active
          required: false
        - name: tags
          value_ref: nv_langitem_create_tags
          required: false
    provides:
    - id
    - title
    - score
    - owner
    - active
  langitem_delete:
    description: Delete LangItem
    kind: delete
    entity: LangItem
  langitem_ping:
    receiver: {kind: entity, entity: LangItem}
    description: Side-effect ping on LangItem
    kind: action
    entity: LangItem
    output:
      type: side_effect
      description: Records a ping against the item (matrix conformance).
  langitem_secured_touch:
    receiver: {kind: entity, entity: LangItem}
    description: Secured side-effect touch on LangItem; Bearer access_token required (for_each auth fanout witness).
    kind: action
    entity: LangItem
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
    output:
      type: side_effect
      description: Records a secured touch against the item when Authorization is present.
  langitem_broadcast:
    description: Pathless side-effect broadcast on LangItem (federated stamp regression; no path id).
    kind: action
    entity: LangItem
    payload:
      input_type:
        type: object
        fields:
        - name: message
          value_ref: nv_langitem_broadcast_message
          required: false
    output:
      type: side_effect
      description: Broadcasts an optional message for the catalog (no entity id in path).
  langauthsession_login:
    description: Pathless login returning LangAuthSession (provides access_token; MutationResult under
      federation).
    kind: action
    entity: LangAuthSession
    payload:
      input_type:
        type: object
        fields:
        - name: username
          value_ref: nv_lang_auth_username
          required: false
        - name: password
          value_ref: nv_lang_auth_password
          required: false
    provides:
    - access_token
    - token_type
    output:
      type: side_effect
      description: Creates an authenticated session; use access_token on subsequent calls.
  langsecurednote_search:
    description: Search secured notes; Bearer access_token required ahead of optional search text.
    kind: search
    entity: LangSecuredNote
    selection:
    - name: access_token
      value_ref: nv_lang_auth_access_token
      required: true
    - name: query
      value_ref: nv_lang_secured_note_query
      required: true
    provides:
    - note_id
    - title
  langsecurednote_get:
    description: Get a secured note including body; Bearer access_token required (summary-hydrate witness).
    kind: get
    entity: LangSecuredNote
    provides:
    - note_id
    - title
    - body
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
  langsecuredgroup_query:
    description: List secured groups; Bearer access_token required (second federated auth consumer).
    kind: query
    entity: LangSecuredGroup
    selection:
    - name: access_token
      value_ref: nv_lang_auth_access_token
      required: true
    provides:
    - group_id
    - name
  langsecuredgroup_get:
    description: Get a secured group by id; Bearer access_token required (anchors LangSecuredGroup under
      context).
    kind: get
    entity: LangSecuredGroup
    provides:
    - group_id
    - name
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
  langoffer_query:
    description: List LangOffer rows
    kind: query
    entity: LangOffer
    provides:
    - id
    - price
    - quote_currency
  langoffer_create:
    description: Create LangOffer
    kind: create
    entity: LangOffer
    payload:
      input_type:
        type: object
        fields:
        - name: price
          value_ref: nv_lang_offer_price
          required: true
        - name: quote_currency
          value_ref: nv_lang_offer_currency
          required: true
    provides:
    - id
    - price
    - quote_currency
  queryonly_request_received_query:
    description: List payment requests other people sent to you (query anchor witness).
    kind: query
    entity: QueryOnlyRequest
    selection:
    - name: access_token
      value_ref: nv_lang_auth_access_token
      required: true
    - name: status
      value_ref: nv_lang_item_status
      required: false
    provides:
    - request_id
    - amount
    - status
  queryonly_request_approve:
    receiver: {kind: entity, entity: QueryOnlyRequest}
    description: Approve and pay a received payment request
    kind: action
    entity: QueryOnlyRequest
    output:
      type: side_effect
      description: Approves the request and transfers money.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
  queryonly_request_deny:
    receiver: {kind: entity, entity: QueryOnlyRequest}
    description: Deny a received payment request
    kind: action
    entity: QueryOnlyRequest
    output:
      type: side_effect
      description: Marks the request as denied.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
  queryonly_request_remind:
    receiver: {kind: entity, entity: QueryOnlyRequest}
    description: Send a reminder about a pending payment request
    kind: action
    entity: QueryOnlyRequest
    output:
      type: side_effect
      description: Notifies the recipient about the outstanding request.
    arguments:
      input_type:
        type: object
        fields:
        - name: access_token
          value_ref: nv_lang_auth_access_token
          required: true
  langtag_get:
    description: Get LangTag by id (batch relation resolution for prefer_from_parent_get)
    kind: get
    entity: LangTag
    provides:
    - id
    - item_id
    - label
  langcompoundbranch_get:
    description: Get CompoundBranch by compound identity (hydrate fallback)
    kind: get
    entity: CompoundBranch
    provides:
    - owner
    - item_id
    - name
    - color
  homographrowa_query:
    description: List HomographRowA rows (homograph projection regression)
    kind: query
    entity: HomographRowA
    provides:
    - id
    - headline
  homographrowb_query:
    description: List HomographRowB rows (homograph projection regression)
    kind: query
    entity: HomographRowB
    provides:
    - id
    - caption
  langtag_query:
    description: List tags scoped to one LangItem (item_id) or by parent score (seq)
    kind: query
    entity: LangTag
    scope:
    - name: item_id
      value_ref: nv_langtag_query_item_id
      required: false
    - name: seq
      value_ref: nv_langtag_by_score_query_seq
      required: false
    provides:
    - id
    - item_id
    - label
  langline_get:
    description: Get LangLine by id (batch relation resolution)
    kind: get
    entity: LangLine
    provides:
    - id
    - item_id
    - note
  langsummary_get:
    description: Get LangSummary by id (matrix one-cardinality hop)
    kind: get
    entity: LangSummary
    provides:
    - id
    - headline
  langdetail_get:
    description: Get LangDetail by id (matrix one-cardinality hop)
    kind: get
    entity: LangDetail
    provides:
    - id
    - body
  langline_query:
    description: List lines scoped to one LangItem (optional list path; also on item GET)
    kind: query
    entity: LangLine
    scope:
    - name: item_id
      value_ref: nv_langline_query_item_id
      required: true
    provides:
    - id
    - item_id
    - note
  langcursor_get:
    description: Get LangCursor by id (observe phase for iterate-until re-read).
    kind: get
    entity: LangCursor
    provides:
    - id
    - phase
    - ticks
  langcursor_tick:
    receiver: {kind: entity, entity: LangCursor}
    description: Advance LangCursor phase one step (open → mid → done).
    kind: action
    entity: LangCursor
    # Type-wide eviction so iterate…until re-Get cannot hit a Completeness::Complete seed row.
    invalidates_entities:
    - LangCursor
    output:
      type: side_effect
      description: Advances the cursor phase toward done; re-observe via get after each tick.
  langvault_get:
    description: Get LangVault by id over the vault list (derive).
    kind: get
    entity: LangVault
    provides:
    - id
    - service
    - password
    derive:
      source: langvault_query
      match_field: id
      projection:
        id: id
        service: service
        password: password
  langvault_query:
    description: List LangVault rows
    kind: query
    entity: LangVault
    provides:
    - id
    - service
    - password
  langvault_unlock:
    receiver: {kind: entity, entity: LangVault}
    description: Confirm a vault password cell against the same named value.
    kind: action
    entity: LangVault
    arguments:
      input_type:
        type: object
        fields:
        - name: secret
          value_ref: nv_lang_vault_password
          required: true
    output:
      type: side_effect
      description: Confirms the vault password cell; no catalog fields change.
  langlane_query:
    description: List LangLane rows for one required shelf
    kind: query
    entity: LangLane
    selection:
    - name: shelf
      value_ref: nv_lang_lane_shelf
      required: true
    provides:
    - id
    - title
    - shelf
  langlanestock_query:
    description: List LangLaneStock rows; omitted shelf uses the authored default
    kind: query
    entity: LangLaneStock
    selection:
    - name: shelf
      value_ref: nv_lang_lane_stock_shelf
      required: true
      default: mine
    provides:
    - id
    - title
    - shelf
values:
  nv_lang_cursor_id:
    type: string
  nv_lang_cursor_phase:
    type: enum
    enum:
    - open
    - mid
    - done
  nv_lang_cursor_ticks:
    type: integer
  nv_lang_detail_id:
    type: string
  nv_lang_detail_body:
    type: string
  nv_lang_summary_id:
    type: string
  nv_lang_summary_headline:
    type: string
  nv_lang_tag_id:
    type: string
  nv_lang_tag_item_id:
    type: entity_ref
    target: LangItem
  nv_lang_tag_label:
    type: string
  nv_lang_line_id:
    type: string
  nv_lang_line_item_id:
    type: entity_ref
    target: LangItem
  nv_lang_line_note:
    type: string
  nv_lang_item_id:
    type: string
  nv_lang_item_title:
    type: string
  nv_langitem_broadcast_message:
    type: string
    description: Optional broadcast body for pathless LangItem action (federation stamp matrix).
  nv_lang_auth_access_token:
    type: string
    description: Bearer token primary key for LangAuthSession.
  nv_lang_auth_token_type:
    type: string
  nv_lang_auth_username:
    type: string
  nv_lang_auth_password:
    type: string
  nv_lang_secured_note_id:
    type: integer
  nv_lang_secured_note_title:
    type: string
  nv_lang_secured_note_body:
    type: string
  nv_lang_secured_note_query:
    type: string
  nv_lang_secured_group_id:
    type: integer
  nv_lang_secured_group_name:
    type: string
  nv_lang_item_score:
    type: integer
  nv_lang_item_owner:
    type: string
  nv_lang_item_active:
    type: boolean
  nv_lang_item_contact_email:
    type: email
  nv_lang_item_trace_id:
    type: uuid
  nv_lang_item_status:
    type: enum
    enum:
    - draft
    - published
    - archived
  nv_lang_item_tag_labels:
    type: multi_enum
    enum:
    - alpha
    - beta
    - gamma
  nv_lang_item_recorded_at:
    type: rfc3339
  nv_lang_item_code:
    type: string
    min_length: 3
    pattern: ^[A-Z]{3}$
  nv_langitem_query_owner_owner:
    type: string
  nv_langitem_query_tags:
    type: string
  nv_langitem_search_q:
    type: string
  nv_langitem_search_team_key:
    type: string
  nv_langitem_create_title:
    type: string
  nv_langitem_create_score:
    type: integer
  nv_langitem_create_owner:
    type: string
  nv_langitem_create_active:
    type: boolean
  nv_langitem_create_recorded_at:
    type: rfc3339
  nv_langitem_create_tags_item:
    type: string
  nv_langitem_create_tags:
    type: array
    items:
      value_ref: nv_langitem_create_tags_item
    description: Tag names to apply when creating a LangItem (array invoke param homograph regression).
  nv_langitem_update_title:
    type: string
  nv_langitem_update_score:
    type: integer
  nv_langitem_update_owner:
    type: string
  nv_langitem_update_active:
    type: boolean
  nv_homograph_shared_short:
    type: string
  nv_langtag_query_item_id:
    type: entity_ref
    target: LangItem
  nv_langtag_by_score_query_seq:
    type: integer
  nv_compound_branch_owner:
    type: string
  nv_compound_branch_item_id:
    type: string
  nv_compound_branch_name:
    type: string
