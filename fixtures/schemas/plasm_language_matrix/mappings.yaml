langitem_query:
  method: GET
  path:
  - type: literal
    value: language
  - type: literal
    value: v1
  - type: literal
    value: items
  query:
    type: object
    fields:
    - [tags, { type: if, condition: { type: exists, var: tags },
        then_expr: { type: var, name: tags }, else_expr: { type: const, value: null } }]
    - [owner, { type: if, condition: { type: exists, var: owner },
        then_expr: { type: var, name: owner }, else_expr: { type: const, value: null } }]
langitem_search:
  method: GET
  path:
  - type: literal
    value: language
  - type: literal
    value: v1
  - type: literal
    value: items
  - type: literal
    value: search
  query:
    type: object
    fields:
    - ["q", { type: var, name: q }]
    - - team_key
      - type: if
        condition: { type: exists, var: team_key }
        then_expr: { type: var, name: team_key }
        else_expr: { type: const, value: null }

langitem_get:
  method: GET
  path:
