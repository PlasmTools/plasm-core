langitem_create:
  method: POST
  path:
  - type: literal
    value: language
  - type: literal
    value: v1
  - type: literal
    value: items
  body:
    type: object
    fields:
    - ["title", { type: var, name: title }]
    - ["score", { type: var, name: score }]
    - ["owner", { type: var, name: owner }]
    - [active, { type: if, condition: { type: exists, var: active },
               then_expr: { type: var, name: active },
               else_expr: { type: const, value: null } }]
    - [recorded_at, { type: if, condition: { type: exists, var: recorded_at },
               then_expr: { type: var, name: recorded_at },
               else_expr: { type: const, value: null } }]
    - [tags, { type: if, condition: { type: exists, var: tags },
               then_expr: { type: var, name: tags },
               else_expr: { type: const, value: null } }]

