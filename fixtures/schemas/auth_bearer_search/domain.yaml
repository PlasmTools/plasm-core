version: 1
auth:
  scheme: none
http_backend: http://localhost:1080
entities:
  SecuredNote:
    id_field: note_id
    description: Note list requiring Bearer access_token (AppWorld AuthSession-shaped search).
    fields:
      note_id:
        required: true
        value_ref: nv_note_id
      title:
        required: true
        value_ref: nv_title
capabilities:
  securednote_search:
    description: Search notes; Bearer token required ahead of optional search text.
    kind: search
    entity: SecuredNote
    parameters:
    - name: access_token
      value_ref: nv_access_token
      required: true
    - name: query
      value_ref: nv_query
      required: false
      role: search
    provides:
    - note_id
    - title
values:
  nv_note_id:
    type: integer
  nv_title:
    type: string
  nv_access_token:
    type: string
  nv_query:
    type: string
