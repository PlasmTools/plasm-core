wallet_get:
  method: GET
  path:
  - type: literal
    value: wallet
  auth:
    scheme: bearer
    token: { type: var, name: access_token }
  response:
    type: object
    fields:
    - - amount
      - type: path
        path: [amount]

wallet_nudge:
  method: POST
  path:
  - type: literal
    value: wallet
  - type: literal
    value: nudge
  auth:
    scheme: bearer
    token: { type: var, name: access_token }
